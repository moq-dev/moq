# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# cooldown.default-days holds back any newly published version until it is at
# least N days old. This buys time for a compromised release (supply-chain
# attack) to be noticed and yanked before we pull it in. Security updates
# bypass the cooldown. It only gates Dependabot-driven updates, not a manual
# `cargo update` / `bun update` / `uv lock`.

version: 2
updates:
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      nix:
        patterns:
          - "*"

  # The smoke suite's own toolchain flake, kept apart so its PR can carry the
  # matching npm playwright pin (test/smoke/freshness.sh fails until it does)
  # without holding up the root flake.
  - package-ecosystem: "nix"
    directory: "/test/smoke"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      smoke-nix:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # The Go bindings come from a uniffi-bindgen-go build that only reads the
      # metadata of one uniffi minor (0.32 today). The generator is pinned in
      # flake.nix and five other places, so a uniffi minor moves with it by
      # hand; see the uniffi-bindgen-go comment in flake.nix.
      - dependency-name: "uniffi"
        versions: [">=0.33"]

  - package-ecosystem: "bun"
    # Every infra/ directory is a standalone Worker with its own lockfile; the
    # glob keeps a new one from going unupdated.
    directories:
      - "/"
      - "/infra/*"
      - "/demo/pub"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns:
          - "*"
    ignore:
      # Pinned to the root flake's Chromium (sh/js/playwright.py), so it moves
      # with a nixpkgs bump rather than ahead of it.
      - dependency-name: "playwright"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/kt"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      gradle:
        patterns:
          - "*"
    ignore:
      # The published bindings range is maintained alongside the wrapper API.
      - dependency-name: "dev.moq:moq-ffi"

  - package-ecosystem: "pub"
    # /dart/moq is deliberately absent. It reaches moq_ffi through a
    # `dependency_overrides` path, and Dependabot resolves manifests without
    # overrides, so `moq_ffi: ^x.y.z` sends it to pub.dev where moq_ffi is not
    # published yet. Solving fails and it emits nothing for the directory, even
    # for unrelated dev dependencies. Listing it here only looks like coverage.
    # Add it back once moq_ffi is on pub.dev; until then `just dart fix`
    # refreshes that lock.
    directories:
      - "/dart/moq_ffi"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pub:
        patterns:
          - "*"
