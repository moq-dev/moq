name: Cache

# Populates the Rust build cache that check.yml restores.
#
# Actions scopes cache reads to the current branch plus the default branch, so a
# pull request can only ever restore a cache saved on its own ref or on `main`.
# check.yml runs on `pull_request` only, so nothing was ever written to `main`
# and every PR started from scratch ("No cache found"), recompiling the world.
# Worse, each PR saved its own 2-3 GB cache that no other PR could read, which
# filled the repository's 10 GB budget with entries nobody could use and evicted
# them before a re-run could benefit.
#
# So `main` is the single writer and pull requests are readers only (see
# `save-if` in check.yml). One cache everyone can reach beats a dozen nobody can.
#
# This runs the unscoped suite rather than the diff-scoped one: the point is to
# leave artifacts for whatever a future PR happens to touch, not to check `main`
# (the PR that became `main` was already checked). It blocks nobody.

permissions:
  contents: read

on:
  push:
    branches: [main]
    # A docs-only merge can't change the build graph, so don't spend a runner.
    paths:
      - "rs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/cache.yml"
  # Priming a cold cache by hand, e.g. after a toolchain bump evicts everything.
  workflow_dispatch:

# Newest `main` wins; an older warm is worth less than the runner it holds.
concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    name: Warm
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false

      # `shared-key` replaces the automatic per-job key, which is what lets
      # check.yml's differently-named jobs restore what this one saves.
      - name: Rust Cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: rust
          cache-on-failure: true

      # Both halves, so the saved cache carries the lint artifacts (clippy rmeta)
      # and the test artifacts (codegen + linked test binaries). They share
      # little, and a PR usually needs both.
      - name: Check
        run: nix develop --command just check-all
        env:
          MOQ_STRICT: 1

      - name: Test
        if: ${{ !cancelled() }}
        run: nix develop --command just test all
        env:
          MOQ_STRICT: 1
          NEXTEST_PROFILE: ci
