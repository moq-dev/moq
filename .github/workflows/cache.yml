name: Cache

# Populates the Rust build cache that pull request jobs restore, and the dev
# shell closure that every nix job substitutes from nix.moq.dev.
#
# The Nix signing key and the CI bucket's write key live in the `cache-write`
# Environment, which only `main` can deploy to.
#
# Actions scopes cache reads to the current branch plus the default branch, so
# only caches written here on `main` are reachable from a pull request. This
# workflow is therefore the single trusted writer. The action refuses to publish
# from a pull request regardless.
#
# The Rust store is ARM64 only, because every job that restores it runs there.
# Each store is about 6 GB against the repository's 10 GB budget, and Actions
# evicts least recently used first, so an x86 store nobody on a pull request
# read was enough to push out the one they all do. The x86 leg still pushes its
# dev shell, which the x86 jobs substitute.
#
# This runs the unscoped suite rather than the diff-scoped one: the point is to
# leave artifacts for whatever a future PR happens to touch, not to check `main`
# (the PR that became `main` was already checked). It blocks nobody.

permissions:
  contents: read

on:
  push:
    branches: [main]
    # A docs-only merge can't change the build graph, so don't spend a runner.
    paths:
      - "rs/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      # Patches and lockfiles the dev shell builds from.
      - "nix/**"
      - ".github/workflows/cache.yml"
      # The action pin and the cache key both live here, and either can roll
      # the store. Without this the sole writer would not re-run after such a
      # change, leaving every PR reader cold until something else landed.
      - ".github/actions/rust-cache/**"
  # Priming a cold cache by hand, e.g. after a toolchain bump rolls the key.
  workflow_dispatch:

# Queue rather than cancel. A warm takes 30-50 minutes and `main` merges more
# often than that, so cancelling meant no warm ever finished and every pull
# request restored a store hours stale. Actions keeps only the newest pending
# run per group, so merges that land mid-warm still coalesce into one.
concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  warm:
    name: Warm (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            rust: true
          - runner: ubuntu-latest
            rust: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: cache-write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # Anything in the dev shell that nixpkgs doesn't serve prebuilt
      # (uniffi-bindgen-go, a buildRustPackage from a git tag) would otherwise
      # compile from source in every job that enters it. Only paths missing
      # from the bucket upload, so this also restores whatever its lifecycle
      # rule expired.
      - name: Cache the dev shell
        env:
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.NIX_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIX_R2_SECRET_ACCESS_KEY }}
        run: |
          # `--profile` realises the shell's full build closure, which is what
          # the runners actually need; `nix build .#devShells...` alone leaves
          # out the build-time inputs.
          nix develop --profile /tmp/devshell --command true
          nix develop --command just infra nix push nix-ci-moq-dev /tmp/devshell

      # The single writer. `save-on-dispatch` is what lets the
      # `workflow_dispatch` above prime a cold store; the action otherwise saves
      # only on pushes to the default branch.
      - name: Rust cache
        if: matrix.rust
        uses: ./.github/actions/rust-cache
        with:
          save-on-dispatch: true

      # Both halves, so the saved cache carries the lint artifacts (clippy rmeta)
      # and the test artifacts (codegen + linked test binaries). They share
      # little, and a PR usually needs both.
      #
      # `continue-on-error` because the action saves only from a successful
      # job, and the artifacts are worth saving whatever a lint or test on
      # `main` says: a formatting slip or one flaky test otherwise left every
      # pull request restoring a store days stale. The merge queue gates are
      # what report those failures.
      - name: Check
        if: matrix.rust
        continue-on-error: true
        run: nix develop --command just ci check --all

      - name: Test
        if: ${{ matrix.rust && !cancelled() }}
        continue-on-error: true
        run: nix develop --command just ci test --all
