name: Cache

# Pushes the dev shell closure that every nix job substitutes.
#
# The Rust build cache is not warmed here: `main` and its merge queue publish
# what they compile as they run (see .github/actions/rust-cache).

permissions:
  contents: read

on:
  push:
    branches: [main]
    # Only the flake decides the dev shell, so don't spend a runner otherwise.
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - ".github/workflows/cache.yml"
  # Priming the shell by hand, e.g. after a failed push.
  workflow_dispatch:

# Queue rather than cancel, so a run always finishes. Actions keeps only the
# newest pending run per group, so merges that land mid-run coalesce into one.
concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  warm:
    name: Warm (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Trust the flake's cachix substituter. `nixConfig` in flake.nix is
          # untrusted by default, so nix logs "ignoring untrusted flake
          # configuration setting 'extra-substituters'" and rebuilds from
          # source anything missing from the public nixpkgs cache. That was
          # costing 678s per job for uniffi-bindgen-go alone, in every job that
          # enters the dev shell.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      # cachix.yml only fires on release tags and only pushes the tagged
      # package, so the dev shell itself was never cached. Anything in it that
      # nixpkgs doesn't serve prebuilt (uniffi-bindgen-go, a
      # buildRustPackage from a git tag) was therefore compiled from source by
      # every job that entered the shell. Push it once here so pull requests
      # substitute it instead.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: kixelated
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Cache the dev shell
        run: |
          # `--profile` realises the shell's full build closure, which is what
          # the runners actually need; `nix build .#devShells...` alone leaves
          # out the build-time inputs.
          nix develop --profile /tmp/devshell --command true
          cachix push kixelated /tmp/devshell
