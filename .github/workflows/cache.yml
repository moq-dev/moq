name: Cache

# Pushes the dev shell closure that every nix job substitutes from nix.moq.dev.
#
# The Nix signing key and the CI bucket's write key live in the `cache-write`
# Environment, which pull requests cannot deploy to (see infra/README.md).
#
# The Rust build cache is not warmed here: `main` and its merge queue publish
# what they compile as they run (see .github/actions/rust-cache).

permissions:
  contents: read

on:
  push:
    branches: [main]
    # Only the flake decides the dev shell, so don't spend a runner otherwise.
    paths:
      - "flake.nix"
      - "flake.lock"
      # Patches and lockfiles the dev shell builds from.
      - "nix/**"
      - ".github/workflows/cache.yml"
  # Priming the shell by hand, e.g. after a failed push.
  workflow_dispatch:

# Queue rather than cancel, so a run always finishes. Actions keeps only the
# newest pending run per group, so merges that land mid-run coalesce into one.
concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  warm:
    name: Warm (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    environment: cache-write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # Anything in the dev shell that nixpkgs doesn't serve prebuilt
      # (uniffi-bindgen-go, a buildRustPackage from a git tag) would otherwise
      # compile from source in every job that enters it. Only paths missing
      # from the bucket upload, so this also restores whatever its lifecycle
      # rule expired.
      - name: Cache the dev shell
        env:
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.NIX_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIX_R2_SECRET_ACCESS_KEY }}
        run: |
          # `--profile` realises the shell's full build closure, which is what
          # the runners actually need; `nix build .#devShells...` alone leaves
          # out the build-time inputs.
          nix develop --profile /tmp/devshell --command true
          nix develop --command just infra nix push nix-ci-moq-dev /tmp/devshell
