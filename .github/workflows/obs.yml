name: OBS

# Compiles and links the OBS plugin, which nothing else does: `just check`
# lints cpp/obs but never builds it, and a local build needs the
# multi-hundred-MB obs-deps bundle on macOS and Windows.
#
# Linux is the platform that needs no bundle at all -- nixpkgs has obs-studio,
# Qt6 and ffmpeg, so the `.#obs` shell is the whole dependency set. The plugin
# is platform-independent C++ over the generated moq-ffi bindings (cpp/moq), so
# a Linux compile catches the breakage a macOS developer would otherwise ship
# uncompiled. The macOS and Windows platform.yml jobs cover the rest: each
# platform's link line and the obs-deps bundle.
#
# libmoq's own C fixtures (`just rs c-tests`) run here too. They link libmoq.a
# from outside cargo the same way the plugin links moq-ffi, which is too slow
# for nextest's hang budget, so this job, which already does that kind of link,
# runs them. They also compile the C doc samples, hence `doc/lib/c/**` in the
# trigger.
#
# Linking a Rust staticlib from outside cargo needs the native libraries in
# `rs/libmoq/native-libs/*.txt`, which moq-ffi and libmoq share and which are
# maintained by hand, so a crate the plugin never names, a feature toggle, or a
# build script can break it while every Rust gate stays green. No list of paths
# covers every such input, so pushes to `release` rebuild on any Rust or plugin
# change, and nightly.yml runs the same Linux recipes on main
# diff-independently.

permissions:
  contents: read

on:
  push:
    branches: [release]
    paths:
      - "rs/**"
      - "cpp/obs/**"
      - "cpp/moq/**"
      - "doc/lib/c/**"
      - "doc/lib/samples.sh"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/obs.yml"

# `release` can merge faster than a run finishes, so pushes queue rather than
# cancel.
concurrency:
  group: obs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: OBS
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # Read only: this runs for `release` alone, and Nightly's `obs ci` row
      # writes on `main`. The cache holds dev-profile artifacts, which is why
      # `just obs ci` builds moq-ffi in debug rather than the preset's release.
      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          access-key-id: ${{ secrets.MBX_B2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MBX_B2_SECRET_ACCESS_KEY }}

      # The same recipe a developer runs on Linux. Warnings are errors here, via
      # the platform's CI preset.
      - name: Build
        run: nix develop .#obs --command just obs ci

      - name: libmoq C fixtures
        run: nix develop .#obs --command just rs c-tests
