name: OBS

# Compiles and links the OBS plugin, which nothing else does: `just check`
# lints cpp/obs but never builds it, and a local build needs the
# multi-hundred-MB obs-deps bundle on macOS and Windows.
#
# Linux is the platform that needs no bundle at all -- nixpkgs has obs-studio,
# Qt6 and ffmpeg, so the `.#obs` shell is the whole dependency set. The plugin is
# platform-independent C++ over moq-c's C ABI, so a Linux compile catches the
# breakage a macOS developer would otherwise ship uncompiled. The macOS and
# Windows release builds cover the rest: each platform's link line and the
# obs-deps bundle.
#
# Narrow trigger, like swift.yml: the plugin's own sources, the moq-c header
# they call through, and the flake that supplies the toolchain.
#
# moq-c's own C fixtures (`just rs c-tests`) run here too. They link libmoq.a
# from outside cargo the same way, which is too slow for nextest's hang budget
# and needs the debug staticlib this job has just built, so this is the one
# PR gate that already has everything they need. They also compile the C doc
# samples, hence `doc/lib/c/**` in the trigger.
#
# The manifests and Cargo.lock are in there for the one way a crate the plugin
# never names can break it: linking libmoq.a from outside cargo needs the native
# libraries in `rs/moq-c/native-libs/*.txt`, which are maintained by hand. A
# dependency that starts pulling in a new one leaves that list stale, and every
# Rust gate stays green, because cargo passes the flag itself and only this job
# links without it.
#
# Manifests and build scripts rather than Cargo.lock alone, because neither a
# feature toggle nor a build script has to touch the lockfile. moq-c takes
# moq-native with default features, so flipping one of those defaults on
# (`jemalloc` gates `dep:tikv-jemallocator`) changes what libmoq.a needs at link
# time while Cargo.lock stays byte-identical, since moq-relay already put that
# package in the graph; a build.rs emitting `cargo::rustc-link-lib` needs no
# manifest change at all.
#
# A list of paths still can't be complete here -- a vendored C source or a
# .cargo/config.toml could do it too -- and `rs/**` would run this on nearly
# every PR, which is the cost that removed the Windows and macOS gates (#2600).
# So this filter covers the likely inputs at PR time, and pushes to `main` and
# `release` rebuild on any Rust or plugin change to cover the rest. nightly.yml also
# runs the Linux recipe diff-independently.

permissions:
  contents: read

on:
  push:
    branches: [main, release]
    paths:
      - "rs/**"
      - "cpp/obs/**"
      - "doc/lib/c/**"
      - "doc/lib/samples.sh"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/obs.yml"
  pull_request:
    # `closed` is here only so merging/closing a PR cancels its in-flight run
    # via the concurrency group below; the job itself is skipped on close.
    types: [opened, synchronize, reopened, closed]
    paths:
      - "cpp/obs/**"
      - "sh/obs/**"
      - "rs/moq-c/**"
      - "doc/lib/c/**"
      - "doc/lib/samples.sh"
      - "rs/**/Cargo.toml"
      - "rs/**/build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/obs.yml"

# Keyed and cancelled like platform.yml: a merged PR's `closed` run must not
# cancel the push run it triggers, and `main` merges faster than a push run
# finishes, so pushes queue rather than cancel.
concurrency:
  group: obs-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: OBS
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # main
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Trust the flake's cachix substituter, so the dev shell substitutes
          # instead of building from source. See check.yml for the full story.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      # cache.yml warms the default-branch store on `main`. Pull requests restore
      # it; the action refuses to publish from a pull request. It holds
      # dev-profile artifacts, which is why `just obs ci` builds moq-c in debug
      # rather than the preset's release.
      - name: Rust cache
        uses: ./.github/actions/rust-cache

      # The same recipe a developer runs on Linux. Warnings are errors here, via
      # the platform's CI preset.
      - name: Build
        run: nix develop .#obs --command just obs ci

      # The plugin build above already produced the debug libmoq.a, so the
      # cargo step inside is a no-op and this is just a cc and a run.
      - name: moq-c C fixtures
        run: nix develop .#obs --command just rs c-tests

  # The release build of the OBS plugin, minus the published moq-c: build.sh
  # without `--moq-c-release` links the in-tree rs/moq-c instead, so a PR is
  # checked against its own C ABI. The obs-deps bundle (libobs, Qt6, ffmpeg)
  # comes from buildspec.json at configure time, same as a tag build.
  release:
    name: OBS (${{ matrix.name }})
    if: github.event.action != 'closed'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            target: aarch64-apple-darwin
            os: macos-latest
          - name: Windows
            target: x86_64-pc-windows-msvc
            # The plugin preset uses the Visual Studio 17 2022 generator.
            os: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: ./.github/actions/just

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: just obs package --target "$TARGET" --output "$RUNNER_TEMP/obs"
