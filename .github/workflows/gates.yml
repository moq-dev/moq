name: Gates

# The behavioral gates, run on the pull requests they cover.
#
# `check.yml` proves the tree compiles and its unit tests pass. It cannot prove a
# broadcast still reaches a browser, that the WASM bindings still connect, or
# that the MPEG-TS exporter still produces a compliant stream. Those lanes exist,
# but each used to be a workflow with a `paths:` filter naming its own harness,
# so an ordinary relay, FFI, or player change ran none of them and the regression
# surfaced the next night, on `main`.
#
# A `paths:` filter cannot fix that, for two reasons. A lane's real input is a
# crate's dependents, not a directory: moq-net owns no file under rs/moq-relay
# and breaks it anyway. And a filtered workflow that does not match never starts,
# so its context never appears, which means it can never be a required check --
# a docs-only pull request would wait on it forever.
#
# So the filter moves inside. This workflow always starts; `select` asks the
# impact map (.github/scripts/select.sh, `just gh select`) which lanes the diff
# needs; each lane is a job conditioned on that answer; and `Gates` is the one
# stable result to require, which passes only when every selected lane passed and
# every unselected one really was skipped.
#
# Adding a lane means adding it to select.sh, adding an output below, and adding
# a job whose id is the lane name. Miss any of the three and `Gates` says so.

permissions:
  contents: read
  id-token: write

on:
  pull_request:
    # `closed` is here only so merging/closing a PR cancels its in-flight run
    # via the concurrency group below; the jobs are skipped on close.
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      smoke: ${{ steps.map.outputs.smoke }}
      smoke_full: ${{ steps.map.outputs.smoke_full }}
      wasm: ${{ steps.map.outputs.wasm }}
      ts: ${{ steps.map.outputs.ts }}
      windows: ${{ steps.map.outputs.windows }}
      macos: ${{ steps.map.outputs.macos }}
      features: ${{ steps.map.outputs.features }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so `just _changed` can diff against origin/$GITHUB_BASE_REF.
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Trust the flake's cachix substituter, so the dev shell substitutes
          # instead of building from source. See check.yml for the full story.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      # No Rust cache: the map reads `cargo metadata`, which resolves the graph
      # without compiling anything. Restoring a multi-gigabyte target/ to answer
      # a question in ten seconds would cost every lane its head start.

      # `tee` rather than a plain redirect: an unexpected lane is the first thing
      # anyone looks for when a gate runs or doesn't, and $GITHUB_OUTPUT is not
      # readable from the log.
      - name: Impact map
        id: map
        run: |
          nix develop --command just gh select | tee -a "$GITHUB_OUTPUT"

  # The representative interop set: rust and browser publish, rust, browser and C
  # subscribe. Selected by any change the delivery path can reach.
  smoke:
    name: Smoke
    needs: select
    if: needs.select.outputs.smoke == 'true'
    uses: ./.github/workflows/smoke.yml
    with:
      matrix: core

  # The full publisher x subscriber matrix, including the python and GStreamer
  # arms. Selected by wire, FFI, and gateway changes, per Cross-Package Sync.
  smoke_full:
    name: Smoke (full)
    needs: select
    if: needs.select.outputs.smoke_full == 'true'
    uses: ./.github/workflows/smoke.yml
    with:
      matrix: full

  wasm:
    name: WASM
    needs: select
    if: needs.select.outputs.wasm == 'true'
    uses: ./.github/workflows/wasm.yml

  # Round-trips a PCR-paced TS through a relay and grades the subscriber's
  # `export ts` output with TSDuck. The `--live` arm, which grades release timing
  # over a two-minute window, stays in nightly.yml.
  ts:
    name: TS
    needs: select
    if: needs.select.outputs.ts == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      # Restore only. cache.yml is the single writer, on `main`; see the comment
      # there for why.
      - name: Rust cache
        uses: ./.github/actions/rust-cache

      - name: TS compliance
        run: nix develop --command just test ts
        shell: bash -leo pipefail {0}

  # The feature permutations. Selected on the manifests and build scripts that
  # define the feature graph; nightly.yml runs the same recipe diff-independently
  # for the breakage that arrives through source instead.
  features:
    name: Features
    needs: select
    if: needs.select.outputs.features == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      - name: Rust cache
        uses: ./.github/actions/rust-cache

      - name: Features
        run: nix develop --command just rs features
        env:
          NEXTEST_PROFILE: ci

  # A compile gate, not a device test: `just rs windows` is the only thing that
  # puts moq-video's Media Foundation capture/encode/decode and every
  # `#[cfg(target_os = "windows")]` test module past a compiler. Running it does
  # not mean the code works on Windows, and nothing here claims otherwise.
  #
  # Same shape as nightly.yml's copy, including the deliberate absence of a Rust
  # cache: the repository's 10 GB budget is spent warming the Linux target/ that
  # every pull request restores, and a lane this narrow should not evict it.
  windows:
    name: Windows
    needs: select
    if: needs.select.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # aws-lc-rs assembles its x86_64 crypto with NASM on Windows.
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Pinned: `--locked` fixes just's own dependencies, not which version of
      # just cargo selects.
      - name: Install just
        shell: bash
        run: cargo install --locked just@1.52.0

      - name: Check
        shell: bash
        run: just rs windows

  # The same compile gate for moq-video's VideoToolbox and ScreenCaptureKit code
  # and moq-audio's system audio capture. See `windows` above.
  macos:
    name: macOS
    needs: select
    if: needs.select.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install just
        run: cargo install --locked just@1.52.0

      - name: Check
        run: just rs macos

  # The one result to require. `always()` so it reports on a docs-only pull
  # request, where every lane above is skipped and there is nothing to wait for.
  gates:
    name: Gates
    if: always() && github.event.action != 'closed'
    needs: [select, smoke, smoke_full, wasm, ts, windows, macos, features]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `skipped` means both "irrelevant to this diff" and "never got to run", so
      # the results are checked against what the selector asked for rather than
      # rolled up. See .github/scripts/gates.sh.
      - name: Verify
        run: .github/scripts/gates.sh
        env:
          GATES_NEEDS: ${{ toJSON(needs) }}
