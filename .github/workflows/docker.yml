name: Docker

on:
  push:
    tags:
      - 'moq-relay-v*'
      - 'moq-cli-v*'
  # Dry-run: build the image, push nothing. Nightly calls this so a broken
  # Dockerfile surfaces before the tag is cut. Off a tag there is no package to
  # derive, so the caller names one.
  workflow_call:
    inputs:
      package:
        description: "Crate to build (moq-relay, moq-cli)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      package:
        description: "Crate to build (moq-relay, moq-cli)"
        required: true
        type: string
        default: moq-relay

env:
  REGISTRY: docker.io/moqdev

jobs:
  parse:
    name: Parse tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: parse
        env:
          CRATE: ${{ inputs.package }}
        run: |
          ref=${GITHUB_REF#refs/tags/}
          if [[ -n "$CRATE" ]]; then
            crate="$CRATE"
          elif [[ "$ref" =~ ^([a-z-]+)-v[0-9.]+$ ]]; then
            crate="${BASH_REMATCH[1]}"
          else
            echo "Tag format not recognized." >&2
            exit 1
          fi
          # The flake package and image are named after the executable.
          case "$crate" in
            moq-cli) package=moq ;;
            *) package="$crate" ;;
          esac
          echo "package=${package}" >> "$GITHUB_OUTPUT"
          .github/scripts/release.sh parse-version "$crate"

  build:
    name: Build ${{ matrix.platform }}
    needs: parse
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.ref_type == 'tag'
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and push by digest. The manifest list is assembled in the merge job.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            package=${{ needs.parse.outputs.package }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.parse.outputs.package }},push-by-digest=true,name-canonical=true,push=${{ github.ref_type == 'tag' }}

      - name: Export digest
        if: github.ref_type == 'tag'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref_type == 'tag'
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest
    needs: [parse, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create manifest
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046  # intentional word-splitting: one arg per digest
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ needs.parse.outputs.package }}:${{ needs.parse.outputs.version }} \
            -t ${{ env.REGISTRY }}/${{ needs.parse.outputs.package }}:latest \
            $(printf "${{ env.REGISTRY }}/${{ needs.parse.outputs.package }}@sha256:%s " *)

      # The image was moqdev/moq-cli through 0.12.2. Point `latest` there at a
      # refusal naming the new image, so a user tracking it breaks instead of
      # silently staying on 0.12.2. Pinned versions keep working.
      - name: Refuse the old image name
        if: needs.parse.outputs.package == 'moq'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            -t ${{ env.REGISTRY }}/moq-cli:latest - <<'DOCKERFILE'
          FROM busybox:stable
          ENTRYPOINT ["sh", "-c", "echo 'error: moqdev/moq-cli is now moqdev/moq' >&2; exit 1"]
          DOCKERFILE
