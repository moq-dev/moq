name: Release Go

# Publishes the ergonomic moq-go wrapper to the moq-dev/moq-go mirror, versioned
# independently of the moq-ffi crate.
#
#   * MAJOR.MINOR is the human-owned API line in go/wrapper/VERSION.
#   * PATCH is derived by publish-wrapper.sh from the mirror's existing tags
#     (registry is the gate, like release-plz / the PyPI check in release.sh).
#
# Triggers:
#   * push to release     - a wrapper API or VERSION change. The ffi require is
#                           pinned to the current crate version, which is
#                           already published in steady state. If it's missing (a
#                           release is mid-flight) or rs/moq-ffi changed since
#                           its tag, the job skips: the workflow_run below
#                           republishes once the ffi lands.
#   * Release FFI done:      its Go publisher published moq.dev/moq-ffi.
#                           Re-cut the wrapper so `moq.dev/moq@latest` floats to
#                           the newest native core (Go MVS won't float on its own).
#                           Chaining off the upstream run guarantees the ffi
#                           version is already published, so there is nothing to poll.
#
# Stray release pushes are harmless: publish-wrapper.sh skips when the staged tree
# matches the mirror, so unchanged content never mints an empty patch release.

on:
  push:
    branches:
      - release
  # Publishes only a protected release tag at the run's commit; see
  # "Require a release tag at the run's commit".
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Release FFI"]
    types:
      - completed

permissions:
  contents: read

# One at a time: publish-wrapper.sh derives the next patch from the mirror's
# tags, so two concurrent runs could race to the same tag.
concurrency:
  group: release-go
  cancel-in-progress: false

jobs:
  ffi-release:
    name: Check FFI publisher
    runs-on: ubuntu-latest
    # workflow_run is privileged. Preserve the owner, same-repo, push and tag
    # gates before reading the trusted upstream checkout or allowing wrapper
    # publication.
    if: >-
      github.repository_owner == 'moq-dev' &&
      (github.event_name == 'push' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'moq-ffi-v')))
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.publisher.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # head_branch names a branch as readily as a tag, and anyone who can push
      # may name a branch and a workflow after a release. Only a tag the
      # `release tags` ruleset protects, at the run's commit, is a release.
      - name: Require a release tag at the run's commit
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          if [[ "$commit" != "$SHA" ]]; then
            echo "::error::$TAG is not a release tag at $SHA"
            exit 1
          fi
      - uses: ./.github/actions/just
      - name: Check independent publisher
        id: publisher
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: just gh ffi completed go

  build:
    name: Build wrapper module
    needs: [ffi-release]
    if: needs.ffi-release.outputs.ready == 'true'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # Tags, for the unreleased ffi check.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/just

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23"
          # A release reads nothing from a cache another branch could have written.
          cache: false

      - name: Read wrapper version line
        id: line
        run: |
          LINE=$(tr -d '[:space:]' < go/wrapper/VERSION)
          if [[ ! "$LINE" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::go/wrapper/VERSION must be MAJOR.MINOR, got '$LINE'"
            exit 1
          fi
          echo "line=$LINE" >> "$GITHUB_OUTPUT"
          echo "wrapper line: $LINE"

      # The ffi version the wrapper should require: the version of the ffi that
      # just published (workflow_run), or the current crate version (release push).
      - name: Resolve ffi version
        id: ffi
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            # Upstream tag ref, e.g. moq-ffi-v0.3.1.
            VERSION="${HEAD_BRANCH#moq-ffi-v}"
            echo "Triggered by FFI publisher: ffi v$VERSION"
          else
            VERSION=$(grep '^version' rs/moq-ffi/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
            echo "Using ffi version from Cargo.toml: $VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # On a release push the wrapper pins the current crate's ffi version, but it
      # may call API added to rs/moq-ffi since that version was tagged.
      - name: Check for unreleased ffi changes (push only)
        id: ffi-diff
        if: github.event_name == 'push'
        env:
          FFI_VERSION: ${{ steps.ffi.outputs.version }}
        run: just gh release ffi-unreleased "$FFI_VERSION"

      # Skip on unreleased ffi changes, and when the pinned ffi version is
      # unpublished (release-plz merged but the Go FFI publisher hasn't finished yet):
      # the workflow_run trigger republishes once the ffi lands. One existence
      # check, no polling. workflow_run runs are chained after that publish, so
      # the version is guaranteed present and this gate doesn't run for them.
      - name: Gate on published ffi (push only)
        id: gate
        if: github.event_name == 'push'
        env:
          FFI_VERSION: ${{ steps.ffi.outputs.version }}
          FFI_UNRELEASED: ${{ steps.ffi-diff.outputs.unreleased }}
        run: |
          if [[ "$FFI_UNRELEASED" == "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Ask the origin moq.dev sends `go get` to (temporary: the git mirror
          # until the go.moq.dev cutover). Distinguish "absent" from a lookup
          # failure: a network error must fail loudly, not masquerade as "defer"
          # (nothing retries a wrapper-only push, so a silent skip would drop
          # the release).
          ORIGIN=$(just go ffi-origin)
          case "$ORIGIN" in
            mod) MOD_URL="https://go.moq.dev/moq.dev/moq-ffi/@v/v${FFI_VERSION}.mod" ;;
            git) MOD_URL="https://raw.githubusercontent.com/moq-dev/moq-go-ffi/v${FFI_VERSION}/go.mod" ;;
          esac
          if ! STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "$MOD_URL"); then
            echo "::error::failed to query $MOD_URL"
            exit 1
          fi
          case "$STATUS" in
            200)
              echo "moq.dev/moq-ffi v${FFI_VERSION} is published ($ORIGIN); proceeding."
              ;;
            404)
              echo "::warning::moq.dev/moq-ffi v${FFI_VERSION} is not published yet; deferring to the FFI release chain."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::$MOD_URL answered HTTP $STATUS"
              exit 1
              ;;
          esac

      - name: Package wrapper
        if: steps.gate.outputs.skip != 'true'
        env:
          LINE: ${{ steps.line.outputs.line }}
          FFI_VERSION: ${{ steps.ffi.outputs.version }}
        run: |
          just go package-wrapper --line "$LINE" --ffi-version "$FFI_VERSION" --output release-out

      - name: Upload wrapper module
        if: steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: go-wrapper-package
          path: release-out/*

  publish:
    name: Publish to Go module mirror
    # Directly on ffi-release: its gate is what makes the head_sha checkout trusted.
    needs: [ffi-release, build]
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # The moq-bot key lives in the `bot` Environment, which only protected
    # refs can deploy to: `release`, and `main` for workflow_run.
    environment: bot

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Generate moq-bot token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: moq-dev
          repositories: moq-go
          # Narrow the minted token to only what publish-wrapper.sh needs.
          permission-contents: write

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: go-wrapper-package
          path: go-out

      - name: Publish to moq-dev/moq-go mirror
        env:
          # Token is minted fresh per run, expires in 1 hour, never at rest.
          GO_MIRROR_TOKEN: ${{ steps.token.outputs.token }}
          GIT_AUTHOR_NAME: moq-bot
          GIT_AUTHOR_EMAIL: moq-bot[bot]@users.noreply.github.com
        run: just go publish-wrapper
