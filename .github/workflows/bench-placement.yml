name: Bench placement

# Temporary experiment for quest/m1/bench-ci.md, removed before the PR is ready:
# A/A runs of paired Nightly groups on the Nightly's hosted ARM runner, without
# dispatching Nightly, against main before this PR, recording which targets build byte-identical.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - .github/workflows/bench-placement.yml

concurrency:
  group: bench-placement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aa:
    name: A/A (${{ matrix.group }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        group: [rust-bench, rust-shared]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          access-key-id: ${{ secrets.MBX_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MBX_R2_SECRET_ACCESS_KEY }}

      - name: Run workload
        id: workload
        run: nix develop --command just gh nightly ${{ matrix.group }}
        env:
          # The full commit: a shallow checkout fetches the base by commit, and a short
          # SHA is not a remote ref.
          BENCH_BASE: 0672ad56ce29ae168c7122fe6ece20de08cdc12a

      - name: Compare builds
        if: ${{ !cancelled() }}
        run: |
          for run in target/bench/nightly/${{ matrix.group }}/runs/run.*; do
            [[ -s $run/criterion-base.targets ]] || continue
            while IFS=$'\t' read -r key _ current; do
              base=$(awk -F '\t' -v key="$key" '$1 == key { print $3 }' "$run/criterion-base.targets")
              [[ -n $base ]] || continue
              if cmp -s "$current" "$base"; then same=identical; else same=DIFFERENT; fi
              printf '%s\t%s\t%s\t%s\n' "$same" "$key" "$(sha256sum <"$current" | cut -c1-16)" "$(sha256sum <"$base" | cut -c1-16)"
            done <"$run/criterion-current.targets"
          done | tee target/bench/nightly/${{ matrix.group }}/builds.tsv

      - name: Gate
        if: ${{ !cancelled() && steps.workload.outcome == 'success' }}
        run: nix develop --command just gh benchmark-report gate target/bench/nightly/${{ matrix.group }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: aa-${{ matrix.group }}
          path: target/bench/nightly/${{ matrix.group }}
