name: Bench placement

# Temporary experiment for quest/m1/bench-ci.md, removed before the PR is ready:
# runs bench/placement.sh on the Nightly's hosted ARM runner.

permissions:
  contents: read

on:
  pull_request:
    paths:
      - bench/placement.sh
      - .github/workflows/bench-placement.yml

concurrency:
  group: bench-placement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  placement:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          access-key-id: ${{ secrets.MBX_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MBX_R2_SECRET_ACCESS_KEY }}

      - name: Placement
        run: nix develop --command bench/placement.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: bench-placement
          path: target/placement/results.tsv
