name: moq-gst

on:
  push:
    tags:
      - "moq-gst-v*"
  # Dry-run: build everything, publish nothing. Nightly calls every release
  # workflow this way so a broken build surfaces before the tag is cut.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  # Pulls the pinned GStreamer CI image, which may be private.
  packages: read

jobs:
  build:
    name: Build tarball (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/just

      - uses: ./.github/actions/nix

      - name: Parse version
        id: parse
        shell: bash
        run: just gh release parse-version moq-gst

      - name: Build and package (tarball)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          just rs package-gst \
            --target "$TARGET" \
            --version "$VERSION" \
            --output dist

      # Load the produced plugin against a system GStreamer, separate from the
      # nix copy the build linked against. This is the customer-facing
      # scenario: `nix build .#moq-gst` then `gst-inspect-1.0 moq`. If dyld or
      # ld.so can't resolve the plugin's deps against the system GStreamer,
      # this step fails. Linux takes Ubuntu's GStreamer from the pinned
      # gstreamer-ci image (.github/docker/gstreamer), so an apt mirror outage
      # can't fail the build.
      - name: Install system GStreamer
        if: runner.os == 'macOS'
        run: brew install gstreamer

      - name: Log in to ghcr.io
        if: runner.os == 'Linux'
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: docker login ghcr.io -u "$ACTOR" --password-stdin <<<"$TOKEN"

      - name: Smoke test (gst-inspect against system GStreamer)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          tar -xzf "dist/moq-gst-v${VERSION}-${TARGET}.tar.gz" -C dist/
          plugin="dist/moq-gst-v${VERSION}-${TARGET}/lib/gstreamer-1.0"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            just gh gstreamer just rs gst-smoke "$plugin"
          else
            just rs gst-smoke "$plugin"
          fi

      - name: Test Homebrew formula against tarball
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: just gh gst-formula "$VERSION" "$TARGET" dist

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: moq-gst-${{ matrix.target }}
          path: dist/*.tar.gz

  package:
    name: Package .deb/.rpm (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-24.04
            deb-arch: amd64
            deb-multiarch: x86_64-linux-gnu
            rpm-arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
            deb-arch: arm64
            deb-multiarch: aarch64-linux-gnu
            rpm-arch: aarch64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up packaging tools
        uses: ./.github/actions/setup-packaging

      - name: Parse version
        id: parse
        shell: bash
        run: just gh release parse-version moq-gst

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: docker login ghcr.io -u "$ACTOR" --password-stdin <<<"$TOKEN"

      - name: Build (release, glibc 2.34)
        shell: bash
        # Pin glibc to 2.34 so one .so covers Debian 12+/Ubuntu 22.04+
        # (.deb) and AlmaLinux/RHEL/Rocky 9+ (.rpm).
        #
        # The build links against Ubuntu 24.04's GStreamer 1.24 headers
        # (gstreamer-rs needs 1.22+) from the pinned gstreamer-ci image, so an
        # apt mirror outage can't fail it. Only this step runs in the image,
        # with the runner's rustup toolchain and Nix packaging tools; the
        # packaging steps after it stay on the runner. The .so dynamically
        # links libgstreamer-1.0.so.0, ABI-stable since 1.0.
        #
        # PKG_CONFIG_ALLOW_SYSTEM_LIBS keeps the `-L /usr/lib/<multiarch>` for
        # glib in pkg-config's output. pkg-config strips system lib paths by
        # default (the native linker searches them anyway), but zig's linker
        # does not, and rustc fails the dylib lookup (strategy 'no_fallback')
        # before linking. The explicit -L lets it resolve libglib-2.0.so /
        # libgobject-2.0.so.
        env:
          TARGET: ${{ matrix.target }}
          PKG_CONFIG_ALLOW_SYSTEM_LIBS: "1"
        run: |
          just gh gstreamer cargo zigbuild --locked --release --target "$TARGET.2.34" -p moq-gst

      - name: Package .deb
        shell: bash
        env:
          VERSION: ${{ steps.parse.outputs.version }}
          ARCH: ${{ matrix.deb-arch }}
          PKG_NAME: gstreamer1.0-moq
          PLUGIN_PATH: target/${{ matrix.target }}/release/libgstmoq.so
          PLUGIN_DIR: /usr/lib/${{ matrix.deb-multiarch }}/gstreamer-1.0
        run: |
          mkdir -p dist
          just rs package-nfpm packaging/moq-gst/nfpm.yaml deb dist/

      - name: Package .rpm
        shell: bash
        env:
          VERSION: ${{ steps.parse.outputs.version }}
          ARCH: ${{ matrix.rpm-arch }}
          PKG_NAME: gstreamer1-moq
          PLUGIN_PATH: target/${{ matrix.target }}/release/libgstmoq.so
          PLUGIN_DIR: /usr/lib64/gstreamer-1.0
        run: |
          mkdir -p dist
          just rs package-nfpm packaging/moq-gst/nfpm.yaml rpm dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: moq-gst-pkg-${{ matrix.target }}
          path: dist/*

  release:
    name: Release
    needs: [build, package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Parse version
        id: parse
        run: just gh release parse-version moq-gst

      - name: Find previous tag
        id: prev_tag
        run: just gh release prev-tag moq-gst

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TITLE: "moq-gst v${{ steps.parse.outputs.version }}"
          RELEASE_PREV_TAG: ${{ steps.prev_tag.outputs.tag }}
        run: just gh release create artifacts

      - name: Trigger apt/rpm repo publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: just gh trigger-repo-publish
