name: release-winget

# Submits/updates the winget manifest for a CLI after its release workflow
# publishes the GitHub Release (with the Windows .zip assets). The release is
# created by the default GITHUB_TOKEN, which can't trigger a `release` event,
# so sh/gh/trigger-repo-publish.sh dispatches this on the release tag. The run
# is the tag, which the `publish` Environment admits, rather than `main` as a
# workflow_run would be. It stays independent of the tag's own run, so a failed
# submission blocks neither release-brew nor any other publisher.
#
# A dispatch on a branch is a dry run instead: it resolves the winget
# identifier and verifies the Windows .zip asset exists on the `tag` input's
# release, then stops without opening a winget-pkgs PR. Use it to sanity-check
# a tag before (or instead of) a real submission. winget-releaser itself has no
# dry-run flag, hence the separate path.
#
# One-time bootstrap (winget-pkgs only lets you UPDATE an existing package):
#   1. A maintainer lands the first manifest once via `wingetcreate new` (or a
#      manual PR) for each PackageIdentifier below.
#   2. Set the WINGET_TOKEN secret in the `publish` Environment: a classic PAT
#      with `public_repo` scope, owned by an account that has forked
#      microsoft/winget-pkgs. By default the fork is looked up under the token
#      owner.
# After that every release is hands-off. Until the secret exists the real
# submit is a clean no-op (the dry run still works without it).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to dry-run from a branch (e.g. moq-cli-v0.7.31); a dispatch on a tag submits that tag"
        required: false
        type: string

concurrency:
  # Key on the release tag, so different packages submit in parallel and only
  # repeat runs of the same tag serialize.
  group: ${{ github.workflow }}-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Single source of truth: the dry-run asset check and the winget-releaser
  # submission must agree on which assets are the Windows installers.
  INSTALLERS_REGEX: '-x86_64-pc-windows-msvc\.zip$'

jobs:
  publish:
    name: Submit winget manifest
    runs-on: windows-latest
    # WINGET_TOKEN lives in the `publish` Environment, which only release refs
    # can deploy to. A dry run needs no token, so it can run from any branch.
    environment: ${{ github.ref_type == 'tag' && 'publish' || '' }}

    steps:
      - name: Resolve mode and tag
        id: mode
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ -n "$DISPATCH_TAG" ]]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "tag=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Dispatch on a release tag to submit it, or name a tag to dry-run."
            exit 1
          fi

      - name: Parse crate and version
        id: parse
        shell: bash
        env:
          TAG: ${{ steps.mode.outputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$ ]]; then
            echo "Tag format not recognized: $TAG" >&2
            exit 1
          fi
          crate="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          case "$crate" in
            moq-cli)       identifier="moq-dev.moq" ;;
            moq-relay)     identifier="moq-dev.moq-relay" ;;
            *)
              echo "No winget identifier mapped for crate: $crate" >&2
              exit 1
              ;;
          esac
          {
            echo "version=$version"
            echo "tag=$TAG"
            echo "identifier=$identifier"
          } >> "$GITHUB_OUTPUT"
          echo "$identifier $version (tag $TAG)"

      # Dry run: prove the release carries a Windows installer that the
      # submission would match, then stop without opening a PR.
      - name: Dry run (validate, do not submit)
        if: steps.mode.outputs.dry_run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.parse.outputs.tag }}
          IDENTIFIER: ${{ steps.parse.outputs.identifier }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          matched=$(echo "$names" | grep -E -e "$INSTALLERS_REGEX" || true)
          if [[ -z "$matched" ]]; then
            echo "No asset on $TAG matches $INSTALLERS_REGEX" >&2
            echo "Available assets:" >&2
            echo "$names" >&2
            exit 1
          fi
          echo "Dry run OK. Would submit $IDENTIFIER $VERSION with installer(s):"
          echo "$matched"

      - name: Check for WINGET_TOKEN
        if: steps.mode.outputs.dry_run == 'false'
        id: gate
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [[ -z "${WINGET_TOKEN}" ]]; then
            echo "WINGET_TOKEN not configured; skipping winget submission." >&2
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit to winget-pkgs
        if: steps.mode.outputs.dry_run == 'false' && steps.gate.outputs.enabled == 'true'
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: ${{ steps.parse.outputs.identifier }}
          version: ${{ steps.parse.outputs.version }}
          release-tag: ${{ steps.parse.outputs.tag }}
          installers-regex: ${{ env.INSTALLERS_REGEX }}
          token: ${{ secrets.WINGET_TOKEN }}
