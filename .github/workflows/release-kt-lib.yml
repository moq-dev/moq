name: Release Kotlin lib

# Publishes the ergonomic `dev.moq:moq` wrapper. Unlike release-kt-ffi.yml (which
# tracks the crate via `moq-ffi-v*` tags), the wrapper is versioned by hand:
# `moq.version` in kt/gradle.properties is the source of truth. This workflow
# checks whether that version is already on Maven Central and publishes only
# when it isn't, so merging a `moq.version` bump ships a new release while any
# other push is a no-op.
#
# The wrapper is pure Kotlin layered on `dev.moq:moq-ffi`; its POM depends on
# moq-ffi via a floating range so consumers float to the newest bindings patch
# without the wrapper being re-cut. We still generate the UniFFI bindings here
# so the sibling `:moq-ffi` project compiles (the wrapper resolves it via the
# project substitution in kt/moq/build.gradle.kts); native libs aren't needed
# because JNA is compileOnly.
#
# Those bindings come from this checkout, so a push is deferred while rs/moq-ffi
# has changes since its release tag: the wrapper could call FFI API that no
# published moq-ffi has. The FFI coordinator re-triggers this workflow after
# its Kotlin publisher succeeds, then publishes from that tag's commit.

on:
  push:
    branches:
      - release
    paths:
      - "kt/moq/**"
      - "kt/gradle.properties"
      - "kt/build.gradle.kts"
      - "kt/settings.gradle.kts"
      - ".github/workflows/release-kt-lib.yml"
      - "sh/gh/release.sh"
  # Manual trigger so a wrapper bump can be published once the bindings it
  # depends on land on Maven Central (the guard below skips otherwise). Only a
  # dispatch on `release` publishes.
  workflow_dispatch:
  # A called run inherits its caller's event, which can be a dispatch on
  # `release`, so the caller says it is a dry-run rather than the event.
  workflow_call:
    inputs:
      dry-run:
        description: "Publish to Maven Local and check the POMs, as a PR does"
        type: boolean
        default: true
  workflow_run:
    workflows: ["Release FFI", "Release Kotlin FFI"]
    types:
      - completed

permissions:
  contents: read

jobs:
  ffi-release:
    name: Check FFI publisher
    runs-on: ubuntu-latest
    # workflow_run is privileged. Preserve the owner, same-repo, push and tag
    # gates before reading the trusted upstream checkout or allowing wrapper
    # publication.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.repository_owner == 'moq-dev' &&
       (github.event.workflow_run.name == 'Release FFI' || github.event.workflow_run.conclusion == 'success') &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'moq-ffi-v'))
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.publisher.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # head_branch names a branch as readily as a tag, and anyone who can push
      # may name a branch and a workflow after a release. Only a tag the
      # `release tags` ruleset protects, at the run's commit, is a release.
      - name: Require a release tag at the run's commit
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          if [[ "$commit" != "$SHA" ]]; then
            echo "::error::$TAG is not a release tag at $SHA"
            exit 1
          fi
      - uses: ./.github/actions/just
      - name: Check independent publisher
        id: publisher
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: just gh ffi completed kotlin

  check-version:
    name: Check version
    needs: [ffi-release]
    if: needs.ffi-release.outputs.ready == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_publish: ${{ steps.decide.outputs.should_publish }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # Tags, for the unreleased FFI check.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Read moq.version
        id: version
        run: |
          VERSION=$(sed -n 's/^moq\.version=//p' kt/gradle.properties | head -1)
          if [[ -z "$VERSION" ]]; then
            echo "::error::moq.version not found in kt/gradle.properties"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve FFI version
        id: ffi
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            VERSION="${HEAD_BRANCH#moq-ffi-v}"
          else
            VERSION=$(grep '^version' rs/moq-ffi/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # workflow_run verifies the Kotlin FFI publisher, so its tag is
      # published. PRs run it too, so the dry-run shows whether merging would
      # publish.
      - name: Check for unreleased FFI changes
        id: ffi-diff
        if: github.event_name != 'workflow_run'
        run: just gh release ffi-unreleased "${{ steps.ffi.outputs.version }}"

      - name: Check wrapper publication
        id: wrapper
        run: just gh release maven-exists dev.moq moq "${{ steps.version.outputs.version }}"

      # The bindings this checkout generates must be on Maven Central, or the
      # wrapper's POM range resolves to an older moq-ffi without them.
      - name: Check bindings publication
        id: bindings
        if: github.event_name != 'workflow_run' && steps.wrapper.outputs.exists != 'true' && steps.ffi-diff.outputs.unreleased != 'true'
        run: just gh release maven-exists dev.moq moq-ffi "${{ steps.ffi.outputs.version }}"

      - name: Decide publish
        id: decide
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FFI_VERSION: ${{ steps.ffi.outputs.version }}
          WRAPPER_EXISTS: ${{ steps.wrapper.outputs.exists }}
          FFI_UNRELEASED: ${{ steps.ffi-diff.outputs.unreleased }}
          BINDINGS_EXISTS: ${{ steps.bindings.outputs.exists }}
        run: |
          if [[ "$WRAPPER_EXISTS" == "true" ]]; then
            echo "dev.moq:moq:${VERSION} already on Maven Central; nothing to publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          elif [[ "$FFI_UNRELEASED" == "true" ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_run" || "$BINDINGS_EXISTS" == "true" ]]; then
            echo "dev.moq:moq:${VERSION} not published yet; moq-ffi ${FFI_VERSION} available; will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::dev.moq:moq-ffi:${FFI_VERSION} is not on Maven Central yet; skipping wrapper publish until it lands (then re-run this workflow)."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish wrapper
    # Directly on ffi-release: its gate is what makes the head_sha checkout trusted.
    needs: [ffi-release, check-version]
    # PRs and nightly always run (dry-run). Pushes publish only when the version is new.
    if: >-
      github.event_name == 'pull_request' || inputs.dry-run ||
      (needs.check-version.outputs.should_publish == 'true' &&
       (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/release'))
    # Only publishing runs share the serialized group. GitHub keeps a single
    # pending run per group and drops the older one, so a PR or a no-op push
    # sharing it silently cancelled a queued release. Scoped to this job so runs
    # that skip publishing never enter it. Dry-runs get a per-ref group instead
    # and cancel their superseded builds. `inputs.dry-run` is null outside
    # workflow_call, and a null cancel-in-progress fails the job.
    concurrency:
      group: release-kt-lib-${{ (github.event_name == 'pull_request' || inputs.dry-run == true) && github.ref || 'publish' }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' || inputs.dry-run == true }}
    runs-on: ubuntu-latest
    # Maven and signing credentials live in the `publish` Environment, which
    # only protected refs can deploy to. A dry-run needs no secrets.
    environment: ${{ github.event_name != 'pull_request' && !inputs.dry-run && 'publish' || '' }}
    env:
      # Picked up by com.vanniktech.maven.publish via Gradle project properties.
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      # Signing credentials are scoped to the real publish step below, NOT here:
      # fork PRs can't read repo secrets, and an empty `signingInMemoryKey` makes
      # signAllPublications() attempt (and fail) instead of no-op. The dry-run
      # doesn't publish, so it doesn't need to sign.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # No Rust cache: shipped binaries compile from source rather than from
      # whatever the shared R2 cache holds.

      # Generate the UniFFI Kotlin so the sibling :moq-ffi project compiles.
      - name: Generate bindings
        env:
          BUILD_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          just rs package-ffi --bindings-only --version "$BUILD_VERSION" --output dist
          mkdir -p kt/moq-ffi/src/jvmAndAndroidMain/kotlin/uniffi/moq
          cp dist/bindings/kotlin/uniffi/moq/moq.kt \
            kt/moq-ffi/src/jvmAndAndroidMain/kotlin/uniffi/moq/moq.kt

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action's default adds the legacy `tools` package, which Google
          # dropped from the SDK repository. Gradle fetches the rest itself.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # check-version runs outside the serialized group, so an earlier run
      # holding it may have published this version since. Check again.
      - name: Recheck wrapper publication
        id: recheck
        if: github.event_name != 'pull_request' && !inputs.dry-run
        run: just gh release maven-exists dev.moq moq "${{ needs.check-version.outputs.version }}"

      - name: Publish to Maven Central
        if: github.event_name != 'pull_request' && !inputs.dry-run && steps.recheck.outputs.exists != 'true'
        env:
          MOQ_VERSION: ${{ needs.check-version.outputs.version }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          gradle -p kt \
            -Pmoq.version="$MOQ_VERSION" \
            -Pandroid.enabled=true \
            :moq:publishAndReleaseToMavenCentral --no-configuration-cache

      - name: Publish to Maven Local (dry-run)
        if: github.event_name == 'pull_request' || inputs.dry-run
        env:
          MOQ_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          gradle -p kt \
            -Pmoq.version="$MOQ_VERSION" \
            -Pandroid.enabled=true \
            :moq:publishToMavenLocal --no-configuration-cache

      - name: Check published POM dependencies
        if: github.event_name == 'pull_request' || inputs.dry-run
        env:
          MOQ_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          just kt check-poms \
            "$HOME/.m2/repository/dev/moq/moq/$MOQ_VERSION" \
            "$HOME/.m2/repository/dev/moq/moq-jvm/$MOQ_VERSION" \
            "$HOME/.m2/repository/dev/moq/moq-android/$MOQ_VERSION"
