name: Video

# Runs the @moq/video renderer in headless Chromium, which `just check` cannot:
# the WebGPU path, a lost device, and the Canvas2D fallback only exist in a real
# browser. SwiftShader stands in for the GPU, so no GPU runner is needed.
#
# Narrow trigger, like wasm.yml: the renderer, the harness, and the two files that
# wire the renderer into `<moq-publish>` (which the harness drives). `@moq/watch`
# wires it the same way but needs a relay to drive, so its regressions surface
# nightly instead.

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"
  pull_request:
    # `closed` is here only so merging/closing a PR cancels its in-flight run
    # via the concurrency group below; the job itself is skipped on close.
    types: [opened, synchronize, reopened, closed]
    paths:
      - "js/video/**"
      - "js/publish/src/preview.ts"
      - "js/publish/src/element.ts"
      - "test/video/**"
      - "test/justfile"
      - "package.json"
      - "bun.lock"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/video.yml"

concurrency:
  group: video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video:
    name: Video
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Trust the flake's cachix substituter, so the dev shell substitutes
          # instead of building from source. See check.yml for the full story.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      # Playwright's Chromium isn't in the nix devShell. Install it plus its apt
      # runtime libs (`--with-deps` needs the host package manager); the recipe's
      # own `playwright install` then no-ops.
      - name: Playwright Chromium
        run: nix develop --command bash -c "bun install --frozen-lockfile && bunx playwright install --with-deps chromium"
        shell: bash -leo pipefail {0}

      - name: Video
        run: nix develop --command just test video
        shell: bash -leo pipefail {0}
