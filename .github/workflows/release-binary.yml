name: release-binary

# Builds, packages, and (on a tag) releases one workspace binary. moq-cli.yml
# and moq-relay.yml call it; they keep the tag trigger and the workflow name
# that alert.yml, release-brew.yml, and release-winget.yml match on.

on:
  workflow_call:
    inputs:
      crate:
        description: "Cargo package to build, e.g. moq-cli"
        required: true
        type: string
      bin:
        description: "Executable the package ships, e.g. moq"
        required: true
        type: string

permissions:
  contents: read

env:
  CRATE: ${{ inputs.crate }}
  BIN: ${{ inputs.bin }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners. Each binary is built on the same arch it ships
          # for, so the .deb/.rpm linkage matches the distro's glibc on the
          # oldest LTS we support (Ubuntu 22.04 / AlmaLinux 9).
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-22.04
            deb-arch: amd64
            rpm-arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-22.04-arm
            deb-arch: arm64
            rpm-arch: aarch64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Parse version
        id: parse
        shell: bash
        run: just gh release parse-version "$CRATE"

      - name: Set up packaging tools
        uses: ./.github/actions/setup-packaging

      - name: Build (release, glibc 2.34)
        shell: bash
        # Pin to glibc 2.34 so one binary covers Ubuntu 22.04+ (.deb)
        # and AlmaLinux/RHEL/Rocky 9+ (.rpm).
        run: cargo zigbuild --locked --release --target ${{ matrix.target }}.2.34 -p "$CRATE"

      - name: Package release assets
        shell: bash
        env:
          VERSION: ${{ steps.parse.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          just rs package-binary \
            --crate "$CRATE" \
            --bin "$BIN" \
            --binary "target/${TARGET}/release/${BIN}" \
            --bare \
            --version "$VERSION" \
            --target "$TARGET" \
            --output dist

      # A transition.yaml beside nfpm.yaml is a deb-only package that keeps
      # apt upgrades following a renamed package.
      - name: Package .deb (Ubuntu 22.04 toolchain)
        shell: bash
        env:
          VERSION: ${{ steps.parse.outputs.version }}
          ARCH: ${{ matrix.deb-arch }}
          BINARY_PATH: target/${{ matrix.target }}/release/${{ inputs.bin }}
        run: |
          just rs package-nfpm "packaging/$CRATE/nfpm.yaml" deb dist/
          if [[ -f "packaging/$CRATE/transition.yaml" ]]; then
            just rs package-nfpm "packaging/$CRATE/transition.yaml" deb dist/
          fi

      - name: Package .rpm
        shell: bash
        env:
          VERSION: ${{ steps.parse.outputs.version }}
          ARCH: ${{ matrix.rpm-arch }}
          BINARY_PATH: target/${{ matrix.target }}/release/${{ inputs.bin }}
        run: just rs package-nfpm "packaging/$CRATE/nfpm.yaml" rpm dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.crate }}-${{ matrix.target }}
          path: dist/*

  build-tarball-macos:
    name: Build macOS tarball (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/just

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false

      - name: Parse version
        id: parse
        shell: bash
        run: just gh release parse-version "$CRATE"

      - name: Build and package tarball
        shell: bash
        run: |
          just rs package-binary \
            --crate "$CRATE" \
            --bin "$BIN" \
            --target ${{ matrix.target }} \
            --version ${{ steps.parse.outputs.version }} \
            --output dist

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.crate }}-${{ matrix.target }}
          path: dist/*

  build-windows:
    name: Build Windows zip (${{ matrix.target }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      # aws-lc-rs assembles its x86_64 crypto with NASM on Windows.
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Parse version
        id: parse
        shell: bash
        run: just gh release parse-version "$CRATE"

      - name: Build and package zip
        shell: bash
        run: |
          just rs package-windows \
            --crate "$CRATE" \
            --bin "$BIN" \
            --target ${{ matrix.target }} \
            --version ${{ steps.parse.outputs.version }} \
            --output dist

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.crate }}-${{ matrix.target }}
          path: dist/*

  release:
    name: Release
    needs: [build, build-tarball-macos, build-windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Parse version
        id: parse
        run: just gh release parse-version "$CRATE"

      - name: Find previous tag
        id: prev_tag
        run: just gh release prev-tag "$CRATE"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TITLE: "${{ inputs.crate }} v${{ steps.parse.outputs.version }}"
          RELEASE_PREV_TAG: ${{ steps.prev_tag.outputs.tag }}
        run: just gh release create artifacts

      - name: Trigger apt/rpm repo publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: just gh trigger-repo-publish
