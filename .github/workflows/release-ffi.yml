name: release-ffi

# Builds each requested target and generates bindings. The shared coordinator
# uploads default-lib-<target>; standalone callers retain their language prefix.
# Binding artifacts retain their language names in either mode.

on:
  workflow_call:
    inputs:
      language:
        description: "Binding language and artifact prefix, e.g. kotlin"
        required: true
        type: string
      targets:
        description: "JSON array of Rust targets to build"
        required: true
        type: string
      bindings:
        description: "Generate and upload the bindings for `language`"
        type: boolean
        default: true
      reuse-native:
        description: "Consume the coordinator's native libraries and bindings"
        type: boolean
        default: false
      binding-languages:
        description: "JSON array of binding languages; empty means language"
        type: string
        default: ""
    outputs:
      targets:
        description: "Requested targets, for selecting and staging native artifacts"
        value: ${{ jobs.parse-version.outputs.targets }}
      version:
        description: "moq-ffi version, from the tag or (off a tag) rs/moq-ffi/Cargo.toml"
        value: ${{ jobs.parse-version.outputs.version }}

permissions:
  contents: read

# Pinned rather than "latest": `--locked` only fixes the tool's own
# dependencies, not which version of the tool cargo selects.
env:
  CARGO_NDK_VERSION: 4.1.2

jobs:
  parse-version:
    name: Parse version
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ inputs.targets }}
      version: ${{ steps.parse.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Parse version
        id: parse
        run: just gh release parse-version moq-ffi

  build:
    name: Build moq-ffi (${{ matrix.target }})
    needs: [parse-version]
    if: ${{ !inputs.reuse-native }}
    runs-on: ${{ contains(matrix.target, '-apple-') && 'macos-latest' || contains(matrix.target, '-windows-') && 'windows-latest' || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      # No Rust cache: shipped binaries compile from source rather than from
      # whatever the shared R2 cache holds.

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          # g++ as well as gcc: moq-video's openh264 fallback is C++, and
          # cc-rs looks for aarch64-linux-gnu-g++ by name.
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install cargo-ndk (Android)
        if: contains(matrix.target, 'android')
        run: cargo install --locked "cargo-ndk@$CARGO_NDK_VERSION"

      - name: Build
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_VERSION: ${{ needs.parse-version.outputs.version }}
          # Set iOS deployment target to avoid ___chkstk_darwin linker errors.
          IPHONEOS_DEPLOYMENT_TARGET: ${{ contains(matrix.target, 'apple-ios') && '16.0' || '' }}
        run: |
          just rs package-ffi --target "$BUILD_TARGET" --version "$BUILD_VERSION" --output dist

      - name: Upload lib
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.language }}-lib-${{ matrix.target }}
          # Only the lib/ contents, so a caller's download is <target>/<libname>.
          path: dist/moq-ffi-${{ needs.parse-version.outputs.version }}-${{ matrix.target }}/lib/

  bindings:
    name: Generate bindings (${{ matrix.language }})
    needs: [parse-version, build]
    # An unrelated target failure must not suppress bindings for successful
    # consumers. A missing Linux artifact fails its download below.
    if: ${{ always() && !cancelled() && inputs.bindings && !inputs.reuse-native }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.binding-languages || format('["{0}"]', inputs.language)) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # No Rust cache: shipped binaries compile from source rather than from
      # whatever the shared R2 cache holds.

      # Go uses a third-party generator; build.sh skips Go when it is absent.
      - name: Install uniffi-bindgen-go
        if: matrix.language == 'go'
        env:
          # A fork until NordSecurity ships a uniffi 0.32 generator; see flake.nix.
          # The revision is v0.10.0-kixelated.2+v0.32.0.
          UNIFFI_BINDGEN_GO_REPO: https://github.com/kixelated/uniffi-bindgen-go
          UNIFFI_BINDGEN_GO_REV: v0.10.0-kixelated.2+v0.32.0
        run: |
          cargo install --locked uniffi-bindgen-go \
            --git "$UNIFFI_BINDGEN_GO_REPO" \
            --rev "$UNIFFI_BINDGEN_GO_REV"

      - name: Download binding metadata
        if: contains(fromJSON(inputs.targets), 'x86_64-unknown-linux-gnu')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.language }}-lib-x86_64-unknown-linux-gnu
          path: binding-library

      - name: Generate bindings
        env:
          BUILD_VERSION: ${{ needs.parse-version.outputs.version }}
          REUSE_LIBRARY: ${{ contains(fromJSON(inputs.targets), 'x86_64-unknown-linux-gnu') }}
        run: |
          args=(--bindings-only --version "$BUILD_VERSION" --output dist)
          if [[ "$REUSE_LIBRARY" == true ]]; then
            args+=(--library binding-library/libmoq_ffi.so)
          fi
          just rs package-ffi "${args[@]}"

      - name: Upload bindings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.language }}-bindings
          path: dist/bindings/${{ matrix.language }}/
          # A language build.sh does not generate would otherwise upload nothing.
          if-no-files-found: error
