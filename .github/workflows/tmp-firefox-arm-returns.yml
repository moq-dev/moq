name: Temporary Firefox ARM returns measurement

# Temporary: measures quest/m0/interop-green/firefox-arm-returns.md's `lifecycle player returns`
# on the Nightly's runner class, with and without the fix. Deleted before the PR is ready for review.

on:
  pull_request:
    paths:
      - .github/workflows/tmp-firefox-arm-returns.yml
      - .github/tmp-arm/**

permissions:
  contents: read

jobs:
  measure:
    name: ARM returns (${{ matrix.variant }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [main, fix]
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          access-key-id: ${{ secrets.MBX_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MBX_R2_SECRET_ACCESS_KEY }}
      - name: Install publisher and player engines
        run: |
          nix develop --command env PLAYWRIGHT_BROWSERS_PATH="${{ runner.temp }}/playwright" bash -c "just js install frozen && bunx playwright install --with-deps chromium firefox"
          sudo apt-get install -y libpulse0
      - name: Measure
        env:
          VARIANT: ${{ matrix.variant }}
          PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: 1
          BROWSERS: ${{ runner.temp }}/playwright
        run: |
          runs=3
          if [[ "$VARIANT" == main ]]; then git apply .github/tmp-arm/revert-fix.patch; fi
          git diff --stat
          pass=0
          fail=0
          for i in $(seq "$runs"); do
            log="$RUNNER_TEMP/run-$i.log"
            if nix develop --command env PLAYWRIGHT_BROWSERS_PATH="$BROWSERS" HARNESS_RUNS="$RUNNER_TEMP/runs-$i" HARNESS_KEEP=1 \
              just test media --media-engines firefox >"$log" 2>&1; then
              pass=$((pass + 1))
              echo "run $i: pass"
            else
              fail=$((fail + 1))
              echo "run $i: fail"
            fi
            grep -E '^\s*(FAIL|PASS) ' "$log" | grep -E 'FAIL|returns' | cut -c1-400 || true
            # The return: from the last replacement wire's end to the end of the lifecycle log.
            for life in "$RUNNER_TEMP"/runs-"$i"/*/media-*lifecycle*.log; do
              [[ -f "$life" ]] || continue
              # The fixture's audio demand and the player's audio gaps at cold start, rejoin, and reattach.
              awk '/^=== (cold start|unsubscribe and rejoin|detach and reattach)/{on=1; print; next} /^=== /{on=0} on && /tmp-audio|skipping (missing|slow) groups: track=audio|audio underflow|reaches live|FAIL/' "$life" \
                | cut -c1-200 | head -60 | sed "s/^/  run $i: /" || true
              start=$(grep -n 'moq-transport-22: replacement' "$life" | tail -1 | cut -d: -f1)
              [[ -n "$start" ]] || continue
              ret=$(tail -n +"$start" "$life" | sed '/=== stop and republish ===/q')
              slow=$(grep -c '^\[player\] skipping slow groups: track=audio' <<<"$ret" || true)
              first=$(grep -m1 -E '^\[player\] skipping (missing|slow) groups: track=audio' <<<"$ret" | cut -c1-200)
              echo "return run $i: player slow audio skips=$slow first=[$first]"
              grep -E 'lifecycle player returns|busiest|idle [0-9]' <<<"$ret" | cut -c1-300 || true
            done
          done
          echo "RESULT $VARIANT: $pass pass, $fail fail of $runs" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arm-returns-${{ matrix.variant }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/run-*.log
            ${{ runner.temp }}/runs-*/*/relay.log
            ${{ runner.temp }}/runs-*/*/media-*.log
          if-no-files-found: ignore
