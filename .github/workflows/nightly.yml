name: Nightly

# The gates that don't belong on a pull request.
#
# `audit` is time-based, not diff-based: an advisory is published without this
# repo changing, so a per-PR run both fires on PRs that can't affect it and
# stays silent on the days nobody pushes. `features` is diff-independent for a
# different reason: it compiles the workspace at feature sets that share almost
# no artifacts with the default one, which is several minutes of duplicate work
# that a PR gate can't justify for how rarely it catches something. `obs` is
# diff-independent because its PR-time counterpart can't be: obs.yml has to
# name the paths that can break an external link to libmoq.a, and no list of
# paths covers every one of them (see the comment there). `windows` is
# diff-independent because what it catches is a whole target's worth of
# `#[cfg(target_os = "windows")]` code that no Linux job compiles at all, and a
# Windows runner is too slow to gate every PR on.
#
# A failure here lands on main rather than being caught in review, which is the
# accepted trade. Anything that must block a merge belongs in check.yml.

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    name: Nightly
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false

      - name: Rust Cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-on-failure: true

      # Runs even if the audit fails: a fresh advisory shouldn't hide a
      # compile break in the feature permutations.
      - name: Features
        run: nix develop --command just rs features
        env:
          NEXTEST_PROFILE: ci

      - name: Audit
        if: ${{ !cancelled() }}
        run: nix develop --command just rs audit

      # The OBS plugin is the only thing that links libmoq.a from outside cargo,
      # so a stale `rs/libmoq/native-libs/*.txt` breaks it and nothing else.
      # obs.yml lists the inputs that can do that, but a list of paths can't be
      # complete: a build script emitting `cargo::rustc-link-lib` needs no
      # manifest change, and widening that filter to `rs/**` would run a link on
      # nearly every PR. Being diff-independent, this run covers whatever the
      # filter misses, at the cost of surfacing a day late rather than in review.
      - name: OBS
        if: ${{ !cancelled() }}
        run: nix develop --command just obs ci

  # `just rs windows` is the only thing that compiles moq-video's Media
  # Foundation capture/encode/decode, its D3D11 frames, and every
  # `#[cfg(target_os = "windows")]` test module. The Linux gate skips all of it,
  # so without this the code compiles for the first time in a tag-triggered
  # release build, and the test targets never compile at all.
  #
  # A separate job rather than a step because it needs a Windows host and the
  # runner-native toolchain: Nix doesn't run here. No Swatinem cache either. The
  # repository cache budget is 10 GB, cache.yml spends it warming the Linux
  # target/ that every pull request restores, and a once-a-day job shouldn't
  # evict that to save itself a few minutes.
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # aws-lc-rs assembles its x86_64 crypto with NASM on Windows.
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Pinned: `--locked` fixes just's own dependencies, not which version of
      # just cargo selects.
      - name: Install just
        shell: bash
        run: cargo install --locked just@1.52.0

      - name: Check
        shell: bash
        run: just rs windows
