name: Nightly

# The gates that don't belong on a pull request.
#
# `audit` is time-based, not diff-based: an advisory is published without this
# repo changing, so a per-PR run both fires on PRs that can't affect it and
# stays silent on the days nobody pushes. `features` is diff-independent for a
# different reason: it compiles the workspace at feature sets that share almost
# no artifacts with the default one, which is several minutes of duplicate work
# that a PR gate can't justify for how rarely it catches something. `obs` is
# diff-independent because its PR-time counterpart can't be: obs.yml has to
# name the paths that can break an external link to a Rust staticlib, and no
# list of paths covers every one of them (see the comment there).
#
# The `release-*` jobs are diff-independent because the release workflows only
# ever run on a tag: a change that compiles under plain cargo can still break a
# release artifact (crane vendors and stubs sources in ways cargo never does,
# the wheel builds in a manylinux container, the Kotlin/Swift/Go/Dart packages
# link the FFI on every platform) and nothing notices until the tag is pushed.
#
# `audio-quality` is here because of what it measures. It plays twenty-four rows of
# audio in real time, a minute each, which no merge gate should carry, and every
# number it grades is a timing one that moves with whatever else the runner is
# doing. A per-PR arm would fail on unrelated load often enough to be ignored;
# nightly it competes with nothing, and a regression surfaces a day late against
# a budget that still means something. The recorded-trace replays are the
# exception: deterministic and seconds long, so audio-quality.yml also gates
# PRs on them.
#
# A failure here lands on main rather than being caught in review, which is the
# accepted trade. Anything that must block a merge belongs in check.yml.

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x11:
    uses: ./.github/workflows/x11.yml

  nightly:
    name: Nightly
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # main
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Trust the flake's cachix substituter, as check.yml does, so the dev
          # shell is substituted rather than built from source.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      # Restore only, like `tests` below. Saving its own store cost 3.6 GB of the
      # repository's 10 GB budget and evicted the one every pull request restores.
      - name: Rust cache
        uses: ./.github/actions/rust-cache

      # Runs even if the audit fails: a fresh advisory shouldn't hide a
      # compile break in the feature permutations.
      - name: Features
        run: nix develop --command just rs features
        env:
          NEXTEST_PROFILE: ci

      - name: Go publisher runtime benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just go bench -benchtime=1x

      - name: GStreamer catalog EOS benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just rs bench-gst-catalog -- --quick

      - name: Audio grouping relay benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just bench-audio

      # perf samples worker switch-outs in kernel context into a large buffer; bench-lock refuses without it.
      - name: Allow perf kernel sampling
        if: ${{ !cancelled() }}
        run: sudo sysctl -w kernel.perf_event_paranoid=-1

      # Smoke-tests the capture path: exact off-CPU waits, resolved worker stacks and CPU.
      - name: Relay lock-wait profile
        if: ${{ !cancelled() }}
        run: nix develop --command just bench-lock fanout-heavy 4

      - name: Latency observation benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just rs bench-latency

      - name: Audio mixer benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just rs bench-playback

      # A single route re-price should expose any slope over the route table or
      # over independent observers of the new live broadcast map.
      - name: JS origin broadcast map benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just js bench broadcasts

      - name: JS request ID admission benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just js bench request-ids

      # A restart should cost the same whether one or many requests follow the path,
      # and an unrelated route should wake none of them. Cancellation also varies
      # competing routes independently of cancelled waiters on the same path.
      - name: JS origin request lifecycle benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just js bench requests

      # A route above several interest heads lands once, so its re-price should
      # expose any slope over heads times received routes. A watch coming and going
      # sweeps held watches against attached sessions.
      - name: JS origin announce forwarding benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just js bench forward

      # Fails if reading a fragmented frame costs more per byte as the frame grows.
      - name: JS stream reader benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just js bench reader

      # Fails if a chunk carrying many small frames costs as much per frame as one
      # carrying a single frame, on either the lite or moq-transport group stream,
      # which means decoding went back to a wakeup per frame.
      - name: JS group frame benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just js bench frames

      # Times one varint encode and decode per wire format. No threshold: it only
      # has to keep running, and its numbers are the baseline for the generated codec.
      - name: JS varint benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just js bench varint

      # Bytes and time for lite-06 against lite-07 frames, groups, and requests. No
      # threshold: it only has to keep running.
      - name: JS lite varint benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just js bench lite-varint

      # Fails if publishing a group costs more as the track retains more groups,
      # which means the latency guard or the cache went back to scanning them all.
      - name: JS track retention benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just js bench track

      # Fails if charging a subscription costs more as the session holds more
      # broadcasts and tracks, which means the cap accounting went back to scanning.
      - name: JS session interest accounting benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just js bench interests

      - name: JS catalog estimate fanout benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just js catalog-bench

      - name: JS arrival window benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just js arrivals-bench

      # Times Effect create and close beside a bare `new Error()`. No threshold: it only
      # has to keep running, and its numbers track the creation stack's cost.
      - name: JS signals effect benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just js signals-bench

      # Runs each moq-net Criterion routine once, so a bench that panics (an
      # unparsable version, a shape that deadlocks) fails here instead of on the
      # next manual run. Timing is not compared; nextest never runs a
      # `harness = false` target. `fuzz` enables the benches that require it,
      # which the `'*'` glob otherwise refuses.
      - name: moq-net benchmark smoke
        if: ${{ !cancelled() }}
        run: nix develop --command cargo bench --locked -p moq-net --features fuzz --bench '*' -- --test

      # Runs each kio Criterion routine once, including the contended bench's
      # worker threads, so one that deadlocks or panics fails here. Timing is
      # not compared.
      - name: kio benchmark smoke
        if: ${{ !cancelled() }}
        run: nix develop --command cargo bench --locked -p kio --bench '*' -- --test

      - name: HTTP idle accounting benchmark smoke
        if: ${{ !cancelled() }}
        run: nix develop --command cargo bench --locked -p moq-relay --bench http_idle -- --test

      - name: Relay auth refresh benchmark smoke
        if: ${{ !cancelled() }}
        run: nix develop --command just rs bench-relay-auth --test

      # One relay's stats tick (drain plus plain and compressed encode), swept
      # over held paths, tiers, and how many of those paths changed, plus the
      # decode and aggregate tables. `--test` runs each tick routine once (the
      # tables ignore it and run every configuration), so a panic (a plain
      # frame past the cache cap, a drain that drops a held path) fails here
      # instead of on the next manual run. Timing is not compared. `bench`
      # exposes the hidden producer hook; without it the tick target is skipped.
      - name: moq-stats producer tick, decode and aggregate benchmarks
        if: ${{ !cancelled() }}
        run: nix develop --command just rs bench-stats --test

      # The catalog bench asserts the estimate rate limit's publish counts, so one pass is
      # the regression check.
      - name: moq-mux catalog estimate fanout benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command cargo bench --locked -p moq-mux --bench catalog -- --test

      - name: Archive timeline FETCH fanout benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just rs test -p moq-archive benchmark_timeline_fetch_fanout --run-ignored only --success-output immediate

      - name: TS damage PID benchmark
        if: ${{ !cancelled() }}
        run: nix develop --command just rs test -p moq-mux benchmark_damage_pid_fanout --run-ignored only --success-output immediate

      - name: TS scheduler benchmark smoke
        if: ${{ !cancelled() }}
        run: nix develop --command just rs bench-ts-schedule --test

      - name: Container export benchmark smoke
        if: ${{ !cancelled() }}
        run: nix develop --command just rs bench-export --test

      - name: RTMP chunk-stream benchmark smoke
        if: ${{ !cancelled() }}
        run: nix develop --command just rs bench-rtmp --test

      - name: Stream import throughput
        if: ${{ !cancelled() }}
        run: nix develop --command just rs test -p moq-cli -E 'test(benchmark_stream_import)' --run-ignored only --success-output immediate

      - name: BBB rendition alignment
        if: ${{ !cancelled() }}
        run: nix develop --command just pub check-bbb

      - name: Audit
        if: ${{ !cancelled() }}
        run: nix develop --command just rs audit

      # The OBS plugin (over moq-ffi) and moq-c's C fixtures link a Rust
      # staticlib from outside cargo, so a stale `rs/moq-c/native-libs/*.txt`
      # breaks them and no cargo build. obs.yml lists the inputs that can do that,
      # but a list of paths can't be complete: a build script emitting
      # `cargo::rustc-link-lib` needs no manifest change, and widening that
      # filter to `rs/**` would run a link on nearly every PR. Being
      # diff-independent, this run covers whatever the filter misses, at the
      # cost of surfacing a day late rather than in review.
      - name: OBS
        if: ${{ !cancelled() }}
        run: nix develop .#obs --command just obs ci

      - name: moq-c C fixtures
        if: ${{ !cancelled() }}
        run: nix develop --command just rs c-tests

  tests:
    name: Tests (${{ matrix.recipe }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # `rs uring` is a separate feature compile (off the default set) and
        # kernel-gated below 6.12. The embedding tests for io_uring live there.
        # `test drain` stands up two relays and drains one under a live JS
        # viewer: diff-independent, since a break can arrive through the relay,
        # js/net, or the wire between them.
        # `gh test` exercises workflow and release tooling, which no pull request runs.
        recipe: ["rs doctest --workspace", "rs loom", "test drill-sensitivity", "rs uring", "test drain", "gh test"]
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # main
        with:
          tool-cache: false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Trust the flake's cachix substituter, as check.yml does, so the dev
          # shell is substituted rather than built from source.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=
      - name: Rust cache
        uses: ./.github/actions/rust-cache
      - name: Test
        run: nix develop --command just ${{ matrix.recipe }}
        env:
          NEXTEST_PROFILE: ci
          MOQ_STRICT: 1

  # Full platform coverage without rebuilding after every main queue merge.
  platform:
    uses: ./.github/workflows/platform.yml

  # Plays the matrix in headless Chromium through moq-shaper and grades what the
  # listener heard against test/audio-quality/budgets.json. ARM64 like wasm.yml,
  # the only architecture cache.yml warms a Rust store for.
  audio-quality:
    name: Audio quality
    runs-on: ubuntu-24.04-arm
    # Twenty-four rows at a minute each, plus the relay, CLI, and shaper built from source.
    timeout-minutes: 60
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # main
        with:
          tool-cache: false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=
      - name: Rust cache
        uses: ./.github/actions/rust-cache
      # Playwright's Chromium isn't in the nix devShell; `--with-deps` installs
      # its apt runtime libs, and run.sh's own install then no-ops.
      - name: Playwright Chromium
        run: nix develop --command bash -c "bun install --frozen-lockfile && bunx playwright install --with-deps chromium"

      - name: WebSocket fallback startup benchmark
        run: nix develop --command just js qmux-bench

      - name: Browser publisher fairness benchmark
        run: nix develop --command just js serve-bench
        shell: bash -leo pipefail {0}
      - name: Native headless playback
        if: ${{ !cancelled() }}
        run: nix develop --command just test native-play
        shell: bash -leo pipefail {0}
        env:
          MOQ_TEST_RUNS: ${{ runner.temp }}/moq-test-runs
      - name: Audio quality
        if: ${{ !cancelled() }}
        run: nix develop --command just test audio-quality --enforce --capture
        shell: bash -leo pipefail {0}
        env:
          # Somewhere upload-artifact can reach; the harness default is under $TMPDIR.
          MOQ_TEST_RUNS: ${{ runner.temp }}/moq-test-runs
          # A passing run is kept too: budgets.json is measured from these nights.
          MOQ_TEST_KEEP: 1
      # The run directory is the diagnosis: each process's log, the shaper's
      # counters, the raw samples, and every row's summary.
      - name: Keep the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audio-quality-run
          path: ${{ runner.temp }}/moq-test-runs/
          retention-days: 7
          if-no-files-found: ignore

  # Every tag-driven release workflow, run against main with publishing skipped:
  # the workflows gate their publish jobs on `github.ref_type == 'tag'`, and no
  # secrets are passed, so a dry-run cannot publish even by accident.
  #
  # A caller has to grant every permission a nested job declares, skipped or
  # not, so these carry the release-time grants. Nothing that runs here uses
  # them.
  release-py-ffi:
    name: Release Py FFI
    uses: ./.github/workflows/release-py-ffi.yml
    permissions:
      contents: read
      id-token: write

  release-kt-ffi:
    name: Release Kotlin FFI
    uses: ./.github/workflows/release-kt-ffi.yml
    permissions:
      contents: read

  release-swift-lib:
    name: Release Swift Lib
    uses: ./.github/workflows/release-swift-lib.yml
    permissions:
      contents: read

  release-swift-ffi:
    name: Release Swift FFI
    uses: ./.github/workflows/release-swift-ffi.yml
    permissions:
      contents: write

  release-go-ffi:
    name: Release Go FFI
    uses: ./.github/workflows/release-go-ffi.yml
    permissions:
      contents: read

  release-dart-ffi:
    name: Release Dart FFI
    uses: ./.github/workflows/release-dart-ffi.yml
    permissions:
      contents: write
      id-token: write

  release-moq-c:
    name: moq-c
    uses: ./.github/workflows/moq-c.yml
    permissions:
      contents: write

  release-cpp:
    name: Release Cpp
    uses: ./.github/workflows/release-cpp.yml
    permissions:
      contents: write

  release-moq-relay:
    name: moq-relay
    uses: ./.github/workflows/moq-relay.yml
    permissions:
      contents: write
      actions: write

  release-moq-cli:
    name: moq-cli
    uses: ./.github/workflows/moq-cli.yml
    permissions:
      contents: write
      actions: write

  release-moq-gst:
    name: moq-gst
    uses: ./.github/workflows/moq-gst.yml
    permissions:
      contents: write
      actions: write

  # The three Docker images share one Dockerfile, so one package covers it.
  release-docker:
    name: Docker
    uses: ./.github/workflows/docker.yml
    with:
      package: moq-relay
    permissions:
      contents: read

  sizes:
    name: Shipping sizes
    # Measures what these release jobs upload rather than rebuilding it.
    needs: [release-py-ffi, release-kt-ffi, release-swift-ffi, release-go-ffi, release-moq-c, release-moq-relay, release-moq-cli]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=
      - uses: ./.github/actions/rust-cache
      - name: Collect and compare sizes
        run: nix develop --command just gh size-nightly size-report "$GITHUB_RUN_ID"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Preserve sizes and attribution
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-size-history
          path: |
            size-report/history.json
            size-report/sizes.json
            size-report/summary.md
            size-report/ffi-bloat.txt
            size-report/js/bytes.json
            size-report/js/*.metafile.json
          retention-days: 45
          if-no-files-found: error

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: [lite, announce, ietf, varint, path, pattern]
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # main
        with:
          tool-cache: false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Trust the flake's cachix substituter, as check.yml does, so the dev
          # shell is substituted rather than built from source.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Fuzz
        run: nix develop --command just rs fuzz ${{ matrix.target }} -- -max_total_time=300
      - name: Preserve failure inputs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-${{ matrix.target }}
          path: rs/moq-net/fuzz/artifacts/
          if-no-files-found: ignore
