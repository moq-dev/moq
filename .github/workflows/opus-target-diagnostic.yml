name: Opus target diagnostic
# Temporary quest-branch experiment; delete before the PR is ready.
# Tests whether the near-zero stall follows the first row after a fresh cargo build
# rather than the isolated ring.
permissions:
  contents: read
on:
  push:
    branches: [quest/m1/audio-jitter-target/opus-isolated-target]
concurrency:
  group: opus-target-diagnostic
  cancel-in-progress: true
jobs:
  audio-quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Plain first, straight after the harness's own build: the ring nightly calls fine.
          - name: plain-first-cold
            prebuild: false
            rings: plain,isolated
          # Isolated first, with the build done and flushed to disk before the harness starts.
          - name: isolated-first-synced
            prebuild: true
            rings: isolated,plain
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=
      - name: Rust cache
        uses: ./.github/actions/rust-cache
      - name: Playwright Chromium
        run: nix develop --command bash -c "bun install --frozen-lockfile && bunx playwright install --with-deps chromium"
      - name: Prebuild and flush
        if: ${{ matrix.prebuild }}
        run: |
          nix develop --command cargo build --locked -p moq-relay -p moq-cli -p moq-shaper
          grep -E '^(Dirty|Writeback):' /proc/meminfo
          time sync
          grep -E '^(Dirty|Writeback):' /proc/meminfo
      - name: Audio quality
        run: |
          mkdir -p "$MOQ_TEST_RUNS"
          (while true; do
             printf '%s ' "$(date -u +%H:%M:%S.%N)"
             grep -E '^(Dirty|Writeback):' /proc/meminfo | tr -s ' \n' ' '
             printf '| io %s | cpu %s\n' "$(head -1 /proc/pressure/io 2>/dev/null)" "$(head -1 /proc/pressure/cpu 2>/dev/null)"
             sleep 0.5
           done) > "$MOQ_TEST_RUNS/pressure.log" 2>&1 &
          vmstat -t 1 > "$MOQ_TEST_RUNS/vmstat.log" 2>&1 &
          status=0
          nix develop --command just test audio-quality --profiles near-zero --codecs opus --rings ${{ matrix.rings }} --duration 60 --capture || status=$?
          kill %1 %2 || true
          exit $status
        shell: bash -leo pipefail {0}
        env:
          MOQ_TEST_RUNS: ${{ runner.temp }}/moq-test-runs
          MOQ_TEST_KEEP: 1
      - name: Keep the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audio-quality-${{ matrix.name }}
          path: ${{ runner.temp }}/moq-test-runs/
          retention-days: 7
          if-no-files-found: ignore
