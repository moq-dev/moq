name: WASM

# Runs the @moq/wasm bindings in a real browser, which nothing in `just check`
# can do. rs/moq-wasm is `#![cfg(target_arch = "wasm32")]`, so a host-target
# `cargo check --workspace` compiles it to nothing, and `just rs wasm` is a
# compile gate: it catches a moq-net change that stops the bindings building,
# never one that stops them working. See test/wasm/README.md.
#
# Pull requests reach this through gates.yml, which selects it whenever the diff
# can reach moq-wasm through the dependency graph, plus the machinery that turns
# the crate into the package under test: `js/wasm`, the harness under `test/wasm`,
# and `.cargo/config.toml`, which carries the wasm32 rustflags
# (`getrandom_backend`, `web_sys_unstable_apis`) without which it does not compile
# at all.
#
# The harness's own fixtures are in as well: run.sh builds a real `moq-relay` and
# publishes from `@moq/net`. The `paths:` filter this replaced left both out on
# purpose, because naming them would have launched a browser on a large share of
# pull requests, and accepted that a break arriving through either lands on `main`
# and shows up the next run. Selection makes them affordable: a diff reaching
# either already runs the smoke lane, so this one runs beside it, not after it.

permissions:
  contents: read

on:
  workflow_call:

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    name: WASM
    # x64, not the arm runner the other jobs use: this is the configuration
    # smoke.yml already launches Playwright's Chromium on.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Out of target/, so the Rust cache does not carry bundles between runs,
      # and at a fixed path so the upload below does not have to guess. The
      # harness deletes its own bundle when it passes, so whatever survives to
      # the upload step is exactly the failure. See test/README.md.
      MOQ_QA_ARTIFACTS: ${{ github.workspace }}/qa-artifacts

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Trust the flake's cachix substituter, so the dev shell substitutes
          # instead of building from source. See check.yml for the full story.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      # Restore only. cache.yml is the single writer, on `main`; see the comment
      # there for why.
      - name: Rust cache
        uses: ./.github/actions/rust-cache

      # Playwright's Chromium isn't in the nix devShell. Install it plus its apt
      # runtime libs (`--with-deps` needs the host package manager); run.sh's own
      # `playwright install` then no-ops.
      - name: Playwright Chromium
        run: nix develop --command bash -c "bun install --frozen-lockfile && bunx playwright install --with-deps chromium"
        shell: bash -leo pipefail {0}

      - name: WASM
        run: nix develop --command just test wasm
        shell: bash -leo pipefail {0}

      # Browser screenshots, redacted HARs, logs, and withheld trace identities
      # have to leave the runner. `just test fetch <run id>` pulls them down.
      - name: Debug bundles
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qa-bundle-wasm
          # Match finalized harness directories, never .incomplete or .live.
          path: qa-artifacts/wasm-*/
          if-no-files-found: ignore
          retention-days: 14
