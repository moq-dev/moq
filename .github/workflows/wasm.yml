name: WASM

# Runs the @moq/wasm bindings in a real browser, which nothing in `just check`
# can do, and moq-clock's browser timers and wall clock through
# wasm-bindgen-test on the same Chromium. rs/moq-wasm is
# `#![cfg(target_arch = "wasm32")]`, so a host-target `cargo check --workspace`
# compiles it to nothing, and `just rs wasm` is a compile gate: it catches a
# moq-net change that stops the bindings building, never one that stops them
# working. See test/wasm/README.md.
#
# Narrow trigger, like obs.yml. The filter covers what the bindings
# are built out of: moq-net, because that is the break this exists to catch in
# review (they are a thin wrapper over it, and every other gate compiles them to
# nothing), and kio underneath it, because a lost wakeup or a timer regression
# reaches the browser through moq-net without touching a file named here
# otherwise. moq-clock supplies the browser clock below those layers.
#
# The rest of the filter is the machinery that turns the crate into the package
# under test, which is just as able to break it: the root `justfile` owns the
# `wasm` recipe, `rs/justfile` the `wasm-test` recipe, and `.cargo/config.toml` carries the wasm32 rustflags
# (`getrandom_backend`, `web_sys_unstable_apis`) without which it does not
# compile at all.
#
# Two things the harness needs are deliberately out, because they are fixtures
# rather than the code under test, and both are already gated elsewhere:
# `js/net/**` (the publisher; its own unit tests plus the interop matrix) and
# `rs/moq-relay/**` (the server; the Rust test suite plus interop). Naming either
# would launch a browser on a large share of pull requests. The cost is that a
# break arriving through one of them lands on `main` and shows up the next time
# this runs.

permissions:
  contents: read

on:
  workflow_call:

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    name: WASM
    # ARM64 like check.yml; the harness builds the relay natively.
    runs-on: ubuntu-24.04-arm
    # Hosted `main` jobs write the Rust cache; see .github/actions/rust-cache.
    environment: ${{ github.ref == 'refs/heads/main' && 'cache-write' || '' }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # Nightly's call writes on `main`; release pull requests read.
      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          access-key-id: ${{ secrets.MBX_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MBX_R2_SECRET_ACCESS_KEY }}

      - name: Browser clock
        run: nix develop --command just rs wasm-test
        shell: bash -leo pipefail {0}

      - name: WASM
        run: nix develop --command just test wasm
        shell: bash -leo pipefail {0}
        env:
          # The run writes its directory here, so a failed one is uploaded below
          # and a passing one is deleted as usual.
          HARNESS_RUNS: ${{ runner.temp }}/moq-test-runs

      # A failing harness run keeps its directory, holding the relay logs, their
      # configs, and a Playwright trace of the failing page. Upload it for a
      # short while so a red run is diagnosable; a passing run deletes its own.
      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wasm-failure
          path: ${{ runner.temp }}/moq-test-runs
          retention-days: 7
          if-no-files-found: ignore
