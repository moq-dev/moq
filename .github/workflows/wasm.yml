name: WASM

# Runs the @moq/wasm bindings in a real browser, which nothing in `just check`
# can do. rs/moq-wasm is `#![cfg(target_arch = "wasm32")]`, so a host-target
# `cargo check --workspace` compiles it to nothing, and `just rs wasm` is a
# compile gate: it catches a moq-net change that stops the bindings building,
# never one that stops them working. See test/wasm/README.md.
#
# Narrow trigger, like obs.yml and swift.yml. The filter covers what the bindings
# are built out of: moq-net, because that is the break this exists to catch in
# review (they are a thin wrapper over it, and every other gate compiles them to
# nothing), and kio underneath it, because a lost wakeup or a timer regression
# reaches the browser through moq-net without touching a file named here
# otherwise. Those two are the whole in-repo dependency graph of the crate.
#
# The rest of the filter is the machinery that turns the crate into the package
# under test, which is just as able to break it: the root `justfile` owns the
# `wasm` recipe, and `.cargo/config.toml` carries the wasm32 rustflags
# (`getrandom_backend`, `web_sys_unstable_apis`) without which it does not
# compile at all.
#
# Two things the harness needs are deliberately out, because they are fixtures
# rather than the code under test, and both are already gated elsewhere:
# `js/net/**` (the publisher; its own unit tests plus the smoke matrix) and
# `rs/moq-relay/**` (the server; the Rust test suite plus smoke). Naming either
# would launch a browser on a large share of pull requests. The cost is that a
# break arriving through one of them lands on `main` and shows up the next time
# this runs.

permissions:
  contents: read

on:
  pull_request:
    # `closed` is here only so merging/closing a PR cancels its in-flight run
    # via the concurrency group below; the job itself is skipped on close.
    types: [opened, synchronize, reopened, closed]
    paths:
      - "rs/moq-wasm/**"
      - "rs/moq-net/**"
      - "rs/kio/**"
      - "js/wasm/**"
      - "test/wasm/**"
      - "justfile"
      - "test/justfile"
      - ".cargo/config.toml"
      - "package.json"
      - "bun.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/wasm.yml"

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    name: WASM
    if: github.event.action != 'closed'
    # x64, not the arm runner the other jobs use: this is the configuration
    # smoke.yml already launches Playwright's Chromium on.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Trust the flake's cachix substituter, so the dev shell substitutes
          # instead of building from source. See check.yml for the full story.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      # Restore only. cache.yml is the single writer, on `main`; see the comment
      # there for why. `shared-key` has to match the one it saves under.
      - name: Rust Cache
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          shared-key: rust
          save-if: false

      # Playwright's Chromium isn't in the nix devShell. Install it plus its apt
      # runtime libs (`--with-deps` needs the host package manager); run.sh's own
      # `playwright install` then no-ops.
      - name: Playwright Chromium
        run: nix develop --command bash -c "bun install && bunx playwright install --with-deps chromium"
        shell: bash -leo pipefail {0}

      - name: WASM
        run: nix develop --command just test wasm
        shell: bash -leo pipefail {0}
