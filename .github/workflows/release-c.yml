name: Release C

# Builds the moq C package (c/moq) for every target and publishes one archive per target to a
# c-v<version> GitHub release. moq-c-v* tags belong to the hand-written rs/moq-c crate until it
# retires.

on:
  push:
    tags:
      - "c-v*"
  # Dry-run: build everything, publish nothing. Nightly calls every release
  # workflow this way so a broken build surfaces before the tag is cut.
  workflow_call:
    inputs:
      reuse-native:
        description: "Use this run's native input after its installed-consumer gate succeeds"
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # aws-lc-rs assembles its x86_64 crypto with NASM on Windows.
      - name: Install NASM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The tag flake.nix pins; see the comment there.
      - name: Install uniffi-bindgen-cpp
        shell: bash
        run: cargo install uniffi-bindgen-cpp --locked --git https://github.com/kixelated/uniffi-bindgen-cpp --tag v0.11.0-kixelated.7+v0.32.2

      # The package version lives in c/moq/VERSION; a tag that disagrees is a mistake.
      - name: Check version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(tr -d '[:space:]' < c/moq/VERSION)
          if [[ "$TAG" != "c-v$version" ]]; then
            echo "::error::tag $TAG does not match c/moq/VERSION ($version)"
            exit 1
          fi

      - name: Refuse same-run input for a release tag
        if: inputs.reuse-native && github.ref_type == 'tag'
        run: |
          echo "::error::c-v releases must use their immutable FFI_VERSION pin"
          exit 1

      # release-shared-ffi.yml stages and checks one default-feature input for both packages.
      - name: Download validated same-run input
        if: inputs.reuse-native
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cpp-native-${{ matrix.target }}
          path: native-archive

      - name: Parse prebuilt FFI version
        if: inputs.reuse-native
        id: ffi-version
        run: just gh release parse-version moq-ffi

      - name: Verify and extract validated input
        if: inputs.reuse-native
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.ffi-version.outputs.version }}
        run: just cpp ffi extract --version "$VERSION" --target "$TARGET" --directory native-archive --output native-input

      - name: Build and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PREBUILT_INPUT: ${{ inputs.reuse-native }}
        run: |
          args=(--target "$TARGET" --output dist)
          if [[ "$PREBUILT_INPUT" == true ]]; then
            args+=(--ffi-dir "$GITHUB_WORKSPACE/native-input")
          fi
          just c package "${args[@]}"

      - name: Check packaged archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version=$(tr -d '[:space:]' < c/moq/VERSION)
          extension=tar.gz
          [[ "$TARGET" == *-windows-* ]] && extension=zip
          just c check --archive "dist/moq-c-$version-$TARGET.$extension"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: moq-c-generated-${{ matrix.target }}
          path: dist/*

  release:
    name: Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Parse version
        id: parse
        run: just gh release parse-version c

      - name: Find previous tag
        id: prev_tag
        run: just gh release prev-tag c

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TITLE: "moq-c v${{ steps.parse.outputs.version }}"
          RELEASE_PREV_TAG: ${{ steps.prev_tag.outputs.tag }}
        run: just gh release create artifacts
