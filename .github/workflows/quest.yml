name: Quest

# Validates the quest tree on every branch that carries one. check.yml already
# runs `quest check` on a pull request into any branch, but a direct push (a
# merge to `main` or `dev`, or `main` merged into a questline) is nobody's pull
# request, so a broken tree could land there unseen.
#
# Push only: a pull request is check.yml's job, and a pull_request trigger here
# would spawn a skipped Alert run on every push to every pull request.
#
# The paths mirror the quest module in sh/dispatch.sh's impact map: the
# documents, and flake.lock, which pins the validator.

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - dev
      - "quest/**"
    paths:
      - "quest/**"
      - "flake.lock"
      - ".github/workflows/quest.yml"

# Only the newest push to a branch matters; Alert ignores the cancelled runs.
concurrency:
  group: quest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Not `Check`: that is check.yml's required status, and a second job with
    # the same name would make it ambiguous on a head that runs both.
    name: Quest
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Trust the flake's cachix substituter, which holds the quest build
          # as part of the dev shell closure; see check.yml.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      # The whole tree, unscoped: a push has no base to diff against.
      #
      # Only the quest package, not `nix develop`: the dev shell compiles
      # uniffi-bindgen-go from source whenever cache.yml hasn't pushed it for
      # this flake.lock yet, which ran past the timeout.
      - name: Check
        run: nix run .#quest -- check
