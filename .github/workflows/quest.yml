name: Quest

# Validates the quest tree on `release`, which takes merges without the merge
# queue. `main` lands only through the merge queue, whose `just ci` runs
# `quest check`. Pull request branches, quest branches included, get no CI:
# their authors run `just check` before pushing.
#
# The paths mirror the quest module in sh/dispatch.sh's impact map: the
# documents, and flake.lock, which pins the validator.

permissions:
  contents: read

on:
  push:
    branches:
      - release
    paths:
      - "quest/**"
      - "flake.lock"
      - ".github/workflows/quest.yml"

# Only the newest push to a branch matters; Alert ignores the cancelled runs.
concurrency:
  group: quest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quest
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # The whole tree, unscoped: a push has no base to diff against.
      #
      # Only the quest package, not `nix develop`: the dev shell compiles
      # uniffi-bindgen-go from source whenever cache.yml hasn't pushed it for
      # this flake.lock yet, which ran past the timeout.
      - name: Check
        run: nix run .#quest -- check
