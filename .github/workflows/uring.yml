name: io_uring

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      # The shared Rust selector walks reverse dependencies, including feature
      # dependencies. Broad paths keep newly added shared crates covered.
      - "rs/**"
      - "sh/rs/**"
      - "sh/changed.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - ".cargo/**"
      - ".config/nextest.toml"
      - "flake.nix"
      - "flake.lock"
      - ".github/actions/**"
      - ".github/workflows/uring.yml"

concurrency:
  group: uring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uring:
    name: io_uring
    if: github.event.action != 'closed'
    # This image provides a 6.12+ kernel; MOQ_STRICT fails the tests if that changes.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      MOQ_STRICT: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      - name: Rust cache
        uses: ./.github/actions/rust-cache

      - name: io_uring
        run: nix develop --command just rs uring-changed "$CI_BASE"
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash -leo pipefail {0}
