name: Temporary Firefox ARM lifecycle measurement

# Temporary: reproduces quest/m0/interop-green/firefox-player-lifecycle.md's Nightly failures with
# the whole `media` lane on the Nightly's runner class. Deleted before the PR is ready for review.

on:
  pull_request:
    paths:
      - .github/workflows/tmp-firefox-lifecycle.yml
      - .github/tmp-arm/**

permissions:
  contents: read

jobs:
  measure:
    name: ARM media (${{ matrix.shard }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          access-key-id: ${{ secrets.MBX_B2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MBX_B2_SECRET_ACCESS_KEY }}
      - name: Install publisher and player engines
        run: |
          nix develop --command env PLAYWRIGHT_BROWSERS_PATH="${{ runner.temp }}/playwright" bash -c "just js install frozen && bunx playwright install --with-deps chromium firefox"
          sudo apt-get install -y libpulse0
      - name: Measure
        env:
          PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: 1
          BROWSERS: ${{ runner.temp }}/playwright
        run: |
          runs=4
          if [[ -f .github/tmp-arm/variant.patch ]]; then git apply .github/tmp-arm/variant.patch; fi
          git diff --stat
          nproc
          pass=0
          fail=0
          for i in $(seq "$runs"); do
            log="$RUNNER_TEMP/run-$i.log"
            if nix develop --command env PLAYWRIGHT_BROWSERS_PATH="$BROWSERS" HARNESS_RUNS="$RUNNER_TEMP/runs-$i" HARNESS_KEEP=1 \
              just test media --media-engines firefox >"$log" 2>&1; then
              pass=$((pass + 1))
              echo "run $i: pass"
            else
              fail=$((fail + 1))
              echo "run $i: fail"
            fi
            grep -E '^\s*FAIL ' "$log" | cut -c1-400 | sed "s/^/  run $i: /" || true
          done
          echo "RESULT: $pass pass, $fail fail of $runs" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arm-media-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/run-*.log
            ${{ runner.temp }}/runs-*
          if-no-files-found: ignore
