# Temporary diagnostic for quest/m0/nightly/ts-schedule.md; removed before the PR leaves draft.
name: ts-schedule-diag
on:
  push:
    branches: [quest/m0/nightly/ts-schedule]
    paths: [.github/workflows/ts-schedule-diag.yml]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q strace
      - uses: ./.github/actions/nix
      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          access-key-id: ${{ secrets.MBX_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MBX_R2_SECRET_ACCESS_KEY }}
      - name: Paired run as Nightly does it
        env:
          MOQ_BENCH_BASE: 4381af6f07e32d594036723f80d298b67e60085f
          MOQ_BENCH_ARTIFACTS: /tmp/runs
        run: |
          nix develop --command bench/run.sh --criterion --no-fail-fast -p moq-relay -p moq-stats -p moq-mux -p moq-rtmp -p moq-uring -p moq-pattern \
            -p moq-quic --features moq-stats/bench,moq-quic/fuzz \
            --bench http_idle --bench auth --bench http_auth --bench producer_tick --bench decode --bench aggregate \
            --bench catalog --bench ts_schedule --bench export --bench containers --bench matching \
            --bench chunk_interleaving --bench worker_turns \
            --bench streams --bench receive --bench endpoint --bench wire -- ts_schedule/ 2>&1 | grep -E "Criterion|ts_schedule/|paired|regress|slower|faster|Change|change" || true
      - name: Syscalls in the dev shell
        run: |
          set -uo pipefail
          run=$(ls -d /tmp/runs/run.* | head -1)
          for side in base current; do
            line=$(grep -P '^moq-mux/ts_schedule\t' "$run/criterion-$side.targets")
            package=$(cut -f2 <<<"$line") bin=$(cut -f3 <<<"$line")
            echo "== $side $bin"
            ldd "$bin" | grep libc
            for case_ in 1/1 4/1 16/1; do
              (cd "$package" && CRITERION_HOME=/tmp/sys/$side /usr/bin/strace -c -e trace=brk,mmap,munmap,madvise,mremap -o /tmp/strace.txt "$bin" --bench --profile-time 2 "ts_schedule/$case_" --exact >/dev/null 2>&1)
              echo "-- $case_"; cat /tmp/strace.txt
              (cd "$package" && CRITERION_HOME=/tmp/sys/$side "$bin" --bench --warm-up-time 1 --measurement-time 2 --sample-size 30 --noplot "ts_schedule/$case_" --exact 2>&1 | grep time:)
            done
          done
          env | grep -iE "malloc|tunable" || echo "no malloc env"
