name: Swift

permissions:
  contents: read

on:
  pull_request:
    # `closed` is here only so merging/closing a PR cancels its in-flight run
    # via the concurrency group below; the job itself is skipped on close.
    types: [opened, synchronize, reopened, closed]
    paths:
      - "swift/**"
      - "rs/moq-ffi/**"
      - "rs/moq-video/**"
      - "Cargo.lock"
      - ".github/workflows/swift.yml"

concurrency:
  group: swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Swift
    if: github.event.action != 'closed'
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Rust Cache
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          cache-on-failure: true

      - name: Rust simulator check
        shell: bash
        run: |
          for target in aarch64-apple-ios-sim x86_64-apple-ios; do
            rustup target add "$target"
            if ! cargo tree --locked --package moq-ffi --target "$target" | grep -q "openh264-sys2 v"; then
              echo "::error::openh264 must stay enabled for Apple simulator builds"
              exit 1
            fi
            cargo check --locked --package moq-ffi --target "$target"
          done

      - name: Swift check
        run: ./swift/scripts/check.sh
