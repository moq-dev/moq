name: Release Swift FFI

# Builds and publishes the raw `MoqFFI` Swift package (UniFFI bindings +
# prebuilt XCFramework). Driven by the `moq-ffi-v*` tag that release-plz pushes
# when it bumps rs/moq-ffi/Cargo.toml, so this package stays lockstep with the
# moq-ffi crate. The ergonomic `Moq` wrapper is released separately
# (release-swift-lib.yml) and versions independently.

on:
  # The tag coordinator supplies shared default-feature artifacts. Manual
  # calls and Go PR dry-runs still build their own target subset.
  workflow_call:
    inputs:
      reuse-native:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-swift-ffi
  cancel-in-progress: false

jobs:
  ffi:
    name: moq-ffi
    uses: ./.github/workflows/release-ffi.yml
    with:
      language: swift
      reuse-native: ${{ inputs.reuse-native || false }}
      targets: '["aarch64-apple-ios", "aarch64-apple-ios-sim", "aarch64-apple-darwin"]'

  package:
    name: Package
    needs: [ffi]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Select native artifacts
        id: native
        env:
          LIB_PREFIX: ${{ inputs.reuse-native && 'default' || 'swift' }}
          BUILD_TARGETS: ${{ needs.ffi.outputs.targets }}
        run: just gh ffi pattern

      - name: Download per-target libs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: libs-raw
          pattern: ${{ steps.native.outputs.pattern }}

      - name: Flatten lib layout
        env:
          LIB_PREFIX: ${{ inputs.reuse-native && 'default' || 'swift' }}
          BUILD_TARGETS: ${{ needs.ffi.outputs.targets }}
        run: just gh ffi stage

      - name: Download bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: swift-bindings
          path: bindings

      - name: Package
        env:
          BUILD_VERSION: ${{ needs.ffi.outputs.version }}
        run: |
          just swift package-ffi \
            --version "$BUILD_VERSION" \
            --lib-dir libs \
            --bindings-dir bindings \
            --output release-out

      - name: Upload Swift package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: swift-ffi-package
          path: release-out/*

  release:
    # Attach MoqFFI.xcframework.zip (and the staged Swift package tarball) to
    # the moq-ffi-v* GitHub release. The mirror's Package.swift binaryTarget URL
    # points at this asset, so it must exist before any consumer resolves the
    # SPM tag.
    name: Attach assets to GitHub release
    needs: [ffi, package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # No git operations here use the stored credential. gh CLI below picks
          # up GH_TOKEN directly, so don't persist a contents-write token.
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Find previous tag
        id: prev_tag
        run: just gh release prev-tag moq-ffi

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: swift-ffi-package
          path: artifacts

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TITLE: "moq-ffi v${{ needs.ffi.outputs.version }}"
          RELEASE_PREV_TAG: ${{ steps.prev_tag.outputs.tag }}
        run: just gh release create artifacts

  verify:
    # Gate the mirror push on actually being able to resolve the staged package
    # against the live release asset. Catches manifests that look syntactically
    # fine but SPM cannot resolve (e.g. a path-based binaryTarget slipping in
    # where a URL+checksum is expected).
    name: Verify staged package resolves
    needs: [ffi, release]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Download staged package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: swift-ffi-package
          path: artifacts

      - name: Resolve and build smoke consumer
        env:
          BUILD_VERSION: ${{ needs.ffi.outputs.version }}
        run: |
          just swift verify-ffi --tarball "artifacts/moq-ffi-${BUILD_VERSION}-swift-ffi.tar.gz"

  publish:
    name: Publish to Swift Package mirror
    needs: [ffi, verify]
    runs-on: ubuntu-latest
    # The moq-bot key lives in the `bot` Environment, which only protected
    # refs can deploy to: `moq-ffi-v*` tags, and `main` for Nightly.
    environment: bot

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Generate moq-bot token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: moq-dev
          repositories: moq-swift-ffi
          # Narrow the minted token to only what publish-ffi.sh needs.
          permission-contents: write

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: swift-ffi-package
          path: swift-out

      - name: Publish to moq-dev/moq-swift-ffi mirror
        env:
          BUILD_VERSION: ${{ needs.ffi.outputs.version }}
          # Token is minted fresh per run, expires in 1 hour, never at rest.
          SWIFT_MIRROR_TOKEN: ${{ steps.token.outputs.token }}
          GIT_AUTHOR_NAME: moq-bot
          GIT_AUTHOR_EMAIL: moq-bot[bot]@users.noreply.github.com
        run: just swift publish-ffi
