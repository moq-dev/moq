name: Interop

# Cross-language interop test built from THIS checkout (not the published
# packages, unlike smoke.yml). Stands up a relay and runs the
# publish x subscribe matrix across rust / python / go / browser / native-js / c,
# on moq-lite and then on each even moq-transport draft, then browser-to-browser
# media QA. TS validation has its own workflow.
on:
  # Manual on-demand runs.
  workflow_dispatch:
  # Nightly: catch an interop regression in the current tree before a user does.
  schedule:
    - cron: "0 8 * * *"
  # release-gate.yml, on release PRs that touch the harness.
  workflow_call:

# Keyed by event too, so a manual run on main cannot cancel the scheduled one that
# publishes the night's report.
concurrency:
  group: interop-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  interop:
    name: Interop
    runs-on: ubuntu-latest
    # Hosted `main` jobs write the Rust cache; see .github/actions/rust-cache.
    environment: ${{ github.ref == 'refs/heads/main' && 'cache-write' || '' }}
    # The matrix runs in real time (ffmpeg -re pacing + per-subscriber timeouts);
    # this is a safety net against a hung relay/client plus a cold first build.
    timeout-minutes: 60
    outputs:
      report: ${{ steps.report.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      # The relay, cli, moq-ffi, and moq-c all build from source. The nightly
      # run publishes them for the pull requests that touch the harness.
      - name: Rust cache
        id: rust-cache
        uses: ./.github/actions/rust-cache
        with:
          access-key-id: ${{ secrets.MBX_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MBX_R2_SECRET_ACCESS_KEY }}

      - name: Workspace dependencies
        id: setup
        run: nix develop --command bun install --frozen-lockfile
        shell: bash -leo pipefail {0}

      # Each suite reports independently after setup, while a failed step still fails the job.
      - name: Optional publisher retention
        id: max-age
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: nix develop --command just test max-age
        shell: bash -leo pipefail {0}

      - name: Receive credit recovery
        id: receive-credit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: nix develop --command just test receive-credit
        shell: bash -leo pipefail {0}
        env:
          # Fail rather than skip the io_uring arm if the runner's kernel lacks it.
          CI_STRICT: 1

      - name: Harness regressions
        id: harness
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: nix develop --command just test harness
        shell: bash -leo pipefail {0}

      - name: Subscription termination interop
        id: bare-fin
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: nix develop --command just test bare-fin
        shell: bash -leo pipefail {0}

      - name: P2P data-channel transport
        id: p2p
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: nix develop --command just test p2p
        shell: bash -leo pipefail {0}

      - name: Interop (full matrix)
        id: interop
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: nix develop --command just test interop --all
        shell: bash -leo pipefail {0}
        env:
          # The run writes its directory here, so a failed one is uploaded below
          # and a passing one is deleted as usual. Each case's record lands beside
          # it, for the report below.
          HARNESS_RUNS: ${{ runner.temp }}/moq-test-runs
          HARNESS_RESULTS: ${{ runner.temp }}/moq-test-runs/results.jsonl

      # The same matrix with every client pinned to one moq-transport draft per pass. A release
      # PR runs the oldest and newest even draft between Rust and native JS; nightly and manual
      # runs cover every even draft and every client.
      - name: Interop (moq-transport)
        id: interop-ietf
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          read -ra args <<<"$INTEROP_ARGS"
          nix develop --command just test interop "${args[@]}"
        shell: bash -leo pipefail {0}
        env:
          INTEROP_ARGS: ${{ github.event_name == 'pull_request' && '--publishers rust --subscribers rust,js-native-node,js-native-bun --versions moq-transport-18,moq-transport-22' || '--all --versions ietf' }}
          HARNESS_RUNS: ${{ runner.temp }}/moq-test-runs
          HARNESS_RESULTS: ${{ runner.temp }}/moq-test-runs/results.jsonl

      # Registry installs and the release matrix run only on main, nightly or
      # on demand: a break only needs catching before the next release.
      - name: Released wire compatibility
        id: wire-compat
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: nix develop --command just test wire-compat
        shell: bash -leo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS_RUNS: ${{ runner.temp }}/moq-test-runs
          HARNESS_RESULTS: ${{ runner.temp }}/moq-test-runs/results.jsonl

      - name: Portrait transcode
        id: portrait
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: nix develop --command just test portrait
        shell: bash -leo pipefail {0}
        env:
          HARNESS_RUNS: ${{ runner.temp }}/moq-test-runs
          HARNESS_RESULTS: ${{ runner.temp }}/moq-test-runs/results.jsonl

      - name: Interop negative control
        id: negative
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: nix develop --command just test interop-negative
        shell: bash -leo pipefail {0}
        env:
          HARNESS_RUNS: ${{ runner.temp }}/moq-test-runs
          HARNESS_RESULTS: ${{ runner.temp }}/moq-test-runs/results.jsonl

      # Browser-to-browser media QA: presented frame progress, audible tone, audio/video skew, and
      # the publication lifecycle, plus the negative controls that prove each assertion can fail.
      - name: Media output and lifecycle
        id: media
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: nix develop --command just test media
        shell: bash -leo pipefail {0}
        env:
          HARNESS_RUNS: ${{ runner.temp }}/moq-test-runs
          HARNESS_RESULTS: ${{ runner.temp }}/moq-test-runs/results.jsonl

      # Run independently so an unrelated cold-start failure cannot hide the
      # codec replacement and same-track coded-size growth measurements.
      - name: Media track identity changes
        id: media-rename
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: nix develop --command just test media --media-cases rename
        shell: bash -leo pipefail {0}
        env:
          HARNESS_RUNS: ${{ runner.temp }}/moq-test-runs
          HARNESS_RESULTS: ${{ runner.temp }}/moq-test-runs/results.jsonl

      # A failing harness run keeps its directory, holding the process logs, the
      # relay config, and a Playwright trace of the failing page. Upload it for a
      # short while so a red cell is diagnosable; a passing run deletes its own.
      # Nothing needs redacting: the certificate and tokens are the harness's
      # throwaway test ones.
      - name: Upload failure artifacts
        id: failure-artifact
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: interop-failure
          path: ${{ runner.temp }}/moq-test-runs
          retention-days: 7
          if-no-files-found: ignore

      # The report: a pass/fail table per suite from the case records, plus every step's
      # outcome, so a suite that never started or failed outside a case still shows. Every
      # run keeps it as an artifact; only the scheduled run on main publishes it below.
      - name: Build report
        id: report
        if: ${{ !cancelled() }}
        run: nix develop --command just test interop-report "$RUNNER_TEMP/moq-test-runs/results.jsonl" "$RUNNER_TEMP/interop-report" --steps "$STEPS" --run-url "$RUN_URL" --artifact-url "$ARTIFACT_URL" --commit-url "$COMMIT_URL"
        shell: bash -leo pipefail {0}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          ARTIFACT_URL: ${{ steps.failure-artifact.outputs.artifact-url }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          # The suite inventory and its prerequisites, in run order, named as the steps
          # above. Checkout and Nix need no entry: without them this step cannot run.
          STEPS: >-
            {
            "Rust cache": "${{ steps.rust-cache.outcome }}",
            "Playwright Chromium": "${{ steps.setup.outcome }}",
            "Optional publisher retention": "${{ steps.max-age.outcome }}",
            "Receive credit recovery": "${{ steps.receive-credit.outcome }}",
            "Harness regressions": "${{ steps.harness.outcome }}",
            "Subscription termination interop": "${{ steps.bare-fin.outcome }}",
            "P2P data-channel transport": "${{ steps.p2p.outcome }}",
            "Interop (full matrix)": "${{ steps.interop.outcome }}",
            "Interop (moq-transport)": "${{ steps.interop-ietf.outcome }}",
            "Released wire compatibility": "${{ steps.wire-compat.outcome }}",
            "Portrait transcode": "${{ steps.portrait.outcome }}",
            "Interop negative control": "${{ steps.negative.outcome }}",
            "Media output and lifecycle": "${{ steps.media.outcome }}",
            "Media track identity changes": "${{ steps.media-rename.outcome }}"
            }

      - name: Upload report
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: interop-report
          path: ${{ runner.temp }}/interop-report
          if-no-files-found: error

  # Publish the scheduled run's report to https://git.moq.dev/interop/. gh-pages is
  # one site with several writers (see sh/gh/pages-publish.sh); each commits only its
  # own directory, deploys the whole branch, and holds the benchmark-pages group.
  # `queue: max` keeps every waiting writer: the default queue holds one and cancels
  # the older, which would silently drop a night's report.
  report:
    name: Publish report
    needs: interop
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name == 'schedule' && needs.interop.outputs.report == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: benchmark-pages
      cancel-in-progress: false
      queue: max
    permissions:
      # Delete a Pages artifact left by an earlier run attempt.
      actions: write
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job pushes the shared gh-pages branch.
          persist-credentials: true

      - uses: ./.github/actions/just

      - name: Download report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: interop-report
          path: ${{ runner.temp }}/interop-report

      - name: Commit report
        run: just gh pages-publish interop "$RUNNER_TEMP/interop-report" "$RUNNER_TEMP/pages"

      - name: Drop a stale Pages artifact
        run: just gh pages-clean
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
