name: Interop

# Cross-language interop test built from THIS checkout (not the published
# packages, unlike the moq-dev/smoke repo). Stands up a relay and runs the
# publish x subscribe matrix across rust / python / go / browser / native-js / c,
# then browser-to-browser media QA. TS validation has its own workflow.
on:
  # Manual on-demand runs.
  workflow_dispatch:
  # Nightly: catch an interop regression in the current tree before a user does.
  schedule:
    - cron: "0 8 * * *"
  # On PRs that touch the harness itself, so a change to the interop test is
  # validated before it merges. Source regressions still surface nightly.
  pull_request:
    paths:
      - "test/lib/**"
      - "test/p2p/**"
      - "js/p2p/**"
      - "test/interop/**"
      - "test/max-age/**"
      - "test/portrait/**"
      - "rs/moq-tokio/tests/max_age.rs"
      # The interop job also depends on the recipe that invokes it and the
      # workspace membership that links the JS clients to source.
      - "test/justfile"
      - "package.json"
      # The Go client builds against the modules this script stages.
      - "sh/go/**"
      - "cpp/moq/**"
      - ".github/workflows/interop.yml"

concurrency:
  group: interop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  interop:
    name: Interop
    runs-on: ubuntu-latest
    # The matrix runs in real time (ffmpeg -re pacing + per-subscriber timeouts);
    # this is a safety net against a hung relay/client plus a cold first build.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Trust the flake's cachix substituter. `nixConfig` in flake.nix is
          # untrusted by default, so nix logs "ignoring untrusted flake
          # configuration setting 'extra-substituters'" and rebuilds from
          # source anything missing from the public nixpkgs cache. That was
          # costing 678s per job for uniffi-bindgen-go alone, in every job that
          # enters the dev shell.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      # Reuse ~/.cargo + ./target across nightly runs so only changed crates
      # recompile (the relay, cli, moq-ffi, and moq-c all build from source).
      - name: Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          # A pull request's entry is scoped to its own branch, where no later
          # run reads it, while it spends the budget the shared store needs.
          save-if: ${{ github.event_name != 'pull_request' }}

      # Playwright's Chromium isn't in the nix devShell. Install it plus its apt
      # runtime libs (`--with-deps` needs the host package manager) so the
      # browser client can launch headless Chromium. interop.sh's own
      # `playwright install` then no-ops.
      - name: Playwright Chromium
        id: setup
        run: nix develop --command bash -c "bun install --frozen-lockfile && bunx playwright install --with-deps chromium"
        shell: bash -leo pipefail {0}

      # Each suite reports independently after setup, while a failed step still fails the job.
      - name: Optional publisher retention
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: nix develop --command just test max-age
        shell: bash -leo pipefail {0}

      - name: Harness regressions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: nix develop --command just test harness
        shell: bash -leo pipefail {0}

      - name: Subscription termination interop
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: nix develop --command just test bare-fin
        shell: bash -leo pipefail {0}

      - name: P2P data-channel transport
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: nix develop --command just test p2p
        shell: bash -leo pipefail {0}

      - name: Interop (full matrix)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: nix develop --command just test interop --all
        shell: bash -leo pipefail {0}
        env:
          # The run writes its directory here, so a failed one is uploaded below
          # and a passing one is deleted as usual.
          MOQ_TEST_RUNS: ${{ runner.temp }}/moq-test-runs

      # Registry installs and the release matrix run only on main, nightly or
      # on demand: a break only needs catching before the next release.
      - name: Released wire compatibility
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: nix develop --command just test wire-compat
        shell: bash -leo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          MOQ_TEST_RUNS: ${{ runner.temp }}/moq-test-runs

      - name: Portrait transcode
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: nix develop --command just test portrait
        shell: bash -leo pipefail {0}
        env:
          MOQ_TEST_RUNS: ${{ runner.temp }}/moq-test-runs

      - name: Interop negative control
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: nix develop --command just test interop-negative
        shell: bash -leo pipefail {0}
        env:
          MOQ_TEST_RUNS: ${{ runner.temp }}/moq-test-runs

      # Browser-to-browser media QA: presented frame progress, audible tone, audio/video skew, and
      # the publication lifecycle, plus the negative controls that prove each assertion can fail.
      - name: Media output and lifecycle
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: nix develop --command just test media
        shell: bash -leo pipefail {0}
        env:
          MOQ_TEST_RUNS: ${{ runner.temp }}/moq-test-runs

      # A failing harness run keeps its directory, holding the process logs, the
      # relay config, and a Playwright trace of the failing page. Upload it for a
      # short while so a red cell is diagnosable; a passing run deletes its own.
      # Nothing needs redacting: the certificate and tokens are the harness's
      # throwaway test ones.
      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: interop-failure
          path: ${{ runner.temp }}/moq-test-runs
          retention-days: 7
          if-no-files-found: ignore
