name: Release Go FFI

# Publishes the raw moq.dev/moq-ffi bindings module (uniffi-bindgen-go output +
# prebuilt native libs) to the go.moq.dev module proxy, or to the
# moq-dev/moq-go-ffi mirror until moq.dev points there, lockstep with the
# moq-ffi crate. The ergonomic moq-go wrapper is released separately
# (release-go.yml), which also auto-bumps its require to each new ffi here.

on:
  # The tag coordinator supplies shared default-feature artifacts. Manual
  # calls and release PR dry-runs still build their own target subset.
  workflow_call:
    inputs:
      reuse-native:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

# Only publishing runs share the serialized group. GitHub keeps a single pending
# run per group and drops the older one, so a PR (or nightly dry-run) sharing it
# silently cancelled a queued release. Dry-runs get a per-ref group instead and
# cancel their superseded builds.
concurrency:
  group: release-go-ffi-${{ github.ref_type == 'tag' && 'publish' || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  ffi:
    name: moq-ffi
    uses: ./.github/workflows/release-ffi.yml
    with:
      language: go
      reuse-native: ${{ inputs.reuse-native || false }}
      targets: >-
        [
          "x86_64-unknown-linux-gnu",
          "aarch64-unknown-linux-gnu",
          "aarch64-apple-darwin",
          "x86_64-pc-windows-msvc"
        ]

  package:
    name: Package
    needs: [ffi]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Select native artifacts
        id: native
        env:
          LIB_PREFIX: ${{ inputs.reuse-native && 'default' || 'go' }}
          BUILD_TARGETS: ${{ needs.ffi.outputs.targets }}
        run: just gh ffi pattern

      - name: Download per-target libs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: libs-raw
          pattern: ${{ steps.native.outputs.pattern }}

      - name: Flatten lib layout
        env:
          LIB_PREFIX: ${{ inputs.reuse-native && 'default' || 'go' }}
          BUILD_TARGETS: ${{ needs.ffi.outputs.targets }}
        run: just gh ffi stage

      - name: Download bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: go-bindings
          path: bindings-raw

      - name: Flatten bindings layout
        # uniffi-bindgen-go emits moq/{moq.go,moq.h} (some versions nest it
        # under uniffi/). package-ffi.sh expects bindings/moq/. Copy the whole
        # dir so the generated C header (moq.h, #include'd by moq.go's cgo
        # preamble) travels with it.
        run: |
          if [[ -d bindings-raw/uniffi/moq ]]; then
            cp -R bindings-raw/uniffi/moq bindings-moq
          elif [[ -d bindings-raw/moq ]]; then
            cp -R bindings-raw/moq bindings-moq
          else
            echo "Error: could not locate moq bindings dir under bindings-raw/" >&2
            find bindings-raw -type f
            exit 1
          fi
          mkdir -p bindings
          mv bindings-moq bindings/moq

      - name: Package
        env:
          BUILD_VERSION: ${{ needs.ffi.outputs.version }}
        # package-ffi.sh strips LLVM bitcode, which Go's cgo now rejects, with
        # rustc's llvm-tools.
        run: |
          rustup component add llvm-tools
          just go package-ffi \
            --version "$BUILD_VERSION" \
            --source-dir go/ffi \
            --lib-dir libs \
            --bindings-dir bindings \
            --output release-out

      - name: Upload Go module
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: go-package
          path: release-out/*

  publish:
    # sh/gh/ffi.py finds the Go publisher by this name.
    name: Publish to Go module mirror
    needs: [ffi, package]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    # The go.moq.dev R2 key, and the moq-bot key for the git mirror, live in the
    # `publish` Environment, which only protected refs can deploy to,
    # `moq-ffi-v*` tags among them.
    environment: publish

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      # Publish where moq.dev's vanity tag sends `go get`: the git mirror until
      # the go.moq.dev cutover. Temporary; the `git` steps go with the mirror.
      - name: Find the module's origin
        id: origin
        # A separate assignment, so a failed lookup fails the step rather than
        # skipping both publishers.
        run: |
          vcs=$(just go ffi-origin)
          echo "vcs=$vcs" >> "$GITHUB_OUTPUT"

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: go-package
          path: go-out

      - name: Generate moq-bot token
        if: steps.origin.outputs.vcs == 'git'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: moq-dev
          repositories: moq-go-ffi
          # Narrow the minted token to only what publish-ffi-mirror.sh needs.
          permission-contents: write

      - name: Publish to moq-dev/moq-go-ffi mirror
        if: steps.origin.outputs.vcs == 'git'
        env:
          BUILD_VERSION: ${{ needs.ffi.outputs.version }}
          # Token is minted fresh per run, expires in 1 hour, never at rest.
          GO_FFI_MIRROR_TOKEN: ${{ steps.token.outputs.token }}
          GIT_AUTHOR_NAME: moq-bot
          GIT_AUTHOR_EMAIL: moq-bot[bot]@users.noreply.github.com
        run: just go publish-ffi-mirror

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.origin.outputs.vcs == 'mod'
        with:
          go-version-file: sh/go/modzip/go.mod
          # A release reads nothing from a cache another branch could have written.
          cache: false

      # rclone, pinned by the flake.
      - name: Set up packaging tools
        if: steps.origin.outputs.vcs == 'mod'
        uses: ./.github/actions/setup-packaging

      - name: Publish to go.moq.dev
        if: steps.origin.outputs.vcs == 'mod'
        env:
          BUILD_VERSION: ${{ needs.ffi.outputs.version }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: just go publish-ffi

  publish-dry-run:
    name: Publish dry-run
    needs: [ffi, package]
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sh/go/modzip/go.mod
          cache: false

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: go-package
          path: go-out

      - name: Dry-run publish to go.moq.dev
        env:
          BUILD_VERSION: ${{ needs.ffi.outputs.version }}
        run: just go publish-ffi --dry-run
