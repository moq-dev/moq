name: Release Go FFI

# Publishes the raw moq-go-ffi bindings module (uniffi-bindgen-go output +
# prebuilt native libs) to the moq-dev/moq-go-ffi mirror, lockstep with the
# moq-ffi crate. The ergonomic moq-go wrapper is released separately
# (release-go.yml), which also auto-bumps its require to each new ffi here.

on:
  push:
    tags:
      - "moq-ffi-v*"
  # Dry-run: build everything, publish nothing. Nightly calls every release
  # workflow this way so a broken build surfaces before the tag is cut.
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release-go-ffi.yml"
      - ".github/workflows/release-ffi.yml"
      - "sh/gh/release.sh"
      - "go/ffi/**"
      - "sh/go/package-ffi.sh"
      - "sh/go/publish-ffi.sh"
      - "rs/moq-ffi/build.sh"

permissions:
  contents: read

# Only publishing runs share the serialized group. GitHub keeps a single pending
# run per group and drops the older one, so a PR (or nightly dry-run) sharing it
# silently cancelled a queued release. Dry-runs get a per-ref group instead and
# cancel their superseded builds.
concurrency:
  group: release-go-ffi-${{ github.ref_type == 'tag' && 'publish' || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  ffi:
    name: moq-ffi
    uses: ./.github/workflows/release-ffi.yml
    with:
      language: go
      targets: >-
        [
          "x86_64-unknown-linux-gnu",
          "aarch64-unknown-linux-gnu",
          "aarch64-apple-darwin",
          "x86_64-pc-windows-msvc"
        ]

  package:
    name: Package
    needs: [ffi]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Download per-target libs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: libs-raw
          pattern: go-lib-*

      - name: Flatten lib layout
        run: |
          mkdir -p libs
          for dir in libs-raw/go-lib-*; do
            target="${dir#libs-raw/go-lib-}"
            mv "$dir" "libs/$target"
          done
          ls -la libs

      - name: Download bindings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: go-bindings
          path: bindings-raw

      - name: Flatten bindings layout
        # uniffi-bindgen-go emits moq/{moq.go,moq.h} (some versions nest it
        # under uniffi/). package-ffi.sh expects bindings/moq/. Copy the whole
        # dir so the generated C header (moq.h, #include'd by moq.go's cgo
        # preamble) travels with it.
        run: |
          if [[ -d bindings-raw/uniffi/moq ]]; then
            cp -R bindings-raw/uniffi/moq bindings-moq
          elif [[ -d bindings-raw/moq ]]; then
            cp -R bindings-raw/moq bindings-moq
          else
            echo "Error: could not locate moq bindings dir under bindings-raw/" >&2
            find bindings-raw -type f
            exit 1
          fi
          mkdir -p bindings
          mv bindings-moq bindings/moq

      - name: Package
        env:
          BUILD_VERSION: ${{ needs.ffi.outputs.version }}
        run: |
          just go package-ffi \
            --version "$BUILD_VERSION" \
            --source-dir go/ffi \
            --lib-dir libs \
            --bindings-dir bindings \
            --output release-out

      - name: Upload Go module
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: go-package
          path: release-out/*

  publish:
    name: Publish to Go module mirror
    needs: [ffi, package]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Generate moq-bot token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: moq-dev
          repositories: moq-go-ffi
          # Narrow the minted token to only what publish-ffi.sh needs.
          permission-contents: write

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: go-package
          path: go-out

      - name: Publish to moq-dev/moq-go-ffi mirror
        env:
          BUILD_VERSION: ${{ needs.ffi.outputs.version }}
          # Token is minted fresh per run, expires in 1 hour, never at rest.
          GO_FFI_MIRROR_TOKEN: ${{ steps.token.outputs.token }}
          GIT_AUTHOR_NAME: moq-bot
          GIT_AUTHOR_EMAIL: moq-bot[bot]@users.noreply.github.com
        run: just go publish-ffi

  publish-dry-run:
    name: Publish dry-run
    needs: [ffi, package]
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: go-package
          path: go-out

      - name: Dry-run publish to mirror
        env:
          BUILD_VERSION: ${{ needs.ffi.outputs.version }}
        run: just go publish-ffi --dry-run
