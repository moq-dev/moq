name: X11 capture

# Xvfb exercises the real X protocol and SHM path, not desktop hardware.
# Correctness is gated; paired timings are retained without a runner-speed threshold.
on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: x11-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: SHM and GetImage
    runs-on: ubuntu-24.04-arm
    # Hosted `main` jobs write the Rust cache; see .github/actions/rust-cache.
    environment: ${{ github.ref == 'refs/heads/main' && 'cache-write' || '' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          access-key-id: ${{ secrets.MBX_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MBX_R2_SECRET_ACCESS_KEY }}
      - name: Capture comparison
        id: capture
        run: nix develop --command just rs x11-bench-ci
        env:
          MOQ_X11_BENCH_LOG: ${{ runner.temp }}/x11-capture-benchmark.log
      # Only after the comparison ran, so a setup failure stays the job's only error.
      - name: Keep capture measurements
        if: ${{ !cancelled() && steps.capture.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: x11-capture-benchmark
          path: ${{ runner.temp }}/x11-capture-benchmark.log
          retention-days: 30
          if-no-files-found: error
