name: X11 capture

# Xvfb exercises the real X protocol and SHM path, not desktop hardware.
# Correctness is gated; paired timings are retained without a runner-speed threshold.
on:
  workflow_call:
  pull_request:
    paths:
      - "rs/moq-video/**"
      - "rs/justfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/x11.yml"

permissions:
  contents: read

concurrency:
  group: x11-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: SHM and GetImage
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=
      - name: Rust cache
        uses: ./.github/actions/rust-cache
      - name: Capture comparison
        run: nix develop --command just rs x11-bench-ci
        env:
          MOQ_X11_BENCH_LOG: ${{ runner.temp }}/x11-capture-benchmark.log
      - name: Keep capture measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: x11-capture-benchmark
          path: ${{ runner.temp }}/x11-capture-benchmark.log
          retention-days: 30
          if-no-files-found: error
