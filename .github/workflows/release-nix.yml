name: Release Nix

# Pushes each released package to nix.moq.dev, so `nix run` on a release tag
# substitutes it instead of building from source.
#
# The signing key and the bucket write key live in the `cache-write`
# Environment, which only `main` and these tag patterns can
# deploy from. A tag ruleset limits who can create them; see infra/README.md.

on:
  push:
    tags:
      - 'moq-relay-v*'
      - 'moq-cli-v*'
      - 'moq-boy-v*'
      - 'moq-c-v*'
      - 'moq-gst-v*'

jobs:
  # Build and push only the package the tag names. The tag prefix
  # (e.g. moq-relay) is the flake attribute, except moq-cli ships as moq.
  release:
    name: Release (${{ matrix.runs-on }})
    runs-on: ${{ matrix.runs-on }}
    environment: cache-write
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-latest # x86_64-linux
          - ubuntu-24.04-arm # aarch64-linux
          - macos-latest # aarch64-darwin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Full-match REF_NAME against the same <prefix>-v<semver> contract
      # release.sh enforces, so a malformed tag fails fast instead of
      # building under a trusted identity.
      - name: Derive package from tag
        id: pkg
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          re='^(moq-relay|moq-cli|moq-boy|moq-c|moq-gst)-v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?)$'
          if [[ ! "$REF_NAME" =~ $re ]]; then
            echo "Tag format not recognized: $REF_NAME" >&2
            exit 1
          fi
          name="${BASH_REMATCH[1]}"
          [[ "$name" == moq-cli ]] && name=moq
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/nix
      - uses: ./.github/actions/just

      # The release bucket has no lifecycle rule, unlike the CI one, so a flake
      # pinned to an old tag still substitutes.
      - name: Build and push
        env:
          PACKAGE: ${{ steps.pkg.outputs.name }}
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.NIX_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.NIX_R2_SECRET_ACCESS_KEY }}
        run: |
          nix build ".#$PACKAGE" --print-build-logs
          just infra nix push nix-moq-dev ./result
