name: Release RS

permissions:
  pull-requests: write
  contents: write

# Only one release job can run at a time.
concurrency:
  group: release-rs
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    # A run costs the better part of an hour and they serialize on the
    # concurrency group above, so a push that can't change a crate's version
    # or its API shouldn't queue one.
    paths:
      - "rs/**"
      - "justfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - ".release-plz.toml"
      - ".github/workflows/release-rs.yml"
  # Releasing by hand, e.g. after a skipped push or a cold cache.
  workflow_dispatch:

jobs:
  release:
    name: Plz

    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'moq-dev' }}

    env:
      # release-plz copies each crate into its own temp directory to compare it
      # against the registry, so cargo-semver-checks would otherwise build
      # rustdoc for every crate, baseline and current, into a throwaway target
      # directory. Pin one absolute path instead so the ~30 crates share their
      # dependency builds and the cache below can carry them between runs. It
      # has to be this path: the cache action transports `./target` relative to
      # the working directory and does not read CARGO_TARGET_DIR.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false

      # Generating a GitHub token, so that PRs and tags created by
      # the release-plz-action can trigger actions workflows.
      - name: Generate GitHub token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      # Install Nix for system dependencies (e.g. ffmpeg).
      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Trust the flake's cachix substituter. `nixConfig` in flake.nix is
          # untrusted by default, so nix logs "ignoring untrusted flake
          # configuration setting 'extra-substituters'" and rebuilds from
          # source anything missing from the public nixpkgs cache. Entering
          # the dev shell costs ~12 minutes of uniffi-bindgen-go without it.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      # Its own scope rather than the shared store cache.yml warms: this holds
      # cargo-semver-checks rustdoc, not check and test artifacts, and mixing
      # the two would have each restoring a target tree built for the other.
      # This workflow only runs on `main`, so it is the sole writer of its scope.
      #
      # The action's shim is what gets mbx in here at all. release-plz spawns
      # Cargo and cargo-semver-checks itself, so no environment variable reaches
      # them; a `cargo` ahead of the dev shell's toolchain does.
      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          scope: release-rs
          save-on-dispatch: true

      - name: Release
        run: nix develop --command just rs release
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
