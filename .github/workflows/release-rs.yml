name: Release RS

permissions:
  pull-requests: write
  contents: write

# Only one release job can run at a time.
concurrency:
  group: release-rs
  cancel-in-progress: false

on:
  push:
    branches:
      - release
    # A run costs the better part of an hour and they serialize on the
    # concurrency group above, so a push that can't change a crate's version
    # or its API shouldn't queue one.
    paths:
      - "rs/**"
      - "justfile"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "flake.nix"
      - "flake.lock"
      - ".release-plz.toml"
      - ".github/workflows/release-rs.yml"
  # Releasing by hand, e.g. after a skipped push. Dispatch it
  # on `release`; the job refuses any other ref.
  workflow_dispatch:

jobs:
  release:
    name: Plz

    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'moq-dev' && github.ref == 'refs/heads/release' }}
    # Write credentials live in the `publish` Environment, which only protected
    # refs can deploy to. The R2 cache pair stays the repository's read key.
    environment: publish

    env:
      # release-plz copies each crate into its own temp directory to compare it
      # against the registry, so cargo-semver-checks would otherwise build
      # rustdoc for every crate, baseline and current, into a throwaway target
      # directory. Pin one absolute path instead so the ~30 crates share their
      # dependency builds.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target

    steps:
      # Generating a GitHub token, so that PRs and tags created by
      # the release-plz-action can trigger actions workflows.
      - name: Generate GitHub token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: generate-token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Only what release-plz needs: push the release branch and tags, and open the PR.
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # release-plz pushes the release branch and tags with this credential.
          token: ${{ steps.generate-token.outputs.token }} # zizmor: ignore[artipacked]

      # Install Nix for system dependencies (e.g. ffmpeg).
      - uses: ./.github/actions/nix

      # Read only: `release` is not a writer. Crates publish as
      # source, so nothing this reads ends up in a release.
      #
      # The action's shim is what gets mbx in here at all. release-plz spawns
      # Cargo and cargo-semver-checks itself, so no environment variable reaches
      # them; a `cargo` ahead of the dev shell's toolchain does.
      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          access-key-id: ${{ secrets.MBX_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MBX_R2_SECRET_ACCESS_KEY }}

      - name: Release
        run: nix develop --command just rs release
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # release-plz bumps Cargo.lock and the manifests without regenerating
      # nix/Cargo.nix, which Check then fails as stale, so commit it on top.
      # The app token's push, unlike GITHUB_TOKEN's, triggers Check. Authoring
      # as moq-bot, as release-plz does, keeps its next run force-pushing this
      # PR instead of closing it to preserve a contributor's commit.
      - name: Regenerate the release PR's nix/Cargo.nix
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GIT_AUTHOR_NAME: moq-bot[bot]
          GIT_AUTHOR_EMAIL: 186640430+moq-bot[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: moq-bot[bot]
          GIT_COMMITTER_EMAIL: 186640430+moq-bot[bot]@users.noreply.github.com
        run: |
          branch=$(gh pr list --base release --state open --json headRefName --jq '.[].headRefName | select(startswith("release-plz-"))')
          if [ -z "$branch" ]; then
            echo "No open release PR."
            exit 0
          fi
          git fetch --no-tags origin "refs/heads/$branch"
          git checkout --detach FETCH_HEAD
          nix develop --command just rs cargo-nix
          if git diff --quiet -- nix; then
            echo "nix/Cargo.nix is current."
            exit 0
          fi
          git commit --message "chore: regenerate nix/Cargo.nix" -- nix
          git push origin "HEAD:refs/heads/$branch"
