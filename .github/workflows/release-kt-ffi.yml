name: Release Kotlin FFI

# Publishes the `dev.moq:moq-ffi` artifact (UniFFI bindings + native libs) on
# every `moq-ffi-v*` tag, so its version tracks the crate. The ergonomic
# `dev.moq:moq` wrapper is published separately by release-kt-lib.yml.

on:
  # The tag coordinator supplies shared default-feature artifacts. Manual
  # calls and Go PR dry-runs still build their own target subset.
  workflow_call:
    inputs:
      reuse-native:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-kt-ffi
  cancel-in-progress: false

jobs:
  ffi:
    name: moq-ffi
    uses: ./.github/workflows/release-ffi.yml
    with:
      language: kotlin
      reuse-native: ${{ inputs.reuse-native || false }}
      # Android, then the desktop JVM.
      targets: >-
        [
          "aarch64-linux-android",
          "armv7-linux-androideabi",
          "x86_64-linux-android",
          "x86_64-unknown-linux-gnu",
          "aarch64-unknown-linux-gnu",
          "aarch64-apple-darwin",
          "x86_64-pc-windows-msvc"
        ]

  package:
    name: Package and publish
    needs: [ffi]
    runs-on: ubuntu-latest
    # Maven and signing credentials live in the `publish` Environment, which
    # only protected refs can deploy to. Only a tag publishes; a dry-run needs
    # no secrets, so it can run from any branch.
    environment: ${{ github.ref_type == 'tag' && 'publish' || '' }}
    env:
      # Picked up by com.vanniktech.maven.publish via Gradle project properties.
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      # Signing credentials are scoped to the real publish step below, NOT here:
      # a dry-run has no secrets, and an empty `signingInMemoryKey` makes
      # signAllPublications() attempt (and fail) instead of no-op. The staging
      # step's publishToMavenLocal doesn't need to sign.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # The action's default adds the legacy `tools` package, which Google
          # dropped from the SDK repository. Gradle fetches the rest itself.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Select native artifacts
        id: native
        env:
          LIB_PREFIX: ${{ inputs.reuse-native && 'default' || 'kotlin' }}
          BUILD_TARGETS: ${{ needs.ffi.outputs.targets }}
        run: just gh ffi pattern

      - name: Download per-target libs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: libs-raw
          pattern: ${{ steps.native.outputs.pattern }}

      - name: Flatten lib layout
        env:
          LIB_PREFIX: ${{ inputs.reuse-native && 'default' || 'kotlin' }}
          BUILD_TARGETS: ${{ needs.ffi.outputs.targets }}
        run: just gh ffi stage

      - name: Download bindings
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: kotlin-bindings
          path: bindings

      - name: Stage native libs + bindings into the gradle module
        env:
          BUILD_VERSION: ${{ needs.ffi.outputs.version }}
        run: |
          just kt package \
            --version "$BUILD_VERSION" \
            --lib-dir libs \
            --bindings-dir bindings \
            --output release-out

      - name: Publish to Maven Central
        if: github.ref_type == 'tag'
        env:
          MOQFFI_VERSION: ${{ needs.ffi.outputs.version }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          gradle -p kt \
            -Pmoqffi.version="$MOQFFI_VERSION" \
            -Pandroid.enabled=true \
            :moq-ffi:publishAndReleaseToMavenCentral --no-configuration-cache

      - name: Upload local maven layout
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kotlin-package
          path: release-out/*
