name: Release Kotlin FFI

# Publishes the `dev.moq:moq-ffi` artifact (UniFFI bindings + native libs) on
# every `moq-ffi-v*` tag, so its version tracks the crate. The ergonomic
# `dev.moq:moq` wrapper is published separately by release-kt-lib.yml.

on:
  push:
    tags:
      - "moq-ffi-v*"
  # Dry-run: build everything, publish nothing. Nightly calls every release
  # workflow this way so a broken build surfaces before the tag is cut.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-kt-ffi
  cancel-in-progress: false

jobs:
  ffi:
    name: moq-ffi
    uses: ./.github/workflows/release-ffi.yml
    with:
      language: kotlin
      # Android, then the desktop JVM.
      targets: >-
        [
          "aarch64-linux-android",
          "armv7-linux-androideabi",
          "x86_64-linux-android",
          "x86_64-unknown-linux-gnu",
          "aarch64-unknown-linux-gnu",
          "aarch64-apple-darwin",
          "x86_64-pc-windows-msvc"
        ]

  package:
    name: Package and publish
    needs: [ffi]
    runs-on: ubuntu-latest
    env:
      # Picked up by com.vanniktech.maven.publish via Gradle project properties.
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      # Signing credentials are scoped to the real publish step below, NOT here:
      # a dry-run has no secrets, and an empty `signingInMemoryKey` makes
      # signAllPublications() attempt (and fail) instead of no-op. The staging
      # step's publishToMavenLocal doesn't need to sign.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # The action's default adds the legacy `tools` package, which Google
          # dropped from the SDK repository. Gradle fetches the rest itself.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Download per-target libs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: libs-raw
          pattern: kotlin-lib-*

      - name: Flatten lib layout
        run: |
          mkdir -p libs
          for dir in libs-raw/kotlin-lib-*; do
            target="${dir#libs-raw/kotlin-lib-}"
            mv "$dir" "libs/$target"
          done
          ls -la libs

      - name: Download bindings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kotlin-bindings
          path: bindings

      - name: Stage native libs + bindings into the gradle module
        env:
          BUILD_VERSION: ${{ needs.ffi.outputs.version }}
        run: |
          just kt package \
            --version "$BUILD_VERSION" \
            --lib-dir libs \
            --bindings-dir bindings \
            --output release-out

      - name: Publish to Maven Central
        if: github.ref_type == 'tag'
        env:
          MOQFFI_VERSION: ${{ needs.ffi.outputs.version }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          gradle -p kt \
            -Pmoqffi.version="$MOQFFI_VERSION" \
            -Pandroid.enabled=true \
            :moq-ffi:publishAndReleaseToMavenCentral --no-configuration-cache

      - name: Upload local maven layout
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kotlin-package
          path: release-out/*
