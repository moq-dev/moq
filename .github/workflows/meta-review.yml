name: meta-review

on:
  pull_request:
    # `closed` is here only so merging/closing a PR cancels its in-flight run
    # via the concurrency group below; the job itself is skipped on close.
    types: [opened, synchronize, reopened, closed, ready_for_review]

# Cancel in-flight reviews when a new commit lands on the same PR, or when the
# PR is merged/closed (the close event shares this group and supersedes it).
concurrency:
  group: meta-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # Phase 1 experiment, read-only reviewer running side-by-side with Codex.
    # Uses `pull_request` (not `pull_request_target`) so the PR's own code
    # never runs with write access.
    #
    # Skipped on close/merge (cancel-only run), on drafts (review on ready,
    # like Codex), and on fork and bot PRs (forks get empty Actions
    # secrets under `pull_request`, and bots such as release-plz fail the
    # reviewer's write-permission check; failing there would turn them red).
    # Remaining runs must have secrets; a missing one fails loud so the
    # misconfiguration surfaces instead of silently disabling review.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-24.04-arm
    # Backstop a hang instead of holding the runner for the 6-hour default.
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # to post the review comment
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # full history so the agent can diff against base
          persist-credentials: false

      # Reviews post as moq-bot so they are distinct from github-actions noise.
      - name: Generate moq-bot token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: moq-dev
          repositories: moq
          # Narrow the minted token to only what posting a review needs.
          permission-contents: read
          permission-pull-requests: write

      - uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest
        env:
          META_MODEL_API_KEY: ${{ secrets.META_MODEL_API_KEY }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          # `opencode github run` ignores the `agent` input and uses the config's
          # default_agent, so set it here rather than in opencode.json where it
          # would change the default for local runs too.
          OPENCODE_CONFIG_CONTENT: '{"default_agent":"review"}'
        with:
          model: model_api/muse-spark-1.3-contributor
          agent: review
          use_github_token: true
          prompt: Review pull request ${{ github.event.pull_request.number }}.
