name: Dependabot

# Enables auto-merge on Dependabot pull requests, so a bump lands on its own
# once the merge queue's Check and Test pass. The main ruleset requires both
# (a main PR reports them skipped, so auto-merge enqueues it), and dependabot.yml
# holds every new version for 7 days, so nothing merges unreviewed by CI or the
# moment it is published.
#
# `pull_request_target` rather than `pull_request`: Dependabot runs with a
# read-only token and no access to secrets, so a `pull_request` run could
# neither read APP_PRIVATE_KEY nor enable auto-merge. That trigger is only safe
# because this job never checks out or executes the pull request's code; it
# queries the pull request files and enables auto-merge through `gh`.
#
# The moq-bot token rather than GITHUB_TOKEN: a merge enabled by GITHUB_TOKEN
# does not trigger further workflow runs, which would silently skip
# release-rs and release-js on every auto-merged bump.

permissions: {}

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  auto-merge:
    name: Auto-merge
    permissions:
      pull-requests: read
    # head.repo guards the `pull_request_target` trigger: Dependabot pushes its
    # branches to this repository, so a pull request from a fork claiming to be
    # Dependabot is not one.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # The moq-bot key lives in the `publish` Environment, which only protected
    # refs can deploy to; pull_request_target runs on the base branch.
    environment: publish

    steps:
      # Smoke's flake and npm Playwright pin move together through its updater.
      # A lock-only Dependabot PR is discovery, not a change safe to auto-enqueue.
      - name: Require a coupled smoke update
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: >-
          gh pr view "$PR_URL" --json files --jq
          'if any(.files[]; .path == "test/smoke/flake.lock") then
          error("Use the Smoke toolchain update workflow for the coupled lock and Playwright bump")
          else "Update can auto-merge" end'

      - name: Generate moq-bot token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: moq-dev
          repositories: moq
          # Narrow the minted token to only what `gh pr merge --auto` needs.
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge
        env:
          # Token is minted fresh per run, expires in 1 hour, never at rest.
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # Squash to match the rest of the history; the ruleset requires a
        # linear one. Re-running on a later push is a no-op.
        run: gh pr merge --auto --squash "$PR_URL"
