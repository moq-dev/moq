name: Features

permissions:
  contents: read

on:
  workflow_call:

concurrency:
  group: features-${{ github.ref }}
  cancel-in-progress: true

jobs:
  features:
    name: Features (${{ matrix.recipe }})
    runs-on: ubuntu-24.04-arm
    environment: ${{ github.ref == 'refs/heads/main' && 'cache-write' || '' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The queue checks selected feature extremes. Nightly and release PRs
        # keep the full feature matrix and optimized artifacts; release binding
        # workflows cover their optimized libraries separately. `gate
        # rs_shapes` is the gate's isolated extremes over every package, which
        # outgrow one hosted job beside the rest of the gate.
        recipe: ["rs features", "gate rs_shapes", "js wasm"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
      - uses: ./.github/actions/rust-cache
        with:
          access-key-id: ${{ secrets.MBX_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MBX_R2_SECRET_ACCESS_KEY }}
      - name: Check feature and profile variants
        run: nix develop --command just ${{ matrix.recipe }}
        env:
          NEXTEST_PROFILE: ci
          CI_STRICT: 1
