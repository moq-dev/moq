name: Central check

# Has Maven Central's Portal validate the Kotlin bundle rust2's release builder writes for
# moq-ffi, signed with this repository's key, then drops it: nothing is published. rust2's
# test of moq's stand-in builds dev.moq:moq-ffi:0.0.0 as its `moq-ffi-maven` artifact, and
# rust2's ffi/release/central.sh, from the same commit, signs and uploads it, as rust2's
# release template does on a tag.
#
# Dispatch it on `release`, the one ref the `publish` environment admits that publishes
# nothing by being pushed, with a finished rust2 run on its `main`, such as a Nightly:
# gh workflow run central-check.yml --ref release -f run=<id>
# rust2 is public, so this repository's token reads the run and its artifact.
on:
  workflow_dispatch:
    inputs:
      run:
        description: The kixel-ai/rust2 run whose moq-ffi-maven artifact to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    if: github.ref == 'refs/heads/release'
    environment: publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/just
      # The commit of a finished run on rust2's own main, as one whose other jobs failed
      # still holds the bundle, whose script alone sees the
      # signing key: not a fork's, a PR's, or an unreviewed branch's.
      - id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.run }}
        run: |
          [[ "$RUN" =~ ^[0-9]+$ ]] || { echo "::error::run is a run ID, not '$RUN'"; exit 1; }
          run=$(gh api "repos/kixel-ai/rust2/actions/runs/$RUN")
          where=$(jq -r '"\(.head_repository.full_name):\(.head_branch) \(.event) \(.status)"' <<< "$run")
          case $where in
            "kixel-ai/rust2:main push completed" | "kixel-ai/rust2:main schedule completed" | "kixel-ai/rust2:main workflow_dispatch completed") ;;
            *)
              echo "::error::run $RUN is $where, not a finished run on kixel-ai/rust2's main"
              exit 1
              ;;
          esac
          echo "sha=$(jq -er .head_sha <<< "$run")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kixel-ai/rust2
          ref: ${{ steps.run.outputs.sha }}
          path: rust2
          sparse-checkout: ffi/release/central.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: moq-ffi-maven
          path: maven
          repository: kixel-ai/rust2
          run-id: ${{ inputs.run }}
          github-token: ${{ github.token }}
      - name: Validate
        env:
          USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: just gh central-check rust2 maven
