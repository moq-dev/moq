name: Check

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    # `closed` is here only so merging/closing a PR cancels its in-flight run
    # via the concurrency group below; the job itself is skipped on close.
    types: [opened, synchronize, reopened, closed]
  merge_group:
    types: [checks_requested]

# Cancel in-flight runs when a new commit lands on the same PR, or when the PR
# is merged/closed (the close event shares this group and supersedes the build).
# Each merge group has its own queue ref, separate from the PR ref.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `check` and `test` are separate jobs because they share almost no build
  # artifacts: clippy emits rmeta without codegen, while nextest codegens and
  # links every test binary. Running them in sequence meant paying both in
  # series for no reuse, so they run concurrently and the job takes the slower
  # of the two rather than their sum.
  check:
    name: Check
    # Skip the actual work on close/merge: this run exists only to cancel the
    # superseded in-flight build via the concurrency group above.
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04-arm
    # Backstop a hang instead of holding the runner for the 6-hour default.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so `just ci check` can diff against the PR or merge group base.
          fetch-depth: 0

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # main
        with:
          tool-cache: false

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Trust the flake's cachix substituter. `nixConfig` in flake.nix is
          # untrusted by default, so nix logs "ignoring untrusted flake
          # configuration setting 'extra-substituters'" and rebuilds from
          # source anything missing from the public nixpkgs cache. That was
          # costing 678s per job for uniffi-bindgen-go alone, in every job that
          # enters the dev shell.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=
      - uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # main

      # cache.yml warms the default-branch store on `main`. Pull requests restore
      # it; the action refuses to publish from a pull request, and Actions would
      # scope such an entry to the PR's own branch anyway, where no later PR
      # could read it while it ate the repository's 10 GB budget.
      - name: Rust cache
        uses: ./.github/actions/rust-cache

      # The same recipe a developer runs locally. It diffs against
      # the merge group base SHA (or origin/$GITHUB_BASE_REF for a PR) and touches
      # only the changed packages plus their dependents, so a one-crate PR compiles one crate and a
      # quest-only PR runs only the lints. sh/dispatch.sh's impact map is the one
      # place that decides; the setup above always runs rather than keep a second
      # path map here.
      #
      # MOQ_STRICT turns every "tool missing, skipping" guard into an error.
      # Locally an absent formatter means less gets checked; here it would mean
      # a green run that checked nothing, which is the failure mode worth
      # spending a preflight on.
      - name: Check
        run: nix develop --command just ci check "$CI_BASE"
        env:
          CI_BASE: ${{ github.event.merge_group.base_sha }}
          MOQ_STRICT: 1

  test:
    name: Test
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so `just ci test` can diff against the PR or merge group base.
          fetch-depth: 0

      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # main
        with:
          tool-cache: false

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Trust the flake's cachix substituter. `nixConfig` in flake.nix is
          # untrusted by default, so nix logs "ignoring untrusted flake
          # configuration setting 'extra-substituters'" and rebuilds from
          # source anything missing from the public nixpkgs cache. That was
          # costing 678s per job for uniffi-bindgen-go alone, in every job that
          # enters the dev shell.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      # Restore only, same as the `check` job above.
      - name: Rust cache
        uses: ./.github/actions/rust-cache

      # NEXTEST_PROFILE picks up the longer hang timeout in .config/nextest.toml;
      # without it a runner under load could trip the local one.
      - name: Test
        run: nix develop --command just ci test "$CI_BASE"
        env:
          CI_BASE: ${{ github.event.merge_group.base_sha }}
          MOQ_STRICT: 1
          NEXTEST_PROFILE: ci

  # The release back-merge (sh/gh/back-merge.sh) must land as a merge commit, but
  # the merge queue only squashes. Once Check and Test pass on its head, moq-bot
  # merges it with --admin; the main ruleset lets moq-bot bypass only when
  # merging a pull request. Gated on this repository's own branch, since a fork
  # branch of the same name gets no secrets and must not land. --match-head-commit
  # pins the merge to the commit the jobs above checked.
  land:
    name: Land back-merge
    needs: [check, test]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.event.pull_request.head.ref == 'merge/release-into-main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Generate moq-bot token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --merge --admin --match-head-commit "$HEAD_SHA" "$PR_URL"
