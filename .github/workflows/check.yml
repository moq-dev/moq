name: Check

permissions:
  id-token: write
  contents: read

# The merge queue is the gate for main: its PRs report both jobs skipped, which
# satisfies the required names, and contributors run `just ci` locally instead.
# Release has no queue, so its PRs run both jobs over every package (`just gate`,
# via CI_BASE=--all): the diff-scoped queue can let a break into main, but none
# may reach a release.
on:
  pull_request:
    # `closed` only cancels an in-flight run. `edited` runs the jobs when a main
    # PR is retargeted to release. Any edit reruns them, since a skipped rerun
    # would post a passing context over a failed one; on main PRs that is free.
    types: [opened, synchronize, reopened, edited, closed]
  merge_group:
    types: [checks_requested]

# Cancel in-flight runs when a new commit lands on the same PR, or when the PR
# is merged/closed (the close event shares this group and supersedes the build).
# Each merge group has its own queue ref, separate from the PR ref.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Test enforces default-feature clippy while compiling its binaries. Check
  # runs the other lints, docs, and distinct feature/target builds in parallel.
  check:
    name: Check
    # A close/merge run exists only to cancel the superseded in-flight build via
    # the concurrency group above.
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.base_ref == 'release')
    runs-on: ubuntu-24.04-arm
    # Backstop a hang instead of holding the runner for the 6-hour default.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so `just ci check` can diff against the PR or merge group base.
          fetch-depth: 0

      - uses: ./.github/actions/just

      # The dispatcher owns scope, including repository-wide lints. A query
      # failure fails this job; an empty selection keeps its required name green.
      - name: Select work
        id: scope
        run: just ci-select check "$CI_BASE" >> "$GITHUB_OUTPUT"
        env:
          CI_BASE: ${{ github.base_ref == 'release' && '--all' || github.event.merge_group.base_sha }}

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        if: steps.scope.outputs.needed == 'true'
        with:
          determinate: false
          # Trust the flake's cachix substituter. `nixConfig` in flake.nix is
          # untrusted by default, so nix logs "ignoring untrusted flake
          # configuration setting 'extra-substituters'" and rebuilds from
          # source anything missing from the public nixpkgs cache. That was
          # costing 678s per job for uniffi-bindgen-go alone, in every job that
          # enters the dev shell.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=
      - uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # main
        if: steps.scope.outputs.needed == 'true'

      # cache.yml warms the default-branch store on `main`. Queue and release PR
      # runs restore it; the action refuses to publish from them, and Actions
      # would scope such an entry to its own ref anyway, where no later run
      # could read it while it ate the repository's 10 GB budget. A selection
      # of lints alone compiles no Rust, so it skips the restore.
      - name: Rust cache
        if: steps.scope.outputs.rust == 'true'
        uses: ./.github/actions/rust-cache

      # Half of the `just ci` a contributor runs before pushing, with the same
      # MOQ_STRICT and nextest profile. In the queue it diffs against the merge
      # group base SHA and touches only the changed packages plus their
      # dependents, so a one-crate PR compiles one crate and a quest-only PR
      # runs only the lints; a release PR runs everything. The pre-setup query and execution
      # use the same impact map in sh/dispatch.sh; a Test job with no work ends
      # after the query while Check keeps its selected repository-wide lints.
      - name: Check
        if: steps.scope.outputs.needed == 'true'
        run: nix develop --command just ci check "$CI_BASE"
        env:
          CI_BASE: ${{ github.base_ref == 'release' && '--all' || github.event.merge_group.base_sha }}

  test:
    name: Test
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.base_ref == 'release')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so `just ci test` can diff against the PR or merge group base.
          fetch-depth: 0

      - uses: ./.github/actions/just

      # The dispatcher owns scope, including repository-wide lints. A query
      # failure fails this job; an empty selection keeps its required name green.
      - name: Select work
        id: scope
        run: just ci-select test "$CI_BASE" >> "$GITHUB_OUTPUT"
        env:
          CI_BASE: ${{ github.base_ref == 'release' && '--all' || github.event.merge_group.base_sha }}

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        if: steps.scope.outputs.needed == 'true'
        with:
          determinate: false
          # Trust the flake's cachix substituter. `nixConfig` in flake.nix is
          # untrusted by default, so nix logs "ignoring untrusted flake
          # configuration setting 'extra-substituters'" and rebuilds from
          # source anything missing from the public nixpkgs cache. That was
          # costing 678s per job for uniffi-bindgen-go alone, in every job that
          # enters the dev shell.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      # Restore only, and only for selected Rust, same as the `check` job above.
      - name: Rust cache
        if: steps.scope.outputs.rust == 'true'
        uses: ./.github/actions/rust-cache

      - name: Test
        if: steps.scope.outputs.needed == 'true'
        run: nix develop --command just ci test "$CI_BASE"
        env:
          CI_BASE: ${{ github.base_ref == 'release' && '--all' || github.event.merge_group.base_sha }}
