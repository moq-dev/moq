name: Check

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    # `closed` is here only so merging/closing a PR cancels its in-flight run
    # via the concurrency group below; the job itself is skipped on close.
    types: [opened, synchronize, reopened, closed]

# Cancel in-flight runs when a new commit lands on the same PR, or when the PR
# is merged/closed (the close event shares this group and supersedes the build).
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `check` and `test` are separate jobs because they share almost no build
  # artifacts: clippy emits rmeta without codegen, while nextest codegens and
  # links every test binary. Running them in sequence meant paying both in
  # series for no reuse, so they run concurrently and the job takes the slower
  # of the two rather than their sum.
  check:
    name: Check
    # Skip the actual work on close/merge: this run exists only to cancel the
    # superseded in-flight build via the concurrency group above.
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04-arm
    # Backstop a hang instead of holding the runner for the 6-hour default.
    timeout-minutes: 60

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so `just check` can diff against origin/$GITHUB_BASE_REF.
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Trust the flake's cachix substituter. `nixConfig` in flake.nix is
          # untrusted by default, so nix logs "ignoring untrusted flake
          # configuration setting 'extra-substituters'" and rebuilds from
          # source anything missing from the public nixpkgs cache. That was
          # costing 678s per job for uniffi-bindgen-go alone, in every job that
          # enters the dev shell.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=
      - uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # main

      # Restore only. cache.yml is the single writer, on `main`; see the comment
      # there for why. `shared-key` has to match the one it saves under.
      - name: Rust Cache
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          shared-key: rust
          save-if: false

      # The same recipe a developer runs locally. It diffs against
      # origin/$GITHUB_BASE_REF and touches only the packages this PR changed
      # plus their dependents, so a one-crate PR compiles one crate.
      #
      # MOQ_STRICT turns every "tool missing, skipping" guard into an error.
      # Locally an absent formatter means less gets checked; here it would mean
      # a green run that checked nothing, which is the failure mode worth
      # spending a preflight on.
      - name: Check
        run: nix develop --command just check
        env:
          MOQ_STRICT: 1

  test:
    name: Test
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so `just test` can diff against origin/$GITHUB_BASE_REF.
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Trust the flake's cachix substituter. `nixConfig` in flake.nix is
          # untrusted by default, so nix logs "ignoring untrusted flake
          # configuration setting 'extra-substituters'" and rebuilds from
          # source anything missing from the public nixpkgs cache. That was
          # costing 678s per job for uniffi-bindgen-go alone, in every job that
          # enters the dev shell.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      - name: Rust Cache
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          shared-key: rust
          save-if: false

      # NEXTEST_PROFILE picks up the longer hang timeout in .config/nextest.toml;
      # without it a runner under load could trip the local one.
      - name: Test
        run: nix develop --command just test
        env:
          MOQ_STRICT: 1
          NEXTEST_PROFILE: ci
