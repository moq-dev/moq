name: Check

permissions:
  id-token: write
  contents: read

# Main PRs report Check as skipped; the merge queue runs the Linux gate once.
# Release PRs run the same gate over every package. The maintainer must remove
# Test from the main ruleset before this change enters the queue.
on:
  pull_request:
    # `closed` only cancels an in-flight run. `edited` runs the jobs when a main
    # PR is retargeted to release. Any edit reruns them, since a skipped rerun
    # would post a passing context over a failed one; on main PRs that is free.
    types: [opened, synchronize, reopened, edited, closed]
  merge_group:
    types: [checks_requested]

# Cancel in-flight runs when a new commit lands on the same PR, or when the PR
# is merged/closed (the close event shares this group and supersedes the build).
# Each merge group has its own queue ref, separate from the PR ref.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One checkout, dev shell, cache restore, and dispatcher for lints and tests.
  check:
    name: Check
    # A close/merge run exists only to cancel the superseded in-flight build via
    # the concurrency group above.
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.base_ref == 'release')
    # Leave the variable unset until the local runner is online and verified.
    runs-on: ${{ github.event_name == 'merge_group' && vars.MOQ_QUEUE_RUNNER || 'ubuntu-24.04-arm' }}
    # `main` and its merge queue write the Rust cache; see .github/actions/rust-cache.
    environment: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/')) && 'cache-write' || '' }}
    # Backstop a hang instead of holding the runner for the 6-hour default.
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so `just ci` can diff against the PR or merge group base.
          fetch-depth: 0

      - uses: ./.github/actions/just

      # The dispatcher owns scope, including repository-wide lints. A query
      # failure fails this job; an empty selection keeps its required name green.
      - name: Select work
        id: scope
        run: just ci-select "$CI_BASE" >> "$GITHUB_OUTPUT"
        env:
          CI_BASE: ${{ github.base_ref == 'release' && '--all' || github.event.merge_group.base_sha }}

      - uses: ./.github/actions/nix
        if: steps.scope.outputs.needed == 'true' && runner.environment != 'self-hosted'
      - uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # main
        if: steps.scope.outputs.needed == 'true'

      # The merge queue writes what it compiles, so the cache follows what lands
      # on `main` without a second build after it; release pull requests read.
      # A selection of lints alone compiles no Rust, so it skips the cache.
      - name: Rust cache
        if: steps.scope.outputs.rust == 'true'
        uses: ./.github/actions/rust-cache
        with:
          access-key-id: ${{ secrets.MBX_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MBX_R2_SECRET_ACCESS_KEY }}

      # The pre-setup query and execution use the same impact map.
      - name: Check
        if: steps.scope.outputs.needed == 'true'
        run: nix develop --command just ci "$CI_BASE"
        env:
          CI_BASE: ${{ github.base_ref == 'release' && '--all' || github.event.merge_group.base_sha }}
