name: Check

permissions:
  id-token: write
  contents: read

on:
  pull_request:
    # `closed` is here only so merging/closing a PR cancels its in-flight run
    # via the concurrency group below; the job itself is skipped on close.
    types: [opened, synchronize, reopened, closed]

# Cancel in-flight runs when a new commit lands on the same PR, or when the PR
# is merged/closed (the close event shares this group and supersedes the build).
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    # Skip the actual work on close/merge: this run exists only to cancel the
    # superseded in-flight build via the concurrency group above.
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04-arm
    # Backstop a hang (e.g. a wedged test) instead of holding the runner for the
    # 6-hour default. Generous enough for a cold first build.
    timeout-minutes: 60

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so `just check` can diff against origin/$GITHUB_BASE_REF.
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
      - uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # main

      # Cache Rust dependencies and build artifacts via the Actions cache.
      - name: Rust Cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: true

      # The same two recipes a developer runs locally. Both diff against
      # origin/$GITHUB_BASE_REF and touch only the packages this PR changed plus
      # their dependents, so a one-crate PR compiles one crate.
      #
      # MOQ_STRICT turns every "tool missing, skipping" guard into an error.
      # Locally an absent formatter means less gets checked; here it would mean
      # a green run that checked nothing, which is the failure mode worth
      # spending a preflight on.
      - name: Check
        run: nix develop --command just check
        env:
          MOQ_STRICT: 1

      # NEXTEST_PROFILE picks up the longer hang timeout in .config/nextest.toml;
      # without it a runner under load could trip the local one.
      - name: Test
        run: nix develop --command just test
        env:
          MOQ_STRICT: 1
          NEXTEST_PROFILE: ci
