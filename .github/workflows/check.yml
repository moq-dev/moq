name: Check

permissions:
  contents: read

# Ready main PRs run the merge queue's selection as a signal, never a gate.
# Release PRs run the same checks over every package, including while drafts.
on:
  pull_request:
    # Closing or returning a main PR to draft cancels its in-flight run.
    # Any edit reruns eligible PRs, including a retarget to main or release:
    # skipping an edit would replace a failed context with a passing one.
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft, closed]

# Cancel in-flight runs when a new commit lands on the same PR, or when the PR
# is merged/closed. The PR number survives a merge, when github.ref changes.
concurrency:
  group: check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # One checkout, dev shell, cache restore, and dispatcher for lints and tests.
  check:
    name: Check
    if: github.event.action != 'closed' && (github.base_ref == 'release' || (github.base_ref == 'main' && github.event.pull_request.draft == false))
    runs-on: ubuntu-24.04-arm
    # Backstop a hang instead of holding the runner for the 6-hour default.
    timeout-minutes: 60
    env:
      CI_BASE: ${{ github.base_ref == 'release' && '--all' || github.event.pull_request.base.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history for the dispatcher's base comparison.
          fetch-depth: 0

      - uses: ./.github/actions/just

      # The dispatcher owns scope, including repository-wide lints. A query
      # failure fails this job; an empty selection keeps its required name green.
      - name: Select work
        id: scope
        run: just ci-select "$CI_BASE" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/nix
        if: steps.scope.outputs.needed == 'true' && runner.environment != 'self-hosted'
      - uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # main
        if: steps.scope.outputs.needed == 'true'

      # Pull requests read the hosted cache; lint-only changes skip it.
      - name: Rust cache
        if: steps.scope.outputs.rust == 'true'
        uses: ./.github/actions/rust-cache
        with:
          access-key-id: ${{ secrets.MBX_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MBX_R2_SECRET_ACCESS_KEY }}

      # The pre-setup query and execution use the same impact map.
      - name: Check
        if: steps.scope.outputs.needed == 'true'
        run: |
          rm -rf target/cargo-timings
          nix develop --command just ci "$CI_BASE"

      # Cargo's per-crate timings for the Rust test builds, so a slow crate
      # shows without rebuilding. The job summary has the per-module times.
      - name: Upload build timings
        if: ${{ !cancelled() && steps.scope.outputs.rust == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cargo-timings
          path: target/cargo-timings/cargo-timing-*.html
          if-no-files-found: ignore
          retention-days: 14
