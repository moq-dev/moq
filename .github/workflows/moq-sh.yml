name: moq.sh

# Tests the moq.sh installer on Linux and macOS, and deploys the moq.sh worker
# from `release`: when its source changes, and when release-binary.yml
# dispatches it after a moq-cli release, so the installer's default is always
# the newest moq-cli. `just check` covers the worker's dry-run bundle.

on:
  push:
    branches: [release]
    paths:
      - "infra/moq-sh/**"
      - ".github/workflows/moq-sh.yml"
  # Release PRs, through release-gate.yml. Main PRs skip it: the landing gate's
  # Check runs its fixtures on Linux, and nightly.yml's platform.yml call runs
  # them and the smoke on macOS.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Deploys share one group, so a queued deploy replaces an older pending one;
# each resolves the newest release itself. Pull requests cancel superseded runs.
concurrency:
  group: moq-sh-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # macOS runs in platform.yml, sharing its runner.
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Test against fake releases
        run: just infra moq-sh test

      - name: Install the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: just infra moq-sh smoke

  deploy:
    name: Deploy
    needs: test
    if: github.repository_owner == 'moq-dev' && github.event_name != 'pull_request' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    # Write credentials live in the `publish` Environment, which only protected
    # refs can deploy to.
    environment: publish

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: nix develop --command just infra moq-sh deploy
