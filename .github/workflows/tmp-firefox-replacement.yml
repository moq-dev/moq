name: Temporary Firefox replacement measurement

# Temporary: times the moq-lite-06 fallback of quest/m0/interop-green/firefox-replacement.md on the
# Nightly's runner class. Deleted before the PR is ready for review.

on:
  pull_request:
    paths:
      - .github/workflows/tmp-firefox-replacement.yml

permissions:
  contents: read

jobs:
  measure:
    name: Firefox replacement (${{ matrix.variant }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [replacement, full]
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/nix
      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          access-key-id: ${{ secrets.MBX_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MBX_R2_SECRET_ACCESS_KEY }}
      - name: Install publisher and player engines
        run: |
          nix develop --command env PLAYWRIGHT_BROWSERS_PATH="${{ runner.temp }}/playwright" bash -c "just js install frozen && bunx playwright install --with-deps chromium firefox"
          sudo apt-get install -y libpulse0
      - name: Measure
        env:
          VARIANT: ${{ matrix.variant }}
          PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: 1
          BROWSERS: ${{ runner.temp }}/playwright
        run: |
          runs=5
          cases=(--media-cases replacement)
          if [[ "$VARIANT" == full ]]; then runs=3; cases=(); fi
          pass=0
          fail=0
          for i in $(seq "$runs"); do
            log="$RUNNER_TEMP/run-$i.log"
            if nix develop --command env PLAYWRIGHT_BROWSERS_PATH="$BROWSERS" HARNESS_RUNS="$RUNNER_TEMP/runs-$i" HARNESS_KEEP=1 RUST_LOG=moq_net=trace \
              just test media --media-engines firefox "${cases[@]}" >"$log" 2>&1; then
              pass=$((pass + 1))
              echo "run $i: pass"
            else
              fail=$((fail + 1))
              echo "run $i: fail"
            fi
            grep -E '^\s+(FAIL|PASS) |replacement [0-9]+ms, fallback' "$log" | cut -c1-300 || true
          done
          echo "RESULT $VARIANT: $pass pass, $fail fail of $runs" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Preserve logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: firefox-replacement-${{ matrix.variant }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/run-*.log
            ${{ runner.temp }}/runs-*/*/relay.log
            ${{ runner.temp }}/runs-*/*/media-*.log
          if-no-files-found: ignore
