name: Audio quality

# Grades the recorded-trace replays of test/audio-quality against their exact
# budgets on every PR that can move them. They replay the player's container
# consumer and rings on a simulated clock, so they are deterministic and take
# seconds, unlike the browser rows, which stay in nightly.yml.
on:
  pull_request:
    paths:
      - "js/watch/**"
      # The container consumer decides what a replay delivers, waits for, and skips, on the
      # groups, tracks, and signals underneath it.
      - "js/hang/**"
      - "js/net/**"
      - "js/signals/**"
      - "test/audio-quality/**"
      - "test/lib/**"
      - "test/justfile"
      - ".github/workflows/audio-quality.yml"

concurrency:
  group: audio-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  replay:
    name: Replay
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Trust the flake's cachix substituter; see check.yml.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      - name: Replay
        run: nix develop --command just test audio-quality --replays --enforce
        shell: bash -leo pipefail {0}
        env:
          # Somewhere upload-artifact can reach; the harness default is under $TMPDIR.
          MOQ_TEST_RUNS: ${{ runner.temp }}/moq-test-runs

      # The harness keeps a failing run's directory: every row's samples and summary.
      - name: Keep the failing run
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: audio-quality-replay
          path: ${{ runner.temp }}/moq-test-runs/
          retention-days: 7
          if-no-files-found: ignore
