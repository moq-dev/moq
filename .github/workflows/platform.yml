name: Platform

# Compiles the workspace on Windows and macOS, the `#[cfg(...)]` code no Linux
# job compiles at all: moq-video's Media Foundation and VideoToolbox backends,
# their capture paths, moq-audio's ScreenCaptureKit capture, and the smaller
# platform branches elsewhere. Without this, a change that breaks any of them
# (a moq-net type they consume, say) merges green and compiles for the first
# time in a tag-triggered release build.
#
# A pull request compiles only the crates it changed plus their dependents,
# the same selection the Linux `check` job makes, because these are the
# slowest and scarcest runners in CI. Pushes to `main` and `dev` compile
# everything, catching the break two individually green PRs make once both
# land. `dev` never ran the nightly at all.
#
# Outside Nix, like android.yml: neither runner has it, so each installs the
# runner-native toolchain. rust-toolchain.toml still pins the compiler, and the
# recipes are the same ones a developer runs on that OS.
#
# No Rust cache. The repository's 10 GB budget is spent on the Linux `target/`
# that cache.yml warms for every pull request, and a Windows or macOS store
# would evict it to save these jobs a few minutes.

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
    paths:
      - "rs/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - ".github/workflows/platform.yml"
  pull_request:
    # `closed` is here only so merging/closing a PR cancels its in-flight run
    # via the concurrency group below; the jobs themselves are skipped on close.
    types: [opened, synchronize, reopened, closed]
    paths:
      - "rs/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - ".github/workflows/platform.yml"

concurrency:
  # Keyed by event, so a merged pull request's `closed` run can't cancel the push
  # run it triggers. Pull requests key by number rather than ref, since a merged
  # PR's `closed` run can report the base branch as its ref instead of the PR's
  # merge ref, and then wouldn't cancel the PR's in-flight run.
  group: platform-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Pushes queue instead: `main` merges faster than these jobs finish, so
  # cancelling meant almost no push run ever reported. Actions keeps only the
  # newest pending run, so queued merges still coalesce.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  JUST_VERSION: 1.52.0

jobs:
  windows:
    name: Windows
    if: github.event.action != 'closed'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so a pull request can diff against its base.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # aws-lc-rs assembles its x86_64 crypto with NASM on Windows.
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # A checksummed release binary, where `cargo install` would spend ~2 minutes
      # building just from source.
      - name: Install just
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Check
        shell: bash
        env:
          SCOPE: ${{ github.event_name == 'push' && '--all' || '' }}
        run: just rs windows "$SCOPE"

  macos:
    name: macOS
    if: github.event.action != 'closed'
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install just
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: just@${{ env.JUST_VERSION }}

      - name: Check
        env:
          SCOPE: ${{ github.event_name == 'push' && '--all' || '' }}
        run: just rs macos "$SCOPE"
