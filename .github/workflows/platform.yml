name: Platform

# The native macOS and Windows gates run once per main merge, in the merge queue,
# rather than on every PR push. Release has no queue, so its PRs retain them. Every PR reports skipped OS checks without path filters,
# allowing the same check names to be required before and inside the queue.
permissions:
  contents: read

on:
  push:
    branches: [release]
    paths:
      - "rs/**"
      - "cpp/**"
      - "swift/**"
      - "infra/moq-sh/**"
      - "sh/**"
      - "doc/lib/**"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - "**/justfile"
      - ".github/**"
  pull_request:
    # `closed` only cancels an in-flight run. `edited` runs the gates when a main
    # PR is retargeted to release. Any edit reruns them, since a skipped rerun
    # would post a passing context over a failed one; on main PRs that is free.
    types: [opened, synchronize, reopened, edited, closed]
  merge_group:
    types: [checks_requested]
  workflow_call:
    inputs:
      benchmarks:
        description: Measure Swift against Rust baselines on this runner
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      benchmarks:
        description: Measure Swift against Rust baselines on this runner
        type: boolean
        default: false

concurrency:
  group: platform-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  # Cargo and the CMake/Swift builds use one artifact tree on each runner.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  NEXTEST_PROFILE: ci

jobs:
  scope:
    # Require this check too: a failed selector otherwise skips its dependents,
    # and GitHub accepts skipped jobs as successful required checks.
    name: Platform scope
    if: github.event.action != 'closed' && (github.event_name != 'pull_request' || github.base_ref == 'release')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    outputs:
      needed: ${{ steps.scope.outputs.needed }}
      rs: ${{ steps.scope.outputs.rs }}
      swift: ${{ steps.scope.outputs.swift }}
      cpp: ${{ steps.scope.outputs.cpp }}
      obs: ${{ steps.scope.outputs.obs_compile }}
      moq_sh: ${{ steps.scope.outputs.moq_sh }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/just
      - name: Select platform checks
        id: scope
        env:
          CI_BASE: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') && '--all' || github.event.merge_group.base_sha }}
        run: just ci-select platform "$CI_BASE" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows
    needs: scope
    if: needs.scope.outputs.rs == 'true' || needs.scope.outputs.cpp == 'true' || needs.scope.outputs.obs == 'true'
    # OBS uses the Visual Studio 17 2022 CMake generator.
    runs-on: windows-2022
    # The suites run serially without a Rust cache; the full macOS suite measured 43 min.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: ./.github/actions/just
      - name: Install nextest
        if: needs.scope.outputs.rs == 'true'
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: nextest@0.9.146
      - name: Install uniffi-bindgen-cpp
        if: needs.scope.outputs.cpp == 'true' || needs.scope.outputs.obs == 'true'
        shell: bash
        run: cargo install uniffi-bindgen-cpp --locked --git https://github.com/kixelated/uniffi-bindgen-cpp --tag v0.11.0-kixelated.5+v0.32.2
      - name: Rust compile and tests
        if: needs.scope.outputs.rs == 'true'
        shell: bash
        env:
          CI_BASE: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') && '--all' || github.event.merge_group.base_sha }}
        run: |
          just rs windows "$CI_BASE"
          just rs windows-test
      - name: C++
        if: needs.scope.outputs.cpp == 'true'
        shell: bash
        run: just cpp check
      - name: OBS
        if: needs.scope.outputs.obs == 'true'
        shell: bash
        run: just obs package --target x86_64-pc-windows-msvc --output "$RUNNER_TEMP/obs"

  macos:
    name: macOS
    needs: scope
    if: needs.scope.outputs.rs == 'true' || needs.scope.outputs.swift == 'true' || needs.scope.outputs.obs == 'true' || needs.scope.outputs.moq_sh == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: ./.github/actions/just
      - name: Install nextest
        if: needs.scope.outputs.rs == 'true'
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: nextest@0.9.146
      - name: Install uniffi-bindgen-cpp
        if: needs.scope.outputs.obs == 'true'
        run: cargo install uniffi-bindgen-cpp --locked --git https://github.com/kixelated/uniffi-bindgen-cpp --tag v0.11.0-kixelated.5+v0.32.2
      - name: Rust compile and tests
        if: needs.scope.outputs.rs == 'true'
        env:
          CI_BASE: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') && '--all' || github.event.merge_group.base_sha }}
        run: |
          just rs macos "$CI_BASE"
          just rs macos-test
      - name: Swift simulator check
        if: needs.scope.outputs.swift == 'true'
        run: just swift simulator
      - name: Swift
        if: needs.scope.outputs.swift == 'true'
        run: just swift check
      - name: Swift binding benchmark
        if: inputs.benchmarks
        run: just bench-ffi swift
      - name: Preserve Swift benchmark
        if: inputs.benchmarks && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bench-ffi-swift
          path: target/bench/ffi/
          if-no-files-found: error
      - name: OBS
        if: needs.scope.outputs.obs == 'true'
        run: just obs package --target aarch64-apple-darwin --output "$RUNNER_TEMP/obs"
      - name: Installer fixtures
        if: needs.scope.outputs.moq_sh == 'true'
        run: just infra moq-sh test
      - name: Installer smoke
        if: needs.scope.outputs.moq_sh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: just infra moq-sh smoke
