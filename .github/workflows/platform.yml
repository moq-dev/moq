name: Platform

# Compiles the workspace on Windows and macOS, the `#[cfg(...)]` code no Linux
# job compiles at all: moq-video's Media Foundation and VideoToolbox backends,
# their capture paths, moq-audio's ScreenCaptureKit capture, and the smaller
# platform branches elsewhere. It also builds the OBS plugin against the
# obs-deps bundle, which obs.yml can't do on Linux. Without this, a change that
# breaks any of them (a moq-net type they consume, say) merges green and
# compiles for the first time in a tag-triggered release build.
#
# Unfiltered, unlike android.yml: every job still finishes before check.yml, so
# a path list tracking the dependency graphs of all that code isn't worth it.
#
# Pushes to `main` and `dev` catch the break two individually green PRs make
# once both land, which is what the nightly run of these jobs used to cover.
# `dev` never ran the nightly at all.
#
# Outside Nix, like android.yml: neither runner has it, so each installs the
# runner-native toolchain. rust-toolchain.toml still pins the compiler, and the
# recipes are the same ones a developer runs on that OS.
#
# No Rust cache. The repository's 10 GB budget is spent on the Linux `target/`
# that cache.yml warms for every pull request, and a Windows or macOS store
# would evict it to save these jobs a few minutes.

permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:
    # `closed` is here only so merging/closing a PR cancels its in-flight run
    # via the concurrency group below; the jobs themselves are skipped on close.
    types: [opened, synchronize, reopened, closed]

concurrency:
  # Keyed by event, so a merged pull request's `closed` run can't cancel the push
  # run it triggers. Pull requests key by number rather than ref, since a merged
  # PR's `closed` run can report the base branch as its ref instead of the PR's
  # merge ref, and then wouldn't cancel the PR's in-flight run.
  group: platform-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  JUST_VERSION: 1.52.0

jobs:
  windows:
    name: Windows
    if: github.event.action != 'closed'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # aws-lc-rs assembles its x86_64 crypto with NASM on Windows.
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Pinned: `--locked` fixes just's own dependencies, not which version of
      # just cargo selects.
      - name: Install just
        shell: bash
        run: cargo install --locked "just@$JUST_VERSION"

      - name: Check
        shell: bash
        run: just rs windows

  macos:
    name: macOS
    if: github.event.action != 'closed'
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install just
        run: cargo install --locked "just@$JUST_VERSION"

      - name: Check
        run: just rs macos

  # The release build of the OBS plugin, minus the published libmoq: build.sh
  # without `--libmoq-release` links the in-tree rs/libmoq instead, so a PR is
  # checked against its own C ABI. The obs-deps bundle (libobs, Qt6, ffmpeg)
  # comes from buildspec.json at configure time, same as a tag build.
  obs:
    name: OBS (${{ matrix.name }})
    if: github.event.action != 'closed'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            target: aarch64-apple-darwin
            os: macos-latest
          - name: Windows
            target: x86_64-pc-windows-msvc
            # The plugin preset uses the Visual Studio 17 2022 generator.
            os: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: ./cpp/obs/build.sh --target "$TARGET" --output "$RUNNER_TEMP/obs"
