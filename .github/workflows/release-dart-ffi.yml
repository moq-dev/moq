name: Release Dart FFI

# Publishes the raw `moq_ffi` package and its Native Assets libraries in
# lockstep with the moq-ffi crate. The ergonomic `moq` package is released by
# release-dart.yml from its own tag.

on:
  push:
    tags:
      - "moq-ffi-v*"
  # Dry-run: build everything, publish nothing. Nightly calls every release
  # workflow this way so a broken build surfaces before the tag is cut.
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release-dart-ffi.yml"
      - ".github/workflows/release-ffi.yml"
      - "dart/moq_ffi/**"
      - "sh/dart/**"
      - "rs/moq-ffi/**"
      - "!rs/moq-ffi/Cargo.toml"

permissions:
  contents: read

# Only publishing runs share the serialized group. GitHub keeps a single pending
# run per group and drops the older one, so a PR (or nightly dry-run) sharing it
# silently cancelled a queued release. Dry-runs get a per-ref group instead and
# cancel their superseded builds.
concurrency:
  group: release-dart-ffi-${{ github.ref_type == 'tag' && 'publish' || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  ffi:
    name: moq-ffi
    uses: ./.github/workflows/release-ffi.yml
    with:
      language: dart
      # The raw bindings are checked in under dart/moq_ffi, so none here.
      bindings: false
      default-features: false
      targets: >-
        [
          "aarch64-linux-android",
          "armv7-linux-androideabi",
          "x86_64-linux-android",
          "x86_64-unknown-linux-gnu",
          "aarch64-unknown-linux-gnu",
          "aarch64-apple-darwin",
          "x86_64-apple-darwin",
          "aarch64-apple-ios",
          "aarch64-apple-ios-sim",
          "x86_64-apple-ios",
          "x86_64-pc-windows-msvc"
        ]

  # hook/build.dart downloads moq-ffi-<version>-<target>-<library> and its
  # .sha256 from the release, so each target's shared library is renamed flat.
  assets:
    name: Stage Native Assets
    needs: [ffi]
    runs-on: ubuntu-latest

    steps:
      - name: Download per-target libs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: libs-raw
          pattern: dart-lib-*

      - name: Stage
        env:
          BUILD_VERSION: ${{ needs.ffi.outputs.version }}
        run: |
          mkdir -p assets
          for dir in libs-raw/dart-lib-*; do
            target="${dir#libs-raw/dart-lib-}"
            case "$target" in
              *-apple-ios* | *-apple-darwin*) library=libmoq_ffi.dylib ;;
              *-windows-*) library=moq_ffi.dll ;;
              *) library=libmoq_ffi.so ;;
            esac
            name="moq-ffi-$BUILD_VERSION-$target-$library"
            cp "$dir/$library" "assets/$name"
            (cd assets && sha256sum "$name" > "$name.sha256")
          done
          ls -la assets

      - name: Upload Native Assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dart-assets
          path: assets/*

  package:
    name: Check pub package
    needs: [ffi]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Stage and check package
        env:
          BUILD_VERSION: ${{ needs.ffi.outputs.version }}
        run: |
          just dart package \
            --package moq_ffi \
            --version "$BUILD_VERSION" \
            --output release-out
          cd "release-out/moq_ffi-$BUILD_VERSION"
          dart pub get --enforce-lockfile
          dart analyze
          dart pub publish --dry-run

      - name: Upload pub package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dart-ffi-package
          path: release-out/*

  release:
    name: Attach Native Assets
    needs: [ffi, assets]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Find previous tag
        id: prev_tag
        run: just gh release prev-tag moq-ffi

      - name: Download Native Assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dart-assets
          path: artifacts

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TITLE: "moq-ffi v${{ needs.ffi.outputs.version }}"
          RELEASE_PREV_TAG: ${{ steps.prev_tag.outputs.tag }}
          RELEASE_CHECKSUMS: SHA256SUMS-dart
        run: just gh release create artifacts

  publish:
    name: Publish moq_ffi to pub.dev
    needs: [ffi, package, release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pub.dev
      url: https://pub.dev/packages/moq_ffi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dart-ffi-package
          path: package

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Publish
        env:
          BUILD_VERSION: ${{ needs.ffi.outputs.version }}
        run: cd "package/moq_ffi-$BUILD_VERSION" && dart pub publish --force
