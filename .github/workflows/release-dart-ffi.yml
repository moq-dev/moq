name: Release Dart FFI

# Publishes the raw `moq_ffi` package and its Native Assets libraries in
# lockstep with the moq-ffi crate. The ergonomic `moq` package is released by
# release-dart.yml from its own tag.

on:
  # The tag coordinator (release-shared-ffi.yml) calls this with reuse-native and
  # supplies the libraries it already built. Manual calls and release PR
  # dry-runs build every target themselves.
  workflow_call:
    inputs:
      reuse-native:
        description: "Take the targets the shared coordinator built instead of rebuilding them"
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

# Only publishing runs share the serialized group. GitHub keeps a single pending
# run per group and drops the older one, so a PR (or nightly dry-run) sharing it
# silently cancelled a queued release. Dry-runs get a per-ref group instead and
# cancel their superseded builds.
concurrency:
  group: release-dart-ffi-${{ github.ref_type == 'tag' && 'publish' || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  # Dart ships every target of the shared build plus the two Apple ones only it
  # needs. With reuse-native the shared ones come from this run's default-lib-*
  # artifacts, which are the same default-feature libraries.
  plan:
    name: Plan targets
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.plan.outputs.all }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Plan
        id: plan
        env:
          REUSE_NATIVE: ${{ inputs.reuse-native }}
          # Kept equal to release-shared-ffi.yml's native targets by sh/gh/ffi.test.ts.
          SHARED: >-
            ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin",
            "x86_64-pc-windows-msvc", "aarch64-linux-android", "armv7-linux-androideabi",
            "x86_64-linux-android", "aarch64-apple-ios", "aarch64-apple-ios-sim"]
          ALL: >-
            ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android",
            "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin",
            "x86_64-apple-darwin", "aarch64-apple-ios", "aarch64-apple-ios-sim", "x86_64-apple-ios",
            "x86_64-pc-windows-msvc"]
        run: |
          echo "all=$(jq -c . <<<"$ALL")" >> "$GITHUB_OUTPUT"
          if [[ "$REUSE_NATIVE" == true ]]; then
            echo "build=$(jq -c --argjson shared "$SHARED" '. - $shared' <<<"$ALL")" >> "$GITHUB_OUTPUT"
          else
            echo "build=$(jq -c . <<<"$ALL")" >> "$GITHUB_OUTPUT"
          fi

  ffi:
    name: moq-ffi
    needs: [plan]
    uses: ./.github/workflows/release-ffi.yml
    with:
      language: dart
      # The package job generates the raw bindings itself: they are not checked in.
      bindings: false
      targets: ${{ needs.plan.outputs.build }}

  # hook/build.dart downloads moq-ffi-<version>-<target>-<library> and its
  # .sha256 from the release, so each target's shared library is renamed flat.
  assets:
    name: Stage Native Assets
    needs: [plan, ffi]
    runs-on: ubuntu-latest

    steps:
      - name: Download per-target libs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: libs-raw
          pattern: "{default,dart}-lib-*"

      - name: Stage
        env:
          BUILD_VERSION: ${{ needs.ffi.outputs.version }}
          TARGETS: ${{ needs.plan.outputs.all }}
        run: |
          mkdir -p assets
          # A missing library fails the release rather than shipping without a platform.
          for target in $(jq -r '.[]' <<<"$TARGETS"); do
            dirs=(libs-raw/*-lib-"$target")
            [[ -d "${dirs[0]}" ]] || { echo "missing native library artifact for $target" >&2; exit 1; }
            dir=${dirs[0]}
            case "$target" in
              *-apple-ios* | *-apple-darwin*) library=libmoq_ffi.dylib ;;
              *-windows-*) library=moq_ffi.dll ;;
              *) library=libmoq_ffi.so ;;
            esac
            name="moq-ffi-$BUILD_VERSION-$target-$library"
            cp "$dir/$library" "assets/$name"
            (cd assets && sha256sum "$name" > "$name.sha256")
          done
          ls -la assets

      - name: Upload Native Assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dart-assets
          path: assets/*

  package:
    name: Check pub package
    needs: [ffi]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - uses: ./.github/actions/nix

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      # dart/moq_ffi/lib/src is not in git. The package must carry the generated
      # bindings, since a consumer installing from pub.dev has no generator.
      - name: Generate bindings
        run: nix develop --command just dart generate

      - name: Stage and check package
        env:
          BUILD_VERSION: ${{ needs.ffi.outputs.version }}
        run: |
          just dart package \
            --package moq_ffi \
            --version "$BUILD_VERSION" \
            --output release-out
          cd "release-out/moq_ffi-$BUILD_VERSION"
          dart pub get --enforce-lockfile
          dart analyze
          # pipefail keeps a failed dry run failing the step, and the log stays
          # outside the package directory, which is uploaded and published.
          set -o pipefail
          dart pub publish --dry-run 2>&1 | tee "$RUNNER_TEMP/publish.log"
          grep -q -- '── moq.dart (' "$RUNNER_TEMP/publish.log"
          grep -q -- '── uniffi_runtime.dart (' "$RUNNER_TEMP/publish.log"

      - name: Upload pub package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dart-ffi-package
          path: release-out/*

  release:
    name: Attach Native Assets
    needs: [ffi, assets]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Find previous tag
        id: prev_tag
        run: just gh release prev-tag moq-ffi

      - name: Download Native Assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dart-assets
          path: artifacts

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TITLE: "moq-ffi v${{ needs.ffi.outputs.version }}"
          RELEASE_PREV_TAG: ${{ steps.prev_tag.outputs.tag }}
          RELEASE_CHECKSUMS: SHA256SUMS-dart
        run: just gh release create artifacts

  publish:
    name: Publish moq_ffi to pub.dev
    needs: [ffi, package, release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pub.dev
      url: https://pub.dev/packages/moq_ffi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dart-ffi-package
          path: package

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Publish
        env:
          BUILD_VERSION: ${{ needs.ffi.outputs.version }}
        run: cd "package/moq_ffi-$BUILD_VERSION" && dart pub publish --force
