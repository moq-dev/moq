name: Release C++

# Builds the moq C++ package (cpp/moq) for every target and publishes one archive per
# target to a cpp-v<version> GitHub release. The vcpkg and Conan packages fetch these.

on:
  push:
    tags:
      - "cpp-v*"
  # Dry-run: build everything, publish nothing. Nightly calls every release
  # workflow this way so a broken build surfaces before the tag is cut.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # aws-lc-rs assembles its x86_64 crypto with NASM on Windows.
      - name: Install NASM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The tag flake.nix pins; see the comment there.
      - name: Install uniffi-bindgen-cpp
        shell: bash
        run: cargo install uniffi-bindgen-cpp --locked --git https://github.com/kixelated/uniffi-bindgen-cpp --tag v0.11.0-kixelated.1+v0.32.2

      # The package version lives in cpp/moq/VERSION; a tag that disagrees is a mistake.
      - name: Check version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(tr -d '[:space:]' < cpp/moq/VERSION)
          if [[ "$TAG" != "cpp-v$version" ]]; then
            echo "::error::tag $TAG does not match cpp/moq/VERSION ($version)"
            exit 1
          fi

      - name: Build and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: ./cpp/moq/build.sh --target "$TARGET" --output dist

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: moq-cpp-${{ matrix.target }}
          path: dist/*

  release:
    name: Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find previous tag
        id: prev_tag
        run: .github/scripts/release.sh prev-tag cpp

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PREV_TAG: ${{ steps.prev_tag.outputs.tag }}
        run: RELEASE_TITLE="moq C++ v${RELEASE_TAG#cpp-v}" .github/scripts/release.sh create artifacts

  # The OBS plugin (cpp/obs) statically links the C++ package, so it ships with
  # every release: rebuild it against the release just published (no second
  # cargo build, guaranteed-matching bindings) and cut a parallel
  # obs-moq-v<version> release. Runs after `release` so the archives the
  # plugin's CMake fetches are already live.
  obs-build:
    name: OBS plugin (${{ matrix.target }})
    needs: release
    runs-on: ${{ matrix.os }}

    # macOS + Windows only. These link the ffmpeg the obs-deps bundle ships
    # (the same one OBS uses), so the binaries are portable. A Linux build
    # would link nix/distro ffmpeg and not be portable, so Linux is
    # build-from-source (see doc/bin/obs.md) and ships no prebuilt binary.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            # The plugin preset uses the Visual Studio 17 2022 generator.
            os: windows-2022

    steps:
      # Shallow: this job only compiles, it never reads git history or tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse version
        id: parse
        shell: bash
        run: .github/scripts/release.sh parse-version cpp

      # Native Xcode / Visual Studio; libobs/Qt6/ffmpeg come from the obs-deps
      # bundle and the C++ package from the release just published (--moq-release).
      - name: Build and package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          ./cpp/obs/build.sh --target "$TARGET" --moq-release "$VERSION" --output dist

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: obs-moq-${{ matrix.target }}
          path: dist/*

  obs-release:
    name: OBS plugin release
    needs: obs-build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Parse version
        id: parse
        run: .github/scripts/release.sh parse-version cpp

      # Only the obs-moq archives: the moq-cpp-* artifacts from the build job
      # belong to the C++ release, not this one.
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: obs-moq-*
          merge-multiple: true

      # release.sh prev-tag keys off the current tag, but the trigger here is a
      # cpp-v* tag, so it can't find the previous obs-moq tag. Take the newest
      # existing obs-moq tag (excluding this version, for safe re-runs) so the
      # release notes span only since the last obs-moq release.
      - name: Find previous obs-moq tag
        id: prev_tag
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          cur="obs-moq-v${VERSION}"
          # awk (not grep -vx | head) so an empty result is exit 0, not 1:
          # under `set -eo pipefail` the inaugural release has no prior tag and
          # grep's exit 1 would fail the step. Empty tag is fine downstream.
          prev=$(git tag --list 'obs-moq-v*' --sort=-v:refname | awk -v cur="$cur" '$0 != cur { print; exit }')
          echo "tag=${prev}" >>"$GITHUB_OUTPUT"

      # Cut a parallel obs-moq-v<version> release at this commit (gh creates
      # the tag).
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: "obs-moq-v${{ steps.parse.outputs.version }}"
          RELEASE_TITLE: "obs-moq v${{ steps.parse.outputs.version }}"
          RELEASE_PREV_TAG: ${{ steps.prev_tag.outputs.tag }}
        run: .github/scripts/release.sh create artifacts
