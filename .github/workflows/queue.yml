name: Queue

# GitHub's merge queue tests each picked PR on top of main, one at a time, on
# the host's self-hosted runner, and merges exactly the tree it tested. When the
# queue drops a PR, kixel-ai/quest's queue watcher on the host runs the land
# fixer and re-enqueues it
# (https://github.com/moq-dev/moq/blob/17a81d6c64/quest/m0/ci/land.md).
#
# `main`'s ruleset requires the `Queue` context. On a pull request,
# queue-pr.yml reports it as skipped; only the merge group build runs code, and
# only a maintainer's pick enters the queue. The rust-cache action admits a
# self-hosted run only under this workflow's name.
on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# No concurrency group: each merge group has its own ref, so its run never has
# another to replace, and cancelling one would report `Queue` cancelled.

jobs:
  # The build, and the `Queue` context main's ruleset requires, run in
  # queue-build.yml so its runner group can admit that workflow alone; see that
  # file. No job here needs a GitHub-hosted runner, so landing never waits on
  # one. It calls main's copy, not the merge group's, since the group admits
  # that workflow only at refs/heads/main: a PR's edit to queue-build.yml runs
  # only after it lands.
  build:
    name: Queue build
    uses: moq-dev/moq/.github/workflows/queue-build.yml@main # zizmor: ignore[unpinned-uses] this repository's own main, the one ref its runner group admits
    # The build's report job posts the required `Queue` check run itself.
    permissions:
      contents: read
      checks: write
