name: Alert

# Posts cron, release, and deployment failures to the Discord #alerts channel.
# PRs and branch validation stay on GitHub; the landing gate runs on the
# maintainer's host.
#
# Needs a DISCORD_WEBHOOK secret in the `alert` Environment (Discord: Channel >
# Integrations > Webhooks). Nothing else reads it.

on:
  # Reads only the run's metadata; it never checks out or runs the run's code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    # Matched by workflow `name:`, not filename. Watch cron and publishing
    # workflows only, avoiding a skipped Alert run on every CI completion.
    # `just gh check` enforces coverage and the exclusions in alert.sh.
    workflows:
      - apt-repo
      - Cache
      - CodSpeed
      - Docker
      - GStreamer CI image
      - Interop
      - libmoq
      - moq-cli
      - moq-gst
      - moq-relay
      - moq.sh
      - Nightly
      - release-brew
      - Release C
      - Release Cpp
      - Release Dart
      - Release Dart FFI
      - Release FFI
      - Release Go
      - Release Go FFI
      - Release JS
      - Release Kotlin FFI
      - Release Kotlin lib
      - Release Nix
      - Release Py
      - Release Py FFI
      - Release remeasure
      - Release RS
      - Release Swift FFI
      - Release Swift Lib
      - release-winget
      - rpm-repo
      - Smoke
      - Smoke toolchain update
      - TS
      - Video
    types:
      - completed

permissions:
  contents: read

jobs:
  discord:
    name: Discord
    # `cancelled` is excluded: concurrency groups cancel in-flight runs as a
    # matter of course, and paging on that would be pure noise. The exception is
    # the package-repo publishers, whose `queue: max` never cancels a run: one
    # cancelled there is a dropped publish (a full queue or a person), which
    # must not pass silently.
    #
    # Note the chained cases (a release tag -> release-brew -> here) sit at the
    # third and final level workflow_run supports; a fourth would never fire.
    # Cron suites alert only for schedules; publishing workflows also alert
    # when dispatched manually or chained after another release. CodSpeed runs
    # on landings instead of a schedule, so it alerts for pushes (only `main`
    # triggers it) but not for Kixel Quest's bisect dispatches.
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      (github.event.workflow_run.conclusion == 'cancelled' &&
      contains(fromJSON('["apt-repo", "rpm-repo", "release-brew"]'), github.event.workflow_run.name))) &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.event != 'pull_request_target' &&
      (github.event.workflow_run.event == 'schedule' ||
      (github.event.workflow_run.event == 'push' && github.event.workflow_run.name == 'CodSpeed') ||
      !contains(fromJSON('["CodSpeed", "GStreamer CI image", "Interop", "Nightly", "Smoke", "Smoke toolchain update", "TS", "Video"]'), github.event.workflow_run.name))
    runs-on: ubuntu-latest
    # The webhook lives in the `alert` Environment, which admits only `main`,
    # where workflow_run runs. It is not a release credential, so it stays out
    # of `publish`, which admits only release refs.
    environment: alert

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
        run: just gh alert discord
