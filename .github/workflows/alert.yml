name: Alert

# Posts cron, release, and deployment failures to the Discord #alerts channel.
# PRs, the landing gate, branch validation, and cache warming stay on GitHub.
#
# Needs a DISCORD_WEBHOOK repo secret (Discord: Channel > Integrations >
# Webhooks). Nothing else reads it.

on:
  # Reads only the run's metadata; it never checks out or runs the run's code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    # Matched by workflow `name:`, not filename. Watch cron and publishing
    # workflows only, avoiding a skipped Alert run on every CI completion.
    # `just gh check` enforces coverage and the exclusions in alert.sh.
    workflows:
      - apt-repo
      - CodSpeed
      - Docker
      - Interop
      - moq-c
      - moq-cli
      - moq-gst
      - moq-relay
      - moq.sh
      - Nightly
      - release-brew
      - Release C
      - Release Cpp
      - Release Dart
      - Release Dart FFI
      - Release FFI
      - Release Go
      - Release Go FFI
      - Release JS
      - Release Kotlin FFI
      - Release Kotlin lib
      - Release Nix
      - Release Py
      - Release Py FFI
      - Release RS
      - Release Swift FFI
      - Release Swift Lib
      - release-winget
      - rpm-repo
      - Smoke
      - Smoke toolchain update
      - TS
      - Video
    types:
      - completed

permissions:
  contents: read

jobs:
  discord:
    name: Discord
    # `cancelled` is excluded: concurrency groups cancel in-flight runs as a
    # matter of course, and paging on that would be pure noise.
    #
    # Note the chained cases (a release tag -> release-brew -> here) sit at the
    # third and final level workflow_run supports; a fourth would never fire.
    # Cron suites alert only for schedules; publishing workflows also alert
    # when dispatched manually or chained after another release.
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.event != 'pull_request_target' &&
      (github.event.workflow_run.event == 'schedule' ||
      !contains(fromJSON('["Interop", "Nightly", "Smoke", "Smoke toolchain update", "TS", "Video"]'), github.event.workflow_run.name))
    runs-on: ubuntu-latest
    # The webhook lives in the `publish` Environment, which only protected refs
    # can deploy to; workflow_run runs on `main`.
    environment: publish

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_REF: ${{ github.event.workflow_run.head_branch }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_ACTOR: ${{ github.event.workflow_run.triggering_actor.login }}
        run: just gh alert discord
