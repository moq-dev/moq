name: API diff

# Diffs every published API against its last release. Nightly calls this on
# `main` and runs it only while the cycle's `phase` in version.json is
# `additive`, failing on any break, so a break that lands early surfaces within
# a day rather than at the cut. Backports and cuts run `just api-diff` locally
# (see RELEASE.md).
permissions:
  contents: read

on:
  workflow_call:

concurrency:
  group: api-diff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    name: Public API
    runs-on: ubuntu-24.04-arm
    # Nightly's run on `main` writes the Rust cache, which needs this environment's keys.
    environment: ${{ github.ref == 'refs/heads/main' && 'cache-write' || '' }}
    # cargo-semver-checks documents every published crate twice, baseline and current.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pick the mode
        id: mode
        run: |
          # `release` has no version.json until the first shared cut lands there.
          phase=null
          if [[ -f version.json ]]; then phase=$(jq -r .phase version.json); fi
          # Only the additive phase forbids a break on `main`.
          [[ "$phase" == additive ]] || echo "skip=1" >>"$GITHUB_OUTPUT"
      - if: ${{ !steps.mode.outputs.skip }}
        uses: ./.github/actions/nix
      - if: ${{ !steps.mode.outputs.skip }}
        uses: ./.github/actions/rust-cache
        with:
          access-key-id: ${{ secrets.MBX_B2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.MBX_B2_SECRET_ACCESS_KEY }}
      # The JS baseline is rendered from `release`'s source.
      - name: Fetch release
        if: ${{ !steps.mode.outputs.skip }}
        run: git fetch --no-tags --depth=1 origin +refs/heads/release:refs/remotes/origin/release
      - name: Diff against the last release
        id: diff
        if: ${{ !steps.mode.outputs.skip }}
        run: nix develop --command just api-diff --deny
        env:
          # Lists and downloads the libmoq and moq-ffi release assets.
          GH_TOKEN: ${{ github.token }}
      - name: Keep the report
        if: ${{ !cancelled() && steps.diff.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: api-diff
          path: target/api-diff/
          retention-days: 30
          if-no-files-found: error
