name: Release JS

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [release]
    paths:
      - 'js/**'
      - '.github/workflows/release-js.yml'
  # Dry-run: builds, packs, and runs `deno publish --dry-run`, which catches
  # JSR-only failures before they break a release on `release`. Only a push
  # publishes, so nightly.yml calls this on main in place of main PRs.
  workflow_call:

# Only publishing runs share the serialized group. GitHub keeps a single pending
# run per group and drops the older one, so a dry-run sharing it would cancel a
# queued release. Dry-runs get a per-ref group and cancel superseded builds.
concurrency:
  group: release-js-${{ github.event_name == 'push' && 'publish' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  release:
    name: Release JS Packages
    runs-on: ubuntu-latest
    if: github.repository_owner == 'moq-dev'
    # npm trusted publishing can require this Environment, which only `release`
    # can deploy to, so a branch's OIDC identity cannot publish. It also holds
    # the JSR token, since JSR's OIDC trust cannot require an Environment.
    # Dry-runs skip it.
    environment: ${{ github.event_name == 'push' && 'npm' || '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/nix

      - name: Setup npm registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile

      - name: Release packages
        env:
          DRY_RUN: ${{ github.event_name != 'push' }}
          # Only the `npm` Environment holds it, so dry-runs get none.
          # release.ts hands it to `deno publish` alone.
          JSR_TOKEN: ${{ secrets.JSR_TOKEN }}
        run: nix develop --command bun --filter '*' release
