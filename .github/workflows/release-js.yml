name: Release JS

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - '.github/workflows/release-js.yml'
  # Dry-run: builds, packs, and runs `deno publish --dry-run`, which catches
  # JSR-only failures before they break a release on main.
  pull_request:
    paths:
      - 'js/**'
      - '.github/workflows/release-js.yml'

# Only publishing runs share the serialized group. GitHub keeps a single pending
# run per group and drops the older one, so a PR sharing it would cancel a
# queued release. Dry-runs get a per-ref group and cancel superseded builds.
concurrency:
  group: release-js-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    name: Release JS Packages
    runs-on: ubuntu-latest
    if: github.repository_owner == 'moq-dev'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Trust the flake's cachix substituter, as check.yml does. Without it
          # `nix develop` built the dev shell from source, about 13 minutes.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      - name: Setup npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: nix develop --command bun install --frozen-lockfile

      - name: Release packages
        env:
          DRY_RUN: ${{ github.event_name == 'pull_request' }}
        run: nix develop --command bun --filter '*' release
