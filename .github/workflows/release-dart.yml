name: Release Dart

# Publishes the ergonomic `moq` wrapper from a moq-dart-v* tag. Pub.dev OIDC
# requires a tag-triggered workflow, so this package cannot use the branch-push
# release gate used by registries that accept branch identities.

on:
  push:
    tags:
      - "moq-dart-v*"
  # Dry-run: check the source package, publish nothing. Only a tag push
  # publishes, so nightly.yml calls this on main in place of main PRs.
  workflow_call:

permissions:
  contents: read

# Only publishing runs share the serialized group. GitHub keeps a single pending
# run per group and drops the older one, so a PR (or nightly dry-run) sharing it
# silently cancelled a queued release. Dry-runs get a per-ref group instead and
# cancel their superseded builds.
concurrency:
  group: release-dart-${{ github.event_name == 'push' && 'publish' || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  package:
    name: Check package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Resolve version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" != "push" ]]; then
            VERSION=$(sed -n 's/^version: //p' dart/moq/pubspec.yaml | head -1)
          else
            just gh release parse-version moq-dart
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check source package (dry-run)
        if: github.event_name != 'push'
        working-directory: dart/moq
        run: |
          if [ -f pubspec.lock ]; then
            dart pub get --enforce-lockfile
          else
            dart pub get
          fi
          dart analyze
          dart pub publish --dry-run

      - name: Stage package
        if: github.event_name == 'push'
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          just dart package \
            --package moq \
            --version "$BUILD_VERSION" \
            --output release-out

      - name: Check staged package
        if: github.event_name == 'push'
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd "release-out/moq-$BUILD_VERSION"
          if [ -f pubspec.lock ]; then
            dart pub get --enforce-lockfile
          else
            dart pub get
          fi
          dart analyze
          dart pub publish --dry-run

      - name: Upload package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dart-package
          path: release-out/*

  publish:
    name: Publish moq to pub.dev
    needs: [package]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pub.dev
      url: https://pub.dev/packages/moq
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dart-package
          path: package

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1

      - name: Publish
        env:
          BUILD_VERSION: ${{ needs.package.outputs.version }}
        run: cd "package/moq-$BUILD_VERSION" && dart pub publish --force
