name: Smoke

# Cross-language interop smoke test built from THIS checkout (not the published
# packages, unlike the moq-dev/smoke repo). Stands up a relay and runs the
# publish x subscribe matrix across rust / python / go / browser / native-js / c / gst.
#
# The TS/IRD compliance harness used to ride along here. It is its own lane in
# gates.yml now, so it runs on the pull requests that change the exporter rather
# than on the ones that change this harness, and nightly.yml still runs the
# stronger `--live` arm of it.
on:
  # Manual on-demand runs.
  workflow_dispatch:
  # Nightly: catch an interop regression in the current tree before a user does.
  schedule:
    - cron: "0 8 * * *"
  # Pull requests reach this through gates.yml, which asks the impact map which
  # width the diff needs instead of filtering on paths. A `paths:` filter here
  # only ever named the harness, so an ordinary relay, hang, or player change ran
  # no matrix at all and the regression surfaced the next night, on `main`.
  workflow_call:
    inputs:
      matrix:
        description: >-
          `full` for every publisher against every subscriber, or `core` for the
          representative rust/browser/C set. Empty on schedule, meaning full.
        type: string
        default: full

concurrency:
  # Keyed by width as well as ref: gates.yml picks one of the two, but a run of
  # each must not cancel the other if both are ever selected.
  group: smoke-${{ inputs.matrix || 'full' }}-${{ github.ref }}
  cancel-in-progress: true

# No id-token: nothing here authenticates over OIDC, and a called workflow cannot
# ask for more than its caller grants, so an unused write would force gates.yml to
# hand every lane the same.
permissions:
  contents: read

jobs:
  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    # The matrix runs in real time (ffmpeg -re pacing + per-subscriber timeouts);
    # this is a safety net against a hung relay/client plus a cold first build.
    timeout-minutes: 60

    env:
      # Out of target/, so the Rust cache does not carry bundles between runs,
      # and at a fixed path so the upload below does not have to guess. Each
      # harness deletes its own bundle when it passes, so whatever survives to
      # the upload step is exactly the failures. See test/README.md.
      MOQ_QA_ARTIFACTS: ${{ github.workspace }}/qa-artifacts

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false
          # Trust the flake's cachix substituter. `nixConfig` in flake.nix is
          # untrusted by default, so nix logs "ignoring untrusted flake
          # configuration setting 'extra-substituters'" and rebuilds from
          # source anything missing from the public nixpkgs cache. That was
          # costing 678s per job for uniffi-bindgen-go alone, in every job that
          # enters the dev shell.
          extra-conf: |
            extra-substituters = https://kixelated.cachix.org
            extra-trusted-public-keys = kixelated.cachix.org-1:CmFcV0lyM6KuVM2m9mih0q4SrAa0XyCsiM7GHrz3KKk=

      # Restore only, from the x64 entry cache.yml warms on `main`. This used to
      # save its own, which was affordable while the only pull requests reaching
      # here were the ones editing the harness. Selected by the impact map it is
      # on a large share of them, and a per-PR entry is readable only by that PR
      # while still counting against the repository's 10 GB budget, evicting the
      # shared entries everyone else restores.
      - name: Rust cache
        uses: ./.github/actions/rust-cache

      # Playwright's Chromium isn't in the nix devShell. Install it plus its apt
      # runtime libs (`--with-deps` needs the host package manager) so the
      # browser client can launch headless Chromium. smoke.sh's own
      # `playwright install` then no-ops.
      - name: Playwright Chromium
        run: nix develop --command bash -c "bun install --frozen-lockfile && bunx playwright install --with-deps chromium"
        shell: bash -leo pipefail {0}

      - name: Smoke
        env:
          MOQ_QA_MATRIX: ${{ inputs.matrix || 'full' }}
        run: |
          case "$MOQ_QA_MATRIX" in
            core|full) ;;
            *) echo "error: unsupported smoke matrix: $MOQ_QA_MATRIX" >&2; exit 2 ;;
          esac
          nix develop --command just test "smoke-$MOQ_QA_MATRIX"
        shell: bash -leo pipefail {0}

      # Proves the harness can still report a failure at all, which every cell
      # passing does not. Only on the full matrix: the core set is the same
      # orchestrator at three fewer subscribers, so a second negative run of it
      # would re-prove the same thing on the pull requests paying for it.
      - name: Negative control
        if: inputs.matrix != 'core'
        run: nix develop --command just test smoke-negative
        shell: bash -leo pipefail {0}

      # Browser-to-browser media QA: presented frame progress, audible tone, audio/video skew, and
      # the publication lifecycle, plus the negative controls that prove each assertion can fail.
      - name: Media output and lifecycle
        run: nix develop --command just test smoke-media
        shell: bash -leo pipefail {0}
      # A failed matrix has to explain itself without a rerun.
      # `just test fetch <run id>` pulls this down.
      - name: Debug bundles
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qa-bundle-smoke-${{ inputs.matrix || 'full' }}
          # Match finalized harness directories, never .incomplete or .live.
          path: qa-artifacts/smoke-*/
          if-no-files-found: ignore
          retention-days: 14
