name: C++

# Builds and tests the moq C++ package (cpp/moq) with clang and MSVC, outside
# Nix. `just check` already runs `just cpp check` with the dev shell's gcc; the
# dev shell has no clang++, and adding one would change which compiler every
# other recipe gets as `cc`.
#
# Outside Nix the generator comes from `cargo install` at the tag flake.nix
# pins; see the comment there for every other place that names it.

permissions:
  contents: read

on:
  pull_request:
    # `closed` is here only so merging/closing a PR cancels its in-flight run
    # via the concurrency group below; the job itself is skipped on close.
    types: [opened, synchronize, reopened, closed]
    paths:
      - "cpp/moq/**"
      - "cpp/justfile"
      - "rs/moq-ffi/**"
      - "sh/cpp/**"
      - "rs/moq-c/native-libs/**"
      - "doc/lib/cpp/**"
      - "doc/lib/samples.sh"
      - "Cargo.lock"
      - ".github/workflows/cpp.yml"

concurrency:
  group: cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang:
    name: C++ (clang)
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: ./.github/actions/just

      - name: Install uniffi-bindgen-cpp
        run: cargo install uniffi-bindgen-cpp --locked --git https://github.com/kixelated/uniffi-bindgen-cpp --tag v0.11.0-kixelated.4+v0.32.2

      - name: Check
        run: just cpp check
        env:
          CXX: clang++

  # MSVC, with exceptions and RTTI off, plus the package's tests.
  msvc:
    name: C++ (MSVC)
    if: github.event.action != 'closed'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # aws-lc-rs assembles its x86_64 crypto with NASM on Windows.
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: ./.github/actions/just

      - name: Install uniffi-bindgen-cpp
        shell: bash
        run: cargo install uniffi-bindgen-cpp --locked --git https://github.com/kixelated/uniffi-bindgen-cpp --tag v0.11.0-kixelated.4+v0.32.2

      - name: Check
        shell: bash
        run: just cpp check
