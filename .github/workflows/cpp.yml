name: C++

# Builds and tests the moq C++ package (cpp/moq) with clang, outside
# Nix. platform.yml covers MSVC. `just check` already runs `just cpp check` with the dev shell's gcc; the
# dev shell has no clang++, and adding one would change which compiler every
# other recipe gets as `cc`.
#
# Outside Nix the generator comes from `cargo install` at the tag flake.nix
# pins; see the comment there for every other place that names it.

permissions:
  contents: read

on:
  workflow_call:

concurrency:
  group: cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang:
    name: C++ (clang)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: ./.github/actions/just

      - name: Install uniffi-bindgen-cpp
        run: cargo install uniffi-bindgen-cpp --locked --git https://github.com/kixelated/uniffi-bindgen-cpp --tag v0.11.0-kixelated.6+v0.32.2

      - name: Check
        run: just cpp check
        env:
          CXX: clang++
