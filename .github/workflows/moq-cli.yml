name: moq-cli

on:
  push:
    tags:
      - "moq-cli-v*"
  # Dry-run: build everything, publish nothing. Nightly calls every release
  # workflow this way so a broken build surfaces before the tag is cut.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: moq-cli-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/release-binary.yml
    with:
      crate: moq-cli
      bin: moq
      # armv7 serves boards running a 32-bit OS, whose SoC codecs v4l2 reaches.
      linux-targets: '["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "armv7-unknown-linux-gnueabihf"]'
      linux-features: v4l2
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
