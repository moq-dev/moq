name: Release Swift Lib

# Publishes the ergonomic `Moq` Swift wrapper to the moq-dev/moq-swift mirror.
# This is the package most callers install; the raw `MoqFFI` bindings it depends
# on are built separately (release-swift-ffi.yml).
#
# Versioned independently of the moq-ffi crate: bump `swift/VERSION` by hand in a
# normal PR. On merge to `release` this reads that version and publishes only if
# it isn't already tagged on the mirror. That tag check is the release gate (the
# same model release-plz uses for crates), so there's no separate tag to
# remember. When wrapper and FFI changes land together, publication waits for
# the Swift FFI publisher in Release FFI and resumes once it succeeds, so the
# required generated API already exists on the mirror.

on:
  push:
    branches:
      - release
    paths:
      - "swift/VERSION"
      - "swift/Package.swift.template"
      - "swift/Sources/Moq/**"
      - "swift/Tests/**"
      - "sh/swift/package.sh"
      - "sh/swift/publish.sh"
      - "sh/swift/verify.sh"
      - ".github/workflows/release-swift-lib.yml"
      - "sh/gh/release.sh"
  workflow_call:
  workflow_dispatch:
  workflow_run:
    workflows: ["Release FFI", "Release Swift FFI"]
    types:
      - completed

permissions:
  contents: read

# Separate PR builds from publishes so a PR run can't queue ahead of (and
# delay) a release.
concurrency:
  group: release-swift-lib-${{ (github.event_name == 'push' || github.event_name == 'workflow_run') && 'publish' || github.ref }}
  cancel-in-progress: false

jobs:
  ffi-release:
    name: Check FFI publisher
    runs-on: ubuntu-latest
    # workflow_run is privileged. Preserve the owner, same-repo, push and tag
    # gates before reading the trusted upstream checkout or allowing wrapper
    # publication.
    if: >-
      github.repository_owner == 'moq-dev' &&
      (github.event_name != 'workflow_run' ||
       ((github.event.workflow_run.name == 'Release FFI' || github.event.workflow_run.conclusion == 'success') &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        startsWith(github.event.workflow_run.head_branch, 'moq-ffi-v')))
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.publisher.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # head_branch names a branch as readily as a tag, and anyone who can push
      # may name a branch and a workflow after a release. Only a tag the
      # `release tags` ruleset protects, at the run's commit, is a release.
      - name: Require a release tag at the run's commit
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)
          if [[ "$commit" != "$SHA" ]]; then
            echo "::error::$TAG is not a release tag at $SHA"
            exit 1
          fi
      - uses: ./.github/actions/just
      - name: Check independent publisher
        id: publisher
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
        run: just gh ffi completed swift

  build:
    name: Build wrapper package
    needs: [ffi-release]
    if: needs.ffi-release.outputs.ready == 'true'
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      ffi_version: ${{ steps.version.outputs.ffi_version }}
      ffi_unreleased: ${{ steps.ffi-diff.outputs.unreleased }}
      # Release PRs and nightly only build. On `release` we publish when the
      # version is not already tagged on the mirror.
      publish: ${{ (github.event_name == 'push' || github.event_name == 'workflow_run') && steps.ffi-diff.outputs.unreleased != 'true' && steps.ffi-gate.outputs.exists == 'true' && steps.gate.outputs.exists == 'false' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Read versions
        id: version
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          VERSION=$(tr -d '[:space:]' < swift/VERSION)
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            FFI_VERSION="${HEAD_BRANCH#moq-ffi-v}"
          else
            FFI_VERSION=$(grep '^version' rs/moq-ffi/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ffi_version=$FFI_VERSION" >> "$GITHUB_OUTPUT"
          echo "wrapper $VERSION, moq-ffi pin $FFI_VERSION"

      # workflow_run verifies the Swift FFI publisher, so its tag is published.
      # Dry-runs show whether merging would publish.
      - name: Check for unreleased FFI changes
        id: ffi-diff
        if: github.event_name != 'workflow_run'
        env:
          FFI_VERSION: ${{ steps.version.outputs.ffi_version }}
        run: just gh release ffi-unreleased "$FFI_VERSION"

      - name: Check FFI mirror tag
        id: ffi-gate
        env:
          FFI_VERSION: ${{ steps.version.outputs.ffi_version }}
        run: just gh release git-tag-exists moq-dev/moq-swift-ffi "$FFI_VERSION"

      - name: Unpublished FFI notice
        if: steps.ffi-diff.outputs.unreleased != 'true' && steps.ffi-gate.outputs.exists != 'true' && (github.event_name == 'push' || github.event_name == 'workflow_run')
        env:
          FFI_VERSION: ${{ steps.version.outputs.ffi_version }}
        run: echo "::warning::moq-swift-ffi ${FFI_VERSION} is not published; deferring to the FFI release chain."

      # The release gate: skip publishing a version already tagged on the mirror.
      # Runs on dry-runs too, as an informational dry-run.
      - name: Check mirror tag
        id: gate
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: just gh release git-tag-exists moq-dev/moq-swift "$VERSION"

      - name: Package
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: just swift package --version "$BUILD_VERSION" --output release-out

      - name: Upload Swift package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: swift-wrapper-package
          path: release-out/*

  verify:
    # Build a throwaway SPM consumer against the staged wrapper, which pulls the
    # published moq-swift-ffi transitively. Proves the moq-ffi pin resolves
    # against a real release before the wrapper reaches the mirror. Skipped (not
    # failed) when the pinned moq-ffi version isn't mirrored yet, so the first
    # bootstrap doesn't deadlock on a not-yet-published FFI package.
    name: Verify staged package resolves
    # Directly on ffi-release: its gate is what makes the head_sha checkout trusted.
    needs: [ffi-release, build]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Check FFI mirror tag
        id: ffi
        if: needs.build.outputs.publish == 'true' || (github.event_name != 'push' && github.event_name != 'workflow_run' && needs.build.outputs.ffi_unreleased != 'true')
        env:
          FFI_VERSION: ${{ needs.build.outputs.ffi_version }}
        # Treat a missing mirror repo / unreachable remote as "not published"
        # rather than a hard failure, so the first bootstrap (before
        # moq-swift-ffi exists) skips the cross-package resolve instead of
        # failing the job. publish.sh stays idempotent regardless.
        run: just gh release git-tag-exists moq-dev/moq-swift-ffi "$FFI_VERSION" || echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Download staged package
        if: steps.ffi.outputs.exists == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: swift-wrapper-package
          path: artifacts

      - name: Resolve and build smoke consumer
        if: steps.ffi.outputs.exists == 'true'
        env:
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: just swift verify --tarball "artifacts/moq-${BUILD_VERSION}-swift.tar.gz"

      - name: Skip notice
        if: needs.build.outputs.ffi_unreleased == 'true'
        run: echo "::notice::moq-ffi has unreleased changes; skipping the published-package cross-resolve and deferring wrapper publication to the FFI release chain."

      - name: Unpublished FFI notice
        if: (needs.build.outputs.publish == 'true' || (github.event_name != 'push' && github.event_name != 'workflow_run')) && needs.build.outputs.ffi_unreleased != 'true' && steps.ffi.outputs.exists != 'true'
        env:
          FFI_VERSION: ${{ needs.build.outputs.ffi_version }}
        run: echo "::notice::moq-swift-ffi ${FFI_VERSION} not published yet; skipping cross-package resolve."

  publish:
    name: Publish to Swift Package mirror
    # Directly on ffi-release: its gate is what makes the head_sha checkout trusted.
    needs: [ffi-release, build, verify]
    runs-on: ubuntu-latest
    if: ${{ needs.build.outputs.publish == 'true' }}
    # The moq-bot key lives in the `publish` Environment, which only protected
    # refs can deploy to: `release`, and `main` for workflow_run.
    environment: publish

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Generate moq-bot token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: token
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: moq-dev
          repositories: moq-swift
          # Narrow the minted token to only what publish.sh needs.
          permission-contents: write

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: swift-wrapper-package
          path: swift-out

      - name: Publish to moq-dev/moq-swift mirror
        env:
          BUILD_VERSION: ${{ needs.build.outputs.version }}
          # Token is minted fresh per run, expires in 1 hour, never at rest.
          SWIFT_MIRROR_TOKEN: ${{ steps.token.outputs.token }}
          GIT_AUTHOR_NAME: moq-bot
          GIT_AUTHOR_EMAIL: moq-bot[bot]@users.noreply.github.com
        run: just swift publish

  publish-dry-run:
    name: Publish dry-run
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name != 'push' && github.event_name != 'workflow_run'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/just

      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: swift-wrapper-package
          path: swift-out

      - name: Dry-run publish to mirror
        env:
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: just swift publish --dry-run
