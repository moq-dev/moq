name: Release Py

# Publishes the pure-python `moq-rs` wrapper wheel (import name `moq`) to PyPI.
# This is the package most callers install; the raw `moq-ffi` bindings it
# depends on are built separately (release-py-ffi.yml).
#
# Versioned independently of the moq-ffi crate: bump `version` in
# py/moq-rs/pyproject.toml by hand in a normal PR. On merge to main this reads
# that version and publishes only if it isn't already on PyPI. That registry
# check is the release gate (the same model release-plz uses for crates), so
# there's no separate tag to remember. When wrapper and FFI changes land
# together, publication waits for Release Py FFI and resumes from its successful
# workflow run so the required generated API already exists on PyPI.

on:
  push:
    branches:
      - main
    paths:
      - "py/moq-rs/**"
      - ".github/workflows/release-py.yml"
      - ".github/scripts/release.sh"
  workflow_run:
    workflows: ["Release Py FFI"]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: release-py
  cancel-in-progress: false

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    # workflow_run has the base repository's privileges, so accept only a
    # successful upstream tag-push run from the expected release workflow.
    if: >-
      github.repository_owner == 'moq-dev' &&
      (github.event_name == 'push' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'moq-ffi-v')))
    outputs:
      version: ${{ steps.version.outputs.version }}
      # Publish only when the version isn't already on PyPI.
      publish: ${{ steps.pypi.outputs.exists == 'false' && (github.event_name == 'workflow_run' || (steps.ffi-gate.outputs.unreleased != 'true' && steps.ffi-pypi.outputs.exists == 'true')) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read version
        id: version
        run: .github/scripts/release.sh read-version py/moq-rs/pyproject.toml

      - name: Resolve FFI version
        id: ffi
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            VERSION="${HEAD_BRANCH#moq-ffi-v}"
          else
            VERSION=$(grep '^version' rs/moq-ffi/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Gate on published FFI
        id: ffi-gate
        env:
          FFI_VERSION: ${{ steps.ffi.outputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            echo "Release Py FFI completed for v${FFI_VERSION}; proceeding."
            echo "unreleased=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="moq-ffi-v${FFI_VERSION}"
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}" >/dev/null; then
            echo "::warning::missing local tag ${TAG}; deferring to the Release Py FFI chain."
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --quiet "$TAG" HEAD -- rs/moq-ffi; then
            echo "::warning::moq-ffi has unreleased changes; deferring to the Release Py FFI chain."
            echo "unreleased=true" >> "$GITHUB_OUTPUT"
          else
            echo "unreleased=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check FFI on PyPI
        id: ffi-pypi
        if: github.event_name == 'push' && steps.ffi-gate.outputs.unreleased != 'true'
        env:
          FFI_VERSION: ${{ steps.ffi.outputs.version }}
        run: .github/scripts/release.sh pypi-exists moq-ffi "$FFI_VERSION"

      - name: Unpublished FFI notice
        if: github.event_name == 'push' && steps.ffi-gate.outputs.unreleased != 'true' && steps.ffi-pypi.outputs.exists != 'true'
        env:
          FFI_VERSION: ${{ steps.ffi.outputs.version }}
        run: echo "::warning::moq-ffi ${FFI_VERSION} is not on PyPI; deferring to the Release Py FFI chain."

      # The release gate: skip publishing a version that's already on PyPI
      # (re-uploads are rejected anyway, but this keeps the run green and makes
      # the no-op explicit).
      - name: Check PyPI
        id: pypi
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/release.sh pypi-exists moq-rs "$VERSION"

      - uses: DeterminateSystems/nix-installer-action@1d87d45818068401a10cf16bdc5f00b24994a83f # main
        with:
          determinate: false

      - name: Build
        run: nix develop --command just py package

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-wrapper
          path: py/dist/*

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    if: ${{ needs.build.outputs.publish == 'true' }}
    environment:
      name: pypi
      url: https://pypi.org/p/moq-rs
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-wrapper
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
