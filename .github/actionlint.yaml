paths:
  # GitHub's `queue: max` on the shared Pages writers. actionlint learns it in
  # https://github.com/rhysd/actionlint/pull/661, unreleased after 1.7.12.
  .github/workflows/{interop,nightly,smoke}.yml:
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
  .github/workflows/check.yml:
    ignore:
      # Delivered to Actions but missing from its event docs: https://github.com/rhysd/actionlint/issues/726
      - 'invalid activity type "destroyed" for "merge_group" Webhook event'
