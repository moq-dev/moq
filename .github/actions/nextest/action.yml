name: Install nextest
description: Install the nextest version shared with the OSS Scanner image.

runs:
  using: composite
  steps:
    - name: Read nextest version
      id: version
      shell: bash
      run: |
        version=$(cat "$GITHUB_ACTION_PATH/VERSION")
        : "${version:?nextest version is empty}"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
      with:
        tool: nextest@${{ steps.version.outputs.version }}
