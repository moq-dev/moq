name: Install NASM
description: Install the pinned NASM on a Windows runner, where aws-lc-rs assembles its x86_64 crypto with it.

runs:
  using: composite
  steps:
    # The Chocolatey package version, not NASM's own (3.2.0 installs NASM 3.02).
    # GITHUB_PATH gets a constant directory, nothing an event can steer.
    - name: Install NASM
      shell: pwsh
      run: | # zizmor: ignore[github-env]
        choco install nasm --version=3.2.0 -y --no-progress
        "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
