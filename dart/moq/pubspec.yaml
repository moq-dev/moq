name: moq
description: Idiomatic Dart and Flutter client for Media over QUIC.
version: 0.1.0
repository: https://github.com/moq-dev/moq/tree/main/dart/moq
issue_tracker: https://github.com/moq-dev/moq/issues
topics:
  - moq
  - quic
  - media
  - streaming

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  # The published floor, bumped by hand when moq starts relying on newer
  # bindings. In this checkout the override wins and pub ignores the
  # constraint, so the path package's 0.0.0-dev sentinel resolves fine.
  moq_ffi: ^0.3.14

dependency_overrides:
  moq_ffi:
    path: ../moq_ffi

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
