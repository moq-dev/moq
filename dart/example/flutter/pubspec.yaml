name: moq_flutter_example
description: Flutter example for the moq package.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  moq:
    path: ../../moq

dependency_overrides:
  moq_ffi:
    path: ../../moq_ffi

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
