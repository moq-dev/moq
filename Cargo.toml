[workspace]
members = [
    "rs/hang",
    "rs/kio",
    "rs/libmoq",
    "rs/moq-audio",
    "rs/moq-bench",
    "rs/moq-boy",
    "rs/moq-cli",
    "rs/moq-ffi",
    "rs/moq-flate",
    "rs/moq-gst",
    "rs/moq-hls",
    "rs/moq-json",
    "rs/moq-loc",
    "rs/moq-msf",
    "rs/moq-mux",
    "rs/moq-native",
    "rs/moq-net",
    "rs/moq-nvenc",
    "rs/moq-relay",
    "rs/moq-rtc",
    "rs/moq-rtmp",
    "rs/moq-srt",
    "rs/moq-stats",
    "rs/moq-token",
    "rs/moq-token-cli",
    "rs/moq-tokio",
    "rs/moq-transcode",
    "rs/moq-video",
    "rs/moq-wasm",
]
default-members = [
    "rs/kio",
    "rs/hang",
    # "rs/libmoq",    # requires C toolchain
    "rs/moq-boy",
    "rs/moq-audio",
    "rs/moq-bench",
    "rs/moq-cli",
    # "rs/moq-ffi",   # requires Python/maturin
    # "rs/moq-gst",   # requires GStreamer
    "rs/moq-flate",
    "rs/moq-hls",
    "rs/moq-json",
    "rs/moq-loc",
    "rs/moq-msf",
    "rs/moq-net",
    "rs/moq-mux",
    "rs/moq-native",
    "rs/moq-nvenc",
    "rs/moq-relay",
    "rs/moq-rtc",
    "rs/moq-rtmp",
    "rs/moq-srt",
    "rs/moq-stats",
    "rs/moq-token",
    "rs/moq-token-cli",
    "rs/moq-tokio",
    "rs/moq-transcode",
    "rs/moq-video",
    # "rs/moq-wasm",  # wasm32-unknown-unknown target only
]
resolver = "2"

[workspace.package]
# Floor for the library surface: iroh 1.0 (via moq-tokio) needs 1.91. This is
# what consumers of moq-net / hang / moq-tokio / etc. see. moq-relay overrides
# it to 1.95 (sysinfo 0.39). moq-relay is lib+bin, so 1.95 does apply to its
# own library target, but that crate is an application with no external
# consumers; the point of the override is to keep the bump off the libraries
# others actually build on. The nix flake / rust-toolchain.toml pin the build
# toolchain to 1.95 (so the whole workspace including the relay compiles) rather
# than latest stable, which keeps the relay's ceiling from creeping up unnoticed.
rust-version = "1.91"

[workspace.dependencies]
criterion = "0.8"
flate2 = "1.1"
getrandom = { version = "0.4", features = ["wasm_js"] }
hang = { version = "0.20", path = "rs/hang" }
# HMAC-SHA256 for the mDNS membership proofs (moq-tokio's `mdns` feature).
hmac = "0.13"
kio = { version = "0.5", path = "rs/kio" }
libc = "0.2"
linux-raw-sys = { version = "0.12.1", features = ["ioctl"] }
# Permutation testing for the kio primitives (and everything built on them).
# Only compiled under `--cfg loom`; see `just rs loom`.
loom = { version = "0.7.2", features = ["futures"] }
# DNS-SD advertisement and browsing for LAN peer discovery (moq-tokio's `mdns` feature).
# `async` awaits the event channel instead of blocking a thread on it.
mdns-sd = { version = "0.20", features = ["async"] }
moq-audio = { version = "0.0.17", path = "rs/moq-audio" }
moq-flate = { version = "0.1.1", path = "rs/moq-flate" }
moq-hls = { version = "0.4.8", path = "rs/moq-hls", default-features = false }
moq-json = { version = "0.3.3", path = "rs/moq-json" }
moq-loc = { version = "0.2", path = "rs/moq-loc" }
moq-msf = { version = "0.4", path = "rs/moq-msf" }
moq-mux = { version = "0.9", path = "rs/moq-mux" }
moq-net = { version = "0.2", path = "rs/moq-net" }
# NVENC bindings, forked from ViliamVadocz/nvidia-video-codec-sdk to dlopen the
# driver at runtime. Compiles on any platform (macOS included) but only actually
# used by moq-video on Linux.
moq-nvenc = { version = "0.0.3", path = "rs/moq-nvenc" }
moq-rtc = { version = "0.2.4", path = "rs/moq-rtc" }
moq-rtmp = { version = "0.2.4", path = "rs/moq-rtmp" }
moq-srt = { version = "0.2.3", path = "rs/moq-srt" }
moq-stats = { version = "0.1.4", path = "rs/moq-stats" }
moq-token = { version = "0.7", path = "rs/moq-token" }
moq-token-cli = { version = "0.5", path = "rs/moq-token-cli" }
moq-tokio = { version = "0.19", path = "rs/moq-tokio", default-features = false }
# default-features off (the NVIDIA hardware codecs) on moq-transcode and
# moq-video so each consumer opts in. Binaries enable them, but a self-compiler
# can leave them off to drop the CUDA dependencies. Both crates still default
# them on when depended on directly. VAAPI is opt-in everywhere, since that
# backend has never been validated on real hardware.
moq-transcode = { version = "0.0.11", path = "rs/moq-transcode", default-features = false }
# Standalone crate (moq-dev/vaapi); vendored from cros-libva + cros-codecs.
# dlopen's libva at runtime (no libva-dev at build, no NEEDED libva in the binary).
moq-vaapi = "0.0.3"
# `default-features = false` is also what keeps `capture` (V4L2, libclang) out of
# moq-ffi, and through it the cross-compiled Python, Swift, Kotlin, and Go
# builds, which want the codecs and not the device stack. Adding
# `features = ["capture"]` to a consumer that ships in those bindings pulls the
# whole device graph into every one of them.
moq-video = { version = "0.0.17", path = "rs/moq-video", default-features = false }
percent-encoding = "2"
qmux = { version = "0.5.0", default-features = false }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
subtle = "2.6"
tempfile = "3"
tokio = "1.48"
web-async = { version = "0.1.5", features = ["tracing"] }
web-transport-iroh = "0.7"
# default-features off so the QUIC crypto provider is chosen by moq-tokio's
# aws-lc-rs / ring features (mirroring how the quinn dependency is wired).
# 0.3 for the `qlog` passthrough feature moq-tokio's `qlog` forwards to.
web-transport-noq = { version = "0.3", default-features = false }
web-transport-proto = "0.6"
web-transport-quiche = "0.6"
web-transport-quinn = "0.12"
web-transport-trait = "0.4"
web-transport-wasm = "0.6"

[profile.dev]
panic = "abort"
# Full DWARF is what makes a debug build enormous: the debug `libmoq_ffi.a`
# measured 619 MiB against a 100 MiB ceiling for the published one, and a
# workspace of those fills a laptop (and a CI runner) fast. Line tables keep
# what we actually read -- file and line in every backtrace and panic -- and
# drop the variable and type records only an interactive debugger uses. Reach
# for `debug = true` in a temporary edit if you need to step through something
# in lldb. `profile.test` inherits this.
debug = "line-tables-only"

# Optimize the bignum crates even in dev/test builds. RSA keygen is bignum
# arithmetic in a loop, and unoptimized it is orders of magnitude slower: the
# moq-token key tests spend ~16s generating 2048-bit keys, versus well under a
# second here. These are dependencies we never step through in a debugger, so
# optimizing them costs nothing an unoptimized build was buying us, and the
# tests keep exercising production key sizes rather than being weakened to
# stay fast. `profile.test` inherits these overrides.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.release]
panic = "abort"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
# frame pointers: pass RUSTFLAGS="-C force-frame-pointers=yes" when building

[profile.release-with-debug]
inherits = "release"
debug = true

# Size-optimized build for the browser/WASM bindings (rs/moq-wasm). Shipping over
# the wire, so optimize for size, not speed (~579KB -> ~471KB gzipped vs the
# default release profile). `just wasm` builds with `--profile wasm-release`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

# External crates (web-transport-iroh) depend on the published kio, which
# otherwise coexists with the workspace copy at the same version and makes
# `--package kio` ambiguous the moment the crate changes. Point everyone at the
# workspace copy so exactly one kio is built.
[patch.crates-io]
kio = { path = "rs/kio" }
