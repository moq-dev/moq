[workspace]
members = [
    "rs/hang",
    "rs/kio",
    "rs/libmoq",
    "rs/moq-archive",
    "rs/moq-audio",
    "rs/moq-auth",
    "rs/moq-bench",
    "rs/moq-binary",
    "rs/moq-boy",
    "rs/moq-cli",
    "rs/moq-e2ee",
    "rs/moq-ffi",
    "rs/moq-flate",
    "rs/moq-gst",
    "rs/moq-hls",
    "rs/moq-json",
    "rs/moq-loc",
    "rs/moq-msf",
    "rs/moq-mux",
    "rs/moq-native",
    "rs/moq-net",
    "rs/moq-net/fuzz",
    "rs/moq-nvenc",
    "rs/moq-pattern",
    "rs/moq-relay",
    "rs/moq-room",
    "rs/moq-rtc",
    "rs/moq-rtmp",
    "rs/moq-shaper",
    "rs/moq-sock",
    "rs/moq-srt",
    "rs/moq-stats",
    "rs/moq-tokio",
    "rs/moq-transcode",
    "rs/moq-uring",
    "rs/moq-v4l",
    "rs/moq-video",
    "rs/moq-wasm",
    "rs/quest",
    "rs/uniffi-bindgen",
]
default-members = [
    "rs/kio",
    "rs/hang",
    # "rs/libmoq",    # requires C toolchain
    "rs/moq-archive",
    "rs/moq-auth",
    "rs/moq-boy",
    "rs/moq-audio",
    "rs/moq-bench",
    "rs/moq-binary",
    "rs/moq-cli",
    "rs/moq-e2ee",
    # "rs/moq-ffi",   # requires Python/maturin
    # "rs/moq-gst",   # requires GStreamer
    "rs/moq-flate",
    "rs/moq-hls",
    "rs/moq-json",
    "rs/moq-loc",
    "rs/moq-msf",
    "rs/moq-net",
    "rs/moq-mux",
    "rs/moq-native",
    "rs/moq-nvenc",
    "rs/moq-pattern",
    "rs/moq-relay",
    "rs/moq-room",
    "rs/moq-rtc",
    "rs/moq-rtmp",
    "rs/moq-shaper",
    "rs/moq-sock",
    "rs/moq-srt",
    "rs/moq-stats",
    "rs/moq-tokio",
    "rs/moq-transcode",
    "rs/moq-uring",
    "rs/moq-v4l",
    "rs/moq-video",
    # "rs/moq-wasm",  # wasm32-unknown-unknown target only
    "rs/quest",
    # Maturin runs the workspace's `uniffi-bindgen` binary from the root to
    # generate the Python wheel, and that only searches default members. A
    # `cargo build -p moq-ffi` still never compiles it.
    "rs/uniffi-bindgen",
]
resolver = "2"

[workspace.metadata.cargo-shear]
# Feature-only dependency selecting the wasm_js backend for browser consumers.
ignored = ["getrandom"]

[workspace.package]
# Floor for the library surface: iroh 1.0 (via moq-tokio) needs 1.91. This is
# what consumers of moq-net / hang / moq-tokio / etc. see. moq-relay overrides
# it to 1.95 (sysinfo 0.39), and moq-cli does too because it depends on that
# library. Those crates are applications; the point of the per-crate override
# is to keep the bump off the libraries others actually build on. The nix flake
# / rust-toolchain.toml pin the build toolchain to a fixed version rather than
# latest stable, which keeps the relay's ceiling from creeping up unnoticed.
# That pin sits above every MSRV here; rust-toolchain.toml says why.
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1"
ash = "0.38"
aws-lc-rs = "1"
axum = { version = "0.8", features = ["tokio"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.23"
bitflags = "2"
block2 = "0.6.2"
bytes = "1"
clap = { version = "4", features = ["derive"] }
criterion = "0.8"
# CUDA driver bindings for the NVENC/NVDEC path. dlopen'd at runtime
# (`fallback-dynamic-loading`), so nothing links against libcuda at build time.
cudarc = { version = "0.19", default-features = false, features = ["driver", "fallback-dynamic-loading", "cuda-12020"] }
dispatch2 = "0.3.1"
flate2 = { version = "1.1", default-features = false }
futures = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
hang = { version = "0.21.3", path = "rs/hang" }
hex = "0.4"
# HMAC-SHA256 for the mDNS membership proofs (moq-tokio's `mdns` feature).
hmac = "0.13"
humantime = "2.3"
io-uring = "0.7.14"
jsonwebtoken = "11"
kio = { version = "0.6.0", path = "rs/kio" }
lazy_static = "1.5"
libc = "0.2"
libloading = "0.9"
linux-raw-sys = { version = "0.12.1", features = ["ioctl"] }
# Permutation testing for the kio primitives (and everything built on them).
# Only compiled under `--cfg loom`; see `just rs loom`.
loom = { version = "0.7.2", features = ["futures"] }
# DNS-SD advertisement and browsing for LAN peer discovery (moq-tokio's `mdns` feature).
# `async` awaits the event channel instead of blocking a thread on it.
mdns-sd = { version = "0.21", features = ["async"] }
moq-archive = { version = "0.0.3", path = "rs/moq-archive" }
moq-audio = { version = "0.1.2", path = "rs/moq-audio", default-features = false }
moq-auth = { version = "0.1.1", path = "rs/moq-auth" }
moq-binary = { version = "0.1.2", path = "rs/moq-binary" }
moq-flate = { version = "0.2.0", path = "rs/moq-flate" }
moq-hls = { version = "0.5.3", path = "rs/moq-hls", default-features = false }
moq-json = { version = "0.5.0", path = "rs/moq-json" }
moq-loc = { version = "0.2.11", path = "rs/moq-loc" }
moq-msf = { version = "0.5.0", path = "rs/moq-msf" }
moq-mux = { version = "0.10.3", path = "rs/moq-mux" }
moq-net = { version = "0.3.2", path = "rs/moq-net" }
# The MoQ fork of noq (moq-dev/noq). iroh keeps upstream noq, so a build with the
# iroh feature carries both stacks.
moq-noq-proto = { version = "1.3", default-features = false }
moq-noq-udp = "1.3"
# NVENC bindings, forked from ViliamVadocz/nvidia-video-codec-sdk to dlopen the
# driver at runtime. Compiles on any platform (macOS included) but only actually
# used by moq-video on Linux.
moq-nvenc = { version = "0.1.0", path = "rs/moq-nvenc" }
moq-pattern = { version = "0.1.0", path = "rs/moq-pattern" }
moq-relay = { version = "0.15.3", path = "rs/moq-relay", default-features = false }
moq-rtc = { version = "0.3.3", path = "rs/moq-rtc" }
moq-rtmp = { version = "0.3.3", path = "rs/moq-rtmp" }
moq-sock = { version = "0.1.0", path = "rs/moq-sock" }
moq-srt = { version = "0.3.3", path = "rs/moq-srt" }
moq-stats = { version = "0.2.3", path = "rs/moq-stats" }
moq-tokio = { version = "0.19.14", path = "rs/moq-tokio", default-features = false }
# Default features off on moq-transcode and moq-video so each workspace consumer
# chooses native codecs, OpenH264, and rendering explicitly. Both crates still
# provide working native plus software defaults when depended on directly.
# VAAPI is opt-in everywhere; its decoder is hardware-validated, while its
# encoder is not yet.
moq-transcode = { version = "0.1.2", path = "rs/moq-transcode", default-features = false }
# default-features off (the noq backend) so the consumer picks which QUIC
# stack the io_uring path compiles; cargo features are additive, so a default-on
# backend could not be opted out of.
moq-uring = { version = "0.0.4", path = "rs/moq-uring", default-features = false }
# In-tree fork of `v4l` with the videodev2.h bindings checked in, so moq-video's
# `capture` and `v4l2` need no libclang or kernel headers. Linux only; an empty
# stub elsewhere.
moq-v4l = { version = "0.1.0", path = "rs/moq-v4l" }
# Standalone crate (moq-dev/vaapi); vendored from cros-libva + cros-codecs.
# dlopen's libva at runtime (no libva-dev at build, no NEEDED libva in the binary).
moq-vaapi = "0.1.0"
# `default-features = false` is here for `capture` (V4L2, libclang), which the
# cross-compiled Python, Swift, Kotlin, and Go builds have no use for: adding
# `features = ["capture"]` to a consumer that ships in those bindings pulls the
# whole device graph into every one of them. Codec features are independent of
# that argument, so moq-ffi and libmoq opt NVIDIA, OpenH264, and VAAPI back in.
moq-video = { version = "0.1.2", path = "rs/moq-video", default-features = false }
nix = { version = "0.31.3", features = ["net", "socket", "uio"] }
# Upstream noq-proto, only for iroh's controller factory types.
noq-proto = { version = "1.2", default-features = false }
num_enum = "0.7"
objc2 = "0.6.4"
objc2-av-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
# Default features off so a consumer that only needs InMemory does not pull the
# local-filesystem stack; `fs` (and cloud backends) are opted in by the caller.
object_store = { version = "0.14", default-features = false }
percent-encoding = "2"
pollster = "1.0"
pulldown-cmark = { version = "0.13", default-features = false }
qmux = { version = "0.5.1", default-features = false }
rand = "0.10.1"
# default-features off so each consumer picks its own TLS backend and body
# features; nothing here wants the default native-tls stack.
reqwest = { version = "0.13", default-features = false }
rustc-hash = "2.1.3"
sd-notify = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
sha2 = "0.11"
slab = "0.4.12"
socket2 = "0.6"
subtle = "2.6"
tempfile = "3"
thiserror = "2"
tokio = "1.48"
tokio-rustls = { version = "0.26", default-features = false }
toml = "1.1"
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-test = "0.2"
# The runtime pin and the bindgen CLI pin must not drift; the `uniffi-bindgen`
# package owns the `cli` feature, moq-ffi the rest.
uniffi = "0.32"
url = "2"
usage = { package = "usage-rs", version = "6.11.1" }
uuid = { version = "1.26", features = ["v7"] }
web-async = { version = "0.1.5", features = ["tracing"] }
web-transport-iroh = "0.7"
# default-features off so the QUIC crypto provider is chosen by moq-tokio's
# aws-lc-rs / ring features.
# The WebTransport adapter released with moq-noq, from the same repository.
web-transport-moq = { version = "1.3", default-features = false }
web-transport-proto = "0.6"
web-transport-trait = "0.4"
web-transport-wasm = "0.6"
x11rb = { version = "0.14.0", features = ["randr", "xfixes"] }
zeroize = { version = "1", features = ["derive"] }

[patch.crates-io]
# web-transport-iroh depends on kio from crates.io. Without
# this, the lock carries a second kio whose pin drifts behind the member, and the
# next publish that reaches both fails to resolve a single version (#3551).
kio = { path = "rs/kio" }

[profile.dev]
panic = "abort"
# Full DWARF is what makes a debug build enormous: the debug `libmoq_ffi.a`
# measured 619 MiB against a 100 MiB ceiling for the published one, and a
# workspace of those fills a laptop (and a CI runner) fast. Line tables keep
# what we actually read -- file and line in every backtrace and panic -- and
# drop the variable and type records only an interactive debugger uses. Reach
# for `debug = true` in a temporary edit if you need to step through something
# in lldb. `profile.test` inherits this.
debug = "line-tables-only"

# Optimize the bignum crates even in dev/test builds. RSA keygen is bignum
# arithmetic in a loop, and unoptimized it is orders of magnitude slower: the
# moq-auth key tests spend ~16s generating 2048-bit keys, versus well under a
# second here. These are dependencies we never step through in a debugger, so
# optimizing them costs nothing an unoptimized build was buying us, and the
# tests keep exercising production key sizes rather than being weakened to
# stay fast. `profile.test` inherits these overrides.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

# Same for the sonora echo canceller. Its hot loops are `core::arch` NEON/SSE
# intrinsics, which at opt-level 0 compile to out-of-line calls carrying the
# debug UB preconditions of `read_unaligned` and `copy_nonoverlapping`: a
# profile of `aec::tests::survives_a_moving_echo_delay` spends 65% of its
# samples in those checks and intrinsic shims and only 20% in sonora's own
# arithmetic. Unoptimized, cancelling 15 seconds of audio costs 12 seconds of
# CPU, which is slower than the realtime callback this runs in and leaves the
# test no headroom under the nextest timeout.
[profile.dev.package.sonora]
opt-level = 3

[profile.dev.package.sonora-aec3]
opt-level = 3

[profile.dev.package.sonora-agc2]
opt-level = 3

[profile.dev.package.sonora-common-audio]
opt-level = 3

[profile.dev.package.sonora-fft]
opt-level = 3

[profile.dev.package.sonora-ns]
opt-level = 3

[profile.dev.package.sonora-simd]
opt-level = 3

[profile.release]
panic = "abort"

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
# frame pointers: pass RUSTFLAGS="-C force-frame-pointers=yes" when building

[profile.release-with-debug]
inherits = "release"
debug = true

# Size-optimized build for the browser/WASM bindings (rs/moq-wasm). Shipping over
# the wire, so optimize for size, not speed (~579KB -> ~471KB gzipped vs the
# default release profile). `just wasm` builds with `--profile wasm-release`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
