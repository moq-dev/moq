# Upgrade in place: `systemctl restart moq-relay` starts the new relay beside
# the old one, which hands over its sockets and drains. Needs `[runtime] workers`
# in relay.toml. Install as /etc/systemd/system/moq-relay.service.d/handoff.conf,
# then run `systemctl daemon-reload`. See https://doc.moq.dev/setup/prod#upgrades.
[Service]
ExecStart=
ExecStart=/usr/bin/moq-relay --handoff-supervise /etc/moq-relay/relay.toml
Environment=MOQ_HANDOFF_SOCKET=/run/moq-relay/handoff.sock
# Only the stand-in main process is signaled: on a restart it exits and leaves
# its relay draining, and on a stop it passes SIGTERM to the relay.
KillMode=process
RestartKillSignal=SIGUSR2
# The handoff socket lives here and must outlive the restart.
RuntimeDirectoryPreserve=restart
