# This file contains settings for `cargo hakari`.
# See https://docs.rs/cargo-hakari/latest/cargo_hakari/config for a full list of options.

hakari-package = "workspace-hack"

# Format version for hakari's output. Version 4 requires cargo-hakari 0.9.22 or above.
dep-format-version = "4"

# Setting workspace.resolver = "2" or higher in the root Cargo.toml is HIGHLY recommended.
# Hakari works much better with the v2 resolver. (The v2 and v3 resolvers are identical from
# hakari's perspective, so you're welcome to set either.)
#
# For more about the new feature resolver, see:
# https://blog.rust-lang.org/2021/03/25/Rust-1.51.0.html#cargos-new-feature-resolver
resolver = "2"

# Add triples corresponding to platforms commonly used by developers here.
# https://doc.rust-lang.org/rustc/platform-support.html
platforms = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

# Write out exact versions rather than a semver range. (Defaults to false.)
# exact-versions = true

[traversal-excludes]
workspace-members = [
    "moq-mux-fuzz",
    "moq-net-fuzz",
    "moq-quic-fuzz",
    "moq-rtmp-fuzz",
    "moq-sock-fuzz",
    "moq-uring-fuzz",
    "qmux-fuzz",
    "moq-auth-fuzz",
]

[final-excludes]
# Keep native media dependencies out of unrelated test builds. Final excludes
# preserve feature unification for their other dependencies.
#
# kio's test-only features (`sim`, `manual`) instrument every poll, so unifying them
# would make every bench measure a kio that no release build ships. Its rev matches
# the workspace's kio dependency; `cargo hakari generate` refuses a stale one.
third-party = [
    { name = "pipewire" },
    { name = "libspa" },
    { name = "clang-sys" },
    { name = "gstreamer" },
    { name = "gstreamer-sys" },
    { name = "kio", git = "https://github.com/kixel-ai/kio", rev = "8013885f8c9f53cfe010c0f50d618f530464776c" },
]
