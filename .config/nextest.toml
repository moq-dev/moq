# Shared nextest settings, picked up by every `cargo nextest` run in the workspace.

[profile.default]
# Kill a test that stops making progress instead of letting it wedge.
#
# The failure mode this bounds: a lost `kio` wakeup parks a task with nothing to
# wake it, which is a hang rather than a failure. Under the plain `cargo test`
# harness that run never ends, holding the target lock and burning a core until
# someone notices and kills it by hand.
#
# `terminate-after` counts periods, so a test is reported SLOW at 30s and killed
# at a minute, failing the run with a TIMEOUT. The slowest honest test in the
# workspace runs in about 9s, so 30s is several times the real ceiling and the
# SLOW label stays worth reading; keep it that way by making a test fast rather
# than by raising this.
slow-timeout = { period = "30s", terminate-after = 2 }

# Retries hide flakes, and this repo treats an intermittent failure as a real
# race until proven otherwise (see Root Cause First in AGENTS.md).
retries = 0

# PR recipes build library, binary, and integration-test targets. Nightly keeps
# the exhaustive target compile, but executes benches through cargo bench smokes.
default-filter = "not kind(bench)"

# Limit ring concurrency within one invocation. Unit-test workers use small
# rings; integration workers keep production geometry. sh/rs/nextest.sh raises
# hosted CI's locked-memory limit and uses the host's hard limit locally.
# Several invocations still share that user-wide budget; see rs/moq-uring/README.md.
[[profile.default.overrides]]
filter = "package(moq-uring) | (binary_id(moq-relay::integration) & (test(/^runtime_uring::/) | test(/^embed::.*uring/)))"
test-group = "io-uring"

# The vivid tests share one capture node, and a second process configuring its
# queue while another streams gets EBUSY.
[[profile.default.overrides]]
filter = "package(moq-video) & test(/^capture::v4l2::tests::vivid::/)"
test-group = "v4l2"

# The binding benchmark runs many `MOQ_BENCH_SECONDS` budgets back to back, so its
# length scales with the budget. It guards each round against a wedge itself.
[[profile.default.overrides]]
filter = "package(moq-ffi) & test(=bench::benchmark_ffi)"
slow-timeout = { period = "60s" }

# The receive-window benchmark sweeps a grid twice, once through a bottleneck
# whose rate bounds how fast a run can go, so it outlasts the hang budget.
[[profile.default.overrides]]
filter = "package(moq-tokio) & test(=receive_credit::benchmark_receive_windows)"
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups]
io-uring = { max-threads = 4 }
v4l2 = { max-threads = 1 }

# CI has noisier neighbours and cold caches, so give a test longer before
# calling it wedged.
[profile.ci]
slow-timeout = { period = "60s", terminate-after = 2 }
retries = 0
# Repeat each failure at the end of the run, so it isn't buried in the log.
failure-output = "immediate-final"
