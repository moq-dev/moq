# `cargo moq <args>` runs the moq-cli binary. Bare `cargo run` can't be pointed
# at it: cargo has no workspace-level `default-run`, and an `[alias] run` is
# ignored because it shadows a built-in. Narrowing `default-members` to moq-cli
# would work, but that list is what scopes `just check` and `cargo semver-checks`.
[alias]
# Strings override enclosing checkouts' aliases; lists concatenate them.
moq = "run --bin moq --"
# `cargo build-ffi` is the one definition of moq-ffi's default build, which every
# binding loads from the shared target directory: `openh264`, as releases ship
# it. Append a profile, `--target`, or `--lib`, never features. A cdylib's file
# name carries no feature hash, so a build with other features replaces
# `libmoq_ffi.so` under everyone reading it; such a build takes a target
# directory of its own (py, `sh/size/collect.sh`, `build.sh --no-default-features`)
# or a `--target` triple no default build uses (dart's `testing` build).
# Aliases resolve from the working directory, so run it inside the checkout.
build-ffi = "build --locked --package moq-ffi --features openh264"
