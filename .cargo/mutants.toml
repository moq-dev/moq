# cargo-mutants: Nightly fails on any mutant of these files the tests miss.
examine_globs = ["rs/moq-net/src/route/**/*.rs", "rs/moq-net/src/model/resume.rs"]
exclude_globs = ["rs/moq-net/src/route/tests/**"]
test_tool = "nextest"
all_features = true
additional_cargo_args = ["--locked"]
# The unit tests, and the integration binary, which drives the route driver
# (`route/node.rs`) through real sessions.
additional_cargo_test_args = ["--lib", "--test", "integration"]

# Mutants no test can catch, because the result is the same either way. Each
# pattern names its function and replacement, not its line. A column pins it
# only where the same function has another such mutant that tests do catch.
exclude_re = [
    # Debug output only feeds logs.
    '<impl (std::)?fmt::Debug for (Node|Stream|Router<N, I, A>)>::fmt',
    # node.rs: the extra `Lost` reaches a key that holds no such claim, which ignores
    # it: a first filing has no other key, and an end already went to the old one.
    'replace && with \|\| in Node::own$',
    # Race-only, as `Fetching::poll_moved` below: taking the lock wakes every waiter
    # whatever the count, which only sends round again a request that read it just
    # before another thread bumped it.
    'replace \+= with \*= in (Stream::serving|State::flush)$',
    # relay.rs: `visit` and `count` only feed the tests' work budgets, which read the
    # count as an upper bound.
    'replace Router<N, I, A>::(visit|count) with \(\)$',
    'replace \+ with (-|\*) in Router<N, I, A>::withdraw$',
    # A pick's key ends in its next hop or its claimant, so no two keys tie.
    'replace < with <= in Router<N, I, A>::(reselect|closest)$',
    # A session closed at a floor already recorded touches routes that stay as they
    # were, and reselecting an unchanged route does nothing.
    'replace > with >= in Router<N, I, A>::closed$',
    # What a claim leaves when dropped is read only for a lost broadcast that did not
    # end, and `restate` already dropped this node's own claim first, with its source,
    # which wins the tie.
    'replace && with \|\| in Router<N, I, A>::publish$',
    # resume.rs: the sweep of handed-out groups only bounds memory, since
    # `let_go` drops dead entries itself before anything reads `out`.
    'replace (== with !=|> with >=) in Reader::hand_out$',
    # Polling a covered copy hands out nothing, so polling it anyway only costs work. An
    # expired copy's groups are past the reader's own budget too: the copy expires a budget
    # after the newer group that makes them stale, and `let_go` arms the same timer.
    ':\d+:13: replace \|\| with && in Reader::poll_lowest$',
    # A run starting at the window's end or the resume point clips to an empty range, which
    # has no gaps.
    'replace < with <= in Reader::(exhausted|lacking)$',
    # `learn_end` just polled the same copy and returned on an `Ok` end.
    'delete match arm Poll::Ready\(Ok\(fin\)\) in Reader::poll_finished$',
    # The one extra copy searched is the route's own, which never has an end.
    ':\d+:32: replace - with / in Reader::backfill$',
    # At the same generation the serving copy is the one that just failed the
    # group, so it never answers at that index.
    'replace match guard !same with true in Recover::poll_serving$',
    # A replacement starting at frame 0 already holds the head.
    'replace > with >= in lend_head$',
    # Race-only, not equivalent: each call follows a read of the route in the same
    # poll, so these differ only when another thread writes the route between that
    # read and this check, a window no deterministic test can stage. There the
    # original retries on the new copy and the arm prevents a lost wake.
    'replace \|\| with && in Fetching::(poll_moved|moved)$',
    'replace Fetching::moved -> bool with false$',
    # The same for `Recover::poll`'s route watch, whose generation it just read; once no
    # front moves the copy, the read never continues on the watch.
    ':\d+:43: replace \|\| with && in Recover::poll$',
    ':\d+:6: delete match arm Some\(Some\(Err\(err\)\)\) in <impl kio::Task for Fetching>::poll$',
    # The reader list's sweep only bounds memory: a dead entry fails every
    # `Weak::upgrade`, and `subscribe` sweeps the list again.
    'replace > with >= in Producer::serve_from$',
    'replace == with != in Consumer::subscribe$',
    # Ranges a reader asks again unchanged, once its log no longer reaches back: asked whole
    # they place and backfill as before, and each copy's replace of equal ranges is a no-op,
    # so treating them as unchanged only saves that work.
    'replace match guard ranges == self.mirrored.ranges with false in Reader::sync$',
    # A backfill fails only with its route's track, so asking that route again for what it
    # refused fails at once too and is let go: skipping the ask only saves the subscribe.
    # `poll_lowest` records that refusal for the skip.
    ':\d+:19: replace <= with > in Reader::backfill$',
    ':\d+:30: replace == with != in Reader::poll_lowest$',
    # With no resume point `raised` names no start, and a settled window has no unsettled
    # range: each guard only skips the walk.
    'replace \|\| with && in Reader::raised$',
    # Dead: every write of `until` also writes `since`, so the superseded check
    # never runs. `ResumeReader.tla` models it, so it goes with the model.
    'replace >= with < in Copy::retains$',
    # A run starting at the end clips to an empty range, on which nothing lands
    # and nothing is missing.
    'replace < with <= in Copy::retains$',
    # `Placed` only sees ranges `Reader::resolve` placed, with no latest group: each
    # start is a time it contains or the oldest, so it never looks a start up or waits on
    # one, and an `Oldest` end only reaches it from a copy that accepted one, which every
    # copy refuses.
    'replace <impl Holdings for Placed>::(next_start|complete|resolves) ',
    # A copy leaves a non-empty range starting at the oldest group or time 0 unresolved
    # only when a cap at 0 empties every range, so a waiting range stops the window too.
    'replace && with \|\| in Reader::resolve$',
    # `owes_below` is asked only of a key outside the window, where no run starts.
    'replace < with <= in Reader::owes_below$',
    # Walking again before anything the read parked on fires returns the same
    # `Pending`, so the idle shortcut only saves work.
    'replace Subscriber::parked -> bool with false$',
]
