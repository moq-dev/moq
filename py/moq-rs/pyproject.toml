[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Dist name is moq-rs but the import package is `moq`, so point hatchling at it.
[tool.hatch.build.targets.wheel]
packages = ["moq"]

[project]
name = "moq-rs"
# Distribution is `moq-rs` (the `moq` name is taken on PyPI); the import name
# stays `moq`. Shared cuts set the minor; patches are independent of moq-ffi.
# On merge to release, release-py.yml publishes this version if it is not on
# PyPI yet (no tag needed; the registry is the gate).
version = "0.6.0"
description = "Media over QUIC: real-time pub/sub with built-in caching, fan-out, and prioritization, with a Pythonic API. Import as `moq`."
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Luke Curley", email = "kixelated@gmail.com" }]
keywords = ["quic", "http3", "webtransport", "media", "live", "streaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]
# Compatible-release pin: consumers float to newer bindings patches without
# a wrapper re-release. Shared cuts move the floor to the new minor; raise
# its patch when the wrapper requires newer FFI API.
dependencies = ["moq-ffi ~= 0.5.0"]

[project.urls]
Homepage = "https://github.com/moq-dev/moq"
Repository = "https://github.com/moq-dev/moq"

# Local dev resolves moq-ffi from the workspace member rather than PyPI.
[tool.uv.sources]
moq-ffi = { workspace = true }
