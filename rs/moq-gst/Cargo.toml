[package]
name = "moq-gst"
description = "Media over QUIC - GStreamer plugin"
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.4.12"
edition = "2024"
# gstreamer 0.25 needs 1.92, above the 1.91 workspace floor. moq-gst is a
# plugin, not a library other crates build on, so the bump stays per-crate.
rust-version = "1.92"
publish = true

[lib]
name = "gstmoq"
crate-type = ["cdylib", "rlib"]

[dependencies]

anyhow = { workspace = true, features = ["backtrace"] }
bytes = { workspace = true }
gst = { package = "gstreamer", version = "0.25" }
gst-audio = { package = "gstreamer-audio", version = "0.25" }
hang = { workspace = true }
kio = { workspace = true, features = ["runtime"] }
moq-mux = { workspace = true }
moq-net = { workspace = true }
moq-tokio = { workspace = true, default-features = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[build-dependencies]
gst-plugin-version-helper = "0.8"

[dev-dependencies]
criterion = { package = "bench-harness", path = "../bench-harness" }
futures = { workspace = true }
# Decodes the OpusHead the sink publishes, so the surround regression checks playback.
moq-audio = { path = "../moq-audio", default-features = false }
# Runs the tests that need a variable set or unset in a child process given it.
test-env = { path = "../test-env" }
tokio = { workspace = true, features = ["test-util"] }

[[bench]]
name = "catalog"
harness = false

[lints]
workspace = true
