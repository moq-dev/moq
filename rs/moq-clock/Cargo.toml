[package]
name = "moq-clock"
description = "One clock for Media over QUIC: logical instants, wall time, deadlines, and a deterministic simulator."
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

# The crates.io name previously held the "CLOCK over QUIC" demo binary (last 0.10.21).
version = "0.11.0"
edition = "2024"
rust-version.workspace = true

keywords = ["moq", "time", "clock", "timer", "simulation"]
categories = ["asynchronous", "date-and-time", "development-tools::testing"]

[package.metadata.docs.rs]
features = ["manual", "sim"]

# The self dev-dependency below only enables a feature; no code names it.
[package.metadata.cargo-shear]
ignored = ["moq-clock"]

[features]
default = ["runtime"]
# The deterministic single-threaded executor and `#[moq_clock::test]`. Meant for
# dev-dependencies, so production builds never compile it.
sim = ["dep:futures", "dep:moq-clock-macros"]
runtime = ["dep:tokio", "dep:web-async"]
# `Manual::install`: a clock that only a test moves, as one tokio runtime's ambient
# clock. Native only. Meant for test builds, so production builds never compile it.
manual = ["runtime"]

[dependencies]
futures = { workspace = true, optional = true }
kio = { workspace = true }
moq-clock-macros = { workspace = true, optional = true }
web-async = { workspace = true, optional = true }

# The browser's only clocks, read with or without the runtime's timers.
[target.'cfg(all(target_arch = "wasm32", not(target_os = "wasi")))'.dependencies]
web-async = { workspace = true }

# The runtime handle, to keep a paused runtime's clock on its own origin.
[target.'cfg(any(not(target_arch = "wasm32"), target_os = "wasi"))'.dependencies]
tokio = { workspace = true, features = ["rt", "time"], optional = true }

[dev-dependencies]
# Enable the simulator so its tests run in the merge gate. Without default features,
# so `--no-default-features` still tests the build without the runtime.
moq-clock = { path = ".", default-features = false, features = ["sim"] }

[target.'cfg(all(target_arch = "wasm32", not(target_os = "wasi")))'.dev-dependencies]
# Match the wasm-bindgen CLI schema used by the browser runner.
wasm-bindgen = "=0.2.129"
wasm-bindgen-test = "=0.3.79"

[target.'cfg(any(not(target_arch = "wasm32"), target_os = "wasi"))'.dev-dependencies]
# Test the installed manual clock, which needs tokio's runtime and so is native only.
moq-clock = { path = ".", default-features = false, features = ["manual", "sim"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "test-util", "time"] }
