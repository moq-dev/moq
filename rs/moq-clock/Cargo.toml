[package]
name = "moq-clock"
description = "One clock for Media over QUIC: logical instants, wall time, deadlines, and a deterministic simulator."
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

# The crates.io name previously held the "CLOCK over QUIC" demo binary (last 0.10.21).
version = "0.11.0"
edition = "2024"
rust-version.workspace = true

keywords = ["moq", "time", "clock", "timer", "simulation"]
categories = ["asynchronous", "date-and-time", "development-tools::testing"]

[package.metadata.docs.rs]
features = ["manual", "sim", "serde"]

# The self dev-dependency below only enables a feature; no code names it.
[package.metadata.cargo-shear]
ignored = ["moq-clock"]

[features]
default = ["runtime"]
# Numeric Unix-second JSON adapters for public wall times.
serde = ["dep:serde", "dep:serde_with"]
# The deterministic single-threaded executor and `#[moq_clock::test]`. Meant for
# dev-dependencies, so production builds never compile it.
sim = ["dep:futures", "dep:moq-clock-macros", "kio/_sim"]
runtime = ["dep:tokio"]
# `Manual::install`: a clock that only a test moves, as one tokio runtime's ambient
# clock. Meant for test builds, so production builds never compile it.
manual = ["runtime"]

[dependencies]
futures = { workspace = true, optional = true }
kio = { workspace = true }
moq-clock-macros = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_with = { workspace = true, optional = true }
# The host timers, and the runtime handle that keeps a paused runtime's clock on its own origin.
tokio = { workspace = true, features = ["rt", "time"], optional = true }

[dev-dependencies]
# Enable the simulator and the installed manual clock so their tests run in the merge
# gate. Without default features, so `--no-default-features` still tests the build
# without the runtime.
moq-clock = { path = ".", default-features = false, features = ["manual", "sim", "serde"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "test-util", "time"] }

[lints]
workspace = true
