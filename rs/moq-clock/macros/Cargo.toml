# The `#[moq_clock::test]` attribute. A separate crate only because a proc macro
# must be; `moq-clock` re-exports it behind its `sim` feature.
[package]
name = "moq-clock-macros"
description = "The #[moq_clock::test] attribute; use it through moq-clock's sim feature."
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.1.0"
edition = "2024"
rust-version.workspace = true

keywords = ["moq", "test", "simulation"]
categories = ["development-tools::testing"]

[lib]
proc-macro = true

[lints]
workspace = true
