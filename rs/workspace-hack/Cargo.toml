# This file is generated by `cargo hakari`.
# To regenerate, run:
#     cargo hakari generate

# Every member dev-depends on this crate by path (`sh/rs/hakari.py` checks), so
# a test or lint build compiles each third-party crate with one feature set
# whichever packages it selects, and mbx reuses that build across jobs.
# `cargo publish` strips path-only dev-dependencies, so it is never published.
[package]
name = "workspace-hack"
description = "Media over QUIC - One feature set per dependency, managed by cargo hakari"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.1.0"
edition = "2024"
rust-version.workspace = true

publish = false

