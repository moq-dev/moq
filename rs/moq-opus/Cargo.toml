[package]
name = "moq-opus"
version = "0.1.0"
# Upstream's edition: the transpiled code relies on 2021 rules for its extern blocks and static muts.
edition = "2021"
license = "BSD-3-Clause"
rust-version.workspace = true

description = "libopus 1.3.1 transpiled to Rust, forked from unsafe-libopus 0.2.0 with SILK concealment and DTX fixed"
repository = "https://github.com/moq-dev/moq"
readme = "README.md"

keywords = ["opus", "audio", "codec"]
categories = ["multimedia::audio", "multimedia::encoding"]

[features]
# Prints the entropy coder's calls, for finding where a decode diverges from C libopus.
ent-dump = ["dep:hex"]

[dependencies]
arrayref = "0.3.7"
hex = { version = "0.4.3", optional = true }
num-complex = "0.4.1"
num-traits = "0.2.16"

[dev-dependencies]
workspace-hack = { path = "../workspace-hack" }
