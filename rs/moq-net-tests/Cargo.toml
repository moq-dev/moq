[package]
name = "moq-net-tests"
description = "Session integration tests for moq-net."
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
publish = false

# Used by the shared transport harness outside this package's source tree.
[package.metadata.cargo-shear]
ignored = ["bytes", "tokio"]

[dev-dependencies]
bytes = { workspace = true }
futures = { workspace = true }
moq-clock = { path = "../moq-clock", default-features = false, features = ["sim"] }
moq-json = { path = "../moq-json" }
moq-net = { path = "../moq-net", features = ["fuzz"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true
