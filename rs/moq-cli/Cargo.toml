[package]
name = "moq-cli"
description = "Media over QUIC"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.9.14"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "http3", "webtransport", "media", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

# The package is `moq-cli`, but the binary it ships is `moq`.
[[bin]]
name = "moq"
path = "src/main.rs"

[features]
default = ["iroh", "quinn", "websocket", "nvidia", "pipewire"]
iroh = ["moq-native/iroh"]
jemalloc = ["moq-native/jemalloc"]
noq = ["moq-native/noq"]
quinn = ["moq-native/quinn"]
quiche = ["moq-native/quiche"]
# qlog trace capture (`--client-quic-qlog <DIR>`). Off by default: it compiles the
# qlog machinery into the enabled backends and is only wanted for debugging or
# congestion-control testing.
qlog = ["moq-native/qlog"]
websocket = ["moq-native/websocket"]
# Device capture (camera + microphone) + encode/publish. Off by default because
# it pulls in moq-video + moq-audio capture, which add system build deps on Linux
# (camera: `v4l`/v4l2-sys-mit needs libclang + V4L2 headers via bindgen; mic: cpal
# needs ALSA/libasound), plus binary size. macOS/Windows use OS frameworks, no
# extra install. H.264 is vendored static (openh264), so no system ffmpeg/libav.
# Enable with `cargo build -p moq-cli --features capture`.
capture = ["dep:moq-video", "dep:moq-audio", "moq-video/capture", "moq-audio/capture"]
# Just-in-time transcoding (`moq ... transcode`). Off by default because it pulls
# in moq-video and its codec dependencies. Enable with
# `cargo build -p moq-cli --features transcode`.
transcode = ["dep:moq-transcode", "dep:moq-video"]
# Native playback (`moq ... play`): decode into a wgpu window and a cpal
# speaker. Off by default because it pulls both graphics and audio device stacks
# into a binary that may only be routing containers or serving gateways.
play = ["dep:moq-video", "moq-video/render", "dep:moq-audio", "moq-audio/playback", "dep:pollster", "dep:winit"]
# NVIDIA hardware codecs (NVENC + NVDEC) on Linux, on by default. Just turns on
# the matching moq-video feature, so it only bites when something else pulls in
# moq-video: `capture`, `transcode`, or `play`. For a build with no CUDA
# dependencies, drop it:
#   cargo build -p moq-cli --no-default-features --features "iroh quinn websocket capture"
nvidia = ["moq-video?/nvidia", "moq-transcode?/nvidia"]
# Compatibility aliases for the pre-consolidation names, kept so a manifest that
# already asks for the old split still resolves. Undocumented on purpose: the
# feature tables name only `nvidia`.
nvenc = ["nvidia"]
nvdec = ["nvidia"]
# Intel/AMD VAAPI hardware encoding (Linux). Off by default because the backend is
# unvalidated on hardware; enable it explicitly alongside `capture` or `transcode`.
vaapi = ["moq-video?/vaapi", "moq-transcode?/vaapi"]
# Screen capture for `capture --display` on Linux (xdg-desktop-portal + PipeWire),
# on by default like the hardware codecs above and trimmable the same way. Only
# bites when `capture` pulls in moq-video; links libpipewire-0.3 at build time.
pipewire = ["moq-video?/pipewire"]

[dependencies]
anyhow = { workspace = true, features = ["backtrace"] }
axum = { workspace = true }
axum-server = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
hang = { workspace = true }
humantime = { workspace = true }
moq-audio = { workspace = true, optional = true }
# `server` enables the HTTP egress server for `moq export hls`; the importer is always available.
moq-hls = { workspace = true, features = ["server"] }
moq-mux = { workspace = true }
moq-native = { workspace = true, default-features = false, features = ["aws-lc-rs"] }
moq-rtc = { workspace = true }
moq-rtmp = { workspace = true }
moq-srt = { workspace = true }
moq-token-cli = { workspace = true }
moq-transcode = { workspace = true, optional = true }
moq-video = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
rustls = { version = "0.23", features = ["aws-lc-rs"], default-features = false }
tokio = { workspace = true, features = ["full"] }
tower-http = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
winit = { version = "0.30.13", optional = true }

[target.'cfg(unix)'.dependencies]
sd-notify = { workspace = true }

[dev-dependencies]
# `test-util` enables `tokio::time::pause` so the TS round-trip test simulates the
# exporter drain timeouts instantly instead of waiting on the wall clock.
tokio = { workspace = true, features = ["test-util"] }
