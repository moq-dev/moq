\* Ranked readers on three drones meshed over cheap links, each with a costly
\* uplink to the publisher's relay: readers start and stop at the drones three
\* times in all.
CONSTANTS
    Shape = "drones"
    Flaky = {}
    Readable = {2, 3, 4}
    Readers = {}
    MaxReads = 3
    MaxCloses = 0
    Rule = "order"
    Order = "route"
    Summed = FALSE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK

PROPERTIES
    PullsQuiet
    EventuallyFed
