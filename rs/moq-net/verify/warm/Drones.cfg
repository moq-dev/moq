\* Three drones meshed over cheap links, each with a costly uplink to the
\* publisher's relay: readers start and stop at each drone three times in all,
\* and one uplink may close and reopen.
CONSTANTS
    Shape = "drones"
    Flaky = {2}
    Readable = {2, 3, 4}
    Readers = {}
    MaxReads = 3
    MaxCloses = 0
    Rule = "order"
    Order = "route"
    Summed = FALSE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK

PROPERTIES
    PullsQuiet
    EventuallyFed
