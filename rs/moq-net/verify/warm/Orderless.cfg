\* Open finding: ranked readers with the rank check removed never settle on
\* the drones of Drones.cfg. With readers at two drones, each takes the other's
\* warm copy over its uplink, sees its own path in what it now pulls, drops it,
\* and both repeat for good. It shows the rank is what settles the ranked rule.
CONSTANTS
    Shape = "drones"
    Flaky = {}
    Readable = {2, 3, 4}
    Readers = {}
    MaxReads = 3
    MaxCloses = 0
    Rule = "orderless"
    Order = "route"
    Summed = FALSE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK

PROPERTIES
    PullsQuiet
    EventuallyFed
