\* Ranked readers on the drones of Drones.cfg: two reader changes, and the
\* uplink of drone 2 closing and reopening once.
CONSTANTS
    Shape = "drones"
    Flaky = {2}
    Readable = {2, 3, 4}
    Readers = {}
    MaxReads = 2
    MaxCloses = 1
    Rule = "order"
    Order = "route"
    Summed = FALSE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK

PROPERTIES
    PullsQuiet
    EventuallyFed
