\* Ranked readers at drones 2 and 3 of Drones.cfg, from no pulls, while the
\* uplink of drone 2 closes and reopens: each changes drone 2's route cost and
\* so its rank.
CONSTANTS
    Shape = "drones"
    Flaky = {2}
    Readable = {}
    Readers = {2, 3}
    MaxReads = 0
    MaxCloses = 2
    Rule = "order"
    Order = "route"
    Summed = FALSE

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK

PROPERTIES
    PullsQuiet
    EventuallyFed
