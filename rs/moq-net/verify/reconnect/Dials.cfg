\* Handover.cfg's rules with `Reconnect::with_dials`: every dial and probe waits
\* for the caller's tokens, which present it or end the policy, and a failure
\* before any session was established backs off instead of ending it.
CONSTANTS
    Endpoints = {"a", "b"}
    Start = "a"
    Refused = "far"
    Restart = "redial"
    Dials = TRUE
    MaxSessions = 3

SPECIFICATION Spec
VIEW View

INVARIANTS
    NoStaleSession
    StatusTruthful
    ConnectedMeansEstablished
    OfflineMeansNothingServes
    NoOrphan
    PresenceBalanced
    FirstWalkFailsFast
    RedirectFollowed
