\* One reader across two routes of one broadcast, each landing three groups in
\* any order, with two switches between live routes, while the publisher skips a
\* group that one route learns of and another may still wait for: the reader
\* waits on no copy for a group a copy it holds declared skipped under its own
\* bound.
CONSTANTS
    G = 3
    MaxTracks = 2
    MaxSwitches = 2
    Hold = FALSE
    MaxEvicts = 0
    MaxSkips = 1
    ReArm = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OnceEach
    ReplacedCapped
    CleanEndIsComplete
    EndWaitsForReplaced
    CleanEndIsDeclared
    FailsOnlyUnroutable
    QuietIsSettled
    CopiesBounded

PROPERTIES
    SwitchCapsAtBoundary
