\* One reader across two routes of one broadcast, each landing three groups in
\* any order, with two switches between live routes, holding each group it
\* reads until it finishes it. ThreeRoutes.cfg trades a group for a third route.
CONSTANTS
    G = 3
    MaxTracks = 2
    MaxSwitches = 2
    Hold = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OnceEach
    CleanEndIsComplete
    EndWaitsForReplaced
    CleanEndIsDeclared
    FailsOnlyUnroutable
    QuietIsSettled
    CopiesBounded
