\* The failover story `/statechart` draws (see `Story`): two groups, a second
\* route that comes up holding both, and one switch. Small enough to chart
\* whole; ResumeReader.cfg and ThreeRoutes.cfg do the checking.
CONSTANTS
    G = 2
    MaxTracks = 2
    MaxSwitches = 1
    Hold = FALSE

SPECIFICATION Spec

CONSTRAINT
    Story

INVARIANTS
    OnceEach
    CleanEndIsComplete
    EndWaitsForReplaced
    CleanEndIsDeclared
    FailsOnlyUnroutable
    QuietIsSettled
    CopiesBounded
