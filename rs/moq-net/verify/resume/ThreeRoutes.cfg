\* One reader across three routes of one broadcast, each landing two groups in
\* any order, so a route can come up after another failed, with two switches
\* between live routes. Groups are finished as soon as they are handed out.
CONSTANTS
    G = 2
    MaxTracks = 3
    MaxSwitches = 2
    Hold = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OnceEach
    CleanEndIsComplete
    EndWaitsForReplaced
    CleanEndIsDeclared
    FailsOnlyUnroutable
    QuietIsSettled
    CopiesBounded
