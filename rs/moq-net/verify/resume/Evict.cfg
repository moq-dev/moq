\* One reader across two routes of one broadcast, each landing three groups in
\* any order, with two switches between live routes, while the cache of a route
\* no longer served evicts one group: one a switch left its copy to drain is
\* asked of the serving route after all. Groups are finished as soon as they
\* are handed out.
CONSTANTS
    G = 3
    MaxTracks = 2
    MaxSwitches = 2
    Hold = FALSE
    MaxEvicts = 1
    MaxSkips = 0
    ReArm = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OnceEach
    ReplacedCapped
    CleanEndIsComplete
    EndWaitsForReplaced
    CleanEndIsDeclared
    FailsOnlyUnroutable
    QuietIsSettled
    CopiesBounded

PROPERTIES
    SwitchCapsAtBoundary
