\* Open finding: under the pool's debt the tail forgets that a group's stream
\* finished, so a stale drop it overtook records it stale, and the next update owes
\* a group the subscriber read whole and the publisher never sends again. Once it is
\* fixed, move Pressure = TRUE into SubscribeAccounting.cfg and delete this file.
CONSTANTS
    Groups = {0}
    MaxUpdates = 4
    MaxStreams = 4
    Pressure = TRUE

SPECIFICATION Spec

INVARIANTS
    NoViolation
    ServedOnce
    QuietIsSettled
