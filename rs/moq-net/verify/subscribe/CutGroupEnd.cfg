\* Open finding: a stream reset after its FIN, its group expiring before the
\* acknowledgement, delivers only the GROUP header, so the reset cuts the GROUP_END
\* and the starts inside the span it told go unaccounted until the subscriber's
\* grace. Previous Delta (quest/m2/lite07-subscribe/previous-delta.md) proves them
\* from the next group's header, and this config then passes.
CONSTANTS
    Groups = {1, 2}
    Pressure = FALSE

SPECIFICATION Spec

INVARIANTS
    QuietIsSettledWhole
