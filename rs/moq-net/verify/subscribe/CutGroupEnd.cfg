\* A stream reset after its FIN, its group expiring before the acknowledgement, delivers
\* only the GROUP header, so the reset cuts the GROUP_END. The publisher skips the starts
\* inside the span it told again. Two starts, no Pressure: the smallest bound that reaches
\* the cut.
CONSTANTS
    Groups = {1, 2}
    Pressure = FALSE
    ReliableReset = TRUE

SPECIFICATION Spec

INVARIANTS
    ServedOnce
    NamedOnce
    NoContradictorySkip
    QuietIsSettled
