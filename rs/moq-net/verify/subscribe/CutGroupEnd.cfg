\* A stream reset after its FIN, its group expiring before the acknowledgement, delivers
\* only the GROUP header, so the reset cuts the GROUP_END. The starts inside the span it
\* told wait again for the next group's header or a not-found drop. Two starts, no
\* Pressure: the smallest bound that reaches the cut.
CONSTANTS
    Groups = {1, 2}
    Pressure = FALSE

SPECIFICATION Spec

INVARIANTS
    ServedOnce
    NamedOnce
    NoContradictoryDrop
    QuietIsSettled
