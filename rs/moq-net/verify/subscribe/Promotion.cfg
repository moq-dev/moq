\* A metadata-only subscription whose first update asks for the payload again, with one
\* YIELDED reset, without pressure: the groups served as metadata are each served again
\* with their payload, dropped, or left to the cursor, and the streams still carrying
\* metadata end without accounting for anything.
CONSTANTS
    Groups = {0}
    MaxUpdates = 2
    MaxStreams = 4
    MaxPauses = 1
    Frames = 0
    Pressure = FALSE
    Promote = TRUE

SPECIFICATION Spec

INVARIANTS
    NoViolation
    ServedOnce
    QuietIsSettled
    PausedIsOwed
    OneReader
    PaidOnPromotion
