\* The subscriber's transport discards a stream after its FIN arrived, before moq-net read
\* its GROUP_END, which sends no STOP_SENDING. The subscriber names the group in a
\* SUBSCRIBE_UPDATE's Lost list, and the publisher skips the starts inside the span again.
\* Two starts, no Pressure: the smallest bound that reaches the loss.
CONSTANTS
    Groups = {1, 2}
    Pressure = FALSE
    ReliableReset = TRUE

SPECIFICATION Spec

INVARIANTS
    ServedOnce
    NamedOnce
    NoContradictorySkip
    QuietIsSettled
