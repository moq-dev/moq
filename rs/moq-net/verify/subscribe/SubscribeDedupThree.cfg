\* Three readers over three groups at one priority and order, so Max Ages 0, 1, and none
\* can sit on one upstream subscription at once. Policy mixes are SubscribeDedup.cfg's.
CONSTANTS
    Readers = {r1, r2, r3}
    Groups = {1, 2, 3}
    Prios = {0}
    Orders = {"desc"}
    FiniteMaxes = {0, 1}
    Shed = TRUE
    FoldPrios = {0}
    FoldMix = 1

SPECIFICATION Spec
SYMMETRY Sym

INVARIANTS
    SentOnce
    NoPoison
    QuietIsSettled

PROPERTIES
    EffectivePolicy
    JudgedWidest
