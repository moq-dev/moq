\* Two readers over three groups, at two priorities in either order, with Max Ages 0, 1,
\* and none, so a live join may expire a group while a history range still wants it.
\* `FoldRule` mixes every three ranges at three priorities.
CONSTANTS
    Readers = {r1, r2}
    Groups = {1, 2, 3}
    Prios = {0, 1}
    Orders = {"asc", "desc"}
    FiniteMaxes = {0, 1}
    Shed = TRUE
    FoldPrios = {0, 1, 2}
    FoldMix = 3

SPECIFICATION Spec
SYMMETRY Sym

INVARIANTS
    SentOnce
    NoPoison
    QuietIsSettled

PROPERTIES
    EffectivePolicy
    JudgedWidest
