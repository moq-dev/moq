\* A peer without RESET_STREAM_AT, or a browser's WebTransport: a reset may lose a GROUP
\* header the transport took or deliver it, so the publisher names every reset group in a
\* drop, which may land beside a header the subscriber read. Three starts without
\* Pressure, about 32.6M states in 3 minutes; with Pressure it passes at 259.6M in 55.
CONSTANTS
    Groups = {1, 2, 3}
    Pressure = FALSE
    ReliableReset = FALSE

SPECIFICATION Spec

INVARIANTS
    ServedOnce
    NamedOnce
    NoContradictoryDrop
    QuietIsSettled
