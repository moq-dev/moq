\* Open finding: a group read whole is recorded stale. Once it is fixed, drop
\* this line.
\* Without pressure: under the pool's debt the tail forgets a finished stream by
\* design, so a stale drop it overtook still records the group stale, though the
\* update owes it nothing again.
CONSTANTS
    Groups = {0}
    MaxUpdates = 4
    MaxStreams = 4
    Pressure = FALSE

SPECIFICATION Spec

INVARIANTS
    StreamWins
