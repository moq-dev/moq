\* Three groups, each served on at most one Group Stream. With no update to reopen a drop
\* and no second stream of a group, the bounds stay cheap enough for a third group: a skip
\* of 1 can be held back for 2's GROUP, and a run of 1 and 2 for 3's. Pressure lets the
\* publisher's record fold at any point.
CONSTANTS
    Groups = {1, 2, 3}
    Pressure = TRUE

SPECIFICATION Spec

INVARIANTS
    ServedOnce
    NamedOnce
    QuietIsSettled
