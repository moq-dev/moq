\* Three starts, each served on at most one Group Stream. With no update to reopen a drop
\* and no second stream of a group, the bounds stay cheap enough for a third start: group 1
\* may end at 2, 3, or 4, so its span covers none, one, or both of the starts above it.
\* Pressure lets the publisher's record fold at any point.
CONSTANTS
    Groups = {1, 2, 3}
    Pressure = TRUE

SPECIFICATION Spec

INVARIANTS
    ServedOnce
    NamedOnce
    NoContradictoryDrop
    QuietIsSettled
