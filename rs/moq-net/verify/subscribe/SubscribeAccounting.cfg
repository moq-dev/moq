\* Two groups, six Group Streams, and two YIELDED resets per group. With no update to
\* reopen a drop, a group gets a second stream only as a continuation, so the bounds stay
\* cheap; the second group puts both groups' drops and skips on one Subscribe Stream.
\* Pressure lets the publisher's record fold at any point. Frames are left out:
\* Continuation.cfg checks where a continuation starts.
CONSTANTS
    Groups = {1, 2}
    MaxStreams = 6
    MaxPauses = 2
    Frames = 0
    Pressure = TRUE

SPECIFICATION Spec

INVARIANTS
    ServedOnce
    NamedOnce
    QuietIsSettled
    PausedIsOwed
    OneReader
