\* One group, four SUBSCRIBE_UPDATEs, and four Group Streams. Groups share only the
\* order of the Subscribe Stream, so one group holds every race the model has, and a
\* second multiplies the states without adding one.
\* StreamWins lives in StreamWins.cfg, without pressure, while its finding is open.
\* Pressure lets the pool fold what each side keeps at any point.
CONSTANTS
    Groups = {0}
    MaxUpdates = 4
    MaxStreams = 4
    Pressure = TRUE

SPECIFICATION Spec

INVARIANTS
    NoViolation
    ServedOnce
    QuietIsSettled
