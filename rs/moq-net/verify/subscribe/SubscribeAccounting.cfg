\* One group, four SUBSCRIBE_UPDATEs, and four Group Streams. Groups share only the
\* order of the Subscribe Stream, so one group holds every race the model has, and a
\* second multiplies the states without adding one.
\* StreamWins lives in StreamWins.cfg while its finding is open.
\* Pressure, which lets the pool fold what each side keeps, is in Pressure.cfg while
\* its finding is open.
CONSTANTS
    Groups = {0}
    MaxUpdates = 4
    MaxStreams = 4
    Pressure = FALSE

SPECIFICATION Spec

INVARIANTS
    NoViolation
    ServedOnce
    QuietIsSettled
