\* One group, four SUBSCRIBE_UPDATEs, four Group Streams, and one YIELDED reset.
\* Groups share only the order of the Subscribe Stream, so one group holds every race
\* the model has, and a second multiplies the states without adding one.
\* StreamWins lives in StreamWins.cfg, without pressure, while its finding is open.
\* Pressure lets the pool fold what each side keeps at any point. Frames are left out:
\* Continuation.cfg checks where a continuation starts.
CONSTANTS
    Groups = {0}
    MaxUpdates = 4
    MaxStreams = 4
    MaxPauses = 1
    Frames = 0
    Pressure = TRUE

SPECIFICATION Spec

INVARIANTS
    NoViolation
    ServedOnce
    QuietIsSettled
    PausedIsOwed
    OneReader
