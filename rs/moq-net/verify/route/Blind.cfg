\* Too large to check every ordering, so TLC samples it at random.
\* Simulate: -simulate num=10000 -depth 120
\* The blind relay (`residual::{distance,path}::a_relay_behind_a_scoped_neighbour_is_blind`):
\* relay 4's nearest neighbour, relay 1, asks for "a" alone, and relay 2,
\* farther from the publisher (0) through relay 3, knows everything. Relay 4,
\* and relay 5 behind it, must show "bx" and reach it through 2.
CONSTANTS
    Nodes = {0, 1, 2, 3, 4, 5}
    Origin = 0
    Links = {{0, 1}, {1, 4}, {0, 3}, {3, 2}, {2, 4}, {4, 5}}
    Dear = {}
    Ring = {}
    Preferred = {}
    Leaving = {}
    Scoped = {1}
    Claims = {"ax", "bx"}
    Narrow = {"ax"}
    MaxRev = 2
    MaxFlaps = 1
    Patient = TRUE
    Exempt = "none"

SPECIFICATION Spec

INVARIANTS
    Truthful
    NoRevival
    NoFalseEnd
    NoRegression
    Stable
    Seen
    SimplePaths
    LoopsAreStale
    StaleIsChased
    RequestsLoopFree
    NoStaleReturn
    QuietIsSettled
    Budget
