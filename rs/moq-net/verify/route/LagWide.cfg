\* Lag.cfg where relay 1 asks for "a" alone, so relay 3 holds a route for "a"
\* through 1 and a wider root route through 2, both covering the claim.
CONSTANTS
    Nodes = {0, 1, 2, 3}
    Origin = 0
    Links = {{0, 1}, {0, 2}, {1, 3}, {2, 3}}
    Dear = {}
    Scoped = {1}
    Claims = {"ax"}
    Narrow = {"ax"}
    MaxRev = 2
    MaxFlaps = 1
    Patient = TRUE

SPECIFICATION Spec

INVARIANTS
    Truthful
    NoRevival
    NoFalseEnd
    NoRegression
    Stable
    Seen
    SimplePaths
    LoopsAreStale
    StaleIsChased
    RequestsLoopFree
    NoStaleReturn
    QuietIsSettled
    Budget
