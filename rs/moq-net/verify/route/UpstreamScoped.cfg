\* Upstream.cfg where the second CDN relay (1) asks for "a" alone, so relay 3's
\* stream to it, over a link 3 marks upstream, picks its source among covering
\* routes that are all down-only and ends rather than send one up.
CONSTANTS
    Nodes = {0, 1, 2, 3}
    Origin = 0
    Links = {{0, 1}, {0, 2}, {2, 3}, {1, 3}}
    Dear = {{0, 1}}
    Ring = {}
    Preferred = {}
    Upstream = {{0, 2}, {1, 3}}
    Leaving = {}
    Scoped = {1}
    Editors = {}
    Claims = {"x"}
    Narrow = {"x"}
    MaxRev = 1
    MaxFlaps = 1
    MaxEdits = 0
    Patient = TRUE

SPECIFICATION Spec

INVARIANTS
    Truthful
    Mirrored
    NoRevival
    NoFalseEnd
    NoRegression
    Stable
    Seen
    SimplePaths
    DownOnly
    LoopsAreStale
    StaleIsChased
    RequestsLoopFree
    NoStaleReturn
    QuietIsSettled
    Budget
