\* Open finding: RequestsLoopFree. The publisher (0) has a session to each of
\* relays 1, 2, and 3, which form a triangle, and all three close in turn. Each
\* relay drops its doubt on the publisher once no route names it, so it takes a
\* neighbour's route whose news has not reached that neighbour yet, and a
\* request goes round 1, 3, 2 until it does. LoopsAreStale and StaleIsChased
\* still hold. A relay that kept its doubt until the timer fires never takes
\* such a route: promote the rule here when the router does.
CONSTANTS
    Nodes = {0, 1, 2, 3}
    Origin = 0
    Links = {{0, 1}, {0, 2}, {0, 3}, {1, 2}, {2, 3}, {1, 3}}
    Dear = {{1, 2}}
    Scoped = {}
    Claims = {"x"}
    Narrow = {}
    MaxRev = 0
    MaxFlaps = 3
    Patient = TRUE

SPECIFICATION Spec

INVARIANTS
    Truthful
    NoRevival
    NoFalseEnd
    NoRegression
    Stable
    Seen
    SimplePaths
    LoopsAreStale
    StaleIsChased
    RequestsLoopFree
    QuietIsSettled
    Budget
