\* The induction step: from any state where `IndInv` holds, with two claims
\* in flight, every step keeps it. One relay with five neighbours stands for
\* every relay: relays share only the claims in flight, and each relay's own
\* step keeps what it sends truthful. Invariants are checked after the step
\* only, since `IndInit` assumes them before it.
\* Apalache: --length=1 --tuning-options=search.invariantFilter=1->.*
CONSTANTS
    Nodes = {0, 1, 2, 3, 4, 5}
    Origin = 0
    Relays = {1}
    Claims = {"ax", "bx"}
    Narrow = {"ax"}
    MaxFlight = 2

INIT IndInit
NEXT Next
INVARIANT IndInv
