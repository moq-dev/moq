\* Too large to check every ordering, so TLC samples it at random.
\* Simulate: -simulate num=10000 -depth 120
\* The dead claim (`two_relays_behind_a_scoped_relay_let_a_dead_claim_go`):
\* relays 3 and 4 sit behind relay 2, whose only way to the publisher (0) is
\* relay 1, which asks for "a" alone. Relay 4 also has a dear session of its
\* own to the publisher. It closes, and the publisher withdraws "bx": neither
\* 3 nor 4 may keep the wider route alive through the other.
CONSTANTS
    Nodes = {0, 1, 2, 3, 4}
    Origin = 0
    Links = {{0, 1}, {1, 2}, {2, 3}, {2, 4}, {3, 4}, {0, 4}}
    Dear = {{0, 4}}
    Preferred = {}
    Leaving = {}
    Scoped = {1}
    Claims = {"ax", "bx"}
    Narrow = {"ax"}
    MaxRev = 3
    MaxFlaps = 1
    Patient = TRUE

SPECIFICATION Spec

INVARIANTS
    Truthful
    NoRevival
    NoFalseEnd
    NoRegression
    Stable
    Seen
    SimplePaths
    LoopsAreStale
    StaleIsChased
    RequestsLoopFree
    NoStaleReturn
    QuietIsSettled
    Budget
