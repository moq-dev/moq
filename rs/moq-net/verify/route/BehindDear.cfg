\* Behind.cfg with unequal costs: relay 3 is nearer the origin than relay 2, so
\* 3's copy of relay 1's route is feasible at 2 after 1 ended it.
CONSTANTS
    Nodes = {0, 1, 2, 3}
    Origin = 0
    Leaves = {}
    Links = {{0, 1}, {1, 2}, {1, 3}, {2, 3}}
    Dear = {{1, 2}, {2, 3}}
    Claims = {"x"}
    MaxRev = 1
    MaxFlaps = 1
    MaxCollects = 0

SPECIFICATION Spec

INVARIANTS
    Truthful
    AllCertified
    NoRevival
    NoFalseEnd
    NoRegression
    LoopFree
    SimplePaths
    NoCountToInfinity
    QuietIsSettled
    Budget
