\* The publisher (0) joined to relays 1 and 2, which each give their link to the
\* other a higher priority. Ranking only its own link's priority, each took the
\* other's path and flipped back forever, exceeding Budget. A path ranks by the
\* lowest priority on it, so both stay direct. One session may also close and
\* reopen. The Rust fixture is mutually_preferred_links_settle.
