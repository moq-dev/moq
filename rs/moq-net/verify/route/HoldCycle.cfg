\* Simulate: -simulate num=2000 -depth 200 -seed 1
\* Holds that would close a cycle (`holds_never_close_a_cycle`): the publisher
\* (0) on hub 1, open relays 2 and 3 on the hub, and relays 4 and 5 asking for
\* "a" alone, each joined to both open relays and nearer the other's choice.
\* Relay 2 takes its "a" route from 4, which answers it from 3's root route,
\* and 3 takes its "a" route from 5, which answers it from 2's. When the
\* publisher's session closes, each held stream would fall back to the "a"
\* route on another path, and the holds would wait on each other for good.
CONSTANTS
    Nodes = {0, 1, 2, 3, 4, 5}
    Origin = 0
    Links = {{0, 1}, {1, 2}, {1, 3}, {2, 4}, {3, 4}, {2, 5}, {3, 5}}
    Dear = {{2, 4}, {3, 5}}
    Ring = {}
    Preferred = {}
    Leaving = {}
    Scoped = {4, 5}
    Claims = {"ax"}
    Narrow = {"ax"}
    MaxRev = 1
    MaxFlaps = 1
    Patient = TRUE
    Exempt = "none"

SPECIFICATION Spec

INVARIANTS
    Truthful
    NoRevival
    NoFalseEnd
    NoRegression
    Stable
    Seen
    SimplePaths
    LoopsAreStale
    StaleIsChased
    RequestsLoopFree
    NoStaleReturn
    QuietIsSettled
    Budget
