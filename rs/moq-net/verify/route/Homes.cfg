\* The publisher (0) on each of three relays in a ring that is cheap one way
\* round, leaving all three. Each relay may move onto its cheaper neighbour's
\* direct route before that neighbour's news arrives, so a request can go round
\* the ring (`RequestsLoopFree` fails): only `LoopsLostThePublisher` holds.
\* Simulate: -simulate num=1000 -depth 150 -seed 1
CONSTANTS
    Nodes = {0, 1, 2, 3}
    Origin = 0
    Links = {{0, 1}, {0, 2}, {0, 3}, {1, 2}, {2, 3}, {1, 3}}
    Dear = {}
    Ring = {1, 2, 3}
    Preferred = {}
    Leaving = {}
    Scoped = {}
    Claims = {"x"}
    Narrow = {}
    MaxRev = 0
    MaxFlaps = 3
    Patient = TRUE
    Flaky <- OwnLinks

SPECIFICATION Spec

INVARIANTS
    Truthful
    NoRevival
    NoFalseEnd
    NoRegression
    Stable
    Seen
    SimplePaths
    LoopsAreStale
    StaleIsChased
    LoopsLostThePublisher
    Routed
    QuietIsSettled
    Budget
