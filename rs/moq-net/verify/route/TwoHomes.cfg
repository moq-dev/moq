\* Flap.cfg where both of the publisher's sessions open and close. The exemption
\* for a route beginning at the publisher lets a relay move onto an offer through
\* its other link while doubt about the publisher stands. Before a patient timer
\* waited for stale offers as well as DEAD news, a relay could forget a dead hop
\* while an offer naming it was still queued, take that offer, and drop a claim it
\* showed once the next message named the hop again, breaking `Stable`.
\* Simulate: -simulate num=1000 -depth 150 -seed 1
CONSTANTS
    Nodes = {0, 1, 2, 3}
    Origin = 0
    Links = {{0, 1}, {0, 2}, {1, 2}, {1, 3}, {2, 3}}
    Dear = {}
    Ring = {}
    Preferred = {}
    Upstream = {}
    Leaving = {}
    Scoped = {}
    Editors = {}
    Claims = {"x"}
    Narrow = {}
    MaxRev = 1
    MaxFlaps = 3
    MaxEdits = 0
    Patient = TRUE
    Flaky <- OwnLinks

SPECIFICATION Spec

INVARIANTS
    Truthful
    Mirrored
    NoRevival
    NoFalseEnd
    NoRegression
    Seen
    SimplePaths
    LoopsAreStale
    StaleIsChased
    RequestsLoopFree
    Routed
    QuietIsSettled
    Budget
    Stable
