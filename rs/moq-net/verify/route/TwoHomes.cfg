\* Flap.cfg where both of the publisher's sessions open and close. A relay may
\* move onto an offer older than the doubt timer, naming a hop it has already
\* forgotten died, where doubt about the publisher kept it off before: the
\* exemption for a route beginning at the publisher allows it. When the
\* next message on that link names a hop it knows died, the relay lets go:
\* claims it showed go offline, then return once another route arrives. The
\* replaced rule kept the relay dark for the whole timer instead, so this
\* config drops `Stable`.
\* Simulate: -simulate num=1000 -depth 150 -seed 1
CONSTANTS
    Nodes = {0, 1, 2, 3}
    Origin = 0
    Links = {{0, 1}, {0, 2}, {1, 2}, {1, 3}, {2, 3}}
    Dear = {}
    Ring = {}
    Preferred = {}
    Leaving = {}
    Scoped = {}
    Claims = {"x"}
    Narrow = {}
    MaxRev = 1
    MaxFlaps = 3
    Patient = TRUE
    Flaky <- OwnLinks

SPECIFICATION Spec

INVARIANTS
    Truthful
    NoRevival
    NoFalseEnd
    NoRegression
    Seen
    SimplePaths
    LoopsAreStale
    StaleIsChased
    RequestsLoopFree
    Routed
    QuietIsSettled
    Budget
