\* Routes that name the nodes they crossed, with two flaps. Passes. Run
\* against DrainCosts.tla.
CONSTANTS
    Nodes = {0, 1, 2, 3}
    Origin = 0
    Leaves = {}
    Links = {{0, 1}, {1, 2}, {1, 3}, {2, 3}}
    Cost <- C
    Claims = {"x"}
    MaxRev = 1
    MaxFlaps = 2
    Echo = "once"
    EchoLane = FALSE
    Hops = TRUE
    MaxCollects = 0
SPECIFICATION Spec
INVARIANTS
    Truthful
    AllCertified
    NoRevival
    NoFalseEnd
    NoRegression
    LoopFree
    QuietIsSettled
    QuietIsEchoed
    NoCountToInfinity
CONSTRAINT
    Bounded
