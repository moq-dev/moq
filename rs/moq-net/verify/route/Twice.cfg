\* Too large to check every ordering, so TLC samples it at random.
\* Simulate: -simulate num=10000 -depth 100
\* RouteHandoff.cfg where two sessions close, as when relay 1 dies and 2 and 3
\* notice apart: each may take the other's stale route and hold under it, and
\* every hold must still end.
CONSTANTS
    Nodes = {0, 1, 2, 3}
    Origin = 0
    Links = {{0, 1}, {1, 2}, {1, 3}, {2, 3}}
    Dear = {}
    Ring = {}
    Preferred = {}
    Leaving = {}
    Scoped = {}
    Claims = {"x"}
    Narrow = {}
    MaxRev = 1
    MaxFlaps = 2
    Patient = TRUE
    Exempt = "none"

SPECIFICATION Spec

INVARIANTS
    Truthful
    NoRevival
    NoFalseEnd
    NoRegression
    Stable
    Seen
    SimplePaths
    LoopsAreStale
    StaleIsChased
    RequestsLoopFree
    QuietIsSettled
    Budget
