\* The publisher (0) on relays 1 and 2, joined to each other, and relay 3 behind
\* both. Only the publisher's link to relay 1 opens and closes, so the only doubt is
\* about the publisher: its link to relay 1 flaps while relay 2's stays up, and
\* every relay that knows the way through relay 2 keeps a route the whole time.
\* Simulate: -simulate num=1000 -depth 150 -seed 1
CONSTANTS
    Nodes = {0, 1, 2, 3}
    Origin = 0
    Links = {{0, 1}, {0, 2}, {1, 2}, {1, 3}, {2, 3}}
    Dear = {}
    Ring = {}
    Preferred = {}
    Leaving = {}
    Scoped = {}
    Claims = {"x"}
    Narrow = {}
    MaxRev = 1
    MaxFlaps = 4
    Patient = TRUE
    Flaky <- FirstLink

SPECIFICATION Spec

INVARIANTS
    Truthful
    NoRevival
    NoFalseEnd
    NoRegression
    Stable
    Seen
    SimplePaths
    LoopsAreStale
    StaleIsChased
    RequestsLoopFree
    Routed
    QuietIsSettled
    Budget
