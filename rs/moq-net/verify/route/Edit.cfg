\* Too large to check every ordering, so TLC samples it at random.
\* Simulate: -simulate num=10000 -depth 120
\* Two interest edits in flight: relay 2, watching "a", hears the publisher (0)
\* through relay 1 and over a dear session of its own, and changes what it
\* watches twice: widening then narrowing back, dropping everything then asking
\* again, and so on. Before the rekey kept the route the sender would reflect,
\* a widening then a narrowing crossing the 0-2 session closing kept a route
\* relay 1 learned through relay 2's dead session and took "ax" offline,
\* breaking Stable at depth 16
\* (`interest::narrowing_keeps_the_route_the_sender_would_reflect`).
