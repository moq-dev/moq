\* A line: the origin (0) publishes through relays 1, 2, and 3 to a client
\* (4) that only watches. Every route has one path, so a cut leaves the far
\* side with nothing, and the client must echo every ROUTE_END it hears.
\* Converges checks under fairness what Budget implies: routing goes quiet.
CONSTANTS
    Nodes = {0, 1, 2, 3, 4}
    Origin = 0
    Leaves = {4}
    Links = {{0, 1}, {1, 2}, {2, 3}, {3, 4}}
    Dear = {}
    Claims = {"x"}
    MaxRev = 2
    MaxFlaps = 1
    MaxCollects = 1

SPECIFICATION LiveSpec

INVARIANTS
    Truthful
    AllCertified
    NoRevival
    NoFalseEnd
    NoRegression
    LoopFree
    SimplePaths
    NoCountToInfinity
    QuietIsSettled
    Budget

PROPERTIES
    Converges
