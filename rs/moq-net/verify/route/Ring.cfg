    Links = {{0, 1}, {1, 2}, {2, 3}, {3, 0}}
    Dear = {}
    Ring = {}
    Preferred = {}
    Leaving = {}
    Scoped = {}
    Claims = {"x"}
    Narrow = {}
    MaxRev = 1
    MaxFlaps = 1
    Patient = FALSE

SPECIFICATION Spec

