\* A ring: the origin (0) and relays 1, 2, and 3, so relay 2 has two equal
\* paths and a cut anywhere leaves a longer way around.
CONSTANTS
    Nodes = {0, 1, 2, 3}
    Origin = 0
    Leaves = {}
    Links = {{0, 1}, {1, 2}, {2, 3}, {3, 0}}
    Dear = {}
    Claims = {"x"}
    MaxRev = 2
    MaxFlaps = 1
    MaxCollects = 0

SPECIFICATION Spec

INVARIANTS
    Truthful
    AllCertified
    NoRevival
    NoFalseEnd
    NoRegression
    LoopFree
    SimplePaths
    NoCountToInfinity
    QuietIsSettled
    Budget
