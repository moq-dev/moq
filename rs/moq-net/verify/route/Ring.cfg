\* The publisher (0) and relays 1, 2, and 3 in a ring, so a cut leaves a way
\* round through the far end of the closed session, which the doubt keeps a
\* relay off until its timer fires. Meanwhile the relay holds, and must not
\* let go while that route may still come back.
