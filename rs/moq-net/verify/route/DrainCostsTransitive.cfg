\* The deferred echo with two flaps: a closed session counts as an echo, and a
\* stale route comes back once. Run against DrainCosts.tla.
CONSTANTS
    Nodes = {0, 1, 2, 3}
    Origin = 0
    Leaves = {}
    Links = {{0, 1}, {1, 2}, {1, 3}, {2, 3}}
    Cost <- C
    Claims = {"x"}
    MaxRev = 1
    MaxFlaps = 2
    Echo = "transitive"
    EchoLane = FALSE
    Hops = FALSE
    MaxCollects = 0
SPECIFICATION Spec
INVARIANTS
    Truthful
    AllCertified
    NoRevival
    NoFalseEnd
    NoRegression
    LoopFree
    QuietIsSettled
    QuietIsEchoed
    NoCountToInfinity
CONSTRAINT
    Bounded
