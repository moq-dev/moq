\* RouteHandoff.cfg with a timer that may fire at any moment, even before the
\* news of the dead hop has reached the relay: as with no doubt at all, a stale
\* route may return (NoStaleReturn breaks), and nothing else does.
CONSTANTS
    Nodes = {0, 1, 2, 3}
    Origin = 0
    Links = {{0, 1}, {1, 2}, {1, 3}, {2, 3}}
    Dear = {}
    Ring = {}
    Preferred = {}
    Leaving = {}
    Scoped = {}
    Claims = {"x"}
    Narrow = {}
    MaxRev = 1
    MaxFlaps = 1
    Patient = FALSE
    Exempt = "none"

SPECIFICATION Spec

INVARIANTS
    Truthful
    NoRevival
    NoFalseEnd
    NoRegression
    Stable
    Seen
    SimplePaths
    LoopsAreStale
    StaleIsChased
    RequestsLoopFree
    QuietIsSettled
    Budget
