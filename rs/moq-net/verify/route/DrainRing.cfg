\* Simulate: -simulate num=1000 -depth 150 -seed 1
\* The publisher (0) joined to relays 1, 2, and 3, which form a ring that is
\* cheap one way round (1 to 2, 2 to 3, 3 to 1) and dear the other. The
\* publisher's GOAWAY may reach every relay before any hears the others re-rank.
\* Ranking drain alone, each moved onto the next relay's old, undrained offer,
\* and a request went round the ring with no session closed, breaking
\* RequestsLoopFree and LoopsAreStale. The DRAIN news casts doubt on the
\* publisher, so no relay takes a stale offer through it.
\* The Rust fixture is a_goaway_in_a_ring_never_loops_a_request.
CONSTANTS
    Nodes = {0, 1, 2, 3}
    Origin = 0
    Links = {{0, 1}, {0, 2}, {0, 3}, {1, 2}, {2, 3}, {1, 3}}
    Dear = {}
    Ring = {1, 2, 3}
    Preferred = {}
    Leaving = {0}
    Scoped = {}
    Claims = {"x"}
    Narrow = {}
    MaxRev = 1
    MaxFlaps = 0
    Patient = TRUE

SPECIFICATION Spec

INVARIANTS
    Truthful
    NoRevival
    NoFalseEnd
    NoRegression
    Stable
    Seen
    SimplePaths
    LoopsAreStale
    StaleIsChased
    RequestsLoopFree
    NoStaleReturn
    QuietIsSettled
    Budget
