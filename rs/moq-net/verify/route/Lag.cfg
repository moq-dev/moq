\* A lagging neighbour: relay 3 hears the publisher (0) through relays 1 and
\* 2. It may learn a withdrawal through one, lose that route, and still hold
\* the other at the older revision: it must not show the claim again. Both
\* routes cover the same prefix.
CONSTANTS
    Nodes = {0, 1, 2, 3}
    Origin = 0
    Links = {{0, 1}, {0, 2}, {1, 3}, {2, 3}}
    Dear = {}
    Scoped = {}
    Claims = {"ax"}
    Narrow = {"ax"}
    MaxRev = 2
    MaxFlaps = 1
    Patient = TRUE

SPECIFICATION Spec

INVARIANTS
    Truthful
    NoRevival
    NoFalseEnd
    NoRegression
    Stable
    Seen
    SimplePaths
    LoopsAreStale
    StaleIsChased
    RequestsLoopFree
    NoStaleReturn
    QuietIsSettled
    Budget
