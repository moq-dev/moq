\* Two uplinks: the publisher (0) sits on a CDN relay joined by a dear link to
\* another (1). Relays 2 and 3 form a local mesh, each with an upstream link to
\* one CDN relay. Every route 2 and 3 hold came down an upstream link, so it is
\* down-only even one LAN hop on, and 3 never sends it up to 1: with the CDN
\* link down, 1 has no route rather than one through the local mesh, while 2
\* still reaches the publisher through 3 and 1 when its own uplink closes. The
\* Rust fixture is two_uplinks_never_carry_cdn_transit.
CONSTANTS
    Nodes = {0, 1, 2, 3}
    Origin = 0
    Links = {{0, 1}, {0, 2}, {2, 3}, {1, 3}}
    Dear = {{0, 1}}
    Ring = {}
    Preferred = {}
    Upstream = {{0, 2}, {1, 3}}
    Leaving = {}
    Scoped = {}
    Editors = {}
    Claims = {"x"}
    Narrow = {}
    MaxRev = 1
    MaxFlaps = 1
    MaxEdits = 0
    Patient = TRUE

SPECIFICATION Spec

INVARIANTS
    Truthful
    Mirrored
    NoRevival
    NoFalseEnd
    NoRegression
    Stable
    Seen
    SimplePaths
    DownOnly
    LoopsAreStale
    StaleIsChased
    RequestsLoopFree
    NoStaleReturn
    QuietIsSettled
    Budget
