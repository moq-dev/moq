\* An origin (0) and two relays (1, 2) in a triangle, so a relay can fail
\* over through the other and Babel's feasibility decides whether it may.
CONSTANTS
    Nodes = {0, 1, 2}
    Origin = 0
    Leaves = {}
    Links = {{0, 1}, {0, 2}, {1, 2}}
    Dear = {}
    Claims = {"x"}
    MaxRev = 2
    MaxFlaps = 2
    MaxCollects = 1

SPECIFICATION Spec

INVARIANTS
    Truthful
    AllCertified
    NoRevival
    NoFalseEnd
    NoRegression
    LoopFree
    SimplePaths
    NoCountToInfinity
    QuietIsSettled
