\* The publisher (0) behind relay 1, which sits in a triangle with relays 2
\* and 3. When 0-1 closes, 2 and 3 each still hold a copy of the other's route
\* through it, and an offer through the dead hop may arrive after one of them
\* dropped its own: the timer, fired late, keeps it off.
