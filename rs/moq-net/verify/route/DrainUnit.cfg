\* An origin (0) behind relay 1 of a triangle with unit costs. The echo at
\* once counts to infinity here in 23 states.
CONSTANTS
    Nodes = {0, 1, 2, 3}
    Origin = 0
    Leaves = {}
    Links = {{0, 1}, {1, 2}, {1, 3}, {2, 3}}
    Cost <- C
    Claims = {"x"}
    MaxRev = 2
    MaxFlaps = 2
    Echo = "once"
    EchoLane = FALSE
    Hops = FALSE
    MaxCollects = 1
SPECIFICATION Spec
INVARIANTS
    Truthful
    AllCertified
    NoRevival
    NoFalseEnd
    NoRegression
    LoopFree
    QuietIsSettled
    QuietIsEchoed
    NoCountToInfinity
CONSTRAINT
    Bounded
