\* The code: a verdict recorded under the narrowest budget the copy asked, and
\* a reader wider than it asks the route. Two budgets the copy may retune
\* between, a live-edge, a wider, and a bounded reader, and three ticks of age.
CONSTANTS
    Budgets = {0, 1}
    ReaderBudgets = {0, 1, 3}
    MaxAge = 2
    MaxRetunes = 2
    Rule = "wider"
    Recorded = "narrowest"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    AnswersAsUpstream
    AsksOnlyWhenWider
