\* The client reads two groups of two frames through E, which fails over
\* between A and B, each pulling from the origin. One relay may die, and each
\* relay may move off a live route once. The client stays, so a deadlock is a
\* hang; Leave.cfg lets it go to check cleanup. EndedRelay.cfg adds B's
\* route through A while its finding is open.
CONSTANTS
    G = 2
    F = 2
    MaxDeaths = 1
    MaxSwitches = 1
    Mesh = FALSE
    Leave = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    CleanEndIsComplete
    CleanEndIsDeclared
    NoSkipWhileHeld
    SettledIsWhole
