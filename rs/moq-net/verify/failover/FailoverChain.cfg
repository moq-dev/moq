\* The client reads two groups of two frames through E, which fails over
\* between A and B, each pulling from the origin. One relay may die, each
\* relay may move off a live route once, and the client may leave.
\* EndedRelay.cfg adds B's route through A while its finding is open.
CONSTANTS
    G = 2
    F = 2
    MaxDeaths = 1
    MaxSwitches = 1
    Mesh = FALSE
    Leave = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    CleanEndIsComplete
    CleanEndIsDeclared
    FailsOnlyUnroutable
    NoSkipWhileHeld
    SettledIsWhole
