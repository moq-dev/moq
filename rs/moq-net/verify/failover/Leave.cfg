\* FailoverChain.cfg with a client that may leave at any point, so a deadlock
\* is a relay that keeps a copy after it left. Leaving is always possible
\* here, which hides a playback hang: FailoverChain.cfg checks that.
CONSTANTS
    G = 2
    F = 2
    MaxDeaths = 1
    MaxSwitches = 1
    Mesh = FALSE
    Leave = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    CleanEndIsComplete
    CleanEndIsDeclared
    NoSkipWhileHeld
    SettledIsWhole
