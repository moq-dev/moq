\* Open finding: NoSkipWhileHeld. A relay whose track ended cannot move a fetch
\* off a route that dies (see the verify-failover skill).
\* FailoverChain.cfg with B also routing through A, so the route can move at
\* the middle hop.
CONSTANTS
    G = 2
    F = 2
    MaxDeaths = 1
    MaxSwitches = 1
    Mesh = TRUE
    Leave = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    CleanEndIsComplete
    CleanEndIsDeclared
    NoSkipWhileHeld
    SettledIsWhole
