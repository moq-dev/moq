\* FailoverChain.cfg with B also routing through A, so the route can move at
\* the middle hop, after B's track ended too. Too large to exhaust (past 139M
\* distinct states at depth 38 with its queue still growing), so Nightly
\* samples it; an exhaustive run passed every state through depth 37.
\* Simulate: -simulate num=200000 -depth 100
CONSTANTS
    G = 2
    F = 2
    MaxDeaths = 1
    MaxSwitches = 1
    Mesh = TRUE
    Leave = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    CleanEndIsComplete
    CleanEndIsDeclared
    NoSkipWhileHeld
    FailsOnlyUnroutable
    SettledIsWhole
