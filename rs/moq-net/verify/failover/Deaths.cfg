\* FailoverChain.cfg with both A and B mortal. Only here can E lose every route,
\* so only here does E's front end the track (`FrontFail`), and only once no
\* dead relay's route still shows: a front holds the track until `Withdraw`.
CONSTANTS
    G = 2
    F = 2
    MaxDeaths = 2
    MaxSwitches = 1
    Mesh = FALSE
    Leave = FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    CleanEndIsComplete
    CleanEndIsDeclared
    NoSkipWhileHeld
    FailsOnlyUnroutable
    SettledIsWhole
