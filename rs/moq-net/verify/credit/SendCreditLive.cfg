\* As SendCredit.cfg, with a group of each subscription whose producer never finishes, so its
\* stream holds credit until a higher-ranked open of its own subscription resets it, and a
\* tied subscription's live stream can block the other's opens for good.
CONSTANTS
    Subs = {1, 2}
    G = 3
    High = {}
    Asc = {2}
    MaxStreams = 1
    LiveSubs = {1, 2}
    HistOnly = {}
    Both = {}
    Late = FALSE
    LiveGroup = 2

SPECIFICATION Spec

INVARIANTS
    WithinCredit
    Ends
    TopDelivered
    HistoryKept
    NoHeadOfLine
    DeferredWaits

PROPERTIES
    Progress
