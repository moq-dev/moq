[package]
name = "moq-congestion"
description = "QUIC congestion controllers for Media over QUIC"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
repository = "https://github.com/moq-dev/moq"
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"

keywords = ["quic", "congestion-control", "bbr", "gcc", "live"]
categories = ["multimedia", "network-programming", "algorithms"]

[features]
# Test support for the candidates under test and the comparisons that run them: the `gcc` and
# `scream` controllers, BBR3's delay bound, and the probe hooks GoogCC overrides
# (`Controller::paces_probe`, `Controller::on_probe_target`), which moq-quic calls only under its
# own `lab`. Meant for dev-dependencies; not for applications.
lab = ["dep:tracing"]

[dependencies]
kio = { workspace = true }
rand = { workspace = true }
rand_pcg = { workspace = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
cpu-time = "1.0.0"
kio = { path = "../kio", features = ["runtime"] }
stats_alloc = "0.1.10"
workspace-hack = { path = "../workspace-hack" }

[lints]
workspace = true
