[package]
name = "moq-congestion-lab"
description = "Congestion controller candidates under test, kept out of moq-congestion's published API"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
repository = "https://github.com/moq-dev/moq"
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
publish = false

[dependencies]
kio = { workspace = true }
moq-congestion = { workspace = true, features = ["lab"] }
tracing = { workspace = true }

[dev-dependencies]
cpu-time = "1.0.0"
kio = { path = "../kio", features = ["runtime"] }
workspace-hack = { path = "../workspace-hack" }

[lints]
workspace = true
