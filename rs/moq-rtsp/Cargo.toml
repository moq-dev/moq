[package]
name = "moq-rtsp"
description = "RTSP camera ingest for Media over QUIC"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.1.0"
edition = "2024"
rust-version.workspace = true

keywords = ["rtsp", "moq", "media", "live", "camera"]
categories = ["multimedia", "network-programming", "web-programming"]

[features]
# A scripted RTSP server for downstream integration tests, such as `moq-cli`'s.
test-support = ["dep:base64", "dep:tokio", "tokio/io-util", "tokio/macros", "tokio/net", "tokio/rt", "tokio/sync"]

# Pure library: pulls one RTSP session into a caller's broadcast. The CLI lives in
# `moq-cli` (`moq import rtsp`), which owns reconnect and epochs.
[dependencies]
base64 = { workspace = true, optional = true }
futures = { workspace = true }
hang = { workspace = true }
kio = { workspace = true, features = ["runtime"] }
moq-mux = { workspace = true }
moq-net = { workspace = true }
# Only for `RedactedUrl`, so the session URL logs without its query.
moq-tokio = { workspace = true }
percent-encoding = { workspace = true }
# Pure-Rust RTSP client and RTP depacketizer (H.264, H.265, AAC).
retina = "0.4.21"
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
base64 = { workspace = true }
# A clock only the stall tests move, so a loaded runner never fires a deadline early.
kio = { path = "../kio", features = ["manual"] }
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-test = { workspace = true }

[lints]
workspace = true
