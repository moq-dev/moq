[package]
name = "moq-flate"
description = "Opaque MoQ tracks, optionally compressed with group-scoped DEFLATE: latest-value snapshots or append-log streams."
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.2.0"
edition = "2024"
rust-version.workspace = true

keywords = ["deflate", "compression", "quic", "moq", "live"]
categories = ["compression", "network-programming"]

[dependencies]
bytes = { workspace = true }
# zlib-rs, not the default miniz_oxide: miniz_oxide 0.9.1 can return from a sync flush with output
# space left but the flush unfinished, silently truncating the frame.
flate2 = { workspace = true, features = ["zlib-rs", "runtime_detection"] }
kio = { workspace = true }
moq-net = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
