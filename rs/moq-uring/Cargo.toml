[package]
name = "moq-uring"
description = "Experimental Linux io_uring support for Media over QUIC"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.0.1"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "io-uring", "networking", "linux"]
categories = ["asynchronous", "network-programming", "os::linux-apis"]

publish = false

[target.'cfg(target_os = "linux")'.dependencies]
boring = "4.22"
bytes = "1"
io-uring = { workspace = true }
kio = { workspace = true }
libc = { workspace = true }
moq-net = { workspace = true }
moq-sock = { workspace = true }
quiche = "0.29"
rand = "0.10"
slab = "0.4"
thiserror = "2"
tracing = "0.1"
web-transport-trait = { workspace = true }

[dev-dependencies]
anyhow = "1"
criterion = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
io-uring = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }
noq-udp = { workspace = true }
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
tempfile = { workspace = true }
tracing = "0.1"

[[bench]]
name = "udp_tokio"
harness = false

[[bench]]
name = "udp_uring"
harness = false

[[bench]]
name = "echo_quiche"
harness = false

[[bench]]
name = "session_lite"
harness = false
