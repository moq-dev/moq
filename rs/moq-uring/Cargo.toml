[package]
name = "moq-uring"
description = "Experimental Linux io_uring support for Media over QUIC"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.0.1"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "io-uring", "networking", "linux"]
categories = ["asynchronous", "network-programming", "os::linux-apis"]

[features]
# The sans-IO QUIC stack behind `quic`. Exactly one is compiled: a build that
# somehow asks for both (`--all-features`) gets `quinn`.
default = ["quiche"]
# Cloudflare's quiche, with TLS through BoringSSL. Building that needs cmake
# and a C++ toolchain.
quiche = ["dep:boring", "dep:quiche"]
# quinn-proto, with TLS through rustls, which is what the rest of this
# workspace speaks. No second TLS stack to build or ship.
quinn = ["dep:quinn-proto", "dep:rustls", "dep:rustls-platform-verifier"]

[target.'cfg(target_os = "linux")'.dependencies]
boring = { version = "4.22", optional = true }
bytes = "1"
http = "1"
io-uring = { workspace = true }
kio = { workspace = true }
libc = { workspace = true }
moq-net = { workspace = true }
moq-sock = { workspace = true }
quiche = { version = "0.29", optional = true }
# default-features off so the crypto provider is ours to pick, matching how
# moq-tokio wires its quinn dependency.
quinn-proto = { version = "0.11", default-features = false, features = ["bloom", "log", "rustls-aws-lc-rs"], optional = true }
rand = "0.10"
rustls = { version = "0.23", optional = true }
# OS-native server-cert verifier for the quinn backend. Version matched to the
# copy moq-tokio pulls in, to avoid duplication.
rustls-platform-verifier = { version = "0.7", optional = true }
slab = "0.4"
thiserror = "2"
tracing = "0.1"
url = "2"
web-transport-proto = { workspace = true }
web-transport-trait = { workspace = true }

[dev-dependencies]
anyhow = "1"
criterion = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "time"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
io-uring = { workspace = true }
libc = { workspace = true }
moq-tokio = { workspace = true, features = ["quinn", "aws-lc-rs"] }
nix = { workspace = true }
noq-udp = { workspace = true }
# The raw peer the endpoint and WebTransport tests drive, whichever backend is
# under test.
quiche = "0.29"
rcgen = { version = "0.14", default-features = false, features = ["pem", "aws_lc_rs"] }
rustls = "0.23"
tempfile = { workspace = true }
tracing = "0.1"
web-transport-quinn = { workspace = true }

[[bench]]
name = "udp_tokio"
harness = false

[[bench]]
name = "udp_uring"
harness = false

[[bench]]
name = "echo_quiche"
harness = false

[[bench]]
name = "session_lite"
harness = false
