# The libFuzzer harness for moq-uring's receive control-message walk. `just rs fuzz uring_cmsg`
# drives it, and nightly.yml runs it for five minutes.
#
# A workspace member so it shares the root lockfile, which is the only thing that
# keeps its resolve from drifting when a sibling it depends on is bumped. It is
# excluded from every gate that means "all of it" instead: libFuzzer needs a nightly
# toolchain and sanitizer flags, so nothing in `check` or `test` may compile it.
#
# The target body lives in `moq-uring`'s `udp::fuzz` module, not here: the walk is
# private, and sharing the body is what lets the crate's own tests replay the corpus
# on stable and under Miri.
[package]
name = "moq-uring-fuzz"
version = "0.0.0"
license = "MIT OR Apache-2.0"
publish = false
edition = "2024"
autobins = false

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "uring_cmsg"
path = "fuzz_targets/uring_cmsg.rs"
test = false
doc = false
bench = false

[dependencies]
libfuzzer-sys = "0.4"
moq-uring = { workspace = true, features = ["fuzz"] }

[lints]
workspace = true
