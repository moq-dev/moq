# Only the worker's clock backend (`clock.rs`, behind `#[allow]`) reads a host
# clock; everything else reads the worker's turn through moq-clock.
disallowed-methods = [
    { path = "std::time::Instant::now", reason = "read the worker's clock: moq_clock::now()" },
    { path = "std::time::Instant::elapsed", reason = "read the worker's clock: moq_clock::Instant::elapsed()" },
    { path = "std::time::SystemTime::now", reason = "read the ambient clock: moq_clock::wall()" },
    { path = "std::time::SystemTime::elapsed", reason = "wall time never measures elapsed time" },
    { path = "std::thread::sleep", reason = "sleep on the worker's clock: moq_clock::sleep()" },
    { path = "tokio::time::Instant::now", reason = "read the ambient clock: moq_clock::now()" },
    { path = "tokio::time::sleep", reason = "sleep on the ambient clock: moq_clock::sleep()" },
    { path = "tokio::time::sleep_until", reason = "sleep on the ambient clock: moq_clock::sleep_until()" },
    { path = "tokio::time::timeout", reason = "use the ambient clock: moq_clock::timeout()" },
    { path = "tokio::time::interval", reason = "use the ambient clock: moq_clock::interval()" },
]
