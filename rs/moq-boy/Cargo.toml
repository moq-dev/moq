[package]
name = "moq-boy"
description = "MoQ Boy - Crowd-controlled Game Boy streaming"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"
keywords = ["moq", "gameboy", "streaming", "emulator", "live"]
categories = ["multimedia::video", "emulators", "network-programming"]

version = "0.4.8"
edition = "2024"
rust-version.workspace = true

[features]
default = ["quinn", "websocket"]
jemalloc = ["moq-tokio/jemalloc"]
noq = ["moq-tokio/noq"]
quinn = ["moq-tokio/quinn"]
websocket = ["moq-tokio/websocket"]

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
boytacean = { version = "0.13", features = ["gen-mock"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
hang = { workspace = true }
moq-audio = { workspace = true }
moq-json = { workspace = true }
moq-mux = { workspace = true }
moq-net = { workspace = true }
moq-tokio = { workspace = true, default-features = false, features = ["aws-lc-rs"] }
# Enable the NVENC hardware encoder (default-off at the workspace level).
moq-video = { workspace = true, features = ["nvenc"] }
serde = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = "0.1"
