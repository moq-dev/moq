[package]
name = "moq-tokio"
description = "Media over QUIC - Tokio connection helpers"
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.19.23"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "http3", "webtransport", "media", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

[features]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
# Test support, for dev-dependencies only: production builds never compile it, and it
# can change in any release. It publishes `quic::driver`, the Tokio QUIC stack under the
# MoQ transports, and `quic::web`, WebTransport over it, which tests, benches, and the
# QUIC interop example drive directly. It also runs tests on kio's deterministic
# simulator: inside `kio::clock::sim::run`, detached tasks spawn on it,
# `quic::driver::sim` carries datagrams over seeded, impaired `moq_quic::sim::Link`s with
# no sockets, `client::Config::sim` and `server::Config::sim` bind a `Client` or `Server`
# on one of its hosts, and `sim::Network` routes a client's dials over in-memory links.
# It also exposes the `decline_solicit` field of `connect::Config` and `listen::Config`,
# which acts as a moq-transport peer without MoQ Solicit.
test-support = ["kio/sim", "moq-quic/sim", "moq-net/test-support"]
# The `ietf` field of `connect::Config` and `listen::Config`, which offers the lite-07 `ietf`
# extension: moq-relay's door for its own links, not a setting. Hidden from the docs.
relay = ["moq-net/relay"]

[dependencies]
bytes = "1"
# Family-restricted `getaddrinfo`, so the AAAA and A queries can be issued separately
# (RFC 8305 section 3) while still going through the system resolver.
dns-lookup = "4"
futures = "0.3"
hex = { workspace = true }
http = "1"
# Parses the WebSocket upgrade response without reading past it.
httparse = { workspace = true }
humantime = { workspace = true }
humantime-serde = { workspace = true }
kio = { workspace = true, features = ["async", "runtime"] }
mdns-sd = { workspace = true }
moq-congestion = { workspace = true }
# rind's rustls provider and the `UnsupportedCpu` error, re-exported as `crypto`. Needs no moq-net.
moq-crypto = { workspace = true, features = ["provider"] }
moq-net = { workspace = true, features = ["async"] }
# The QUIC state machine `quic::driver` drives; rind supplies its cryptography.
moq-quic = { workspace = true }
moq-sock = { workspace = true }
notify = "8"
qmux = { workspace = true }
rand = "0.10.1"
rcgen = { workspace = true }
reqwest = { version = "0.13", default-features = false }
rind = { workspace = true }
rind-rcgen = { workspace = true }
rustc-hash = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
# OS-native server-cert verifier for the rustls backend.
rustls-platform-verifier = "0.7"
rustls-webpki = { version = "0.103", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_with = { version = "3", features = ["hex"] }
thiserror = "2"
tikv-jemalloc-ctl = { version = "0.7", optional = true }
tikv-jemallocator = { version = "0.7", features = ["profiling", "unprefixed_malloc_on_supported_platforms"], optional = true }
time = { workspace = true }
tokio = { workspace = true, features = ["full"] }
# The TLS stream `tcp::TlsAcceptor` accepts from a listener sharing its port.
tokio-rustls = { workspace = true }
# The WebSocket upgrade's HTTP handshake; qmux runs the frames after it.
tokio-tungstenite = { workspace = true, features = ["handshake"] }
toml = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
usage-rs = { workspace = true, features = ["config"] }
web-transport-proto = { workspace = true }
x509-parser = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# Android's platform verifier needs a JNI handle to the app Context (see
# `tls::init_android`); jni is the bridge. Until init runs, verification falls
# back to the bundled Mozilla roots.
jni = { workspace = true }
tracing-android = "0.2"
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
# Errno constants for classifying an `accept(2)` failure (`accept::Failure`).
# Their numeric values differ across unix platforms, so they can't be spelled out.
libc = { workspace = true }

[dev-dependencies]
anyhow = "1"
bytes = "1"
chrono = "0.4"
swole = { workspace = true }
# Use the channel type behind `mdns_sd::Receiver` so the mDNS readiness gate can
# be driven with synthetic daemon events.
flume = "0.12"
kio = { path = "../kio", features = ["manual", "sim"] }
# The integration tests build congestion controllers directly, including the candidates the
# real-socket comparisons run.
moq-congestion = { path = "../moq-congestion", features = ["lab"] }
# A bufferbloated path for the receive-credit tests and benchmark.
moq-shaper = { path = "../moq-shaper" }
# The tests drive the QUIC driver directly and run sessions on the simulator. Only
# `test-support`, so a test build keeps the features it was asked for.
moq-tokio = { path = ".", default-features = false, features = ["test-support"] }
pem = { workspace = true }
rcgen = { workspace = true, features = ["pem"] }
# rustls without a provider, as another crate in the graph may build it, so the default test build covers an
# `http://` dial's certificate fetch with no process default installed.
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rind-rcgen = { workspace = true }
rind-rustls = { workspace = true }
# The shared lite-07 range table, which the JavaScript relay's copy runs through.
serde_json = { workspace = true }
# Sockets a test holds or inspects: which ones the process still holds, so the
# worker tests can prove a stopped group closed its own, and port reservations
# that never listen, so a test needn't release a port another test could take.
socket2 = { workspace = true, features = ["all"] }
tempfile = "3"
# Runs the tests that need a variable set in a child process given it.
test-env = { path = "../test-env" }
# test-util adds tokio::time::pause/auto-advance for the time-dependent tests.
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { workspace = true }
toml = "1.1"
tracing-test = { workspace = true }
workspace-hack = { path = "../workspace-hack" }

# Stream fanout through the driver on localhost, swept over streams per connection.
[[bench]]
name = "fanout"
harness = false

[lints]
workspace = true
