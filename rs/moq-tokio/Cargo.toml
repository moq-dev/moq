[package]
name = "moq-tokio"
description = "Media over QUIC - Tokio connection helpers"
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.19.23"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "http3", "webtransport", "media", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

[features]
default = ["net", "quic", "aws-lc-rs", "websocket", "tcp", "uds"]
# MoQ sessions over moq-net: `Client`, `Server`, `origin`, and the `connect`, `listen`,
# and `transport` modules. Every transport feature turns it on, since none works without it.
net = ["dep:moq-net", "dep:web-transport-trait"]
# The async QUIC driver alone (`quic::driver`): moq-quic on tokio, without moq-net or
# the MoQ backend. Needs a crypto-provider feature.
driver = ["dep:moq-congestion", "dep:moq-quic", "dep:pin-project-lite", "dep:rustc-hash"]
# QUIC and WebTransport over moq-quic, for `https://`, `moqt://`, and `moql://`.
quic = ["_transport", "_certs", "driver", "dep:http", "dep:kio", "dep:web-transport-proto", "dep:reqwest", "watch", "dep:dns-lookup"]
# Server-side certificate handling: chains loaded from disk, self-signed generation,
# in-memory identities, and per-SNI selection. Not one to enable on its own, since
# nothing turns it into a listener: every QUIC backend needs it for its own TLS, and
# so does the plain-TLS `tls::Listen::server_config` an RTMPS or HTTPS listener builds,
# which is why the crypto-provider features below turn it on too.
_certs = ["dep:rcgen", "dep:rustls-webpki"]
# Private "any transport is compiled" marker. Not one to enable on its own: every
# backend that can move bytes turns it on, and `uds` reaches it through `tcp`.
_transport = ["net", "dep:moq-quic"]
# Filesystem watcher for hot-reloading on-disk TLS certs, keys, and root CAs.
watch = ["dep:notify"]
# Capture qlog traces (`--*-quic-qlog <DIR>`). Off by default so production
# builds do not pull in the qlog crate and its serde_json encoder.
qlog = ["moq-quic?/qlog"]
# The QUIC backend pulls in its crypto provider from these features (default-features
# are off on the dependency), so a backend without aws-lc-rs/ring has no initial cipher.
# A provider is also all it takes to sign and serve certificates, so each turns on
# `_certs` even where there is no QUIC backend to serve them for.
aws-lc-rs = ["_certs", "rustls/aws-lc-rs", "rcgen/aws_lc_rs", "moq-quic?/rustls-aws-lc-rs"]
iroh = ["_transport", "dep:web-transport-iroh", "dep:web-transport-proto", "dep:noq-proto", "dep:tokio-util"]
# LAN peer discovery over mDNS (the `mdns` module).
mdns = ["dep:mdns-sd", "dep:hmac", "dep:sha2", "dep:subtle"]
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
websocket = ["_transport", "dep:qmux", "watch", "dep:dns-lookup"]
# Qmux over TCP: plaintext `tcp://`, and `tls://` once a crypto provider is on. Server-side and client-side.
tcp = ["_transport", "dep:qmux", "dep:dns-lookup"]
# Unix-domain-socket qmux transport (`unix://`), unix-only. Adds peer-credential
# inspection on accept. Pulls in `tcp` (shares qmux's stream transport).
uds = ["tcp", "qmux/uds"]
# Native WebRTC data channels over str0m, with a full ICE agent (the `webrtc` module).
webrtc = ["_transport", "dep:qmux", "dep:moq-ice", "dep:str0m", "dep:if-addrs", "dep:mdns-sd"]
ring = ["_certs", "rustls/ring", "rcgen/ring", "moq-quic?/ring"]

[dependencies]
bytes = "1"
# Family-restricted `getaddrinfo`, so the AAAA and A queries can be issued separately
# (RFC 8305 section 3) while still going through the system resolver.
dns-lookup = { version = "4", optional = true }
futures = "0.3"
hex = { workspace = true }
hmac = { workspace = true, optional = true }
http = { version = "1", optional = true }
humantime = "2.3"
humantime-serde = { workspace = true }
if-addrs = { workspace = true, optional = true }
kio = { workspace = true, optional = true }
mdns-sd = { workspace = true, optional = true }

moq-clock = { workspace = true }
moq-congestion = { workspace = true, optional = true }
# The ICE agent behind the `webrtc` module. Private, like str0m: neither appears in this crate's API.
moq-ice = { workspace = true, optional = true }
moq-net = { workspace = true, optional = true }
# The QUIC state machine `quic::driver` drives; the crypto-provider features pick its provider.
moq-quic = { workspace = true, optional = true }
moq-sock = { workspace = true }
# iroh runs on upstream noq rather than moq-quic, and re-exports only the
# ControllerFactory trait, not the concrete congestion configs. Version matched to
# the copy iroh pulls in.
noq-proto = { workspace = true, optional = true }
notify = { version = "8", optional = true }
pin-project-lite = { version = "0.2", optional = true }
qmux = { workspace = true, features = ["wss", "tls", "tcp"], optional = true }
rand = "0.10.1"
rcgen = { workspace = true, optional = true }
reqwest = { version = "0.13", default-features = false, optional = true }
rustc-hash = { workspace = true, optional = true }
rustls = "0.23"
# OS-native server-cert verifier for the rustls backend.
rustls-platform-verifier = "0.7"
rustls-webpki = { version = "0.103", features = ["aws-lc-rs"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_with = { version = "3", features = ["hex"] }
sha2 = { workspace = true, optional = true }
str0m = { workspace = true, optional = true }
subtle = { workspace = true, optional = true }
thiserror = "2"
tikv-jemalloc-ctl = { version = "0.7", optional = true }
tikv-jemallocator = { version = "0.7", features = ["profiling", "unprefixed_malloc_on_supported_platforms"], optional = true }
time = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["io"], optional = true }
toml = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
usage-rs = { workspace = true, features = ["config"] }
web-transport-iroh = { workspace = true, optional = true }
web-transport-proto = { workspace = true, optional = true }
web-transport-trait = { workspace = true, optional = true }
x509-parser = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# Android's platform verifier needs a JNI handle to the app Context (see
# `tls::init_android`); jni is the bridge. Until init runs, verification falls
# back to the bundled Mozilla roots.
jni = "0.22"
tracing-android = "0.2"
webpki-roots = "1"

[target.'cfg(unix)'.dependencies]
# Errno constants for classifying an `accept(2)` failure (`accept::Failure`).
# Their numeric values differ across unix platforms, so they can't be spelled out.
libc = { workspace = true }

[dev-dependencies]
anyhow = "1"
bytes = "1"
chrono = "0.4"
# Use the channel type behind `mdns_sd::Receiver` so the mDNS readiness gate can
# be driven with synthetic daemon events.
flume = "0.12"
moq-clock = { path = "../moq-clock", features = ["sim"] }
# A bufferbloated path for the receive-credit tests and benchmark.
moq-shaper = { path = "../moq-shaper" }
rcgen = { workspace = true, features = ["pem", "aws_lc_rs"] }
# rustls without a provider, as iroh builds it, so the default test build covers an
# `http://` dial's certificate fetch with no process default installed.
reqwest = { workspace = true, features = ["rustls-no-provider"] }
# Sockets a test holds or inspects: which ones the process still holds, so the
# worker tests can prove a stopped group closed its own, and port reservations
# that never listen, so a test needn't release a port another test could take.
socket2 = { workspace = true, features = ["all"] }
# A fake STUN server for the WebRTC server-reflexive candidate test.
stun-types = { workspace = true }
tempfile = "3"
# test-util adds tokio::time::pause/auto-advance for the time-dependent tests.
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls = { workspace = true }
toml = "1.1"
tracing-test = { workspace = true, features = ["no-env-filter"] }

# The examples and integration tests run MoQ sessions, which a driver-only build lacks.
[[example]]
name = "chat"
required-features = ["net"]

[[example]]
name = "clock"
required-features = ["net"]

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["net"]
[lints]
workspace = true
