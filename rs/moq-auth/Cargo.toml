[package]
name = "moq-auth"
description = "Media over QUIC - the authorization contract: requests, grants, leases, and the JWT that rides them"
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.1.3"
edition = "2024"
rust-version.workspace = true

[features]
default = ["client"]
# The HTTP client that drives a lease against an auth server.
client = ["dep:reqwest", "dep:rustls", "tokio", "dep:tracing", "dep:rand"]
# The reference auth server behind `moq auth serve`: the policy a relay held, on axum.
serve = ["dep:axum", "tokio", "dep:tracing", "tokio/net"]
# The lease clock: `lease::Producer::{due, failed}` and `Grant::deadline`.
tokio = ["dep:tokio", "dep:rand"]

[dependencies]
aws-lc-rs = { workspace = true }
axum = { workspace = true, optional = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
kio = { workspace = true }
moq-pattern = { workspace = true, features = ["serde"] }
p256 = "0.14.0"
p384 = "0.14.0"
rand = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["rustls", "json"], optional = true }
rsa = "0.9.10"
rustls = { version = "0.23", default-features = false, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true, features = ["base64"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt", "time", "sync"], optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
moq-auth = { path = ".", features = ["client", "serve"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6"
