[package]
name = "moq-auth"
description = "Media over QUIC - the authorization contract: requests, grants, leases, and the JWT that rides them"
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.2.1"
edition = "2024"
rust-version.workspace = true

[features]
default = ["client"]
# The HTTP client that drives a lease against an auth server.
client = ["dep:reqwest", "dep:rind-rustls", "dep:rustls", "dep:rustls-platform-verifier", "dep:tokio", "kio/runtime", "dep:tracing", "dep:rand"]
# The reference auth server behind `moq auth serve`: the policy a relay held, on axum.
serve = ["dep:axum", "dep:tokio", "dep:tracing", "tokio/net"]

[dependencies]
axum = { workspace = true, optional = true }
base64 = { workspace = true }
data-encoding = { workspace = true }
jsonwebtoken = { workspace = true }
kio = { workspace = true, features = ["serde"] }
moq-pattern = { workspace = true, features = ["serde"] }
pkcs1 = { workspace = true, features = ["std"] }
pkcs8 = { workspace = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["rustls-no-provider", "json"], optional = true }
rind = { workspace = true }
rind-jsonwebtoken = { workspace = true }
rind-rustls = { workspace = true, optional = true }
rustls = { version = "0.23", default-features = false, optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true, features = ["base64"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt", "time", "sync"], optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, features = ["serde"] }

[dev-dependencies]
anyhow = { workspace = true }
criterion = { package = "bench-harness", path = "../bench-harness" }
kio = { path = "../kio", features = ["runtime", "sim"] }
moq-auth = { path = ".", features = ["client", "serve"] }
moq-auth-published = { package = "moq-auth", version = "=0.2.1", default-features = false }
moq-token = "0.7"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-test = { workspace = true }
wiremock = "0.6"

[[bench]]
name = "jwt"
harness = false

[lints]
workspace = true
