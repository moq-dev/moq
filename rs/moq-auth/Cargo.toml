[package]
name = "moq-auth"
description = "Media over QUIC - the authorization contract: requests, grants, leases, and the JWT that rides them"
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.2.1"
edition = "2024"
rust-version.workspace = true

[features]
default = ["client"]
# The HTTP client that drives a lease against an auth server.
client = ["dep:reqwest", "dep:rustls", "dep:tokio", "moq-clock/runtime", "dep:tracing", "dep:rand"]
# The reference auth server behind `moq auth serve`: the policy a relay held, on axum.
serve = ["dep:axum", "dep:tokio", "dep:tracing", "tokio/net"]

[dependencies]
aws-lc-rs = { workspace = true }
axum = { workspace = true, optional = true }
base64 = { workspace = true }
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
kio = { workspace = true }
moq-clock = { version = "0.11.0", path = "../moq-clock", default-features = false, features = ["serde"] }
moq-pattern = { workspace = true, features = ["serde"] }
p256 = "0.14.0"
p384 = "0.14.0"
pkcs1 = { workspace = true }
pkcs8 = { workspace = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["rustls", "json"], optional = true }
rustls = { version = "0.23", default-features = false, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true, features = ["base64"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt", "time", "sync"], optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
moq-auth = { path = ".", features = ["client", "serve"] }
moq-auth-published = { package = "moq-auth", version = "=0.2.1", default-features = false }
moq-clock = { path = "../moq-clock", features = ["sim"] }
moq-token = "0.7"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-test = { workspace = true }
wiremock = "0.6"

[lints]
workspace = true
