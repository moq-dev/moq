[package]
name = "moq-audio"
description = "Native audio encoding/decoding for Media over QUIC"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.0.13"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "http3", "webtransport", "media", "audio"]
categories = ["multimedia", "multimedia::audio", "multimedia::encoding"]

[features]
# Device capture. Microphones go through cpal (pure-Rust: CoreAudio / WASAPI /
# ALSA); macOS system audio goes through ScreenCaptureKit, which is where Apple
# puts it. Off by default so audio-only consumers (e.g. moq-ffi) don't pull cpal
# and, on Linux, the ALSA build dependency. On macOS it also pulls AVFoundation
# for the TCC permission pre-check (the objc deps below are target-gated, so this
# is a no-op elsewhere).
capture = [
    "dep:cpal",
    "dep:tokio",
    "dep:tracing",
    "dep:block2",
    "dep:dispatch2",
    "dep:objc2",
    "dep:objc2-av-foundation",
    "dep:objc2-core-audio-types",
    "dep:objc2-core-media",
    "dep:objc2-foundation",
    "dep:objc2-screen-capture-kit",
]
# Device playback. Mixes any number of `playback::Sink`s into one cpal output
# stream (CoreAudio / WASAPI / ALSA). Off by default for the same reason as
# `capture`: a consumer that only encodes shouldn't pull cpal, or the ALSA build
# dependency on Linux.
playback = ["dep:cpal", "dep:fixed-resample", "dep:tokio", "dep:tracing"]

[dependencies]
bytes = "1"
# Pure-Rust cross-platform audio I/O. Optional: only the `capture` and
# `playback` features need it. Encode stays on unsafe-libopus, so a build
# without either pulls no new dependency.
cpal = { version = "0.18", optional = true }
# The realtime SPSC channel between a caller thread and the audio callback: a
# preallocated ring buffer that resamples the caller's rate to the device rate
# and corrects for clock drift, so the callback never allocates or blocks. Not a
# second resampler: it wraps the same `rubato` we already depend on. `channel`
# is the ring buffer and `resampler` its rubato back end; the default
# `fft-resampler` stays off, matching the sinc-only stance below.
fixed-resample = { version = "0.12", optional = true, default-features = false, features = ["channel", "resampler"] }
hang = { workspace = true }
moq-mux = { workspace = true }
moq-net = { workspace = true }
# We only use the sinc resampler (Async::new_sinc), so skip the default
# fft_resampler feature and its RustFFT/realfft dependencies.
rubato = { version = "4.0", default-features = false }
thiserror = "2"
# Only the device features need an async runtime: the on-demand capture loop
# awaits frames and demand transitions, and playback awaits the driver thread.
tokio = { workspace = true, optional = true, features = ["rt", "macros", "sync", "time"] }
# Only used by the device features, for stream-error logging.
tracing = { version = "0.1", optional = true }
# Pure-Rust transpilation of libopus 1.3.1. No CMake toolchain, no C
# linker hackery, and crucially still maintained, unlike the
# `opus`/`audiopus_sys` combo which is stuck on a 5-year-old vendored
# libopus that breaks under CMake 4 (RUSTSEC-2026-0150). Trade-off:
# ~20% slower than the C version with intrinsics enabled, but for the
# 20 ms Opus frames moq-audio publishes that's still well under any
# real-time budget.
unsafe-libopus = "0.2"

# macOS-only, and only pulled in by the `capture` feature (see above); a no-op on
# other platforms. AVFoundation queries/requests the microphone TCC permission so
# a denied mic fails fast instead of feeding silence into the capture loop.
# ScreenCaptureKit (plus CoreMedia/CoreAudioTypes to read the PCM out of its
# sample buffers) is how macOS exposes system audio.
[target.'cfg(target_os="macos")'.dependencies]
block2 = { version = "0.6.2", optional = true }
dispatch2 = { version = "0.3.0", optional = true }
objc2 = { version = "0.6.4", optional = true }
objc2-av-foundation = { version = "0.3.2", optional = true }
objc2-core-audio-types = { version = "0.3.2", optional = true }
objc2-core-media = { version = "0.3.2", optional = true, features = ["CMSampleBuffer", "CMBlockBuffer", "CMSync", "objc2-core-audio-types"] }
objc2-foundation = { version = "0.3.2", optional = true }
objc2-screen-capture-kit = { version = "0.3.2", optional = true, features = ["SCStream", "SCShareableContent"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
