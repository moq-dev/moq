[package]
name = "moq-bench"
description = "Media over QUIC - Load generator and host sampler for benchmarking relays"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.1.0"
edition = "2024"
rust-version.workspace = true
publish = false

keywords = ["quic", "http3", "webtransport", "media", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

[[bin]]
name = "moq-bench"
path = "src/main.rs"
doc = false

[features]
default = ["quic", "websocket", "tcp"]
quic = ["moq-tokio/quic"]
# Qmux over TCP: `tcp://`, and `tls://`.
tcp = ["moq-tokio/tcp"]
websocket = ["moq-tokio/websocket"]

[dependencies]
anyhow = { workspace = true, features = ["backtrace"] }
bytes = { workspace = true }
humantime = { workspace = true }
kio = { workspace = true, features = ["runtime"] }
moq-net = { workspace = true }
moq-tokio = { workspace = true, default-features = false, features = ["net"] }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml = { workspace = true }
tracing = { workspace = true }
usage-rs = { workspace = true, features = ["completions", "config"] }

# The host sampler reads /proc, so it is Linux-only (production relays are Linux).
[target.'cfg(target_os = "linux")'.dependencies]
# The sampler's sock_diag dump.
libc = { workspace = true }
procfs = "0.18"

[dev-dependencies]
tempfile = { workspace = true }
# Runs the tests that need a variable set or unset in a child process given it.
test-env = { path = "../test-env" }
# test-util enables tokio::time::pause/advance for the deterministic produce tests.
tokio = { workspace = true, features = ["test-util"] }
workspace-hack = { path = "../workspace-hack" }

[lints]
workspace = true
