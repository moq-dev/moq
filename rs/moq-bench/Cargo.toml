[package]
name = "moq-bench"
description = "Media over QUIC - Load generator for benchmarking relays"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.0.1"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "http3", "webtransport", "media", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

publish = false
# `cargo run -p moq-bench` means the load generator; the sampler needs --bin.
default-run = "moq-bench"

[[bin]]
name = "moq-bench"
path = "src/main.rs"
doc = false

# Host-side resource sampler, run next to the process under test (see src/host.rs).
[[bin]]
name = "moq-bench-host"
path = "src/host.rs"
doc = false

# io_uring capability probe used before the runtime benchmark matrix.
[[bin]]
name = "moq-bench-uring-check"
path = "src/uring.rs"
required-features = ["uring"]
doc = false

[features]
default = ["quinn", "websocket"]
iroh = ["moq-tokio/iroh"]
noq = ["moq-tokio/noq"]
quinn = ["moq-tokio/quinn"]
quiche = ["moq-tokio/quiche"]
uring = ["dep:moq-uring"]
websocket = ["moq-tokio/websocket"]

[dependencies]
anyhow = { workspace = true, features = ["backtrace"] }
humantime = { workspace = true }
moq-net = { workspace = true }
moq-tokio = { workspace = true, default-features = false, features = ["aws-lc-rs"] }
rand = { workspace = true }
rustls = { version = "0.23", features = ["aws-lc-rs"], default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
toml = { workspace = true }
tracing = { workspace = true }
usage = { workspace = true, features = ["completions"] }

# The host sampler reads /proc, so it is Linux-only (production relays are Linux).
[target.'cfg(target_os = "linux")'.dependencies]
moq-uring = { workspace = true, optional = true }
procfs = "0.18"

[dev-dependencies]
# test-util enables tokio::time::pause/advance for the deterministic produce tests.
tokio = { workspace = true, features = ["test-util"] }
