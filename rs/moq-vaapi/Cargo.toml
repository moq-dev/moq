[package]
name = "moq-vaapi"
version = "0.2.1"
edition = "2021"
license = "BSD-3-Clause"
rust-version.workspace = true

description = "VA-API H.264 and H.265 hardware encode and decode, forked from discord/cros-libva and discord/cros-codecs, with libva loaded at runtime"
authors = ["The ChromiumOS Authors", "Discord", "Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
readme = "README.md"

keywords = ["vaapi", "h264", "encoder", "decoder", "hardware"]
categories = ["multimedia::encoding", "hardware-support", "external-ffi-bindings"]

# Only bindgen.sh reads the wrapper header; the bindings it generates are checked in.
exclude = ["bindgen.sh", "libva-wrapper.h"]

[dependencies]
anyhow = { workspace = true }
bitflags = { workspace = true }
# dlopen libva at runtime: the bindings' `Va` struct is built on libloading.
libloading = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
workspace-hack = { path = "../workspace-hack" }

[lints]
workspace = true
