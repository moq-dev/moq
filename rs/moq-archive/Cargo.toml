[package]
name = "moq-archive"
description = "MoQ broadcast archives on any object_store::ObjectStore"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.0.11"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "moq", "archive", "recording", "object-store"]
categories = ["multimedia", "filesystem"]

[dependencies]
bytes = { workspace = true }
futures = { workspace = true }
kio = { workspace = true }
moq-clock = { workspace = true }
moq-net = { workspace = true }
object_store = { workspace = true }
percent-encoding = { workspace = true }
quick_cache = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
criterion = { package = "bench-harness", path = "../bench-harness" }
object_store = { workspace = true, features = ["fs", "aws"] }
s3s = "0.17"
s3s-fs = "0.17"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "test-util", "time"] }

[[bench]]
name = "producer"
harness = false

[lints]
workspace = true
