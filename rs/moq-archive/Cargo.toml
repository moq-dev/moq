[package]
name = "moq-archive"
description = "Versioned hang recording objects on any object_store::ObjectStore"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.0.1"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "moq", "archive", "recording", "object-store"]
categories = ["multimedia", "filesystem"]

[dependencies]
bytes = { workspace = true }
futures = { workspace = true }
moq-net = { workspace = true }
object_store = { workspace = true }
percent-encoding = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
object_store = { workspace = true, features = ["fs"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
