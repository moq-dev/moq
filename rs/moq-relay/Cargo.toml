[package]
name = "moq-relay"
description = "Media over QUIC"
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.14.13"
edition = "2024"
# sysinfo 0.39 (cache governor cgroup limits) needs 1.95, above the 1.91
# workspace floor. moq-relay is lib+bin, so this applies to its library target
# too, but the crate is an application with no external consumers; keeping the
# bump per-crate holds it off the libraries others build on rather than raising
# the whole workspace.
rust-version = "1.95"

keywords = ["quic", "http3", "webtransport", "media", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

[[bin]]
name = "moq-relay"
path = "src/main.rs"
doc = false

[features]
default = ["iroh", "quinn", "websocket", "uds"]
iroh = ["moq-native/iroh"]
jemalloc = ["moq-native/jemalloc"]
noq = ["moq-native/noq"]
quinn = ["moq-native/quinn"]
quiche = ["moq-native/quiche"]
# qlog trace capture (`--server-quic-qlog <DIR>`). Off by default: it compiles the
# qlog machinery into the enabled backends and is only wanted for debugging or
# congestion-control testing.
qlog = ["moq-native/qlog"]
websocket = ["moq-native/websocket", "dep:qmux", "axum/ws"]
# Unix-domain-socket stream listener (`--server-unix-bind`), unix-only. In the
# default set; drop via --no-default-features on platforms without Unix sockets.
uds = ["moq-native/uds"]

[dependencies]
anyhow = { workspace = true, features = ["backtrace"] }
axum = { workspace = true }
axum-server = { workspace = true }
bytes = { workspace = true }
bytesize = "2.4.2"
clap = { workspace = true }
futures = { workspace = true }
http-body = "1"
http-cache-reqwest = { version = "1.0.0-alpha.6", features = ["manager-moka", "reqwest-middleware", "url-standard"], default-features = false }
humantime = { workspace = true }
humantime-serde = { workspace = true }
jsonwebtoken = { workspace = true }
moq-native = { workspace = true, default-features = false, features = ["aws-lc-rs", "watch", "tcp"] }
moq-net = { workspace = true }
moq-stats = { workspace = true }
moq-token = { workspace = true, features = ["tokio"] }
qmux = { workspace = true, features = ["ws"], optional = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
reqwest-middleware = "0.5"
rustls = { version = "0.23", features = ["aws-lc-rs"], default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true, features = ["json", "base64"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-rustls = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }
tower-service = "0.3"
tracing = { workspace = true }
url = { workspace = true, features = ["serde"] }
web-transport-trait = { workspace = true }

[target.'cfg(unix)'.dependencies]
sd-notify = { workspace = true }

[dev-dependencies]
rcgen = "0.14"
tempfile = { workspace = true }
wiremock = "0.6"
