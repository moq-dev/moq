[package]
name = "moq-relay"
description = "Media over QUIC"
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.17.2"
edition = "2024"
# sysinfo 0.39 (cache governor cgroup limits) needs 1.95, above the 1.91
# workspace floor. moq-relay is lib+bin, so this applies to its library target
# too. Workspace applications that depend on it (moq-cli) declare 1.95 as well;
# keeping the bump per-crate holds it off the libraries others build on rather
# than raising the whole workspace.
rust-version = "1.95"

keywords = ["quic", "http3", "webtransport", "media", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

[[bin]]
name = "moq-relay"
path = "src/main.rs"
doc = false

[features]
# A programmatic relay fixture with generated TLS and ephemeral ports.
test-support = []
# The optional public STUN Binding listener (`--stun-bind`).
stun = ["dep:stun-types"]
default = ["acme", "cluster-lan", "quic", "websocket", "uds"]
acme = ["dep:rustls-acme"]
iroh = ["moq-tokio/iroh"]
# Discover cluster peers on the LAN with mDNS (`--cluster-lan`).
cluster-lan = ["moq-tokio/mdns"]
jemalloc = ["moq-tokio/jemalloc"]
quic = ["_quic", "moq-tokio/quic"]
# The tokio QUIC listener, and the thread-per-core worker group behind
# `runtime.workers`. Not one to enable on its own: it names no backend, so
# moq-tokio would have nothing to bind a socket with.
_quic = []
# qlog trace capture (`--quic-qlog <DIR>`). Off by default: it compiles the
# qlog machinery into the enabled backends and is only wanted for debugging or
# congestion-control testing. Covers the io_uring workers too, so one feature
# means one thing whichever runtime is serving.
qlog = ["moq-tokio/qlog", "moq-uring?/qlog"]
websocket = ["moq-tokio/websocket", "dep:qmux", "axum/ws"]
# Unix-domain-socket stream listener (`--server-unix-bind`), unix-only. In the
# default set; drop via --no-default-features on platforms without Unix sockets.
uds = ["moq-tokio/uds"]
# Serve QUIC from io_uring workers (`--runtime-io-uring`), Linux-only.
# This is off by default: the relay is useful without io_uring.
io-uring = ["_uring", "moq-uring/quic"]
# The listener machinery shared by the feature above.
_uring = ["dep:moq-sock", "dep:moq-uring"]

[dependencies]
anyhow = { workspace = true, features = ["backtrace"] }
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
axum = { workspace = true }
axum-server = { workspace = true }
bytes = { workspace = true }
bytesize = "2.4.2"
futures = { workspace = true }
hex = { workspace = true }
http-body = "1.0.1"
# A 1.0 prerelease: the latest stable (0.16) is still on reqwest 0.12 and
# reqwest-middleware 0.4, while this line matches reqwest 0.13 below.
http-cache-reqwest = { version = "1.0.0-alpha.6", features = ["manager-moka", "reqwest-middleware", "url-standard"], default-features = false }
humantime = { workspace = true }
hyper-util = { workspace = true }
moq-auth = { workspace = true, features = ["client"] }
moq-clock = { workspace = true, features = ["serde"] }
moq-net = { workspace = true }
# The flow-control limits both QUIC runtimes take, for widening a peer's connection.
moq-quic = { workspace = true }
moq-stats = { workspace = true }
moq-tokio = { workspace = true, default-features = false, features = ["aws-lc-rs", "watch", "tcp"] }
qmux = { workspace = true, features = ["ws"], optional = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
reqwest-middleware = "0.5"
rustls = { version = "0.23", features = ["aws-lc-rs"], default-features = false }
rustls-acme = { version = "0.15.4", optional = true, default-features = false, features = ["aws-lc-rs", "webpki-roots"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true, features = ["json", "base64"] }
stun-types = { workspace = true, optional = true }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-rustls = { workspace = true }
toml = { workspace = true }
tower-service = "0.3"
tracing = { workspace = true }
url = { workspace = true, features = ["serde"] }
usage-rs = { workspace = true, features = ["completions", "config"] }
web-transport-trait = { workspace = true }
x509-parser = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
moq-sock = { workspace = true, optional = true }
moq-uring = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
sd-notify = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# An HTTP/2 client, so the admission bench can hold many requests on one connection.
h2 = { workspace = true }
kio = { path = "../kio" }
moq-auth = { path = "../moq-auth", features = ["client", "serve"] }
# Clocks only the test moves, wall time included, so a grant's life is exact.
moq-clock = { path = "../moq-clock", features = ["manual", "sim"] }
moq-congestion = { path = "../moq-congestion" }
# The shared session bench fills FETCH runs through the hidden `fuzz` module.
moq-net = { path = "../moq-net", features = ["fuzz"] }
moq-shaper = { path = "../moq-shaper", features = ["test"] }
qmux = { workspace = true, features = ["tcp"] }
rcgen = { workspace = true, features = ["pem", "ring", "x509-parser"] }
stun-types = { workspace = true }
tempfile = { workspace = true }
# Runs the tests that need a variable set or unset in a child process given it.
test-env = { path = "../test-env" }
time = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Workers built inside a runtime with a manual clock installed run on that clock.
moq-uring = { workspace = true, features = ["_manual"] }
# Which sockets the process still holds, so the embed tests can prove a stopped
# relay closed its own without rebinding a port another test could take.
socket2 = { workspace = true, features = ["all"] }

# `raise(SIGINT)` at ourselves, so the shutdown test exercises the real signal
# path rather than the trigger behind it.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[bench]]
name = "http_idle"
harness = false

[[bench]]
name = "auth"
harness = false

[[bench]]
name = "http_auth"
harness = false

[[bench]]
name = "session"
harness = false
required-features = ["test-support"]

[lints]
workspace = true
