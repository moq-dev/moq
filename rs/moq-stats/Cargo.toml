[package]
name = "moq-stats"
description = "Publish and consume MoQ traffic stats: drains a moq-net counter registry into JSON tracks, plain and compressed."
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.2.12"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "http3", "webtransport", "stats", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

[features]
# Exposes one producer tick to the producer_tick bench, through the hidden
# `produce::bench` module, and moq-net's hidden counter bump. Off by default
# and hidden from the docs. Not a supported API.
bench = ["moq-net/fuzz"]

[dependencies]
moq-json = { workspace = true }
moq-net = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
web-async = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "aggregate"
harness = false

# Reaches the producer drain through the hidden `bench` module.
[[bench]]
name = "producer_tick"
harness = false
required-features = ["bench"]
