[package]
name = "moq-stats"
description = "Publish and consume MoQ traffic stats: drains a moq-net counter registry into JSON tracks, plain and compressed."
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.2.12"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "http3", "webtransport", "stats", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

[package.metadata.docs.rs]
features = ["async"]

[features]
default = []
# Generated async wrappers for the poll methods, and `Publisher::run`. Enable where you `.await` them.
async = ["kio/async"]
# Exposes one producer tick to the producer_tick bench, through the
# `produce::bench` module, and moq-net's counter bump. Off by default.
bench = ["moq-net/fuzz"]

[dependencies]
kio = { workspace = true, features = ["runtime"] }
moq-json = { workspace = true }
moq-net = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
criterion = { package = "bench-harness", path = "../bench-harness" }
futures = { workspace = true }
# Compile the generated wrappers used by the tests and benches.
moq-json = { path = "../moq-json", features = ["async"] }
moq-net = { path = "../moq-net", features = ["async", "fuzz"] }
moq-stats = { path = ".", features = ["async"] }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }
workspace-hack = { path = "../workspace-hack" }

[[bench]]
name = "decode"
harness = false

[[bench]]
name = "aggregate"
harness = false

# Reaches the producer drain through the `bench` module.
[[bench]]
name = "producer_tick"
harness = false
required-features = ["bench"]

[lints]
workspace = true
