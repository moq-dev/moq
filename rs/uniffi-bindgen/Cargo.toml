[package]
name = "uniffi-bindgen"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors = ["Luke Curley"]
license = "MIT OR Apache-2.0"
publish = false
description = "Generate the Kotlin, Swift, and Python bindings from the moq-ffi cdylib via UniFFI. A separate package so a library build of moq-ffi never compiles the bindgen and its dependencies."

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
# Generator-only fork of UniFFI 0.32.2. moq-ffi stays on crates.io so its
# published package has no git dependencies.
uniffi = { git = "https://github.com/kixelated/uniffi-rs", rev = "88d835d", features = ["cli"] }
