[package]
name = "moq-webrtc"
description = "Media over QUIC - WebRTC: the WHIP/WHEP gateway and data-channel sessions with browser peers"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.3.12"
edition = "2024"
rust-version.workspace = true

keywords = ["webrtc", "whip", "whep", "moq", "media"]
categories = ["multimedia", "network-programming", "web-programming"]

[features]
default = ["server"]
# The bundled axum routers and the `pub use axum`. An embedder that owns its HTTP
# stack and calls `whip::accept` / `whep::accept` drops them with
# `default-features = false`.
server = ["dep:axum"]
# MoQ sessions over a WebRTC data channel with a browser peer (the `p2p` module): qmux
# over SCTP, host candidates per interface, and `.local` candidates resolved over mDNS.
p2p = ["dep:if-addrs", "dep:mdns-sd", "dep:qmux", "moq-tokio/qmux"]

# Pure library: the WHIP/WHEP <-> MoQ gateway (axum routers + WHEP/WHIP client), and
# with `p2p`, MoQ sessions over a data channel. The CLI lives in `moq-cli` (the `rtc`
# subcommand); embedders mount the routers / dial with `Client` against their own origin.
[dependencies]
axum = { workspace = true, optional = true }
bytes = { workspace = true }
hang = { workspace = true }
if-addrs = { workspace = true, optional = true }
# Drives each str0m connection over its UDP socket.
kio = { workspace = true, features = ["runtime"] }
mdns-sd = { workspace = true, optional = true }
moq-mux = { workspace = true, features = ["async"] }
moq-net = { workspace = true }
# `RedactedUrl` keeps a dialed URL's query token and userinfo out of the logs, and with
# `p2p`, `Client::connect_with` and `Listener::accept_with` run MoQ over the data channel.
moq-tokio = { workspace = true }
qmux = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["rustls"] }
str0m = { workspace = true }
# The STUN Binding client the ICE agent runs for server-reflexive candidates.
stun-types = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Signs the MESSAGE-INTEGRITY on a forged STUN binding request: str0m rejects a
# request without one, and its own SHA1 provider is private.
aws-lc-rs = { workspace = true }
# `poll!` checks what a data channel peer is still waiting on.
futures = { workspace = true }
# The tests host their broadcasts on `origin::spawn`, and dial a session over TCP.
moq-tokio = { workspace = true, features = ["net", "tcp"] }
tokio = { workspace = true, features = ["test-util"] }
tracing-test = { workspace = true }
workspace-hack = { path = "../workspace-hack" }

[lints]
workspace = true
