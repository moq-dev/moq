[package]
name = "moq-video"
description = "Native video capture/encoding/decoding for Media over QUIC"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.0.20"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "http3", "webtransport", "media", "video"]
categories = ["multimedia", "multimedia::video", "multimedia::encoding"]

[features]
# The NVIDIA codecs are enabled by default. Disable them (e.g.
# `--no-default-features`) for a slimmer self-compiled Linux build that drops the
# CUDA dependencies. Openh264 stays as the always-compiled software fallback;
# disable only `capture` to omit the device stack while retaining codecs.
default = ["capture", "nvidia"]
# Native camera and screen capture. Enabled by default for direct consumers,
# but workspace consumers opt in so codec-only bindings avoid device build
# dependencies such as V4L2 and libclang.
capture = ["dep:v4l", "dep:zune-jpeg"]
# The NVIDIA codecs on Linux: the NVENC encoder and the NVDEC decoder. One
# feature because they are one dependency stack (cudarc + moq-nvenc, plus a
# libloading probe for the driver libs) and one code path: NVDEC hands NVENC a
# CUDA frame to encode in place, so splitting them saves no build and costs the
# zero-copy transcode path. Everything is dlopen'd at runtime, so a build with
# this on still links GPU-less and starts driverless, falling back to the next
# encoder or decoder.
nvidia = ["dep:cudarc", "dep:moq-nvenc", "dep:libloading"]
# Compatibility aliases for the pre-consolidation names, kept so a manifest that
# already asks for the old split still resolves. Undocumented on purpose: the
# feature tables name only `nvidia`.
nvenc = ["nvidia"]
nvdec = ["nvidia"]
# Intel/AMD VAAPI hardware encoder (Linux). Off by default because the backend has
# never been validated on real hardware, not because of anything it costs the
# build: moq-vaapi dlopen's libva, so an enabled-vaapi build needs no libva at
# build time and still starts on a libva-less host, where automatic backend
# selection falls back to the next encoder like the NVENC backend does.
vaapi = ["dmabuf", "dep:moq-vaapi"]
# Linux DMA-BUF surface vocabulary and CPU fallback support. Enabled by every
# backend that can produce or consume one. It pulls no graphics API by itself.
dmabuf = ["dep:libc", "dep:linux-raw-sys"]
# GPU rendering of decoded frames (the `render` module): a wgpu pipeline that
# converts a frame to RGBA and hands back a texture the caller presents. Off by
# default because wgpu pulls a graphics stack (and its backend drivers) that a
# relay or a headless publisher has no use for; only an application that actually
# draws video turns it on. `dmabuf` adds the Linux surface vocabulary; Vulkan
# itself still comes from wgpu.
render = [
    "dmabuf",
    "dep:bytemuck",
    "dep:wgpu",
    "dep:objc2-metal",
    "objc2-core-video/CVMetalTexture",
    "objc2-core-video/CVMetalTextureCache",
    "objc2-core-video/objc2-metal",
]
# Screen capture on Linux via xdg-desktop-portal + PipeWire (Wayland and X11).
# Off by default because the `pipewire` crate links libpipewire-0.3 via pkg-config
# at build time (and its bindgen needs libclang), so it only belongs in builds
# that actually capture displays. Camera capture (V4L2) needs nothing extra.
pipewire = ["capture", "dmabuf", "dep:pipewire", "dep:ashpd"]

[dependencies]
anyhow = { workspace = true }
# Casting the color-conversion uniform to the bytes wgpu wants, without an
# unsafe reinterpret of our own. Already in the graph via wgpu.
bytemuck = { version = "1", optional = true }
bytes = { workspace = true }
# CPU I420 resize (SIMD per-plane convolution), the software fallback for
# Frame::resize; CUDA and macOS pixel-buffer frames resize on the GPU instead.
fast_image_resize = "6"
# Catalog types (VideoConfig / VideoCodec) the decode consumer reads.
hang = { workspace = true }
moq-mux = { workspace = true }
moq-net = { workspace = true }
# Vendored, statically-linked software H.264 fallback (no system dependency).
# Always compiled in: hardware encoders (VideoToolbox / Media Foundation /
# NVENC / VAAPI) are preferred, but openh264 is the fallback when none is usable
# (GPU-less box, or a resolution a hardware encoder rejects).
openh264 = "0.9.8"
# For the raw `ENCODER_OPTION_BITRATE` set_option: openh264 takes a bitrate only
# at construction and re-exports none of the sys types needed to retune a live
# encoder. `default-features = false` because openh264 already turns on the
# features it needs; cargo unifies this on the same version it depends on, so the
# raw API types stay identical.
openh264-sys2 = { version = "0.9.8", default-features = false }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tracing = { workspace = true }
# GPU rendering behind the `render` feature. `wgpu::hal` is re-exported by wgpu
# itself, so the zero-copy import paths reach the platform handles without a
# separate wgpu-hal dependency that could drift to a different version.
wgpu = { version = "30", optional = true }
# RGBA -> I420 color conversion (replaces ffmpeg swscale).
yuv = "0.8.14"

[target.'cfg(target_os="linux")'.dependencies]
# xdg-desktop-portal ScreenCast negotiation for the `pipewire` feature (pure Rust,
# zbus over DBus). The portal owns source selection: the user picks a monitor in a
# compositor dialog, and we get back a PipeWire fd + node id to stream from.
ashpd = { version = "0.13", optional = true, default-features = false, features = ["tokio", "screencast"] }
# The NVIDIA codecs, behind the default-on `nvidia` feature. Everything is
# dlopen'd at runtime: cudarc loads CUDA, and moq-nvenc (an in-tree fork of
# nvidia-video-codec-sdk, see rs/moq-nvenc) loads libnvidia-encode. So the binary
# links on a GPU-less builder and still starts on machines without the NVIDIA
# driver, falling back to the next encoder (see backend::open). `cuda-12020` pins
# the CUDA API version so the build needs no CUDA toolkit.
# The `nvrtc` feature only unlocks the `Ptx` type and `load_module` (both free of
# extra dependencies); libnvrtc itself is never loaded since we ship pre-built PTX
# (see frame/nv12_resize.ptx) that the driver JIT-compiles.
cudarc = { workspace = true, features = ["nvrtc"], optional = true }
# Mapping a linear DMA-BUF for the universal CPU I420 fallback. Non-linear
# modifiers stay GPU-only and return an honest error instead of treating tiled
# memory as rows.
libc = { workspace = true, optional = true }
# Probe for the NVIDIA driver libraries before calling cudarc / the NVENC SDK,
# which panic (process-abort under release `panic = "abort"`) if their library is
# absent. Lets a GPU-less host fall back to the next encoder instead of crashing.
libloading = { workspace = true, optional = true }
# Architecture-correct DMA_BUF_IOCTL_SYNC request values for CPU access.
linux-raw-sys = { workspace = true, optional = true }
moq-nvenc = { workspace = true, optional = true }
# Intel/AMD VAAPI hardware encoder, behind the opt-in `vaapi` feature. As of
# moq-vaapi 0.0.3 libva is dlopen'd at runtime, so the binary carries no NEEDED
# libva: the build needs no libva-dev, and a libva-less host still loads. Automatic
# backend selection then falls back to the next encoder instead of failing at load,
# matching the NVENC backend.
moq-vaapi = { workspace = true, optional = true }
# PipeWire video stream for the portal's node, behind the `pipewire` feature.
# Links libpipewire-0.3 via pkg-config at build time; bindgen needs libclang.
pipewire = { version = "0.10", optional = true }
# Native V4L2 webcam capture (replaces nokhwa). `v4l` streams MMAP buffers;
# MJPEG cameras are decoded with the pure-Rust `zune-jpeg` (no libjpeg/IJG).
v4l = { version = "0.14", optional = true }
zune-jpeg = { version = "0.5", optional = true }

[target.'cfg(target_os="macos")'.dependencies]
block2 = { workspace = true }
dispatch2 = { workspace = true }
objc2 = { workspace = true }
objc2-av-foundation = { workspace = true }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", features = ["CGDirectDisplay"] }
objc2-core-media = { workspace = true }
objc2-core-video = "0.3.2"
objc2-foundation = { workspace = true }
# MTLDevice / MTLTexture for the `render` feature's zero-copy CVPixelBuffer
# import (CVMetalTextureCache aliases the decoder's IOSurface as a Metal texture,
# which wgpu then adopts).
objc2-metal = { version = "0.3.2", optional = true }
objc2-screen-capture-kit = { workspace = true }
objc2-video-toolbox = "0.3.2"

[target.'cfg(target_os="windows")'.dependencies]
# Native Media Foundation webcam capture + hardware H.264 encode (replaces
# nokhwa). An `IMFSourceReader` backed by a D3D11 device hands us NV12 textures
# that feed a hardware encoder MFT zero-copy; without a GPU it falls back to CPU
# NV12 deinterleaved to I420 for openh264. Links only system import libs, no
# vendor SDK. The Direct3D11 / Dxgi features cover the shared D3D11 device and
# the `IMFDXGIBuffer` surfaces wrapping each captured texture.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[dev-dependencies]
# `poll!`, to cancel an `encode::Sink` request exactly where a `select!` would.
futures = { workspace = true }
h264-reader = "0.8.0"
# Driving `encode::Sink` from a plain test thread, the way an FFI caller does.
pollster = { workspace = true }
tracing-test = { workspace = true }
