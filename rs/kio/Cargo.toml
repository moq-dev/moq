[package]
name = "kio"
description = "Easy async"
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.5.4"
edition = "2024"
rust-version.workspace = true

keywords = ["async", "producer", "consumer", "state", "sync"]
categories = ["asynchronous", "concurrency"]

[features]
# Opt-in poll-driven wall-clock deadlines and retry schedules, backed by `web-async`
# (tokio on native, wasmtimer in the browser). Off by default so kio stays runtime-free.
# `rand` is here for `Backoff`'s jitter; a wasm consumer picks its own getrandom
# backend in the leaf binary, same as moq-net.
time = ["dep:web-async", "dep:rand"]
tokio = ["dep:tokio"]

[dependencies]
rand = { version = "0.10.1", optional = true }
smallvec = "1.15"
tokio = { workspace = true, features = ["time"], optional = true }
web-async = { workspace = true, optional = true }

# Loom swaps in its own Arc/Mutex/atomics so it can permute every interleaving.
# It's a normal (not dev) dependency because `sync.rs` re-exports it from the
# library itself, but `cfg(loom)` is never set outside `just rs loom`.
[target.'cfg(loom)'.dependencies]
loom = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
