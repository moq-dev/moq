[package]
name = "kio"
description = "Easy async"
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.6.2"
edition = "2024"
rust-version.workspace = true

keywords = ["async", "producer", "consumer", "clock", "simulation"]
categories = ["asynchronous", "concurrency", "date-and-time", "development-tools::testing"]

[package.metadata.docs.rs]
features = ["runtime", "manual", "sim", "serde", "macros"]

# The self dev-dependency below only enables features; no code names it.
[package.metadata.cargo-shear]
ignored = ["kio"]

[features]
# Lean by default: without `runtime`, the clock compiles no host timer backend.
default = []
# Host timers: tokio's clock on native, `setTimeout` in the browser.
runtime = ["dep:tokio", "dep:web-async"]
# The deterministic single-threaded executor, `#[kio::test]`, and per-task Ready
# poll accounting. Meant for dev-dependencies, so production builds never compile it.
sim = ["dep:futures", "dep:kio-macros"]
# `clock::Manual::install`: a clock that only a test moves, as one tokio runtime's
# ambient clock. Native only. Meant for test builds, so production builds never compile it.
manual = ["runtime"]
# Numeric Unix-second JSON adapters for public wall times.
serde = ["dep:serde", "dep:serde_with"]
# `#[kio::machine]`, which writes a `poll_*` state machine from straight-line code.
macros = ["dep:kio-macros"]

[dependencies]
# Frees a log's evicted segments once no read that could reach them is running.
crossbeam-epoch = "0.9.21"
futures = { workspace = true, optional = true }
kio-macros = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_with = { workspace = true, optional = true }
smallvec = { version = "1.15", features = ["union"] }
web-async = { workspace = true, optional = true }

# The browser's only clocks, read with or without the runtime's timers.
[target.'cfg(all(target_arch = "wasm32", not(target_os = "wasi")))'.dependencies]
web-async = { workspace = true }

# The runtime handle, to keep a paused runtime's clock on its own origin.
[target.'cfg(any(not(target_arch = "wasm32"), target_os = "wasi"))'.dependencies]
tokio = { workspace = true, features = ["rt", "time"], optional = true }

# Loom swaps in its own Arc/Mutex/atomics so it can permute every interleaving.
# It's a normal (not dev) dependency because `sync.rs` re-exports it from the
# library itself, but `cfg(loom)` is never set outside `just rs loom`.
[target.'cfg(loom)'.dependencies]
# Under `--cfg crossbeam_loom` too, so loom permutes the collector's own atomics.
crossbeam-epoch = { version = "0.9.21", features = ["loom"] }
loom = { workspace = true }

[dev-dependencies]
# Bench-only: the FuturesUnordered comparison in benches/tasks.rs.
futures = "0.3"
# Enable the simulator so the clock's tests run in the merge gate. The browser
# leaves the runtime to `--features runtime`, so it tests the clock both ways.
kio = { path = ".", features = ["sim", "serde"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util", "time"] }

[target.'cfg(all(target_arch = "wasm32", not(target_os = "wasi")))'.dev-dependencies]
# Match the wasm-bindgen CLI schema used by the browser runner.
wasm-bindgen = "=0.2.129"
wasm-bindgen-test = "=0.3.79"

[target.'cfg(any(not(target_arch = "wasm32"), target_os = "wasi"))'.dev-dependencies]
# Test the installed manual clock, which needs tokio's runtime and so is native only.
kio = { path = ".", features = ["manual", "sim", "serde"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }

# The benches run natively; rayon under criterion refuses to build for wasm, where
# the browser runner compiles the clock's tests.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { package = "bench-harness", path = "../bench-harness" }

[[bench]]
name = "tasks"
harness = false

[[bench]]
name = "waiter"
harness = false

[[bench]]
name = "channel"
harness = false

[[bench]]
name = "contended"
harness = false

[lints]
workspace = true
