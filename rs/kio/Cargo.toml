[package]
name = "kio"
description = "Poll-native async shared state, a deterministic clock and simulator, and state-machine macros."
authors = ["Luke Curley"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.6.2"
edition = "2024"
rust-version.workspace = true

keywords = ["async", "producer", "consumer", "clock", "simulation"]
categories = ["asynchronous", "concurrency", "date-and-time", "development-tools::testing"]
# An allowlist, so the Verus proof package (verify/) stays out of the published crate.
include = ["/src", "/tests", "/benches", "/README.md", "/CHANGELOG.md", "/MIGRATE.md", "/LICENSE-*"]

[package.metadata.docs.rs]
features = ["async", "runtime", "manual", "sim", "model", "serde", "macros"]

# Compile-fail fixtures are loaded by trybuild.
[package.metadata.cargo-shear]
ignored-paths = ["macros/tests/ui/*.rs"]

[features]
# Lean by default: without `runtime`, the clock compiles no host timer backend, and
# without `async`, no coroutines.
default = []
# The `async fn` that `#[kio::wrapper]` generates beside most `poll_*` methods, and the
# few written by hand around a poll that takes a closure or a `Context` (`Queue::push`,
# the `wait` predicates, `Interval::tick`) or has none (`clock::drive`). Off by
# default: enable it where you `.await`.
async = ["macros"]
# Host timers on tokio's clock.
runtime = ["dep:tokio"]
# The deterministic single-threaded executor, `#[kio::test]`, and per-task Ready
# poll accounting. Meant for dev-dependencies, so production builds never compile it.
sim = ["async", "dep:futures"]
# `clock::Manual::install`: a clock that only a test moves, as one tokio runtime's
# ambient clock. Meant for test builds, so production builds never compile it.
manual = ["runtime"]
# `kio::model`, an exhaustive breadth-first checker for pure state machines. Meant for
# dev-dependencies, as `sim` is; it adds no dependencies.
model = []
# Numeric Unix-second JSON adapters for public wall times.
serde = ["dep:serde", "dep:serde_with"]
# `#[kio::machine]`, which writes a `poll_*` state machine from straight-line code, and
# `#[kio::wrapper]`, which writes the `async fn` that awaits one.
macros = ["dep:kio-macros"]

[dependencies]
# Frees a log's evicted segments once no read that could reach them is running.
crossbeam-epoch = "0.9.21"
# Only `std`: the simulator needs no executor or `select!` macros, so it builds no futures-macro.
futures = { version = "0.3", default-features = false, features = ["std"], optional = true }
kio-macros = { workspace = true, optional = true }
rand = { workspace = true }
serde = { workspace = true, optional = true }
serde_with = { workspace = true, optional = true }
smallvec = { version = "1.15", features = ["union"] }
# The host timers, and the runtime handle that keeps a paused runtime's clock on its own origin.
tokio = { workspace = true, features = ["rt", "time"], optional = true }

[target.'cfg(any(target_os = "linux", target_os = "android", target_vendor = "apple"))'.dependencies]
# Reads the clocks that count the host's sleep, which std's `Instant` does not.
libc = { workspace = true }

[dev-dependencies]
# Bench-only: the FuturesUnordered comparison in benches/tasks.rs.
swole = { workspace = true }
futures = { workspace = true }
# Enable the async wrappers, the simulator, and the installed manual clock so the
# tests that await them run in the merge gate.
kio = { path = ".", features = ["async", "manual", "sim", "serde"] }
serde_json = { workspace = true }
test-env = { path = "../test-env" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util", "time"] }
workspace-hack = { path = "../workspace-hack" }

[[bench]]
name = "tasks"
harness = false

[[bench]]
name = "task_capacity"
harness = false

[[bench]]
name = "waiter"
harness = false

[[bench]]
name = "channel"
harness = false

[[bench]]
name = "contended"
harness = false

# Not the workspace's lints: Verus sets the cfgs below when it proves `src/log.rs`
# (see verify/), and kio denies bare `#[allow]`, so a stale suppression can't linger.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_only)", "cfg(verus_keep_ghost)", "cfg(verus_keep_ghost_body)"] }

[lints.clippy]
# Every suppression says why, so the next lint audit can judge it.
allow_attributes_without_reason = "warn"
# `#[expect]` fails once its lint stops firing.
allow_attributes = "warn"
