[package]
publish = false
name = "moq-sign"
description = "Per-frame Ed25519 signatures for MoQ broadcasts, so relays proxy without forging content."
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.0.1"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "http3", "webtransport", "signature", "live"]
categories = ["cryptography", "multimedia", "network-programming"]

[dependencies]
aws-lc-rs = { workspace = true }
bytes = { workspace = true }
data-encoding = { workspace = true }
kio = { workspace = true }
moq-net = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
criterion = { package = "bench-harness", path = "../bench-harness" }
hex = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[[bench]]
name = "sign"
harness = false

[lints]
workspace = true
