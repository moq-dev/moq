[package]
name = "hang"
description = "Media over QUIC"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.21.11"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "http3", "webtransport", "media", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

[package.metadata.docs.rs]
features = ["async"]

[features]
default = []
# Generated async wrappers for the poll methods, and `Catalog::subscribe`. Enable where you `.await` them.
async = ["kio/async"]

[dependencies]
bytes = { workspace = true }
hex = { workspace = true }
kio = { workspace = true, features = ["runtime"] }
moq-json = { workspace = true }
moq-net = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true, features = ["base64"] }
thiserror = { workspace = true }
url = { workspace = true, features = ["serde"] }

[dependencies.derive_more]
version = "2"
features = ["from", "display", "debug"]

[dev-dependencies]
anyhow = { workspace = true }
# Compile the async API used by the tests.
hang = { path = ".", features = ["async"] }
moq-mux = { path = "../moq-mux", features = ["async"] }
moq-tokio = { path = "../moq-tokio", default-features = false, features = ["quic", "websocket"] }
tokio = { workspace = true, features = ["macros", "fs"] }
tracing = { workspace = true }
url = { workspace = true }
workspace-hack = { path = "../workspace-hack" }

[lints]
workspace = true
