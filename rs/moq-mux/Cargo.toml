[package]
name = "moq-mux"
description = "Media muxers and demuxers for MoQ"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.10.11"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "http3", "webtransport", "media", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

[package.metadata.docs.rs]
features = ["async"]

[features]
default = []
# Generated async wrappers for the poll methods, and the async constructors and helpers with no
# poll of their own. Enable where you `.await` them.
async = ["kio/async", "moq-net/async"]
# Exposes the media parsers' fuzz target bodies and seeds to the `fuzz/` harness through the
# `fuzz` module. Off by default.
fuzz = []

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bitstream-io = { workspace = true }
bytes = { workspace = true }
crc = "3"
ebml-iterable = { workspace = true }
h264-reader = "0.9.0"
hang = { workspace = true }
kio = { workspace = true, features = ["runtime"] }
memchr = "2"
moq-json = { workspace = true }
moq-loc = { workspace = true }
moq-msf = { workspace = true }
moq-net = { workspace = true }
mp4-atom = { workspace = true, features = ["tokio", "bytes", "serde"] }
mpeg2ts = "0.6.0"
num_enum = { workspace = true }
roxmltree = "0.21.1"
rustc-hash = { workspace = true }
scuffle-av1 = { version = "0.1.4" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true, features = ["base64"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tracing = { workspace = true }
url = { workspace = true }
webm-iterable = "0.7"

[dev-dependencies]
criterion = { package = "bench-harness", path = "../bench-harness" }
futures = { workspace = true }
# The tests await hang's catalog subscription.
hang = { path = "../hang", features = ["async"] }
kio = { workspace = true, features = ["sim"] }
# Compile the async API used by the tests, benches, and examples.
moq-mux = { path = ".", features = ["async"] }
# Mints an instance for a test, as a session of an older wire does.
moq-net = { path = "../moq-net", features = ["fuzz"] }
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-test = { workspace = true }
workspace-hack = { path = "../workspace-hack" }

# The ts_schedule bench pins glibc's heap.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dev-dependencies]
libc = { workspace = true }

# Writes the generated fuzzer corpus to disk. Needs the `fuzz` feature, so a default
# `--all-targets` build skips it rather than failing to find the module.
[[example]]
name = "fuzz-seeds"
path = "examples/fuzz-seeds.rs"
required-features = ["fuzz"]

[[bench]]
name = "catalog"
harness = false

[[bench]]
name = "ts_schedule"
harness = false

[[bench]]
name = "ts_programs"
harness = false

[[bench]]
name = "export"
harness = false

[[bench]]
name = "jitter"
harness = false

[[bench]]
name = "decode_clock"
harness = false

[[bench]]
name = "containers"
harness = false

[[bench]]
name = "sync"
harness = false

[[bench]]
name = "ts_video"
harness = false

[[bench]]
name = "parameter_sets"
harness = false

[lints]
workspace = true
