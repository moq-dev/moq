[package]
name = "moq-mux"
description = "Media muxers and demuxers for MoQ"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.9.10"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "http3", "webtransport", "media", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
h264-parser = { version = "0.4.0" }
hang = { workspace = true }
kio = { workspace = true }
memchr = "2"
moq-json = { workspace = true }
moq-loc = { workspace = true }
moq-msf = { workspace = true }
moq-net = { workspace = true }
mp4-atom = { version = "0.15", features = ["tokio", "bytes", "serde"] }
mpeg2ts = "0.6.0"
num_enum = { workspace = true }
scuffle-av1 = { version = "0.1.4" }
scuffle-h265 = { version = "0.2.2" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true, features = ["base64"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tracing = { workspace = true }
url = { workspace = true }
web-async = { workspace = true }
webm-iterable = "0.6"

[dev-dependencies]
futures = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
