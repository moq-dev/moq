[package]
name = "moq-mux"
description = "Media muxers and demuxers for MoQ"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.10.11"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "http3", "webtransport", "media", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
crc = "3"
ebml-iterable = { workspace = true }
h264-parser = { version = "0.4.2" }
h264-reader = "0.9.0"
hang = { workspace = true }
kio = { workspace = true }
memchr = "2"
moq-clock = { workspace = true }
moq-json = { workspace = true }
moq-loc = { workspace = true }
moq-msf = { workspace = true }
moq-net = { workspace = true }
mp4-atom = { version = "0.17.0", features = ["tokio", "bytes", "serde"] }
mpeg2ts = "0.6.0"
num_enum = { workspace = true }
roxmltree = "0.21.1"
rustc-hash = { workspace = true }
scuffle-av1 = { version = "0.1.4" }
scuffle-h265 = { version = "0.2.2" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true, features = ["base64"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tracing = { workspace = true }
url = { workspace = true }
webm-iterable = "0.7"

[dev-dependencies]
criterion = { package = "bench-harness", path = "../bench-harness" }
futures = { workspace = true }
moq-clock = { workspace = true, features = ["sim"] }
proptest = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-test = { workspace = true }

# The ts_schedule bench pins glibc's heap.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dev-dependencies]
libc = { workspace = true }

[[bench]]
name = "catalog"
harness = false

[[bench]]
name = "ts_schedule"
harness = false

[[bench]]
name = "ts_programs"
harness = false

[[bench]]
name = "export"
harness = false

[[bench]]
name = "jitter"
harness = false

[[bench]]
name = "decode_clock"
harness = false

[[bench]]
name = "containers"
harness = false

[[bench]]
name = "ts_video"
harness = false

[[bench]]
name = "parameter_sets"
harness = false

[lints]
workspace = true
