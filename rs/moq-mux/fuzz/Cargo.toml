# The libFuzzer harness for moq-mux's media parsers. `just rs fuzz <target>` drives it,
# and nightly.yml runs every target for five minutes.
#
# A workspace member so it shares the root lockfile, which is the only thing that
# keeps its resolve from drifting when a sibling it depends on is bumped. It is
# excluded from every gate that means "all of it" instead: libFuzzer needs a nightly
# toolchain and sanitizer flags, so nothing in `check` or `test` may compile it.
#
# The target bodies live in `moq-mux`'s hidden `fuzz` module, not here: sharing them
# is what lets the crate's own tests replay the corpus on stable, allocation bound
# included.
[package]
name = "moq-mux-fuzz"
version = "0.0.0"
license = "MIT OR Apache-2.0"
publish = false
edition = "2024"
autobins = false

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "fmp4"
path = "fuzz_targets/fmp4.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mkv"
path = "fuzz_targets/mkv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ts"
path = "fuzz_targets/ts.rs"
test = false
doc = false
bench = false

[[bin]]
name = "flv"
path = "fuzz_targets/flv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cmaf"
path = "fuzz_targets/cmaf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "annexb"
path = "fuzz_targets/annexb.rs"
test = false
doc = false
bench = false

[[bin]]
name = "catalog"
path = "fuzz_targets/catalog.rs"
test = false
doc = false
bench = false

[dependencies]
libfuzzer-sys = "0.4"
moq-mux = { workspace = true, features = ["fuzz"] }

[lints]
workspace = true
