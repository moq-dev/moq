[package]
name = "moq-ffi"
description = "Media over QUIC, UniFFI bindings"
authors = ["Luke Curley <kixelated@gmail.com>", "Brian Medley <bpm@bmedley.org>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.4.12"
edition = "2024"

keywords = ["quic", "http3", "webtransport", "media", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

[lib]
name = "moq_ffi"
crate-type = ["staticlib", "cdylib"]

[features]
# On by default so every existing consumer (the language wrappers, `build.sh`)
# keeps the surface it has. Opt out with `default-features = false` to skip the
# ~40 crates that only the codecs pull in.
default = ["audio", "video"]

audio = ["dep:moq-audio"]
video = ["dep:moq-video", "dep:pollster"]
# The OpenH264 software H.264 fallback (vendored C++) for `video`. Off for
# development and linting; `cargo build-ffi` (.cargo/config.toml), maturin, and
# CI's tests turn it on. It is the only encoder on API-24 Android and the Apple
# simulators, so every release build needs it.
openh264 = ["moq-video?/openh264"]
# qlog trace capture (`MoqQuicConfig::qlog`). Off by default: it compiles the qlog
# machinery in and is only wanted for debugging; `moq_qlog_supported` reports it.
qlog = ["moq-tokio/qlog"]
# Test-only hooks for the host suites: control of the runtime clock (`just py test`) and a
# count of moq's heap (the Dart leak tests). Released builds leave it off, so they never
# carry the `moq_ffi_test_*` symbols or the counting allocator.
testing = ["moq-clock/manual"]

[dependencies]
bytes = { workspace = true }
hang = { workspace = true }
kio = { workspace = true }
# Codecs only: the language wrappers do their own device I/O.
moq-audio = { workspace = true, optional = true, features = ["aac"] }
moq-clock = { workspace = true }
moq-json = { workspace = true }
moq-mux = { workspace = true }
moq-net = { workspace = true }
moq-tokio = { workspace = true, default-features = true }
# `nvidia` and `vaapi` back on, matching rs/moq-c: the workspace turns
# moq-video's defaults off for `capture` (device code the bindings don't
# expose), and the codecs are collateral rather than the goal. Nothing is paid for them off Linux, since
# cudarc / moq-nvenc / libloading / moq-vaapi sit behind
# `cfg(target_os = "linux")` and Android is `target_os = "android"`. On Linux
# both dlopen the driver, so the wrappers still link GPU-less and start
# driverless; `vaapi` alone costs the build something, since moq-vaapi's bindgen
# needs libclang (the dev shell carries it).
moq-video = { workspace = true, optional = true, features = ["nvidia", "vaapi"] }
# Blocking on `encode::Sink` from the synchronous producer exports; see
# `video::block_on` for why not a tokio helper.
pollster = { workspace = true, optional = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tracing = { workspace = true }
# The bindgen CLI lives in the `uniffi-bindgen` package, so a library build
# never compiles `uniffi_bindgen` and its dependencies.
uniffi = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# The video tests encode with OpenH264, the one encoder a GPU-less host has, so
# they turn it on without the `openh264` feature.
moq-video = { path = "../moq-video", features = ["openh264"] }
# One non-codec test blocks on a future; the main dep is `video`-only.
pollster = { workspace = true }
# Runs the key log tests with `SSLKEYLOGFILE` set or unset, in a child process.
test-env = { path = "../test-env" }
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dev-dependencies]
# Process CPU time for the benchmark's baselines.
libc = { workspace = true }

[lints]
workspace = true
