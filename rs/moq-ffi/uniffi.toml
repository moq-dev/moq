# Kotlin objects are AutoCloseable, and `close()` there releases the handle,
# which ends the broadcast only once no `requests()` handle remains. The
# generated forced end is `end()` so it doesn't collide with it.
[bindings.kotlin.rename]
"MoqBroadcastProducer.close" = "end"
# See MoqRoute::instance_id: the C++ generator reserves `instance`, Kotlin does not.
"MoqRoute.instance_id" = "instance"
