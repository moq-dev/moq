# Kotlin objects are AutoCloseable, and `close()` there releases the handle,
# which ends the broadcast only once no `dynamic()` handle remains. The
# generated forced end is `end()` so it doesn't collide with it. A finish handle's
# `close()` ends the linger even while a wait holds the handle, so it is `end()` too.
[bindings.kotlin.rename]
"MoqBroadcastProducer.close" = "end"
"MoqBroadcastFinish.close" = "end"
