[package]
name = "moq-c"
description = "Media over QUIC, C bindings"
authors = ["Luke Curley <kixelated@gmail.com>", "Brian Medley <bpm@bmedley.org>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.7.0"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "http3", "webtransport", "media", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

[lib]
name = "moq"
crate-type = ["staticlib"]

[features]
# The OpenH264 software H.264 fallback (vendored C++). Off for development and
# linting; `build.sh`, the nix package, and CI's tests turn it on.
openh264 = ["moq-video/openh264"]

[dependencies]
anyhow = { workspace = true, features = ["backtrace"] }
bytes = { workspace = true }
hang = { workspace = true }
kio = { workspace = true }
# Codecs only: OBS and the other C consumers do their own device I/O.
moq-audio = { workspace = true, features = ["aac"] }
moq-json = { workspace = true }
moq-mux = { workspace = true }
moq-net = { workspace = true }
moq-tokio = { workspace = true, features = ["quic", "aws-lc-rs", "websocket", "tcp", "uds"] }
# Select the NVIDIA and VAAPI hardware codecs explicitly because workspace
# defaults are off. The hardware backends dlopen their driver; `vaapi` also runs
# bindgen, so Linux builds need libclang. The software fallback is `openh264`.
moq-video = { workspace = true, features = ["nvidia", "vaapi"] }
# Blocking on `encode::Sink` from the synchronous C entry points; see
# `video::block_on` for why not a tokio helper.
pollster = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
tracing = { workspace = true }
url = { workspace = true }

[build-dependencies]
cbindgen = "0.29"

[dev-dependencies]
kio = { path = "../kio", features = ["runtime"] }
moq-loc = { path = "../moq-loc" }
# The tests encode with OpenH264, the one encoder a GPU-less host has, so they
# turn it on without the `openh264` feature.
moq-video = { path = "../moq-video", features = ["openh264"] }
# Runs the tests that need a variable set or unset in a child process given it.
test-env = { path = "../test-env" }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
