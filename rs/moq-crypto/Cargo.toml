[package]
name = "moq-crypto"
description = "Cryptography for MoQ: content signing, end-to-end encryption, and the rind provider the transports share."
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.0.11"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "webtransport", "encryption", "signature", "live"]
categories = ["cryptography", "multimedia", "network-programming"]

[package.metadata.docs.rs]
all-features = true

[features]
# Without `sign` or `e2ee`, the crate holds only `sign::PublicKey`, the endpoint ID, and its
# z-base-32 text: no `moq-net` and no rind, for crates that only name endpoints.
default = ["sign", "e2ee"]
# Per-frame signing: `sign::SecretKey` and the signed broadcast wrappers.
sign = ["dep:bytes", "dep:kio", "dep:moq-net", "dep:rind", "dep:zeroize"]
# End-to-end encryption: the `e2ee` module.
e2ee = ["cpu", "dep:base64", "dep:bytes", "dep:kio", "dep:moq-net", "dep:rind", "dep:uuid", "dep:zeroize"]
# CPU support and its shared error need only rind.
cpu = ["dep:rind"]
# The rustls provider adds TLS without needing `moq-net`.
provider = ["cpu", "dep:rind-rustls", "dep:rustls"]
# `sign::PublicKey` serializes as its canonical z-base-32 text.
serde = ["dep:serde"]
# Generated async wrappers for the `sign` and `e2ee` poll methods. Enable where you `.await` them.
async = ["kio?/async"]

[dependencies]
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
data-encoding = { workspace = true }
kio = { workspace = true, optional = true }
moq-net = { workspace = true, optional = true }
rind = { workspace = true, optional = true }
rind-rustls = { workspace = true, optional = true }
rustls = { version = "0.23", default-features = false, features = ["std"], optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true }
uuid = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
criterion = { package = "bench-harness", path = "../bench-harness" }
hex = { workspace = true }
kio = { workspace = true, features = ["runtime"] }
# Compile the generated wrappers used by the tests and benches, keeping the features they pick.
moq-crypto = { path = ".", default-features = false, features = ["async"] }
moq-net = { path = "../moq-net", features = ["async"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }
workspace-hack = { path = "../workspace-hack" }

[[bench]]
name = "protect"
harness = false
required-features = ["e2ee"]

[[bench]]
name = "sign"
harness = false
required-features = ["sign"]

[[test]]
name = "transport"
required-features = ["e2ee"]

[lints]
workspace = true
