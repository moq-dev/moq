[package]
publish = false
name = "moq-crypto"
description = "Content signing and end-to-end encryption for MoQ broadcasts."
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.0.11"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "webtransport", "encryption", "signature", "live"]
categories = ["cryptography", "multimedia", "network-programming"]

[dependencies]
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
data-encoding = { workspace = true }
kio = { workspace = true }
moq-net = { workspace = true }
rind = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
criterion = { package = "bench-harness", path = "../bench-harness" }
hex = { workspace = true }
kio = { workspace = true, features = ["runtime"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }
workspace-hack = { path = "../workspace-hack" }

[[bench]]
name = "protect"
harness = false

[[bench]]
name = "sign"
harness = false

[lints]
workspace = true
