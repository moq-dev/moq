[package]
name = "moq-crypto"
description = "Cryptography the MoQ crates share: the endpoint key, the rind provider, and the CPU check."
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.0.11"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "webtransport", "tls", "ed25519", "live"]
categories = ["cryptography", "multimedia", "network-programming"]

[package.metadata.docs.rs]
all-features = true

[features]
# Without `endpoint`, the crate holds only `endpoint::PublicKey`, the endpoint ID, and its
# z-base-32 text: no `moq-net` and no rind, for crates that only name endpoints.
default = ["endpoint"]
# The persistent `endpoint::SecretKey`, which converts to `moq_net::origin::RouteKey`.
endpoint = ["dep:moq-net", "dep:rind", "dep:zeroize"]
# CPU support and its shared error need only rind.
cpu = ["dep:rind"]
# The rustls provider adds TLS without needing `moq-net`.
provider = ["cpu", "dep:rind-rustls", "dep:rustls"]
# `endpoint::PublicKey` serializes as its canonical z-base-32 text.
serde = ["dep:serde"]

[dependencies]
data-encoding = { workspace = true }
moq-net = { workspace = true, optional = true }
rind = { workspace = true, optional = true }
rind-rustls = { workspace = true, optional = true }
rustls = { version = "0.23", default-features = false, features = ["std"], optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true }
zeroize = { workspace = true, optional = true }

[dev-dependencies]
hex = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
workspace-hack = { path = "../workspace-hack" }

[lints]
workspace = true
