[package]
name = "moq-transcode"
description = "Just-in-time live transcoding for hang broadcasts over Media over QUIC"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.1.10"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "http3", "webtransport", "media", "video"]
categories = ["multimedia", "multimedia::video", "multimedia::encoding"]

[features]
# NVIDIA is on by default, mirroring moq-video: NVDEC -> NVENC is the zero-copy
# GPU pipeline, and it dlopens its driver so it needs nothing on the build host.
# OpenH264, the software H.264 fallback, is vendored C++ and opt-in like
# moq-video's: release builds enable it. `vaapi` stays opt-in because its
# bindgen needs libclang; `v4l2` mirrors moq-video's opt-in too, though it costs
# the build nothing.
default = ["nvidia"]
# NVENC + NVDEC (Linux, dlopen'd at runtime; a no-op elsewhere).
nvidia = ["moq-video/nvidia"]
# Software H.264 encode/decode through moq-video's vendored OpenH264 backend.
# Off by default; enable it in release builds.
openh264 = ["moq-video/openh264"]
# Intel/AMD VAAPI hardware encoder (Linux; libva dlopen'd at runtime, but
# moq-vaapi's bindgen needs libclang at build time).
vaapi = ["moq-video/vaapi"]
# The V4L2 M2M codecs of an ARM SoC (Linux; moq-v4l checks its bindings in, so
# nothing is needed on the build host).
v4l2 = ["moq-video/v4l2"]

[dependencies]
bytes = { workspace = true }
hang = { workspace = true }
kio = { workspace = true }
moq-mux = { workspace = true }
moq-net = { workspace = true }
moq-video = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
moq-clock = { workspace = true, features = ["sim"] }
moq-tokio = { path = "../moq-tokio", default-features = false, features = ["quic", "aws-lc-rs", "websocket"] }
# The tests encode with OpenH264, the one encoder a GPU-less host has, so they
# turn it on without making it a default of the library.
moq-video = { path = "../moq-video", features = ["openh264"] }
# test-util unlocks tokio::time::pause for the deterministic live-feed tests.
tokio = { workspace = true, features = ["full", "test-util"] }
url = { workspace = true }
usage-rs = { workspace = true }

[lints]
workspace = true
