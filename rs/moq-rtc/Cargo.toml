[package]
name = "moq-rtc"
description = "WebRTC (WHIP/WHEP) gateway for Media over QUIC"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.2.6"
edition = "2024"
rust-version.workspace = true

keywords = ["webrtc", "whip", "whep", "moq", "media"]
categories = ["multimedia", "network-programming", "web-programming"]

# Pure library: the WHIP/WHEP <-> MoQ gateway (axum routers + WHEP/WHIP client).
# The CLI lives in `moq-cli` (the `rtc` subcommand); embedders mount the routers
# / dial with `Client` against their own origin.
[dependencies]
anyhow = { workspace = true, features = ["backtrace"] }
axum = { workspace = true }
bytes = { workspace = true }
hang = { workspace = true }
moq-mux = { workspace = true }
moq-net = { workspace = true }
reqwest = { workspace = true, features = ["rustls"] }
str0m = "0.22"
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
url = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Signs the MESSAGE-INTEGRITY on a forged STUN binding request: str0m rejects a
# request without one, and its own SHA1 provider is private.
aws-lc-rs = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
