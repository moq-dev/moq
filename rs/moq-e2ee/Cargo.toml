[package]
name = "moq-e2ee"
description = "End-to-end encryption for MoQ groups, datagrams, and track names."
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.0.3"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "http3", "webtransport", "encryption", "live"]
categories = ["cryptography", "multimedia", "network-programming"]

[dependencies]
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
kio = { workspace = true }
moq-net = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
web-transport-trait = { workspace = true }

[[bench]]
name = "protect"
harness = false
