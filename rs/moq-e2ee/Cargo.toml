[package]
name = "moq-e2ee"
description = "End-to-end encryption for MoQ groups, datagrams, and track names."
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

# Above crates.io's 0.0.25, so publishing the finished format needs no jump.
version = "0.0.26"
edition = "2024"
rust-version.workspace = true

# Unpublished until its finished format lands: quest/m3/e2ee-format.md.
publish = false

keywords = ["quic", "webtransport", "encryption", "live"]
categories = ["cryptography", "multimedia", "network-programming"]

[features]
# Generated async wrappers for the poll methods. Enable where you `.await` them.
async = ["kio/async"]

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
kio = { workspace = true }
moq-crypto = { workspace = true, features = ["cpu"] }
moq-net = { workspace = true }
rind = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
swole = { workspace = true }
hex = { workspace = true }
kio = { workspace = true, features = ["runtime"] }
# Compile the generated wrappers used by the tests and benches.
moq-e2ee = { path = ".", features = ["async"] }
moq-net = { path = "../moq-net", features = ["async"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }
workspace-hack = { path = "../workspace-hack" }

[[bench]]
name = "protect"
harness = false

[lints]
workspace = true
