[package]
name = "moq-hls"
description = "HLS / LL-HLS / DASH gateway for Media over QUIC"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.5.11"
edition = "2024"
rust-version.workspace = true

keywords = ["hls", "ll-hls", "moq", "media", "cmaf"]
categories = ["multimedia", "network-programming", "web-programming"]

[features]
default = ["server"]
server = ["dep:axum", "dep:http-body"]

[dependencies]
# Only needed by the HTTP export server (gated by `server`).
axum = { workspace = true, optional = true }
bytes = { workspace = true }
hang = { workspace = true }
http-body = { version = "1", optional = true }
humantime = { workspace = true }
kio = { workspace = true, features = ["runtime"] }
m3u8-rs = "6"
moq-mux = { workspace = true }
moq-net = { workspace = true }
percent-encoding = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["rustls-no-provider", "gzip"] }
rind = { workspace = true }
# Installed as rustls's process default when the host installed none, since reqwest reads it.
rind-rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
criterion = { package = "bench-harness", path = "../bench-harness" }
futures = { workspace = true }
moq-archive = { path = "../moq-archive" }
moq-json = { path = "../moq-json" }
moq-tokio = { path = "../moq-tokio", default-features = false, features = ["tcp", "quic", "aws-lc-rs"] }
mp4-atom = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
tracing-test = { workspace = true }
workspace-hack = { path = "../workspace-hack" }

[[bench]]
name = "contributions"
harness = false
required-features = ["server"]

[lints]
workspace = true
