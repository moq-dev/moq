[package]
name = "moq-hls"
description = "HLS / LL-HLS / DASH gateway for Media over QUIC"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.5.11"
edition = "2024"
rust-version.workspace = true

keywords = ["hls", "ll-hls", "moq", "media", "cmaf"]
categories = ["multimedia", "network-programming", "web-programming"]

[features]
default = ["server"]
server = ["dep:axum"]

[dependencies]
# Only needed by the HTTP export server (gated by `server`).
axum = { workspace = true, optional = true }
bytes = { workspace = true }
hang = { workspace = true }
humantime = { workspace = true }
kio = { workspace = true }
m3u8-rs = "6"
moq-clock = { workspace = true }
moq-mux = { workspace = true }
moq-net = { workspace = true }
percent-encoding = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "gzip"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
futures = { workspace = true }
moq-archive = { path = "../moq-archive" }
moq-json = { path = "../moq-json" }
moq-tokio = { path = "../moq-tokio", default-features = false, features = ["tcp", "quic", "aws-lc-rs"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
tracing-test = { workspace = true }

[lints]
workspace = true
