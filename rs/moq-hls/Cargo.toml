[package]
name = "moq-hls"
description = "HLS / LL-HLS gateway for Media over QUIC"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.4.11"
edition = "2024"
rust-version.workspace = true

keywords = ["hls", "ll-hls", "moq", "media", "cmaf"]
categories = ["multimedia", "network-programming", "web-programming"]

[features]
default = ["server"]
server = ["dep:axum"]

[dependencies]
# Always required (import + export library).
anyhow = { workspace = true, features = ["backtrace"] }

# Only needed by the HTTP export server (gated by `server`).
axum = { workspace = true, optional = true }
bytes = { workspace = true }
hang = { workspace = true }
humantime = { workspace = true }
kio = { workspace = true }
m3u8-rs = "6"
moq-mux = { workspace = true }
moq-net = { workspace = true }
percent-encoding = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["rustls", "gzip"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
