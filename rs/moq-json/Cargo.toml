[package]
name = "moq-json"
description = "JSON publishing over MoQ tracks: snapshot/delta (RFC 7396 merge patch) objects, or append-log record streams."
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.5.8"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "http3", "webtransport", "json", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

[package.metadata.docs.rs]
features = ["async"]

[features]
default = []
# Generated async wrappers for the poll methods. Enable where you `.await` them.
async = ["kio/async"]

[dependencies]
bytes = { workspace = true }
kio = { workspace = true }
moq-net = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = "0.1"
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { package = "bench-harness", path = "../bench-harness" }
futures = { workspace = true }
json-patch = "4"
# Compile the generated wrappers used by the tests.
moq-json = { path = ".", features = ["async"] }
proptest = { workspace = true, features = ["handle-panics"] }

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "allocations"
harness = false

[[bench]]
name = "table"
harness = false

[[bench]]
name = "window"
harness = false

# Run the documented example's inline test in the normal nextest gate.
[[example]]
name = "teleop"
test = true

[lints]
workspace = true
