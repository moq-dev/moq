[package]
name = "moq-json"
description = "JSON publishing over MoQ tracks: snapshot/delta (RFC 7396 merge patch) objects, or append-log record streams."
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.5.8"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "http3", "webtransport", "json", "live"]
categories = ["multimedia", "network-programming", "web-programming"]

[package.metadata.docs.rs]
features = ["async"]

[features]
default = []
# Generated async wrappers for the poll methods. Enable where you `.await` them.
async = ["kio/async"]
# Exposes the merge-patch diff to the codec bench, through the `bench` module. Off by
# default.
bench = []

[dependencies]
bytes = { workspace = true }
kio = { workspace = true }
moq-net = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde_path_to_error = "0.1"
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
swole = { workspace = true }
futures = { workspace = true }
json-patch = "5"
# Compile the generated wrappers used by the tests.
moq-json = { path = ".", features = ["async"] }
moq-net = { path = "../moq-net", features = ["async"] }
proptest = { workspace = true, features = ["handle-panics"] }
# A raw record skips the formatter's container hooks, which the nesting tests cover.
serde_json = { workspace = true, features = ["raw_value"] }
workspace-hack = { path = "../workspace-hack" }

[[bench]]
name = "codec"
harness = false
required-features = ["bench"]

[[bench]]
name = "allocations"
harness = false

[[bench]]
name = "table"
harness = false

[[bench]]
name = "window"
harness = false

[lints]
workspace = true
