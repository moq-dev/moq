[package]
# Unpublished until the studio settles its API; moq-studio is its only consumer.
publish = false
name = "moq-scene"
description = "Scene graph, live sources, and a wgpu compositor for a MoQ streaming studio"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.1.0"
edition = "2024"
rust-version.workspace = true

keywords = ["quic", "media", "video", "compositing", "live"]
categories = ["multimedia", "multimedia::video", "rendering"]

[features]
# Camera, display, window, and microphone sources. Off by default for the same
# reason as moq-video's and moq-audio's `capture`: on Linux the microphone links
# libasound at build time, and a workspace build would otherwise unify it on for
# every crate. Without it, those sources report that the build cannot capture.
capture = ["moq-video/capture", "moq-audio/capture"]
# PipeWire cameras on Linux, whose DMA-BUFs the compositor imports rather than
# uploads, and audio devices through the sound server. Off by default like
# moq-video's `pipewire`: it links libpipewire-0.3 at build time, so a Linux
# package turns it on where the build host has it.
pipewire = ["capture", "moq-video/pipewire", "moq-audio/pipewire"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
# The catalog's rendition configs, which a broadcast source follows.
hang = { workspace = true }
humantime-serde = { workspace = true }
# PNG and JPEG still images. Already in a studio's graph through eframe.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
kio = { workspace = true, features = ["runtime"] }
moq-audio = { workspace = true, features = ["bus"] }
moq-mux = { workspace = true }
moq-net = { workspace = true }
# `render` is the compositor's whole input path: it turns every decoded or
# captured frame into a texture on the studio's device.
moq-video = { workspace = true, features = ["render"] }
serde = { workspace = true }
serde_with = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "time"] }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
