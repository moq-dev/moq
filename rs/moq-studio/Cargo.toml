[package]
# Unpublished until the packaging quest decides how the studio ships.
publish = false
name = "moq-studio"
description = "A native streaming studio that composites scenes on the GPU and goes live over MoQ"
authors = ["Luke Curley <kixelated@gmail.com>"]
repository = "https://github.com/moq-dev/moq"
license = "MIT OR Apache-2.0"

version = "0.1.0"
edition = "2024"
# egui 0.36 and egui_dock 0.21 need 1.92 and 1.95. This is an application, so
# the bump stays here rather than raising the libraries' floor.
rust-version = "1.95"

keywords = ["quic", "streaming", "studio", "live", "media"]
categories = ["multimedia", "multimedia::video", "gui"]

[features]
default = ["quic", "websocket", "nvidia"]
quic = ["moq-tokio/quic"]
websocket = ["moq-tokio/websocket"]
# Camera, display, window, microphone, and system-audio sources. Off by default
# like moq-cli's `capture`: on Linux the microphone links libasound at build
# time. Enable with `cargo run -p moq-studio --features capture,openh264`.
capture = ["moq-scene/capture"]
# NVIDIA hardware codecs (NVENC + NVDEC) on Linux, as in moq-cli.
nvidia = ["moq-video/nvidia"]
# The vendored OpenH264 software H.264 fallback, opt-in like moq-video's.
openh264 = ["moq-video/openh264"]
# Intel/AMD VAAPI hardware codecs (Linux); its bindgen needs libclang.
vaapi = ["moq-video/vaapi"]
# PipeWire cameras, drawn without a copy, and audio through the sound server.
# Wayland screens and windows are not reachable yet: display and window sources
# capture X11 only.
pipewire = ["capture", "moq-scene/pipewire"]

[dependencies]
anyhow = { workspace = true, features = ["backtrace"] }
bytes = { workspace = true }
# The window, its event loop, and the egui integration. `wgpu` is the renderer
# the compositor shares a device with; no glow, no system font discovery.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wayland", "wgpu", "x11"] }
egui = "0.36"
# Docked, rearrangeable panels. 0.21 is the newest release and pins egui 0.36.
egui_dock = "0.21"
kio = { workspace = true, features = ["runtime"] }
moq-audio = { workspace = true, features = ["bus"] }
moq-mux = { workspace = true }
moq-net = { workspace = true }
moq-scene = { workspace = true }
moq-tokio = { workspace = true, default-features = false, features = ["aws-lc-rs", "net"] }
moq-video = { workspace = true }
pollster = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
url = { workspace = true }
usage-rs = { workspace = true, features = ["completions", "config"] }

[dev-dependencies]
moq-relay = { path = "../moq-relay", default-features = false, features = ["test-support"] }
tempfile = { workspace = true }

[lints]
workspace = true
