# Maven Central answers shared CI runner IPs with 429 Too Many Requests. Gradle
# retries it as transient, but its default 3 tries over 3s end inside the rate
# limit; 5 tries backing off from 5s (5+10+20+40s) outlast it.
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=5000
