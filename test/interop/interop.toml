# Relay config for the cross-language interop test.
# Token auth, self-signed localhost cert, QUIC + WebSocket on 127.0.0.1:4443.

[log]
level = "info"

[listen]
# QUIC on UDP. 127.0.0.1 avoids IPv6 flakiness on CI runners.
bind = "127.0.0.1:4443"
tls.generate = ["localhost", "127.0.0.1"]
# Every default version, plus the work-in-progress moq-lite-07 that carries AUTH,
# which the defaults leave out.
version = [
    "moq-lite-07-wip",
    "moq-lite-06",
    "moq-lite-05",
    "moq-lite-04",
    "moq-lite-03",
    "moq-lite-02",
    "moq-lite-01",
    "moq-transport-22",
    "moq-transport-21",
    "moq-transport-20",
    "moq-transport-19",
    "moq-transport-18",
    "moq-transport-17",
    "moq-transport-16",
    "moq-transport-15",
    "moq-transport-14",
]

[web.http]
# HTTP + WebSocket on TCP, also serving /certificate.sha256 for cert pinning.
listen = "127.0.0.1:4443"

[auth]
# `moq auth serve`, verifying the tokens interop.sh mints for each cell. No
# anonymous access: a client that drops its token is refused.
url = "http://127.0.0.1:4440/"
