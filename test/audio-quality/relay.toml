# Relay config for the audio quality harness.
# Anonymous access, self-signed localhost cert, QUIC + HTTP on 127.0.0.1:4443.
#
# run.sh rewrites the port into a copy in the run directory. The page reaches QUIC through the
# shaper on another port; the driver answers the page's /certificate.sha256 fetch with this relay's
# hash, so the shaper only carries UDP.

[log]
level = "info"

[listen]
# QUIC on UDP. 127.0.0.1 avoids IPv6 flakiness on CI runners.
bind = "127.0.0.1:4443"
tls.generate = ["localhost", "127.0.0.1"]

[web.http]
# HTTP on TCP, serving /certificate.sha256 to the publishers and the driver.
listen = "127.0.0.1:4443"

[auth]
# Allow anonymous access to everything.
public = "**"
