# Header for the consumer manifest test/packaged/rust.sh generates. The
# [dependencies] and [patch.crates-io] tables are appended per run, one entry
# per staged candidate.
#
# An empty [workspace] table makes this its own workspace root, so the consumer
# never inherits the repo's lints, profiles, or dependency versions even if it
# is staged somewhere below it.
[workspace]

[package]
name = "packaged-consumer"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"
