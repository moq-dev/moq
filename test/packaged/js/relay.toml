# Relay config for the packaged-consumer round trip.
# Anonymous access, self-signed localhost cert, QUIC + HTTP on 127.0.0.1.
#
# js.sh overrides the ports on the command line (`--server-bind` /
# `--web-http-listen`); only the settings the round trip needs live here.

[log]
level = "info"

[server]
# QUIC on UDP. 127.0.0.1 avoids IPv6 flakiness on CI runners.
bind = "127.0.0.1:4470"
tls.generate = ["localhost", "127.0.0.1"]

[web.http]
# HTTP on TCP, serving /certificate.sha256 so the round trip can wait for a
# listening relay instead of racing it.
listen = "127.0.0.1:4470"

[auth]
# Allow anonymous access to everything.
public = ""
