[log]
# Enable debug logging for development.
# The RUST_LOG environment variable will take precedence.
level = "debug"

[listen]
# Listen for QUIC connections on UDP:4445
# Sometimes IPv6 causes issues; try 127.0.0.1:4445 instead.
bind = "[::]:4445"

# Serve the same cluster-signed certificate that we present as a client,
# so other leaves can verify us against `ca.pem`.
tls.cert = ["leaf1.crt"]
tls.key = ["leaf1.key"]

# To authenticate peers by certificate, trust client certificates signed by
# this CA and switch `[auth]` below to the auth server, which grants them
# as cluster peers through `--mtls-publish`, `--mtls-subscribe`, and
# `--mtls-peer`. Public rules ignore certificates, so the relay refuses a
# client CA alongside them.
# tls.root = ["ca.pem"]

[connect]
# Present this certificate and key on outbound cluster connections; the
# root reports it to its auth source.
tls.cert = "leaf1.crt"
tls.key = "leaf1.key"

# Verify the remote's server cert against the cluster CA. All cluster
# nodes' server certs are signed by `ca.pem`, so no custom trust
# store is required beyond this one file.
tls.root = ["ca.pem"]

[web.http]
# Listen for HTTP and WebSocket (TCP) connections on the given address.
listen = "[::]:4445"

[cluster]
# Connect to both the root and leaf0, forming a loop to exercise cluster loop detection.
# ex. imagine us-east connects to us-central AND directly to us-west.
connect = ["https://localhost:4443/", "https://localhost:4444/"]

[auth]
# Local development: anonymous access to everything, so no JWT is needed.
public = "**"

# To exercise JWT + public-pattern auth instead, drop `public` above, run
# `moq auth serve --key root.jwk --public-subscribe 'anon/**' --public-subscribe 'demo/**' --public-publish 'anon/**' --mtls-publish '**' --mtls-subscribe '**' --mtls-peer`,
# point the relay at it, and uncomment `listen.tls.root` above:
# url = "http://127.0.0.1:4440/"

[stats]
enabled = true
node = "local/leaf1"
