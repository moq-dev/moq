# An example of a production configuration.
# Here's a real one: https://github.com/moq-dev/moq.dev/blob/b4da7dd8f09879cefb593d5e35f99f064caa3943/infra/relay.yml.tpl#L56

[listen]
# Listen for QUIC connections on UDP:443
# This is the default port for WebTransport
bind = "[::]:443"

# Every version, plus the opt-in moq-lite-07-wip that sockets (such as MoQ Boy's) need.
version = [
	"moq-lite-07-wip",
	"moq-lite-06",
	"moq-lite-05",
	"moq-lite-04",
	"moq-lite-03",
	"moq-lite-02",
	"moq-lite-01",
	"moq-transport-22",
	"moq-transport-20",
	"moq-transport-18",
]

[listen.tls]
# You'll need to provide a real certificate and key in production.
# You can get this via a service like Let's Encrypt.
cert = "cert.pem"
key = "key.pem"

#[web.http]
# Optionally listen for HTTP and WebSocket connections on port 80.
# listen = "[::]:80"

[web.https]
# Optionally listen for TCP/HTTPS/WSS connections on port 443.
listen = "[::]:443"

# You'll need to provide a real certificate and key in production.
# This can be the exact same certificate and key as the QUIC endpoint.
cert = "cert.pem"
key = "key.pem"

# See docs/auth.md for more information.
[auth]
# The auth server asked once per session event. The policy lives there:
#
#   moq auth serve --listen 127.0.0.1:4440 --key root.jwk \
#     --public-subscribe 'anon/**' --public-subscribe 'demo/**' \
#     --public-publish 'anon/**' --public-publish 'demo/viewer/**' \
#     --public-publish 'demo/boy/.socket/viewer-*' \
#     --mtls-publish '**' --mtls-subscribe '**' --mtls-link peer
#
# Anonymous MoQ Boy viewers share one grant, so it covers only `viewer-*` endpoint ids:
# a game's endpoint, `demo/boy/.socket/<game>`, stays the emulator's, which signs in
# with a token. Each viewer's id is 128 random bits, so no viewer can guess another's.
#
# For multiple keys with rotation, give it `--key-dir /path/to/keys/` instead:
# keys are named {kid}.jwk and resolved by the kid in the JWT header.
url = "http://127.0.0.1:4440/"
