# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
#
# Run `just rs audit` to validate; runs nightly.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # rsa 0.9.x Marvin Attack: test-only compatibility fixtures use published
    # moq-auth 0.2.1 and moq-token 0.7, which still depend on rsa. Production
    # key generation and signing use aws-lc-rs; no normal/build graph holds rsa.
    "RUSTSEC-2023-0071",

    # paste is unmaintained (proc-macro, build-time only). Pulled by
    # tikv-jemalloc-ctl (moq-tokio's `jemalloc` feature; 0.7 still uses it).
    "RUSTSEC-2024-0436",

    # ttf-parser is unmaintained, with no upgrade available. Reachable only via
    # winit -> sctk-adwaita -> ab_glyph, which parses the system font used to
    # draw Wayland client-side decorations for `moq play`. Dropping winit's
    # `wayland-csd-adwaita` feature would remove it, at the cost of a titlebar
    # on GNOME. Awaits sctk-adwaita migrating to skrifa.
    "RUSTSEC-2026-0192",

    # basic-toml is unmaintained, with no patched release. Only Askama's build-time
    # template config parser in the unpublished UniFFI generator fork uses it.
    # Drop when Askama releases its migration to toml:
    # https://github.com/askama-rs/askama/blob/main/askama_derive/Cargo.toml
    "RUSTSEC-2026-0374",

    # zbus 6 merged these crates into its names/wire modules. ashpd 0.13, the
    # latest stable portal client used by moq-video, still requires zbus 5.
    # These advisories report maintenance status, not a known vulnerability.
    # Drop when ashpd migrates to zbus 6:
    # https://github.com/z-galaxy/zbus/issues/2043
    # https://github.com/bilelmoussaoui/ashpd/pull/491
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",

]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots cert bundle
    "ISC",
    "MIT",
    "MPL-2.0",
    # libfuzzer-sys vendors LLVM's libFuzzer harness, which is NCSA licensed.
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = [{ name = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path/workspace deps don't carry versions; that's fine for intra-workspace use.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# uniffi-bindgen's generator-only UniFFI fork. Unpublished, so it never ships in a crate.
allow-git = ["https://github.com/kixelated/uniffi-rs"]
