# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
#
# Run `just rs audit` to validate; runs nightly.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste is unmaintained (proc-macro, build-time only). Pulled by
    # tikv-jemalloc-ctl (moq-tokio's `jemalloc` feature; 0.7 still uses it).
    "RUSTSEC-2024-0436",

    # proc-macro-error2 is unmaintained (proc-macro, build-time only). moq-auth's
    # rind crypto stack reaches it through libcrux-intrinsics -> core-models
    # 0.0.7 -> hax-lib 0.3.7 -> hax-lib-macros, only under cfg(hax).
    # Drop when core-models releases its migration to hax-lib 0.4 or newer.
    "RUSTSEC-2026-0173",

    # ttf-parser is unmaintained, with no upgrade available. Reachable only via
    # winit -> sctk-adwaita -> ab_glyph, which parses the system font used to
    # draw Wayland client-side decorations for `moq play`. Dropping winit's
    # `wayland-csd-adwaita` feature would remove it, at the cost of a titlebar
    # on GNOME. Awaits sctk-adwaita migrating to skrifa.
    "RUSTSEC-2026-0192",

    # basic-toml is unmaintained, with no patched release. Only Askama's build-time
    # template config parser in the unpublished UniFFI generator fork uses it.
    # Drop when Askama releases its migration to toml:
    # https://github.com/askama-rs/askama/blob/main/askama_derive/Cargo.toml
    "RUSTSEC-2026-0374",

    # zvariant, zbus_names, and zvariant_derive are unmaintained: zbus 6 absorbed
    # them. Reachable only via moq-video's `pipewire` feature -> ashpd 0.13 ->
    # zbus 5, held there because zbus 6 pipelines its handshake, which breaks
    # every portal call inside a Flatpak on xdg-dbus-proxy before 0.1.6 (Ubuntu
    # 24.04 LTS ships 0.1.5). See the ashpd note in rs/moq-video/Cargo.toml.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",

    # chrono is unmaintained, with no patched release; no vulnerability is known.
    # Every crate that reaches it is already at its newest release: object_store
    # (moq-archive, moq-cli), m3u8-rs (moq-hls), procfs (moq-bench), s3s (dev),
    # and boytacean and gst-plugin-version-helper (build-time). Our own use is
    # only the moq-tokio clock example. Drop when those migrate to jiff or time.
    "RUSTSEC-2026-0543",

    # humantime is unmaintained only because chrono's maintainers stewarded it;
    # it has no dependencies and no known vulnerability. object_store and qlog
    # (moq-quic) still use it at their newest releases, so replacing our own
    # duration parsing with jiff would not remove it. Drop with chrono's above.
    "RUSTSEC-2026-0542",

]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots cert bundle
    "ISC",
    "MIT",
    "MPL-2.0",
    # libfuzzer-sys vendors LLVM's libFuzzer harness, which is NCSA licensed.
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
exceptions = [{ name = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path/workspace deps don't carry versions; that's fine for intra-workspace use.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # uniffi-bindgen's generator-only UniFFI fork. Unpublished, so it never ships in a crate.
    "https://github.com/kixelated/uniffi-rs",
    # Temporary until kixel-ai/kio publishes kio-macros and kio to crates.io (quest/m0/kio-crates-io.md).
    "https://github.com/kixel-ai/kio",
]
